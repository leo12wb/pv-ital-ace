        {n:39,q:"Qual é o papel da educação em saúde nas visitas domiciliares do ACE?",ops:["Substituir o tratamento médico","Orientar os moradores sobre eliminação de criadouros, sinais de alerta e importância da prevenção","Fiscalizar e punir moradores negligentes","Apenas distribuir material educativo impresso"],g:1,exp:"A educação em saúde é parte fundamental do trabalho do ACE: orientar sobre eliminação de criadouros, reconhecimento dos sintomas, procura de serviço de saúde e importância da prevenção coletiva."},
        {n:40,q:"Imóveis 'fechados' (F) no ciclo do ACE devem ser:",ops:["Desconsiderados no relatório","Registrados como pendência e revisitados na próxima rodada","Notificados diretamente à polícia","Considerados sem foco automaticamente"],g:1,exp:"Imóveis fechados são registrados no BAC como pendência e devem ser revisitados na próxima rodada do ciclo para garantir a cobertura completa do território."},
      ]},
      {nome:'Endemias e Doenças (Q41–Q50)',qs:[
        {n:41,q:"Qual mosquito é o principal vetor da dengue, Zika e Chikungunya no Brasil?",ops:["Anopheles darlingi","Aedes albopictus","Aedes aegypti","Culex quinquefasciatus"],g:2,exp:"O Aedes aegypti é o principal vetor das três arboviroses no Brasil. Prefere ambientes urbanos e criadouros artificiais com água limpa e parada."},
        {n:42,q:"A principal complicação da infecção por Zika em gestantes é:",ops:["Pré-eclâmpsia grave","Microcefalia e malformações do sistema nervoso central do feto","Diabetes gestacional","Parto prematuro sem sequelas neurológicas"],g:1,exp:"A síndrome congênita do Zika inclui microcefalia, calcificações cerebrais, artrogripose e outras malformações do SNC fetal, especialmente quando a infecção ocorre no primeiro trimestre."},
        {n:43,q:"A malária é endêmica principalmente em qual região do Brasil?",ops:["Nordeste","Sul","Região Amazônica","Centro-Oeste"],g:2,exp:"A região Amazônica concentra mais de 99% dos casos de malária no Brasil, onde temperatura, umidade e floresta criam condições ideais para o Anopheles."},
        {n:44,q:"O vetor da leishmaniose visceral no Brasil é:",ops:["Aedes aegypti","Anopheles darlingi","Lutzomyia longipalpis (flebotomíneo/mosquito-palha)","Triatoma infestans (barbeiro)"],g:2,exp:"O Lutzomyia longipalpis é o principal vetor da leishmaniose visceral no Brasil. É um mosquito pequeno, de voo silencioso e baixo, ativo ao entardecer e amanhecer."},
        {n:45,q:"A doença de Chagas é causada pelo:",ops:["Plasmodium falciparum","Leishmania chagasi","Trypanosoma cruzi","Wuchereria bancrofti"],g:2,exp:"O Trypanosoma cruzi é o agente etiológico da doença de Chagas, transmitido pelo barbeiro (Triatoma spp.). Foi descoberto pelo médico brasileiro Carlos Chagas em 1909."},
        {n:46,q:"A Síndrome de Weil, forma grave da leptospirose, apresenta a tríade:",ops:["Artralgia, rash e febre","Icterícia intensa, insuficiência renal aguda e fenômenos hemorrágicos","Febre periódica, calafrios e sudorese","Hepatomegalia, esplenomegalia e anemia"],g:1,exp:"A Síndrome de Weil é a forma mais grave da leptospirose: icterícia intensa (coloração amarela intensa), insuficiência renal aguda e fenômenos hemorrágicos (petéquias, hemorragia pulmonar). Alta letalidade."},
        {n:47,q:"Qual é a fase da dengue de maior risco de evolução grave?",ops:["Fase febril (1º ao 3º dia)","Fase crítica (3º ao 6º dia, após queda da febre)","Fase de recuperação (após 7º dia)","A doença não apresenta fases"],g:1,exp:"A fase crítica, coincidindo com a queda da febre, é quando pode ocorrer extravasamento de plasma, hemoconcentração e choque — principal causa de óbito por dengue."},
        {n:48,q:"O sinal de Romaña é característico da fase aguda de qual doença?",ops:["Dengue","Leishmaniose visceral","Malária","Doença de Chagas"],g:3,exp:"O sinal de Romaña é o edema bipalpebral unilateral indolor, ocorre quando o Trypanosoma cruzi entra pela conjuntiva ocular — porta de entrada para a infecção na face."},
        {n:49,q:"Qual é o reservatório animal mais importante da leishmaniose visceral no ambiente urbano?",ops:["Rato doméstico","Gato doméstico","Cão doméstico","Gambá"],g:2,exp:"O cão doméstico é o principal reservatório urbano da L. infantum/chagasi. O controle canino é parte essencial das estratégias de prevenção da leishmaniose visceral urbana."},
        {n:50,q:"A transmissão da leptospirose ocorre principalmente por:",ops:["Picada de inseto","Contato com água ou lama contaminada pela urina de ratos","Transmissão de pessoa a pessoa","Contato com saliva de animais infectados"],g:1,exp:"A Leptospira penetra pela pele com lesões ou mucosas em contato com água/lama contaminada pela urina de ratos, especialmente em enchentes urbanas."},
      ]},
      {nome:'Conhecimentos em Informática (Q51–Q60)',qs:[
        {n:51,q:"No MS-Windows, o atalho Ctrl+C realiza qual ação?",ops:["Recortar o item selecionado","Copiar o item selecionado para a área de transferência","Colar o conteúdo da área de transferência","Desfazer a última ação"],g:1,exp:"Ctrl+C copia o item selecionado para a área de transferência, mantendo o original. Ctrl+X recorta (remove o original). Ctrl+V cola. Ctrl+Z desfaz."},
        {n:52,q:"No MS-Word, qual recurso insere números de página automaticamente no documento?",ops:["Inserir > Cabeçalho","Inserir > Número de Página","Layout > Margens","Referências > Notas de Rodapé"],g:1,exp:"Em Inserir > Número de Página, o Word insere a numeração automaticamente nas posições escolhidas (topo, rodapé ou margens do documento)."},
        {n:53,q:"No MS-Word, qual atalho abre 'Localizar e Substituir'?",ops:["Ctrl+F","Ctrl+H","Ctrl+G","Ctrl+L"],g:1,exp:"Ctrl+H abre a caixa de diálogo 'Localizar e Substituir', que permite encontrar uma palavra/frase e substituí-la por outra automaticamente em todo o documento."},
        {n:54,q:"No MS-Excel, qual fórmula calcula a média aritmética do intervalo B2:B10?",ops:["=SOMA(B2:B10)","=MÉDIA(B2:B10)","=MÁXIMO(B2:B10)","=CONT.SE(B2:B10)"],g:1,exp:"=MÉDIA(intervalo) calcula a média aritmética do conjunto de valores. =SOMA() soma, =MÁXIMO() retorna o maior valor, =CONT.SE() conta condicionalmente."},
        {n:55,q:"No MS-Excel, o símbolo $ em uma referência como $A$1 indica:",ops:["Que a célula está vazia","Referência absoluta — a célula não muda ao copiar a fórmula","Que o valor é monetário","Erro na fórmula"],g:1,exp:"O $ fixa a referência de célula (referência absoluta). $A$1 sempre aponta para a célula A1, mesmo ao copiar a fórmula para outras células. Sem $, a referência é relativa e se ajusta automaticamente."},
        {n:56,q:"No MS-Excel, qual função verifica uma condição e retorna valores diferentes conforme o resultado?",ops:["=SOMA()","=PROCV()","=SE()","=CONT.NÚM()"],g:2,exp:"=SE(teste_lógico; valor_se_verdadeiro; valor_se_falso) é a função condicional básica do Excel. Exemplo: =SE(A1>10;\"Aprovado\";\"Reprovado\")."},
        {n:57,q:"No MS-PowerPoint, qual recurso aplica efeitos visuais a objetos (texto, imagem) DENTRO de um slide?",ops:["Transição","Design","Animação","Layout"],g:2,exp:"Animação aplica efeitos de entrada, ênfase ou saída a objetos dentro de um slide. Transição é o efeito entre slides ao avançar a apresentação."},
        {n:58,q:"No MS-PowerPoint, o modo 'Apresentação de Slides' (F5) serve para:",ops:["Editar o layout do slide","Exibir a apresentação em tela cheia para o público","Adicionar anotações ao apresentador","Imprimir os slides em preto e branco"],g:1,exp:"F5 inicia a apresentação de slides em tela cheia a partir do primeiro slide. Shift+F5 inicia a partir do slide atual."},
        {n:59,q:"Na internet, o que significa a sigla URL?",ops:["Universal Reading Language","Uniform Resource Locator (endereço de um recurso na internet)","United Remote Link","User Resource Login"],g:1,exp:"URL = Uniform Resource Locator: é o endereço que identifica e localiza um recurso na internet, especificando protocolo (https://), domínio (site.com.br) e caminho (/pagina)."},
        {n:60,q:"Ao enviar um e-mail com 'CC' (Com Cópia), o que ocorre?",ops:["O e-mail é enviado apenas para o destinatário em CC","Todos os destinatários (principal e CC) recebem o e-mail e podem ver os endereços uns dos outros","O e-mail fica em modo confidencial","Apenas o remetente recebe cópia"],g:1,exp:"CC (Com Cópia) envia uma cópia do e-mail para destinatários adicionais, e todos os destinatários conseguem ver os endereços de e-mail de quem está em CC. Para cópia oculta, usa-se CCO (Cópia Oculta)."},
      ]},
    ]
  },
  {
    id:'sim10',titulo:'aceEstuda – Questões Comentadas',banca:'VUNESP',ano:2025,
    edital:'Agente de Combate às Endemias',cargo:'ACE',
    secoes:[
      {nome:'Conhecimentos Específicos ACE (Q1)',qs:[
        {n:1,q:"A febre amarela é uma doença infecciosa viral de importância em saúde pública, transmitida por mosquitos e prevenível por vacinação. Agora, marque V para verdadeiro e F para falso:\n( ) A febre amarela pode ocorrer nos ciclos silvestre e urbano, envolvendo diferentes espécies de mosquitos vetores.\n( ) A vacinação é uma medida eficaz na prevenção da febre amarela e na redução da ocorrência de casos humanos.\n( ) A transmissão da febre amarela ocorre exclusivamente por contato direto entre pessoas infectadas.\n( ) O Agente de Combate às Endemias pode atuar na orientação da população sobre prevenção e na vigilância de áreas com circulação viral.\nA sequência correta é:",ops:["V, V, V, F.","F, V, V, F.","V, V, F, V.","V, F, F, V."],g:2,exp:"A febre amarela ocorre nos ciclos silvestre (vetores Haemagogus/Sabethes) e urbano (Aedes aegypti) — V. A vacinação é a principal medida preventiva — V. A transmissão NÃO ocorre por contato direto entre pessoas, mas sim por picada de mosquito infectado — F. O ACE atua na orientação da população e vigilância de áreas com circulação viral — V. Portanto: V, V, F, V."},
        {n:2,q:"O piso salarial dos ACE e ACS, estabelecido pela EC 120/2022, é de responsabilidade de qual ente federativo?",ops:["Da União.","Do Estado.","Do Distrito Federal apenas.","Do Município."],g:0,exp:"O vencimento dos ACE e ACS é de responsabilidade da UNIÃO, conforme a Constituição Federal (art. 198, § 5º, com redação dada pela EC 120/2022). Estados, DF e Municípios podem estabelecer incentivos, auxílios, gratificações e indenizações adicionais."},
        {n:3,q:"Sobre a Leptospirose, marque a alternativa CORRETA:",ops:["Em casos mais graves, podem aparecer icterícia e insuficiência renal (Síndrome de Weil).","A leptospirose ocorre somente durante o verão e pode afetar todas as pessoas.","A principal forma de prevenção é por meio da vacina contra a leptospirose.","É uma doença transmissível e causada por um vírus.","A transmissão ocorre exclusivamente por contato direto com roedores."],g:0,exp:"A leptospirose é causada pela bactéria Leptospira interrogans. A Síndrome de Weil é a forma grave, caracterizada por icterícia, insuficiência renal e hemorragias. Não existe vacina disponível para a leptospirose no calendário nacional. A transmissão ocorre principalmente pelo contato com água ou solo contaminados pela urina de roedores — não exclusivamente por contato direto com os animais."},
        {n:4,q:"Considere que o Agente de Combate a Endemias (ACE) recebeu um mapa territorializado com registros dos seguintes pontos de risco de infestação do mosquito Aedes aegypti, identificados com base no último LIRAa:\n• Setor 01: 1,5%\n• Setor 02: 4,1%\n• Setor 03: 3,8%\n• Setor 04: 0,9%\nSegundo o Ministério da Saúde, índices superiores a 4% configuram situação de risco. Com base nesses dados, assinale a afirmativa correta.",ops:["Os setores 02 e 03 estão em alerta e devem receber monitoramento e ação preventiva prioritária.","O setor 04 apresenta risco iminente de surto, exigindo ação emergencial.","Todos os setores devem ser tratados igualmente, pois estão acima do índice ideal.","Apenas o setor 01 deve receber ações intensificadas de controle e bloqueio."],g:0,exp:"Pelo LIRAa (Levantamento de Índice Rápido para Aedes aegypti), os índices são classificados em: satisfatório (< 1%), alerta (1% a 3,9%) e risco (≥ 4%). O Setor 02 (4,1%) está em situação de RISCO e o Setor 03 (3,8%) em situação de ALERTA — ambos demandam monitoramento e ação preventiva prioritária. O Setor 04 (0,9%) é satisfatório e o Setor 01 (1,5%) está em alerta, mas não é o mais crítico. A alternativa A é a que melhor reflete a priorização correta de acordo com os dados apresentados."},
        {n:5,q:"É uma doença parasitária, diretamente relacionada ao saneamento precário. A transmissão ocorre quando pessoas entram em contato com água doce contaminada por cercárias, formas infectantes do parasita, liberadas por caramujos. A qual doença se refere o texto?",ops:["Esquistossomose.","Leishmaniose.","Histoplasmose.","Hanseníase."],g:0,exp:"A esquistossomose (barriga d'água) é uma doença parasitária causada pelo Schistosoma mansoni, transmitida quando as cercárias (formas infectantes do parasita) liberadas por caramujos do gênero Biomphalaria penetram na pele humana em contato com água doce contaminada. Está diretamente relacionada ao saneamento precário. A histoplasmose é fúngica, a hanseníase é bacteriana e a leishmaniose é transmitida por flebotomíneos."},
        {n:6,q:"A Lei nº 8.080/1990, que dispõe sobre a organização e o funcionamento do Sistema Único de Saúde (SUS), estabelece diretrizes específicas para o Planejamento e o Orçamento das ações e serviços de saúde. Nesse contexto, é CORRETO afirmar que:",ops:["O processo de planejamento e orçamento do SUS será ascendente, do nível local até o federal.","O processo de planejamento e orçamento do SUS será progressivo, do nível local até o estadual.","O processo de planejamento e orçamento do SUS será decrescente, do nível federal até o local.","O processo de planejamento e orçamento do SUS será crescente, do nível local até o municipal."],g:0,exp:"Conforme Art. 36 da Lei 8.080/1990, o processo de planejamento e orçamento do Sistema Único de Saúde (SUS) será ascendente, do nível local até o federal. Isso significa que o planejamento parte das necessidades locais (municípios) e se consolida nos níveis estadual e federal, respeitando a descentralização do SUS."},
        {n:7,q:"A peste é uma zoonose de roedores que pode infectar outros mamíferos (cães, gatos, coelhos, camelos), inclusive o homem. Constitui-se em um perigo potencial para as populações, devido à persistência da infecção em roedores silvestres. Trata-se de uma doença infecciosa aguda, transmitida principalmente por picada de pulga infectada, que se manifesta sob três formas clínicas principais:",ops:["Cuneiforme, etimoidal e pneumônica.","Bubônica, bacteriana e pneumônica.","Bubônica, septicêmica e pneumônica.","Septicêmica, pneumônica e juvenil.","Talassêmica, cuneiforme, bubônica."],g:2,exp:"A peste manifesta-se sob três formas clínicas principais: bubônica (mais comum, com inflamação de linfonodos — os famosos 'bubões'), septicêmica (disseminação da bactéria Yersinia pestis no sangue) e pneumônica (forma mais grave, com comprometimento pulmonar e possibilidade de transmissão interpessoal por gotículas). As demais alternativas apresentam termos incorretos ou inexistentes na classificação clínica da doença."},
        {n:8,q:"As autoridades governamentais federal, estadual e municipal, preocupadas com a situação epidemiológica da Dengue e a infestação de quase todo território nacional pelo mosquito Aedes aegypti, estão normatizando várias ações de controle do mosquito transmissor da dengue e da febre amarela. Identifique qual é o mais eficiente, seguro, econômico e racional método de controle do mosquito vetor:",ops:["Controle perifocal.","Controle sanitário.","Controle químico.","Controle mecânico."],g:3,exp:"O controle mecânico (eliminação de criadouros, vedação de recipientes, descarte correto de materiais e manejo ambiental) é o método mais eficiente, seguro, econômico e racional para o controle do Aedes aegypti. Não utiliza substâncias químicas, não agride o meio ambiente, pode ser realizado pela população e tem efeito duradouro. O controle químico deve ser usado apenas como complemento em situações específicas de surto. O controle perifocal é uma técnica específica de aplicação de inseticida ao redor de criadouros de difícil remoção."},
        {n:9,q:"Conforme Portaria nº 2.436, de 21 de setembro de 2017, são atribuições comuns a todos os membros que atuam na Atenção Básica:",ops:["Indicar a necessidade de internação hospitalar ou domiciliar, mantendo a responsabilização pelo acompanhamento da pessoa.","Alimentar e garantir a qualidade do registro das atividades nos sistemas de informação da Atenção Básica conforme normativa vigente.","Realizar consultas clínicas, pequenos procedimentos cirúrgicos, atividades em grupo na UBS e, quando indicado ou necessário, no domicílio e/ou nos demais espaços comunitários.","Realizar e/ou supervisionar acolhimento com escuta qualificada e classificação de risco, de acordo com protocolos estabelecidos."],g:1,exp:"Conforme a Portaria 2.436/2017, alimentar e garantir a qualidade do registro das atividades nos sistemas de informação da Atenção Básica é atribuição COMUM a todos os membros das equipes. As demais alternativas referem-se a atribuições específicas de determinadas categorias profissionais (médicos, enfermeiros), não sendo comuns a todos."},
        {n:10,q:"De acordo com a Lei nº 8.080/1990, são atribuições comuns da União, dos Estados e dos Municípios no âmbito administrativo do Sistema Único de Saúde (SUS):",ops:["Participar na formulação e na implementação das políticas de controle das agressões ao meio ambiente, de saneamento básico e relativas às condições e aos ambientes de trabalho.","Elaborar normas técnicas e estabelecer padrões de qualidade para promoção da saúde do trabalhador.","Gerir laboratórios públicos de saúde e hemocentros.","Formular, avaliar e apoiar políticas de alimentação e nutrição.","Promover a descentralização para os municípios dos serviços e das ações de saúde."],g:1,exp:"Conforme Art. 15, VI da Lei 8.080/1990, é atribuição COMUM da União, dos Estados e dos Municípios elaborar normas técnicas e estabelecer padrões de qualidade para promoção da saúde do trabalhador. As demais alternativas referem-se a atribuições específicas de determinados entes: a gestão de hemocentros e laboratórios (C) e a descentralização para municípios (E) são atribuições da União/Estados; as políticas de alimentação e nutrição (D) têm competências diferenciadas por ente."},
        {n:11,q:"Qual ano foi criada a lei que regulamenta o trabalho do Agente de Combate às Endemias?",ops:["1999","2003","1990","2006","1994"],g:3,exp:"A Lei Federal nº 11.350, que regulamenta o trabalho do Agente de Combate às Endemias (ACE) e do Agente Comunitário de Saúde (ACS), foi publicada em 2006. Essa lei dispõe sobre o aproveitamento dos agentes, estipula requisitos para o exercício das atividades e define as atribuições da carreira."},
        {n:12,q:"No âmbito do Sistema Único de Saúde (SUS), são atribuições comuns à União, aos Estados, ao Distrito Federal e aos Municípios, EXCETO:",ops:["Gerir laboratórios públicos de saúde e hemocentros.","Participação na formulação e na execução da política de formação e desenvolvimento de recursos humanos para a saúde.","Administração dos recursos orçamentários e financeiros destinados, em cada ano, à saúde.","Elaboração e atualização periódica do plano de saúde.","Participação na formulação e implementação das políticas de controle das agressões ao meio ambiente."],g:0,exp:"Conforme Art. 18, VIII da Lei 8.080/1990, gerir laboratórios públicos de saúde e hemocentros é competência MUNICIPAL, não atribuição comum a todos os entes federados. As demais alternativas (formação de RH, administração de recursos, plano de saúde e controle ambiental) são atribuições comuns previstas no Art. 15 da mesma lei."},
        {n:13,q:"De acordo com a Constituição Federal, as ações e os serviços públicos de saúde constituem um sistema único, que tem como uma de suas diretrizes o(a):",ops:["Atendimento integral, com prioridade para os serviços assistenciais.","Rede regionalizada e sem hierarquia ou precedência.","Atendimento integral, com prioridade para as atividades emergenciais.","Participação da comunidade.","Centralização da direção em uma esfera, no caso o governo federal."],g:3,exp:"Conforme Art. 198 da CF/88, o SUS é constituído por uma rede regionalizada e hierarquizada e organizado com base em três diretrizes: I – descentralização, com direção única em cada esfera de governo; II – atendimento integral, com prioridade para as atividades PREVENTIVAS (não assistenciais nem emergenciais); III – participação da comunidade. A alternativa D corresponde exatamente à terceira diretriz constitucional do SUS."},
        {n:14,q:"As zoonoses são doenças ou infecções naturalmente transmitidas entre animais e seres humanos, representando um importante desafio para a saúde pública. O Agente de Combate às Endemias atua na orientação da população, na vigilância ambiental e no apoio às ações de prevenção e controle dessas doenças no território. Considerando os conceitos e as estratégias de prevenção das zoonoses, assinale a alternativa CORRETA:",ops:["A prevenção das zoonoses limita-se ao tratamento dos animais doentes, não sendo necessárias ações de vigilância ou educação em saúde.","O controle das zoonoses é responsabilidade exclusiva dos serviços hospitalares, não envolvendo ações no território.","As zoonoses são transmitidas entre animais e seres humanos e exigem ações preventivas integradas.","As zoonoses afetam exclusivamente animais domésticos, não oferecendo risco à saúde humana."],g:2,exp:"As zoonoses são doenças transmitidas entre animais e seres humanos e exigem ações preventivas integradas, incluindo vigilância ambiental, controle vetorial, orientação da população e educação em saúde. As demais alternativas estão incorretas: zoonoses afetam tanto animais domésticos quanto silvestres; o controle envolve ações no território (não apenas hospitais); e a prevenção vai muito além do tratamento de animais doentes."},
        {n:15,q:"A assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas, constitui um dos objetivos do SUS. Certo ou Errado?",ops:["Errado.","Certo."],g:1,exp:"CERTO. Conforme Art. 5º, III da Lei 8.080/1990, são objetivos do SUS: I – a identificação e divulgação dos fatores condicionantes e determinantes da saúde; II – a formulação de política de saúde para promover, proteger e recuperar a saúde; III – a assistência às pessoas por meio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas."},
        {n:16,q:"Qual é o ciclo de vida completo do Aedes aegypti?",ops:["Larva, pupa e adulto.","Ovo, ninfa e adulto.","Ovo, larva e adulto.","Ovo, larva, pupa e adulto."],g:3,exp:"O ciclo do Aedes aegypti tem 4 fases: ovo → larva → pupa → adulto. As fases de ovo, larva e pupa são aquáticas (dependem da água para se desenvolver), enquanto a fase adulta é aérea. O ciclo completo dura em média de 7 a 10 dias em condições ideais de temperatura e umidade. O termo 'ninfa' pertence ao ciclo de outros insetos (hemimetábolos), não ao mosquito."},
        {n:17,q:"No que se refere aos princípios do Sistema Único de Saúde (SUS), analise a afirmativa abaixo. A _______ assegura o acesso às ações e aos serviços de saúde a todos os cidadãos brasileiros, sem qualquer forma de discriminação. A incorporação desse princípio pela Constituição Federal de 1988 representou uma expressiva conquista democrática, ao reconhecer a saúde como direito de todos e dever do Estado. Assinale a alternativa que preenche corretamente a lacuna:",ops:["Universalidade.","Centralização.","Seletividade.","Equidade."],g:0,exp:"A universalidade é o princípio do SUS que assegura o acesso às ações e serviços de saúde a TODOS os cidadãos, sem discriminação de raça, cor, classe social ou qualquer outra condição. A CF/1988 reconheceu a saúde como direito de todos e dever do Estado (Art. 196). Não confundir com equidade (tratar desigualmente os desiguais para reduzir iniquidades) nem com integralidade (atenção ao indivíduo como um todo)."},
        {n:18,q:"Durante as vistorias em áreas rurais com ocorrência de pomares e reflorestamentos, o Agente de Combate às Endemias (ACE) orienta os trabalhadores sobre acidentes por lagartas do gênero Lonomia (lepidópteros). Em caso de acidente por contato com as cerdas desse animal, qual é a complicação grave esperada e o tratamento indicado?",ops:["Insuficiência respiratória aguda e paralisia motora espástica, tratada com soro antibotrópico via endovenosa.","Necrose cutânea progressiva com formação de bolhas, tratada com corticoides tópicos de efeito residual.","Síndrome hemorrágica com risco de insuficiência renal aguda, tratada com soro antilonômico específico.","Choque anafilático precoce e edema de glote imediato, tratado com vacina antitetânica e anti-histamínicos."],g:2,exp:"O acidente com lagartas do gênero Lonomia (taturana) pode causar síndrome hemorrágica grave — com distúrbios de coagulação, sangramento espontâneo e risco de insuficiência renal aguda. O tratamento específico é o soro antilonômico, produzido pelo Instituto Butantan. O soro antibotrópico é indicado para acidentes com serpentes do gênero Bothrops (jararaca), não para lepidópteros."},
        {n:19,q:"O Controle de pragas e vetores é um conjunto de medidas preventivas e corretivas para evitar a infestação, proliferação, acesso e abrigo para vetores e pragas. Essas ações trazem resultados positivos se adotadas com medidas sanitárias, promovendo impactos satisfatórios no aspecto ambiental. Identifique qual alternativa NÃO representa um impacto positivo do controle das pragas e vetores para a saúde e ambiente:",ops:["Minimiza a população de pragas e vetores para que não se torne um problema significativo.","Elimina fatores que possam ajudar na permanência das pragas e vetores, reduzindo ofertas de abrigo, água e comida.","Evita a transmissão de doenças transmissíveis e não transmissíveis.","Evita que pragas como insetos, roedores e aves transitem em espaços onde as portas e janelas possuem telas de proteção."],g:2,exp:"O controle de pragas e vetores NÃO evita a transmissão de doenças NÃO transmissíveis (como doenças crônicas, cardiovasculares, diabetes, hipertensão, etc.), pois estas têm causas multifatoriais sem relação com vetores. O controle de pragas atua na prevenção de doenças TRANSMISSÍVEIS causadas por vetores (dengue, leptospirose, malária, etc.). As demais alternativas descrevem impactos positivos reais do controle vetorial."},
        {n:20,q:"A Lei Orgânica 8.080, de 1990, define 'um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva'. Trata-se do conceito de:",ops:["Vigilância Ambiental.","Epidemiologia.","Promoção da saúde.","Vigilância Nutricional.","Vigilância Epidemiológica."],g:4,exp:"Conforme Art. 6º, §2º da Lei 8.080/1990, vigilância epidemiológica é 'um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos'."},
        {n:21,q:"A Lei nº 8.142/1990 dispõe sobre a participação da comunidade na gestão do Sistema Único de Saúde (SUS) e sobre as transferências intergovernamentais de recursos financeiros na área da saúde. Sobre o Conselho de Saúde, é CORRETO afirmar que:",ops:["É um órgão consultivo, sem poder de decisão sobre a política de saúde.","É um órgão temporário, reunindo-se a cada quatro anos para avaliar a situação de saúde e propor diretrizes.","É um órgão permanente e deliberativo, composto por representantes do governo, prestadores de serviço, profissionais de saúde e usuários, atuando na formulação de estratégias e no controle da execução da política de saúde.","É composto apenas por gestores e prestadores de serviço, sem participação de usuários."],g:2,exp:"Conforme Art. 1º, §2º da Lei nº 8.142/1990, o Conselho de Saúde é um órgão PERMANENTE e DELIBERATIVO, composto por representantes do governo, prestadores de serviço, profissionais de saúde e usuários. Atua na formulação de estratégias e no controle da execução da política de saúde, inclusive nos aspectos econômicos e financeiros. A alternativa B descreve a Conferência de Saúde (que se reúne a cada 4 anos). A alternativa A está errada (o Conselho é deliberativo, não consultivo). A alternativa D está errada (há participação paritária de usuários)."},
        {n:22,q:"O que é a fase leptospirêmica da doença?",ops:["A fase de recuperação da doença.","A fase inicial (1ª semana), com presença da bactéria no sangue, febre súbita, cefaleia e mialgia intensa.","A fase de transmissão para outros humanos.","A fase crônica da doença, com meses de duração."],g:1,exp:"A fase leptospirêmica ocorre nos primeiros 3 a 7 dias, quando a Leptospira está presente no sangue e no líquor. Caracteriza-se por febre de início súbito, cefaleia intensa, mialgia (principalmente nas panturrilhas) e conjuntivite. É a fase aguda inicial da leptospirose, antes de eventual evolução para a fase imunológica (síndrome de Weil), com icterícia, insuficiência renal e manifestações hemorrágicas."},
        {n:23,q:"Sobre a leishmaniose visceral, é correto afirmar que:",ops:["É sempre benigna.","É uma doença crônica e sistêmica, que pode ser fatal se não tratada.","Afeta apenas crianças.","Não tem tratamento."],g:1,exp:"A leishmaniose visceral é uma doença CRÔNICA e SISTÊMICA, que pode ser FATAL se não tratada. Afeta principalmente crianças e imunossuprimidos, mas pode ocorrer em adultos. O tratamento é disponibilizado pelo SUS (antimoniais pentavalentes como o Glucantime ou anfotericina B). Não é benigna — a letalidade sem tratamento pode ultrapassar 90%."},
        {n:24,q:"A Lei 8.080/1990 determina que a assistência terapêutica integral no SUS deve incluir:",ops:["Apenas medicamentos de alto custo.","Medicamentos de uso exclusivamente hospitalar.","O fornecimento gratuito de medicamentos essenciais.","Produtos que não necessitam de receita médica."],g:2,exp:"Conforme Art. 6º, I, 'd' da Lei 8.080/1990, a assistência terapêutica integral inclui a oferta de medicamentos. O SUS garante o acesso gratuito a medicamentos essenciais (Rename – Relação Nacional de Medicamentos Essenciais), não se restringindo a medicamentos de alto custo, uso hospitalar exclusivo ou produtos sem receita."},
      ]},
    ]
  },
  {
    id:'sim-ac2',titulo:'aceEstuda 2 – Questões Comentadas',banca:'aceEstuda',ano:2025,
    edital:'Agente de Combate às Endemias',cargo:'ACE',
    secoes:[
      {nome:'Conhecimentos Específicos ACE (Q1)',qs:[
        {n:1,q:"Qual é a principal diferença clínica entre Chikungunya e Dengue?",ops:["A Chikungunya causa manchas na pele, enquanto a dengue não.","A Chikungunya causa dor articular intensa e persistente, enquanto a dengue causa dor muscular.","A Chikungunya causa febre alta, enquanto a dengue não causa febre.","A Chikungunya não causa dor."],g:1,exp:"A Chikungunya é marcada por dor articular intensa e persistente (artralgia/artrite), que pode durar meses ou anos. A dengue causa mais dor muscular e retro-orbitária. Ambas causam febre e podem causar manchas na pele. A dor articular da Chikungunya é a característica mais distintiva."},
        {n:2,q:"A Lei Orgânica 8.080, de 1990, define 'um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva'. Trata-se do conceito de:",ops:["Vigilância Epidemiológica.","Vigilância Nutricional.","Vigilância Ambiental.","Epidemiologia.","Promoção da saúde."],g:0,exp:"Conforme Art. 6º, §2º da Lei 8.080/1990, essa é a definição de vigilância epidemiológica."},
        {n:3,q:"Dengue é uma doença viral frequente em regiões tropicais, podendo evoluir para quadros graves. Assinale a alternativa que representa uma estratégia CORRETA de prevenção e manejo:",ops:["Viabilizar o uso de inseticidas somente após a confirmação laboratorial de surtos, priorizando áreas com maior densidade populacional.","Combinar controle mecânico e químico do vetor, aliando educação em saúde e notificação imediata de casos suspeitos.","Concentrar a vigilância em bairros mais afetados, deixando comunidades com menor incidência em segundo plano.","Distribuir repelentes individuais amplamente pela comunidade, considerando-os como principal medida para controle efetivo da doença."],g:1,exp:"A prevenção e manejo da dengue devem combinar controle mecânico e químico do vetor, educação em saúde e notificação imediata de casos suspeitos. A vigilância não deve ser concentrada apenas em áreas mais afetadas. O uso de repelentes é uma medida complementar."},
        {n:4,q:"O que é vedado pelo § 2º do Art. 199 em relação ao uso de recursos públicos?",ops:["O uso para instituições filantrópicas.","O uso para auxílios a instituições privadas com fins lucrativos.","O uso para programas de saúde comunitários.","O uso para a saúde pública."],g:1,exp:"O § 2º do Art. 199 da CF/88 veda a destinação de recursos públicos para auxílios ou subvenções às instituições privadas com fins lucrativos."},
        {n:5,q:"Os serviços e ações de saúde que integram o Sistema Único de Saúde (SUS) são organizados de forma regionalizada e hierarquizada e desenvolvidos a partir de alguns princípios, dentre eles a igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie. Tal princípio tem relação direta com os conceitos de igualdade e de justiça, visto que reconhece as diferenças nas condições de vida e saúde e nas necessidades das pessoas, e é denominado princípio da:",ops:["Longitudinalidade.","Resolutividade.","Equidade.","Universalidade.","Integralidade."],g:2,exp:"A equidade é o princípio que busca tratar desigualmente os desiguais, na medida de suas desigualdades, para alcançar a igualdade. Reconhece as diferenças nas condições de vida e saúde e nas necessidades das pessoas."},
        {n:6,q:"Sobre a exigência de residência na comunidade de atuação, é correto afirmar que:",ops:["Não é exigida para nenhum.","É exigida para o ACE.","É exigida para o ACS, mas não para o ACE.","É exigida para ambos."],g:2,exp:"A exigência de residir na comunidade de atuação é uma característica LEGAL DO ACS (Agente Comunitário de Saúde), mas NÃO do ACE (Agente de Combate às Endemias). Essa é uma pegadinha comum em provas."},
        {n:7,q:"Qual é a classificação de gravidade de um acidente ofídico por Bothrops (jararaca)?",ops:["A gravidade não pode ser avaliada clinicamente.","Existe apenas 2 classificações: grave e não grave.","Leve (edema local discreto), Moderado (edema intenso, alterações da coagulação sem sangramento ativo) e Grave (edema extenso, coagulopatia grave, complicações sistêmicas).","Toda picada de jararaca é automaticamente classificada como grave."],g:2,exp:"O acidente botrópico é classificado em leve (edema local limitado, sem coagulopatia), moderado (edema extenso, coagulopatia sem sangramento ativo) e grave (edema além do membro, coagulopatia com sangramento, choque, insuficiência renal). O número de ampolas de soro varia conforme a classificação."},
        {n:8,q:"O Decreto nº 7.508/2011, que regulamenta a Lei nº 8.080/1990, estabelece que as Regiões de Saúde devem conter, no mínimo, ações e serviços de:",ops:["Apenas atenção hospitalar e de urgência e emergência.","Apenas atenção primária e vigilância em saúde.","Atenção primária, urgência e emergência, atenção psicossocial, atenção ambulatorial especializada e hospitalar, e vigilância em saúde.","Apenas atenção psicossocial e vigilância em saúde.","Atenção primária e atenção hospitalar, apenas."],g:2,exp:"Conforme Art. 5º do Decreto 7.508/2011, as Regiões de Saúde devem conter, no mínimo, ações e serviços de: atenção primária, urgência e emergência, atenção psicossocial, atenção ambulatorial especializada e hospitalar, e vigilância em saúde."},
        {n:9,q:"De acordo com a Portaria nº 2436/2017, a coordenação municipal da Atenção Básica é de competência das Secretarias Municipais de Saúde, no âmbito de seus limites territoriais, de acordo com a política, as diretrizes e as prioridades estabelecidas. É responsabilidade dos municípios e do Distrito Federal, EXCETO:",ops:["Selecionar e contratar os profissionais que compõem as equipes multiprofissionais da Atenção Básica, conforme a legislação vigente, ficando a remuneração desses profissionais a cargo das Secretarias de Saúde dos Estados.","Destinar recursos municipais para compor o financiamento tripartite da Atenção Básica.","Inserir a Estratégia Saúde da Família em sua rede de serviços como estratégia prioritária de organização da Atenção Básica.","Organizar os serviços para permitir que a Atenção Básica atue como porta de entrada preferencial e ordenada da Rede de Atenção à Saúde (RAS)."],g:0,exp:"Conforme a Portaria 2.436/2017, a remuneração dos profissionais da Atenção Básica é responsabilidade do município ou Distrito Federal, não dos Estados."},
        {n:10,q:"O Sistema Único de Saúde é constituído pelo conjunto de todas as ações e serviços públicos de saúde, integrados numa rede regionalizada e hierarquizada. Considerando suas funções e características, assinale a alternativa CORRETA:",ops:["Apenas pessoas brasileiras, residentes em território nacional, podem recorrer ao SUS para obter serviços de atenção à saúde.","O SUS oferece serviços gratuitos de maneira universal, sendo acessível a qualquer pessoa, independentemente da condição socioeconômica.","Uma das principais características do SUS é a união dos Poderes Executivos (federal, estadual e municipal) pela gerência do sistema.","O SUS é um dos poucos sistemas de saúde nacionalmente integrados, daí a caracterização denominada pela palavra 'sistema'."],g:1,exp:"O SUS oferece serviços gratuitos de maneira universal, sendo acessível a qualquer pessoa (brasileira ou estrangeira, residente ou em trânsito no território nacional), independentemente da condição socioeconômica. Isso decorre do princípio da universalidade. A alternativa A está errada pois o SUS atende também estrangeiros. A C está errada: o SUS é gerido de forma tripartite (União, Estados e Municípios), mas não é uma 'união dos Poderes Executivos'. A D está errada pois não descreve corretamente a característica do sistema."},
        {n:11,q:"A manutenção do trabalho em equipe se dá pela clareza dos objetivos da proposta de trabalho (tarefa visível) e também pela relação afetiva entre seus membros (tarefa invisível). Uma das condições para que haja na equipe um espaço de fala e escuta, respeito mútuo e confiança é 'acreditar que os indivíduos são capazes de mudar e que isso é fruto do amadurecimento pessoal e das oportunidades de desenvolvimento das suas potencialidades e da disposição para enfrentar as dificuldades'. Essa definição corresponde a:",ops:["Confiança na capacidade de transformação pessoal.","Interprofissionalidade.","Escuta e acolhimento.","Cooperação e aceitação das diferenças.","Disponibilidade interna."],g:0,exp:"A definição apresentada corresponde à Confiança na capacidade de transformação pessoal — crença de que os indivíduos são capazes de mudar a partir do amadurecimento pessoal, das oportunidades de desenvolvimento e da disposição para enfrentar dificuldades. Esse é um dos pilares do trabalho em equipe na Estratégia Saúde da Família."},
        {n:12,q:"A leptospirose é uma doença infecciosa transmitida pela urina de roedores infectados. É CORRETO afirmar que a leptospirose é causada pelo(a):",ops:["Vírus Rabies.","Bactéria Leptospira.","Bactéria Streptococcus.","Parasita Leishmania."],g:1,exp:"A leptospirose é causada pela bactéria Leptospira interrogans (espiroqueta). A Leishmania é um protozoário causador da leishmaniose. O vírus Rabies causa a raiva. O Streptococcus é uma bactéria causadora de diversas infecções, mas não da leptospirose."},
        {n:13,q:"O dever do Estado de garantir a saúde não exclui o das pessoas, da família, das empresas e da sociedade.",ops:["Certo.","Errado."],g:0,exp:"Conforme Art. 2º, §2º da Lei 8.080/1990, o dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade."},
        {n:14,q:"Sobre a atuação do ACE em ações de vigilância epidemiológica, é correto afirmar que:",ops:["O ACE só participa de ações de vigilância sanitária.","O ACE participa de ações de vigilância epidemiológica, conforme suas atribuições legais.","O ACE só participa de ações de vigilância ambiental.","O ACE não participa de ações de vigilância epidemiológica."],g:1,exp:"O ACE participa de ações de VIGILÂNCIA EPIDEMIOLÓGICA, AMBIENTAL E DE CONTROLE DE DOENÇAS E AGRAVOS, conforme suas atribuições legais, normas técnicas e organização do serviço. Sua atuação é integrada à equipe de saúde."},
        {n:15,q:"Leia as afirmativas a seguir:\nI. A vigilância ambiental em saúde constitui-se no conjunto de ações e serviços que proporcionam o conhecimento e a detecção de fatores de risco do meio ambiente que interferem na saúde humana. O sistema integra informações e ações de diferentes setores com o objetivo de prevenir e controlar os fatores de risco de doenças e de outros agravos à saúde, decorrentes do ambiente e das atividades produtivas.\nII. Os atuais padrões de vida adotados em relação ao trabalho, à alimentação e ao consumo, de modo geral, aumentam a exposição dos indivíduos aos agentes cancerígenos. Esses fatores ambientais resultantes de mudanças no estilo de vida das pessoas e do processo de industrialização estão relacionados com a participação do câncer na mudança do perfil de adoecimento da população brasileira.\nMarque a alternativa CORRETA:",ops:["A afirmativa I é verdadeira, e a II é falsa.","As duas afirmativas são falsas.","As duas afirmativas são verdadeiras.","A afirmativa II é verdadeira, e a I é falsa."],g:2,exp:"Ambas as afirmativas estão corretas. A afirmativa I descreve corretamente a vigilância ambiental em saúde como um conjunto de ações para detectar fatores de risco ambientais que interferem na saúde humana, integrando diferentes setores. A afirmativa II também está correta ao relacionar os padrões de vida modernos (trabalho, alimentação, consumo) com o aumento da exposição a agentes cancerígenos e a mudança no perfil de adoecimento da população brasileira."},
        {n:16,q:"Qual é o piso salarial nacional dos ACE e ACS, conforme a EC 120/2022?",ops:["1,5 salário mínimo.","2 salários mínimos.","3 salários mínimos.","1 salário mínimo."],g:1,exp:"A Emenda Constitucional nº 120/2022 estabeleceu que o vencimento dos ACE e ACS não será inferior a 2 SALÁRIOS MÍNIMOS. O vencimento é de responsabilidade da União, conforme a Constituição Federal."},
        {n:17,q:"De acordo com a Lei Orgânica de Saúde 8.080/90, compete à direção nacional do Sistema Único de Saúde:",ops:["Formular, avaliar e apoiar políticas de alimentação e nutrição.","Formar consórcios administrativos intermunicipais.","Controlar e fiscalizar os procedimentos dos serviços privados de saúde firmados nos consórcios estaduais.","Gerir sistemas públicos de alta complexidade, de referência estadual e regional.","Executar serviços de saneamento básico e vigilância epidemiológica."],g:0,exp:"Conforme Art. 16, I da Lei 8.080/1990, compete à direção nacional do SUS formular, avaliar e apoiar políticas de alimentação e nutrição."},
        {n:18,q:"De acordo com o previsto na Lei nº 8.080/1990, assinale a alternativa correta:",ops:["Entende-se por vigilância sanitária um conjunto de ações capaz de eliminar, diminuir ou prevenir os riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde.","As ações e serviços de saúde públicos deverão obedecer, entre outros, os princípios de obrigação na defesa da integridade física e moral das pessoas, e a vigilância e a orientação nutricional da sociedade.","A iniciativa privada não poderá participar do SUS, em caráter complementar, mas sim em caráter cooperativo.","É dever do Estado garantir a saúde por meio de formulação e execução de políticas econômicas e sociais, excluindo-se desse dever a família, as empresas e a sociedade.","Aos Municípios é vedada a constituição de consórcios administrativos para desenvolver ações e serviços de saúde."],g:0,exp:"Conforme Art. 6º, §1º da Lei 8.080/1990, essa é a definição de vigilância sanitária: um conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e intervir em problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde. As demais alternativas estão incorretas."},
        {n:19,q:"O que deve conter o Boletim de Acompanhamento de Campo (BAC) preenchido pelo ACE após cada visita?",ops:["Apenas registros de casos de dengue.","Dados do imóvel, tipo de visita (normal/complementar), recipientes inspecionados, criadouros encontrados, medidas adotadas e resultado da visita.","Apenas o nome do morador.","Informações financeiras sobre o imóvel."],g:1,exp:"O BAC é o instrumento de registro das atividades do ACE, contendo: endereço e tipo do imóvel, tipo de visita, situação de acesso, recipientes inspecionados por tipo, criadouros encontrados, tratamento realizado (mecânico, químico, biológico) e situação de fechamento."},
        {n:20,q:"Durante uma visita domiciliar, o agente de combate às endemias identifica diversos recipientes com água parada no quintal. Qual deve ser a primeira orientação à família para prevenir arboviroses, como dengue, zika e chikungunya?",ops:["Utilizar inseticida em todos os cômodos da casa diariamente.","Recomendar o uso contínuo de repelente corporal em todos os moradores.","Solicitar que a família instale telas em todas as janelas.","Orientar a lavar o quintal com desinfetante semanalmente.","Manter recipientes sempre limpos e tampados, evitando o acúmulo de água."],g:4,exp:"A primeira orientação deve ser manter recipientes sempre limpos e tampados, evitando o acúmulo de água parada, pois o Aedes aegypti deposita seus ovos em água parada. Lavar o quintal com desinfetante não elimina criadouros. Inseticida em cômodos não previne a reprodução do mosquito. Telas protegem da entrada, mas não eliminam criadouros. Repelentes protegem individualmente, mas não previnem a reprodução."},
        {n:21,q:"A assistência à saúde é livre à iniciativa privada, observando-se os princípios éticos e as normas expedidas pelo órgão de direção do Sistema Único de Saúde quanto às condições para seu funcionamento.",ops:["Certo.","Errado."],g:0,exp:"Conforme Art. 21 e 22 da Lei 8.080/1990, a assistência à saúde é livre à iniciativa privada, observados os princípios éticos e as normas expedidas pelo órgão de direção do SUS."},
        {n:22,q:"Qual é a relação entre saneamento básico e a prevenção da esquistossomose?",ops:["O saneamento apenas reduz a dengue, não a esquistossomose.","A esquistossomose é transmitida pelo ar, não pela água.","Não há relação entre saneamento e esquistossomose.","O tratamento de esgoto e o abastecimento de água potável evitam que as fezes humanas contaminadas alcancem coleções de água doce onde vivem os caramujos hospedeiros."],g:3,exp:"A esquistossomose tem ciclo que depende da contaminação de coleções de água doce pelas fezes humanas. Com esgotamento sanitário adequado e abastecimento de água, as fezes não chegam ao ambiente aquático dos caramujos (Biomphalaria), quebrando o ciclo de transmissão."},
        {n:23,q:"O que é o Índice de Breteau (IB)?",ops:["Número de recipientes positivos por 100 imóveis pesquisados.","Percentual de imóveis com focos positivos.","Percentual de larvas por recipiente.","Número de mosquitos adultos por armadilha."],g:0,exp:"O Índice de Breteau (IB) é o número de recipientes positivos (com larvas) por 100 imóveis pesquisados. Ele reflete a densidade larvária. O Índice de Infestação Predial (IIP) é o percentual de imóveis com focos positivos."},
        {n:24,q:"Sobre arboviroses, como chikungunya e dengue, marque a opção correta:",ops:["O CHIKV não pode causar complicações neurológicas.","Apenas a dengue é uma arbovirose viral.","Arboviroses são transmitidas apenas por mosquitos do gênero Anopheles.","Zika, dengue e chikungunya são transmitidas por diferentes vetores.","Todas as arboviroses são transmitidas por artrópodes."],g:4,exp:"Todas as arboviroses são transmitidas por artrópodes (como mosquitos). O CHIKV pode causar complicações neurológicas, ao contrário do que afirma a alternativa A. Zika, dengue e chikungunya são transmitidas pelo mesmo vetor, o Aedes aegypti. Anopheles transmite malária, não arboviroses."},
      ]},
    ]
  },
  {
    id:'sim11',titulo:'Prova Agente Prefeitura Parauapebas',banca:'Fadesp',ano:2022,
    edital:'Concurso Público – Edital Nº 001/2022',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q10)',qs:[
        {n:1,q:"De acordo com o texto sobre 'fake news' (Hérica Teixeira/Sesp-MT), a notícia da onda de sequestros de crianças e adolescentes em Cuiabá e Várzea Grande era",ops:["absolutamente tendenciosa.","totalmente mentirosa.","parcialmente verdadeira.","potencialmente perigosa."],g:1,exp:"O texto informa que a Polícia Judiciária Civil confirmou apenas um boletim de ocorrência e que não havia nenhum registro de criança desaparecida, mostrando que a notícia de 'uma onda de sequestros' era totalmente mentirosa."},
        {n:2,q:"Com o intuito de diminuir a ocorrência de fake news, a Sesp enumerou",ops:["direitos a serem exigidos.","precauções a serem tomadas.","ordens a serem obedecidas.","deveres a serem cumpridos."],g:1,exp:"A Sesp listou 'cuidados' e orientações práticas para os usuários da internet verificarem a veracidade das notícias — são precauções, não ordens ou deveres."},
        {n:3,q:"Para a Sesp, um indício de que uma notícia é verdadeira é",ops:["conter uma chamada que cause impacto.","referir-se a um fato surpreendente.","partir de uma fonte que goze de prestígio.","constar em veículo de comunicação confiável."],g:3,exp:"O texto afirma que o terceiro passo é 'constatar se a informação recebida já consta em veículos de comunicação oficial' como forma de verificar sua veracidade."},
        {n:4,q:"A autora do texto sugere que",ops:["a maioria das notícias que circulam nas redes sociais é falsa.","as notícias falsas são reproduzidas por pessoas criminosas.","existe uma tendência a acreditar em notícias inverídicas.","veículos de comunicação oficial podem publicar notícias falsas."],g:0,exp:"A autora sugere que há sites 'voltados só para criar notícias falsas' com 'chamadas de impacto' para atrair leitores, e que a sociedade tende a ampliar a divulgação de boatos — sugerindo uma tendência a acreditar em notícias inverídicas."},
        {n:5,q:"No trecho 'boletim de ocorrência foi registrado sobre o caso em Cuiabá, onde a mãe narra que tentaram levar sua filha', a palavra grifada 'onde' se refere a",ops:["Cuiabá e Várzea Grande.","Polícia Judiciária Civil.","boletim de ocorrência.","Cuiabá."],g:2,exp:"'Onde' é pronome relativo que retoma o antecedente 'boletim de ocorrência'. A mãe narra (no boletim) que tentaram levar sua filha."},
        {n:6,q:"No trecho 'O primeiro deles é ler com atenção a notícia e não focar o título', o termo 'focar' é sinônimo de",ops:["considerar.","distinguir.","destacar.","mirar."],g:0,exp:"No contexto 'não focar o título', 'focar' significa dar atenção prioritária, equivalendo a 'considerar' — não se deve focar/considerar apenas o título da notícia."},
        {n:7,q:"Uma preposição foi omitida em",ops:["'Um dos casos apontava uma onda de sequestros de crianças...' (linhas 8 e 9).","'Ainda sobre o caso, a Polícia Judiciária Civil informou que não há nenhum registro...' (linhas 14 a 17).","'o correto a fazer é verificar se o site é confiável' (linhas 24 a 27).","'O terceiro passo é constatar se a informação recebida já consta em veículos de comunicação oficial...' (linhas 28 e 29)."],g:2,exp:"Em 'o correto a fazer é verificar se o site é confiável', falta a preposição 'de' antes do infinitivo: 'o correto a fazer é o de verificar'. A preposição foi omitida na construção nominal."},
        {n:8,q:"Uma vírgula obrigatória deixou de ser empregada em",ops:["'Segundo informações de técnicos da Adjunta de Inteligência da Sesp, uma solução para frear... é checar a fonte e, em caso de dúvida... o correto a fazer é não compartilhar.' (linhas 3 a 6).","'Ainda sobre o caso, a Polícia Judiciária Civil informou...' (linhas 14 a 17).","'O primeiro deles é ler com atenção a notícia e não focar o título, pois segundo os técnicos...' (linhas 21 a 23).","'A quarta instrução é fazer buscas por sites de checagens livres.' (linhas 29 e 30)."],g:2,exp:"Em '...não focar o título, pois segundo os técnicos,' falta vírgula após 'técnicos': 'pois, segundo os técnicos,' — o adjunto 'segundo os técnicos' é intercalado e requer isolamento por vírgulas."},
        {n:9,q:"A palavra grifada é preposição em",ops:["'...tem colocado a vida de pessoas inocentes em risco...' (grifada: a).","'...proteção a Pessoas (DHPP).' (grifada: a).","'...ler com atenção a notícia...' (grifada: a).","'...ter a consciência de que uma pessoa inocente...' (grifada: a)."],g:1,exp:"Em 'proteção a Pessoas', a palavra 'a' é preposição que introduz o complemento nominal 'Pessoas'. Nas demais alternativas, 'a' é artigo definido feminino."},
        {n:10,q:"Uma regra de regência foi desobedecida em",ops:["'...o estado de Mato Grosso foi alvo de algumas fake news, que colocaram as forças de segurança em alerta...'","'Diante dos fatos que envolvem notícias falsas, a Coordenadoria... apontou alguns cuidados a serem tomados...'","'Há vários disponíveis no mercado, a exemplo de boatos.org, aos fatos, projeto comprova, dentre outros.'","'O cidadão precisa ter a consciência de que uma pessoa inocente ser envolvida em uma história falsa poderá acarretar em danos sociais...'"],g:3,exp:"'Acarretar' é verbo transitivo direto — não exige preposição. O correto seria 'acarretará danos', não 'acarretará em danos'. O uso de 'em' após 'acarretar' é erro de regência verbal."},
      ]},
      {nome:'Matemática e Raciocínio Lógico (Q11–Q15)',qs:[
        {n:11,q:"Um boleto de R$ 1.350,00 tem juros simples de 1,2% ao dia e multa fixa de R$ 2,70. Pago com 10 dias de atraso, o novo valor será de",ops:["R$ 1.357,70.","R$ 1.358,90.","R$ 1.510,50.","R$ 1.514,70."],g:3,exp:"Juros = 1.350 × 0,012 × 10 = R$ 162,00. Total = 1.350 + 162 + 2,70 = R$ 1.514,70."},
        {n:12,q:"Numa seção eleitoral, dos 360 eleitores aptos, 306 compareceram (12 anularam ou votaram em branco). O percentual de eleitores ausentes é",ops:["10%.","15%.","20%.","25%."],g:1,exp:"Ausentes = 360 − 306 = 54. Percentual = 54/360 × 100 = 15%."},
        {n:13,q:"Em um grupo de 22 pessoas, 14 gostam de abacate e 12 gostam de maçã. É possível afirmar que [QUESTÃO ANULADA pela banca]",ops:["todas as pessoas gostam de apenas uma fruta.","há pessoas que não gostam de ambas as frutas.","todas as pessoas gostam das duas frutas.","há pessoas que gostam de ambas as frutas."],g:3,exp:"QUESTÃO ANULADA. A resposta esperada seria D: 14+12=26 > 22, logo pelo menos 4 pessoas gostam de ambas as frutas (D seria verdade). A questão foi anulada pela banca Fadesp. Todos os candidatos receberam ponto nesta questão."},
        {n:14,q:"No quadro de alunos transferidos (2015–2022: 06, 14, 18, 19, 23, 20, 25, 40), conclui-se que",ops:["o número de transferências em 2017 é o triplo da quantidade de transferências em 2015.","o número de transferências em 2019 é 50% menor em relação ao ano de 2022.","2016 foi o ano com o menor número de transferências no período de 2015 a 2018.","o número de transferências manteve-se constante de 2019 a 2022."],g:0,exp:"2017 = 18 e 2015 = 6. 3 × 6 = 18 ✓ — Alternativa A é verdadeira. B: 23 é 42,5% menor que 40 (não 50%). C: o menor de 2015–2018 foi 2015 (06), não 2016. D: os valores variaram (20, 25, 40)."},
        {n:15,q:"Com base no gráfico do PIB anual do Brasil (1995–2020), é possível afirmar que o PIB",ops:["não ultrapassou 4% no período de 1995 a 2002.","atingiu patamares negativos em três anos no período de 2016 a 2020.","atingiu o maior valor no período de 2004 a 2011.","não superou a marca de 1,5% no período de 2016 a 2020."],g:2,exp:"O maior valor do PIB (7,5%) foi registrado no período 2004–2011 (governo Lula). No período 1995–2002 o PIB chegou a 4,4% (acima de 4%). No período 2016–2020 houve negativos em 2016 (−3,3%) e 2020 (−4,1%) — apenas 2 anos negativos. Em 2017 o PIB foi +1,4% (acima de 1,5% é incorreto para o período todo)."},
      ]},
      {nome:'Noções de Informática (Q26–Q30)',qs:[
        {n:26,q:"Sobre a licença GPL: I. Utiliza os princípios do direito autoral para proteger o software livre. II. Assegura as quatro liberdades (usar, estudar, melhorar, redistribuir). III. O copyright na GPL garante APENAS ao proprietário o direito de acessar o código-fonte. A sequência correta é",ops:["I – F, II – V, III – V.","I – V, II – F, III – V.","I – V, II – V, III – F.","I – F, II – F, III – F."],g:2,exp:"I – V: a GPL usa o copyright para proteger a liberdade do software. II – V: as quatro liberdades são garantidas. III – F: na GPL o copyleft garante o acesso ao código-fonte a TODOS, não apenas ao proprietário. Sequência: V, V, F."},
        {n:27,q:"A assistente virtual de produtividade pessoal do sistema operacional Windows 10 é chamada de",ops:["Alexa.","Cortana.","Siri.","Bixby."],g:1,exp:"Cortana é a assistente virtual da Microsoft integrada ao Windows 10. Alexa é da Amazon, Siri é da Apple e Bixby é da Samsung."},
        {n:28,q:"A funcionalidade do Gmail que permite definir uma data de validade para as mensagens enviadas é chamada de",ops:["modo confidencial.","assinatura.","citação.","Cco."],g:0,exp:"O modo confidencial do Gmail permite definir data de expiração para a mensagem enviada, impedindo o destinatário de encaminhar, copiar ou imprimir o conteúdo após o prazo."},
        {n:29,q:"Com relação ao armazenamento em nuvem, é correto afirmar que",ops:["o modelo multi-cloud utiliza apenas nuvens públicas para melhorar a redundância.","o serviço de armazenamento em nuvem da Microsoft é o iCloud.","a característica de ampliação/redução de recursos conforme a demanda é chamada de interoperabilidade.","o modelo híbrido permite que uma nuvem privada tenha seus recursos ampliados a partir de uma nuvem pública."],g:3,exp:"O modelo híbrido (hybrid cloud) combina nuvem privada e pública. iCloud é serviço da Apple (a Microsoft oferece OneDrive). Escalabilidade (não interoperabilidade) é a ampliação de recursos por demanda. Multi-cloud pode usar nuvens públicas e privadas combinadas."},
        {n:30,q:"No Microsoft Word 365, versão desktop em Português (Brasil), a função que cria textos de acordo com o tamanho desejado pelo usuário é a",ops:["ABS.","MOD.","RAND.","ROUND."],g:2,exp:"RAND() no Word 365 gera texto aleatório (Lorem Ipsum adaptado) conforme os parâmetros definidos. ABS e MOD são funções matemáticas do Excel; ROUND arredonda números."},
      ]},
      {nome:'Conhecimentos Específicos ACE (Q31–Q50)',qs:[
        {n:31,q:"O conceito de Vigilância em Saúde inclui",ops:["vigilância e controle das doenças transmissíveis, vigilância das doenças e agravos não transmissíveis, vigilância da situação de saúde, vigilância ambiental em saúde, vigilância da saúde do trabalhador e vigilância sanitária.","tratamento e vigilância das doenças não transmissíveis, vigilância da situação de saúde, vigilância ambiental em saúde e vigilância de coberturas aéreas.","vigilância das doenças não transmissíveis, vigilância dos indicadores econômicos e educacionais em saúde, vigilância da saúde do trabalhador e vigilância sanitária.","vigilância e controle das doenças transmissíveis, vigilância dos meios de comunicação e transportes aéreos, vigilância da situação de saúde, vigilância ambiental em saúde e vigilância sanitária."],g:0,exp:"A Vigilância em Saúde inclui: vigilância e controle das doenças transmissíveis, vigilância das DANT, vigilância da situação de saúde, vigilância ambiental em saúde, vigilância da saúde do trabalhador e vigilância sanitária."},
        {n:32,q:"São sinais de alarme na Dengue Hemorrágica",ops:["dor abdominal intensa e contínua, vômitos persistentes, hipertensão sistêmica, sonolência e debilidade.","sonolência, irritabilidade, aumento da diurese, vômitos esporádicos e desconforto respiratório.","dor abdominal contínua, hipotensão postural, diminuição da diurese, hepatomegalia dolorosa.","vômitos com sangue, sangramento de mucosa nasal, hipertensão arterial, hipotermia."],g:2,exp:"Os sinais de alarme da dengue hemorrágica incluem: dor abdominal intensa e contínua, hipotensão postural (não hipertensão), diminuição da diurese e hepatomegalia dolorosa — indicando extravasamento de plasma e risco de choque."},
        {n:33,q:"Um dos objetivos da vigilância em saúde é",ops:["promover transformações nos padrões dos agentes e hospedeiros e implantar mudanças nas práticas de saúde.","identificar, quantificar e monitorar as tendências e padrões do processo saúde-doença nas populações.","detectar mudanças nas evoluções climáticas e nas condições de saúde.","elaborar medidas para tratamento de doenças e implementar ações de controle de doenças."],g:1,exp:"O principal objetivo da vigilância em saúde é identificar, quantificar e monitorar as tendências e padrões do processo saúde-doença nas populações, gerando informação para tomada de decisão."},
        {n:34,q:"Quanto ao período de incubação da dengue, é correto afirmar que ocorre de",ops:["3 a 7 dias.","5 a 10 dias.","3 a 15 dias.","15 a 20 dias."],g:2,exp:"O período de incubação da dengue no ser humano é de 3 a 15 dias após a picada do Aedes aegypti infectado (média de 5 a 8 dias), conforme o Manual de Dengue do Ministério da Saúde."},
        {n:35,q:"A doença cujo agente é uma larva que vive em caramujos, evolui, infecta a água e contamina o homem que entra em contato com ela chama-se",ops:["Esquistossomose.","Leptospirose.","Febre amarela.","Escabiose."],g:0,exp:"A esquistossomose é causada pelo Schistosoma mansoni. As cercárias (larvas) vivem em caramujos do gênero Biomphalaria e ao sair infectam a água — o homem se contamina ao entrar em contato com a água contaminada."},
        {n:36,q:"Entre os objetivos do Programa Nacional de Controle da Dengue (PCND), é correto afirmar a intenção de reduzir",ops:["a infestação pelo Aedes albopictus.","a letalidade por febre hemorrágica de Dengue.","a menos de 3% a infestação predial em todos os estados brasileiros.","o número de casos após 2003, em 15% a cada ano."],g:1,exp:"Um dos objetivos explícitos do PCND é reduzir a letalidade por febre hemorrágica de Dengue, garantindo diagnóstico precoce e manejo adequado dos casos graves."},
        {n:37,q:"De acordo com o PCND, a vigilância epidemiológica da dengue está baseada em quatro subcomponentes denominados de",ops:["Vigilância Urbana; Vigilância Sazonal; Vigilância em Áreas de Fronteira; Vigilância Entomológica.","Vigilância de Casos; Vigilância Rural; Vigilância em Áreas de Fronteira; Vigilância da Saúde.","Vigilância de Casos; Vigilância Laboratorial; Vigilância em Áreas de Fronteira; Vigilância Entomológica.","Vigilância Sazonal; Vigilância Laboratorial; Vigilância em Saúde; Vigilância Marítima."],g:2,exp:"Os quatro subcomponentes da vigilância epidemiológica da dengue no PCND são: Vigilância de Casos, Vigilância Laboratorial, Vigilância em Áreas de Fronteira e Vigilância Entomológica."},
        {n:38,q:"A Portaria Nº 2.436/2017 destaca como atribuição do Agente de Combate às Endemias",ops:["planejar ações de campo em projetos que visem avaliar novas metodologias de intervenção.","informar os usuários sobre as datas e os horários de consultas e exames agendados.","aferir a pressão arterial, inclusive no domicílio.","executar ações de controle de doenças utilizando medidas de controle químico, biológico, manejo ambiental e outras ações de manejo integrado de vetores."],g:3,exp:"A Portaria 2.436/2017 define que o ACE deve executar ações de controle de doenças utilizando medidas de controle químico, biológico, manejo ambiental e outras ações de manejo integrado de vetores — atribuição específica do cargo."},
        {n:39,q:"São consideradas situações que podem incorrer no risco de contaminação da água no manancial",ops:["lançamento clandestino de efluentes.","tratamento em conformidade com o padrão de substâncias químicas.","uso de hipoclorito na água de consumo humano.","manutenção da rede distribuidora de água."],g:0,exp:"O lançamento clandestino de efluentes (esgotos não tratados, resíduos industriais) nos mananciais representa risco direto de contaminação da água. As demais alternativas são medidas de proteção ou adequadas."},
        {n:40,q:"A doença cujo agente infeccioso é transportado pela água e adquirido pela ingestão de água ou alimentos contaminados por uma bactéria chama-se",ops:["Febre tifoide.","Febre amarela.","Toxoplasmose.","Oncocercose."],g:0,exp:"A febre tifoide é causada pela bactéria Salmonella Typhi, transmitida pela ingestão de água ou alimentos contaminados com fezes de pessoas infectadas. Está diretamente relacionada ao saneamento básico precário."},
        {n:41,q:"Para o Ministério da Saúde, são considerados fatores determinantes da saúde",ops:["religião, ambiente, nacionalidade e habitação.","condição de trabalho, ambiente, educação e habitação.","alimentação, ambiente, profissão e religião.","habitação, condição de trabalho, profissão e nacionalidade."],g:1,exp:"Os determinantes sociais da saúde incluem condição de trabalho, ambiente, educação e habitação — fatores que influenciam diretamente o estado de saúde e doença das populações."},
        {n:42,q:"Para evitar os riscos de transmissão em casos de Leishmanioses, a medida de proteção individual que deve ser estimulada é",ops:["eliminação dos resíduos sólidos orgânicos.","controle químico por meio da utilização de inseticidas.","prática de eutanásia canina.","não exposição nos horários de atividade do vetor."],g:3,exp:"A proteção individual contra a leishmaniose inclui evitar a exposição nos horários de atividade do flebotomíneo (entardecer e amanhecer), uso de repelentes e roupas de manga longa."},
        {n:43,q:"Sobre o controle da Raiva em áreas com circulação de variante do vírus rábico de animais silvestres, consideram-se ações de controle [QUESTÃO ANULADA pela banca]",ops:["medidas de educação em saúde com ênfase em evitar contato com morcegos e esclarecimento quanto à gravidade e disponibilidade de medidas de prevenção.","medidas de educação em saúde focadas na gravidade, cuidado com cães soltos e vacinação dos animais.","o acompanhamento da vigilância epidemiológica do caso e investigação para quantificação de casos de animais e suspeitos.","orientação das pessoas: prender o animal, lavar com álcool a 70% e aguardar sintomas para encaminhamento médico."],g:0,exp:"QUESTÃO ANULADA pela banca Fadesp. A resposta esperada seria A: em áreas com variante silvestre, a ênfase é na educação sobre contato com morcegos e orientação sobre as medidas de prevenção disponíveis. Todos os candidatos receberam ponto nesta questão."},
        {n:44,q:"Uma das bactérias causadoras das Doenças Diarreicas Agudas é conhecida pelo nome de",ops:["Entamoeba coli.","Entamoeba histolytica.","Escherichia coli.","Giardia lamblia."],g:2,exp:"A Escherichia coli enteropatogênica é uma bactéria causadora de doenças diarreicas agudas. Entamoeba histolytica e Giardia lamblia são protozoários, não bactérias."},
        {n:45,q:"A doença transmitida ao homem por inalação de artroconídeos (forma do fungo no solo), sobretudo decorrente de acidentes de laboratório, é chamada de",ops:["Criptococose.","Coccidioidomicose.","Donovanose.","Malassezia furfur."],g:1,exp:"A Coccidioidomicose é causada pelo fungo Coccidioides immitis. Os artroconídeos (esporos) presentes no solo seco são inalados ou inoculados em acidentes laboratoriais. É endêmica em regiões semiáridas."},
        {n:46,q:"O Art. 7º da Lei 8.080/90 estabelece como princípio do SUS",ops:["igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.","universalidade de acesso aos serviços no nível primário e secundário de saúde.","parcialidade da assistência, por meio de um conjunto articulado e contínuo das ações e dos serviços curativos e coletivos.","administração dos recursos orçamentários e financeiros destinados, em cada ano, à saúde."],g:0,exp:"O art. 7º, IV da Lei 8.080/90 estabelece como princípio a 'igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie'. A universalidade se aplica a TODOS os níveis de atenção, não apenas primário e secundário."},
        {n:47,q:"O fiscal da vigilância sanitária constatou inconformidade no açougue quando observou que",ops:["as paredes eram forradas com azulejos de cor branca até o teto.","a pia para lavagem das mãos e o balcão eram de materiais não corrosíveis.","o piso era de madeira até a extensão do balcão de atendimento.","os produtos de limpeza eram armazenados em armários com portas, em área reservada."],g:2,exp:"O piso de madeira em área de manipulação de alimentos é inadequado por absorver líquidos, acumular bactérias e ser de difícil higienização. A legislação exige pisos impermeáveis, laváveis e antiderrapantes."},
        {n:48,q:"De acordo com a Portaria nº 204/2016 (Lista Nacional de Notificação Compulsória), é considerada doença de notificação compulsória",ops:["Hipertensão arterial sistêmica.","Febre de Chikungunya.","Oncocercose.","Tracoma."],g:1,exp:"A Febre de Chikungunya é doença de notificação compulsória no Brasil, constante na lista da Portaria 204/2016. Hipertensão arterial não é de notificação compulsória. Tracoma e Oncocercose não constam na lista atual."},
        {n:49,q:"Entre as estratégias do Ministério da Saúde para implementação da Política Nacional de Promoção à Saúde, pode-se destacar",ops:["a estruturação das ações de promoção da saúde no sistema de saúde privado, privilegiando práticas do exterior.","o estímulo à inserção de ações de promoção em todos os níveis de atenção, com ênfase na atenção terciária.","o desenvolvimento de estratégias de qualificação para profissionais de saúde e de sistemas de informação tecnológicas.","o estímulo à criação de Rede Nacional de Experiências Exitosas na adesão e no desenvolvimento da estratégia de municípios saudáveis."],g:3,exp:"O estímulo à criação de Rede Nacional de Experiências Exitosas de municípios saudáveis é uma das estratégias da PNPS, visando compartilhar boas práticas entre municípios e fortalecer a promoção da saúde no território."},
        {n:50,q:"Doença transmissível aguda, toxinfecciosa, causada por Corynebacterium diphtheriae, que se aloja nas amígdalas, faringe e laringe, com presença de placas pseudomembranosas branco-acinzentadas. Essas informações fazem referência à doença chamada",ops:["Cólera.","Difteria.","Criptosporidíase.","Tétano."],g:1,exp:"A Difteria é causada pelo Corynebacterium diphtheriae. A manifestação clínica típica são placas pseudomembranosas branco-acinzentadas nas amígdalas e faringe. É prevenível pela vacina DTP/dT."},
      ]},
    ]
  },
  {
    id:'sim12',titulo:'Prova Agente Endemias Prefeitura Vitória da Conquista',banca:'IDCAP',ano:2024,
    edital:'Edital de Abertura Nº 003/2024',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q15)',qs:[
        {n:1,texto:"Texto-base (Q1–Q7) — Artigo BBC: 'A inteligência artificial vai acabar com os testes em animais?' Pesquisadores buscam alternativas ao uso de animais. A IA usa resultados globais já existentes, evitando novos testes desnecessários. Joseph Manuppello (EUA): entusiasmado com ChatGPT para extrair e sintetizar dados. Thomas Hartung (Johns Hopkins): 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A IA proporciona 'enorme salto em frente tanto em potência quanto em precisão', criando oportunidades antes inexistentes. Problema: viés de dados — sistema treinado com dados de um grupo étnico pode ser inadequado para outros. Vioxx passou em testes animais mas causou risco cardíaco em humanos; aspirina teria falhado em animais (tóxica para embriões de ratos). Conclusão: em vários casos, a IA já se revelou mais precisa que os testes em animais.",q:"Em: 'IA está proporcionando um enorme salto em frente tanto em potência quanto em precisão.' O vocábulo destacado (salto) tem vários significados no dicionário Michaelis. Qual é o mais apropriado no contexto?",ops:["Efeito da reação a uma situação de surpresa, medo ou alarme.","Transição rápida de uma situação ou posição modesta para outra mais importante.","Interrupção de uma sequência temporal.","Distância que se percorre rapidamente.","Movimento de elevação rápida do corpo que impulsiona os músculos para transpor uma altura ou espaço e cair verticalmente."],g:1,exp:"No contexto, 'salto' significa transição rápida de uma situação modesta para outra mais importante — a IA fez um grande avanço em potência e precisão em relação aos métodos anteriores."},
        {n:2,texto:"Texto-base (Q1–Q7) — Artigo BBC: 'A inteligência artificial vai acabar com os testes em animais?' Pesquisadores buscam alternativas ao uso de animais. A IA usa resultados globais já existentes, evitando novos testes desnecessários. Joseph Manuppello (EUA): entusiasmado com ChatGPT para extrair e sintetizar dados. Thomas Hartung (Johns Hopkins): 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A IA proporciona 'enorme salto em frente tanto em potência quanto em precisão', criando oportunidades antes inexistentes. Problema: viés de dados — sistema treinado com dados de um grupo étnico pode ser inadequado para outros. Vioxx passou em testes animais mas causou risco cardíaco em humanos; aspirina teria falhado em animais (tóxica para embriões de ratos). Conclusão: em vários casos, a IA já se revelou mais precisa que os testes em animais.",q:"De acordo com o texto, é INCORRETO afirmar: [QUESTÃO ANULADA pela banca]",ops:["O viés de dados é responsável para garantir a segurança química.","Os amantes da causa animal não são os únicos que não gostam que os animais sejam submetidos a testes científicos.","Em relação a testes científicos, tanto o de medicamentos em animais como o uso da IA não são totalmente seguros.","A IA é superior aos sistemas de software devido a sua potência e precisão.","A IA passa a usar dados previamente coletados evitando o uso desnecessário de animais em experimentos."],g:0,exp:"QUESTÃO ANULADA pela banca IDCAP. A alternativa incorreta seria A: o viés de dados é um PROBLEMA que compromete a segurança química, não um garantidor. Todos os candidatos receberam ponto nesta questão."},
        {n:3,texto:"Texto-base (Q1–Q7) — Artigo BBC: 'A inteligência artificial vai acabar com os testes em animais?' Pesquisadores buscam alternativas ao uso de animais. A IA usa resultados globais já existentes, evitando novos testes desnecessários. Joseph Manuppello (EUA): entusiasmado com ChatGPT para extrair e sintetizar dados. Thomas Hartung (Johns Hopkins): 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A IA proporciona 'enorme salto em frente tanto em potência quanto em precisão', criando oportunidades antes inexistentes. Problema: viés de dados — sistema treinado com dados de um grupo étnico pode ser inadequado para outros. Vioxx passou em testes animais mas causou risco cardíaco em humanos; aspirina teria falhado em animais (tóxica para embriões de ratos). Conclusão: em vários casos, a IA já se revelou mais precisa que os testes em animais.",q:"Releia: 'Mas isso acaba sendo feito para ajudar... Os pesquisadores há muito tempo buscam alternativas que não envolvam os animais. Os sistemas de IA agora estão acelerando o trabalho nessa área.' Os vocábulos destacados (isso / que / nessa área) têm como referentes, respectivamente:",ops:["Testes científicos; uso humano; sistema de inteligência.","Medicamentos e substâncias; medicamentos; IA.","A submissão de animais em testes; alternativas; envolvimento de animais em testes.","Uso de animais em testes; medicamentos; animais.","Ninguém; uso humano; sistemas de IA."],g:2,exp:"'Isso' retoma a submissão de animais em testes; 'que' retoma 'alternativas'; 'nessa área' retoma o contexto do envolvimento de animais em testes. Coesão referencial: os pronomes retomam elementos anteriores do próprio texto."},
        {n:4,texto:"Texto-base (Q1–Q7) — Artigo BBC: 'A inteligência artificial vai acabar com os testes em animais?' Pesquisadores buscam alternativas ao uso de animais. A IA usa resultados globais já existentes, evitando novos testes desnecessários. Joseph Manuppello (EUA): entusiasmado com ChatGPT para extrair e sintetizar dados. Thomas Hartung (Johns Hopkins): 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A IA proporciona 'enorme salto em frente tanto em potência quanto em precisão', criando oportunidades antes inexistentes. Problema: viés de dados — sistema treinado com dados de um grupo étnico pode ser inadequado para outros. Vioxx passou em testes animais mas causou risco cardíaco em humanos; aspirina teria falhado em animais (tóxica para embriões de ratos). Conclusão: em vários casos, a IA já se revelou mais precisa que os testes em animais.",q:"Em: 'Mas, como salienta o professor Hartung, testar medicamentos humanos em animais pode, por vezes, ser de pouca utilidade também.' A palavra 'salienta' pode ser substituída sem alteração de sentido por:",ops:["Notabiliza.","Resguarda.","Atenua.","Acumula.","Encobre."],g:0,exp:"'Salienta' significa ressaltar, destacar, tornar notável. 'Notabiliza' é o substituto que preserva o sentido de destacar ou enfatizar uma ideia. As demais opções têm sentidos incompatíveis com o contexto."},
