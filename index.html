        {n:31,q:'Na transição da gestão municipal, a equipe técnica preparou um roteiro para relacionar o Plano de Saúde, a Programação Anual de Saúde (PAS), o Relatório Detalhado do Quadrimestre Anterior (RDQA) e o Relatório Anual de Gestão (RAG). O roteiro deveria preservar a função e a articulação temporal desses documentos. Nesse contexto, assinale a formulação compatível com a função e a articulação temporal desses instrumentos.',ops:['O Plano de Saúde parte da análise situacional e orienta o quadriênio; a PAS anualiza suas metas; o RDQA acompanha a execução; e o RAG encerra a avaliação anual, alterando diretamente as metas do Plano e da programação seguinte.','O Plano de Saúde reúne as iniciativas do quadriênio; a PAS anualiza suas metas depois do encaminhamento da LDO; o RDQA examina a execução física e financeira; e o RAG subsidia os ajustes necessários no planejamento.','O Plano de Saúde define, para quatro anos, diretrizes, objetivos, metas e indicadores; a PAS anualiza metas e prevê recursos; o RDQA acompanha a execução quadrimestral; e o RAG apresenta os resultados da PAS e orienta redirecionamentos no Plano.','O Plano de Saúde estabelece os compromissos do quadriênio; a PAS redefine anualmente suas diretrizes conforme o orçamento aprovado; o RDQA consolida os resultados do exercício; e o RAG acompanha a execução em cada quadrimestre.','O Plano de Saúde e a PAS organizam, respectivamente, as metas quadrienais e anuais; o RDQA avalia o cumprimento do Plano ao fim do exercício; e o RAG substitui a programação do ano seguinte quando recomenda novos objetivos.'],g:2,exp:'Gabarito: C.'},
        {n:32,q:'Na organização de uma rede regional para pessoas com condições crônicas, a proposta inicial atribuiu ao hospital de maior densidade tecnológica o comando do percurso assistencial. As unidades de Atenção Primária fariam a triagem e os encaminhamentos, enquanto laboratório, assistência farmacêutica, regulação, prontuário eletrônico e transporte seriam administrados como estruturas do hospital. O município-sede definiria os fluxos e apresentaria os resultados aos demais gestores. À luz da organização das Redes de Atenção à Saúde, o projeto deve ser reformulado de modo a:',ops:['Situar a Atenção Primária como centro de comunicação e coordenadora do cuidado, organizar os sistemas de apoio e logística em módulos vinculados à densidade tecnológica dos pontos e compartilhar regionalmente a governança.','Situar a Atenção Primária como centro de comunicação e coordenadora do cuidado, integrar os sistemas de apoio e logística e atribuir ao município-sede a definição dos fluxos, com acompanhamento regional dos resultados.','Situar a Atenção Primária como centro de comunicação e coordenadora dos percursos de menor risco, atribuir ao hospital a coordenação dos casos de maior risco, integrar os sistemas comuns e pactuar regionalmente os resultados.','Situar a Atenção Primária como centro de comunicação e coordenadora do cuidado, integrar os sistemas de apoio e logística e pactuar regionalmente os fluxos e recursos conforme a capacidade instalada dos prestadores.','Situar a Atenção Primária como centro de comunicação e coordenadora do cuidado em todo o percurso, integrar os pontos por sistemas comuns de apoio e logística e compartilhar regionalmente objetivos, responsabilidades e resultados.'],g:4,exp:'Gabarito: E.'},
        {n:33,q:'Uma rede municipal registrou falhas recorrentes na conciliação de medicamentos durante a transição entre hospital, farmácia e Atenção Primária. A análise dos prontuários mostrou que as equipes conheciam o protocolo, mas tomavam decisões diferentes nos pontos de passagem do usuário. Para organizar uma resposta coerente com a Política Nacional de Educação Permanente em Saúde, a gestão deve:',ops:['Reunir os trabalhadores dos pontos envolvidos para analisar os casos e as diferentes interpretações do protocolo, revisar os conteúdos comuns e condicionar a mudança do fluxo ao desempenho individual obtido em uma avaliação de aprendizagem.','Solicitar ao núcleo de segurança que interprete os eventos e defina o novo fluxo, utilizando oficinas interprofissionais para relacionar experiência e conhecimento técnico à execução das rotinas propostas e recolher ajustes operacionais.','Reunir os trabalhadores dos pontos envolvidos para analisar os casos, relacionar experiência e conhecimento técnico, construir e experimentar mudanças compartilhadas e tomar a certificação individual como medida da transformação alcançada no processo de trabalho.','Examinar os mesmos casos em grupos definidos por categoria profissional, elaborar e experimentar mudanças próprias de cada grupo e encarregar a gestão de reuni-las posteriormente em um fluxo municipal.','Reunir os trabalhadores dos pontos envolvidos para problematizar casos e práticas, relacionar experiência e conhecimento técnico, experimentar mudanças construídas no grupo e revê-las pelos efeitos observados no cuidado.'],g:4,exp:'Gabarito: E.'},
        {n:34,q:'A análise de dois bairros mostrou aumento de lesões no trânsito, mas com padrões distintos. Em um deles, os eventos se concentravam no trajeto de estudantes e estavam associados à travessia insegura. No outro, predominavam ocorrências noturnas com motociclistas, iluminação deficiente e consumo de álcool no entorno de uma área comercial. A aplicação das orientações da Política Nacional de Promoção da Saúde aos dois territórios requer:',ops:['Definir, em governança intersetorial com participação dos moradores, respostas próprias para cada território, combinar medidas individuais e estruturais e acompanhar resultados e desigualdades, cabendo a cada setor revisar separadamente as ações sob sua responsabilidade.','Definir com moradores e setores envolvidos respostas próprias para cada território, combinar medidas individuais e estruturais e acompanhar resultados e desigualdades, mantendo com a saúde a definição dos objetivos e dos critérios de avaliação.','Definir com moradores e setores envolvidos respostas próprias para cada território, compartilhar responsabilidades sobre fatores individuais e estruturais e acompanhar resultados e desigualdades entre grupos e bairros.','Definir com moradores e setores envolvidos respostas próprias para cada território, compartilhar responsabilidades sobre fatores individuais e estruturais, considerar as diferenças entre grupos na escolha das ações e avaliar o resultado pela variação média das lesões no conjunto dos bairros.','Definir com moradores e setores envolvidos respostas próprias para cada território, compartilhar responsabilidades sobre fatores individuais e estruturais e utilizar o cumprimento das atividades em cada grupo e bairro como medida dos efeitos e da redução das desigualdades.'],g:2,exp:'Gabarito: C.'},
        {n:35,q:'Um município constatou insuficiência da rede pública para realizar exames de imagem e incluiu três propostas na análise do Fundo Municipal de Saúde: I. contratar uma entidade filantrópica, integrada à regulação do SUS, para prestar os exames gratuitamente aos usuários; II. conceder subvenção a uma clínica com fins lucrativos para ampliar suas instalações, em troca de uma cota de atendimentos ao SUS; III. custear um plano assistencial destinado aos servidores municipais e a seus dependentes. O parecer tecnicamente adequado às três propostas é o que estabelece:',ops:['O pagamento pelos exames pode integrar a apuração, desde que a atuação complementar seja formalizada segundo o direito público e submetida às diretrizes do SUS; a subvenção à clínica lucrativa não compõe o mínimo, mas pode ser concedida com recursos municipais não computados em saúde; e o plano funcional não pode ser computado por não assegurar acesso universal.','O pagamento pelos exames pode integrar a apuração, desde que a atuação complementar seja formalizada por contrato de direito público ou convênio e submetida às diretrizes do SUS; a subvenção à clínica lucrativa é vedada; e o plano funcional não pode ser computado por não assegurar acesso universal.','O pagamento pelos exames pode integrar a apuração, desde que a atuação da entidade filantrópica seja formalizada exclusivamente por convênio e submetida às diretrizes do SUS; a subvenção à clínica lucrativa é vedada; e o plano funcional não pode ser computado por não assegurar acesso universal.','O pagamento pelos exames pode integrar a apuração mediante contrato ou convênio regido pelo direito privado, desde que haja regulação do SUS e gratuidade ao usuário; a subvenção à clínica lucrativa é vedada; e o plano funcional não pode ser computado por não assegurar acesso universal.','O pagamento pelos exames pode integrar a apuração, desde que a atuação complementar seja formalizada segundo o direito público e submetida às diretrizes do SUS; a subvenção à clínica lucrativa é vedada; e somente a cobertura dos dependentes fica fora da apuração, podendo ser computada a parcela referente aos servidores ativos.'],g:1,exp:'Gabarito: B.'}
      ]},
      {nome:'ACE – Agente de Combate às Endemias (Q36–Q50)',qs:[
        {n:36,q:'Durante a investigação da transmissão local de dengue, a equipe reconstruiu a seguinte sequência: uma fêmea de Aedes aegypti realizou repasto sanguíneo em um morador durante a fase virêmica; transcorrido determinado intervalo, a mesma fêmea picou outra pessoa suscetível. Para avaliar se o segundo contato poderia integrar a cadeia de transmissão, foram apresentadas diferentes interpretações sobre o intervalo ocorrido no vetor e sua capacidade de transmitir o vírus. A interpretação compatível com o ciclo epidemiológico da dengue está indicada em:',ops:['O intervalo no mosquito corresponde à incubação extrínseca; quando o vírus passa a estar presente na saliva, a fêmea pode transmiti-lo em novos repastos e permanece infectante até o final de sua vida.','O intervalo no mosquito corresponde à incubação extrínseca; quando o vírus passa a estar presente na saliva, a fêmea pode transmiti-lo no primeiro novo repasto, perdendo a capacidade infectante após essa alimentação.','O intervalo no mosquito corresponde à incubação extrínseca; para que o vírus alcance a saliva, a fêmea precisa realizar outro repasto em pessoa virêmica, pois essa segunda alimentação completa sua capacidade infectante.','O intervalo no mosquito corresponde à incubação intrínseca; quando o vírus passa a estar presente na saliva, a fêmea pode transmiti-lo em novos repastos e permanece infectante até o final de sua vida.','O intervalo no mosquito corresponde à incubação extrínseca; a presença do vírus na saliva marca o início desse período, ao fim do qual a fêmea passa a transmiti-lo nos repastos sanguíneos realizados em pessoas suscetíveis.'],g:0,exp:'Gabarito: A.'},
        {n:37,q:'Em determinado município, casos de dengue são registrados todos os anos dentro de uma frequência esperada para a população local. Em um período específico, a vigilância identifica um número de casos significativamente superior ao esperado para aquele local e intervalo de tempo. Assinale a alternativa que apresenta a classificação epidemiológica adequada para as duas situações.',ops:['A ocorrência habitual corresponde a uma epidemia, enquanto o aumento de casos acima do esperado também caracteriza uma epidemia.','A ocorrência habitual corresponde a uma endemia, enquanto o aumento de casos acima do esperado caracteriza uma epidemia.','A ocorrência habitual corresponde a uma endemia, enquanto o aumento de casos acima do esperado caracteriza necessariamente um surto restrito.','A ocorrência habitual corresponde a uma endemia, enquanto o aumento de casos acima do esperado caracteriza apenas uma variação sazonal esperada.','A ocorrência habitual corresponde a uma endemia, enquanto o aumento de casos acima do esperado permanece classificado como endemia por se tratar da mesma doença.'],g:1,exp:'Gabarito: B.'},
        {n:38,q:'Em um imóvel fechado, um reservatório permaneceu seco por dez meses. Antes do novo enchimento, o ACE encontrou ovos aderidos individualmente à parede interna, pouco acima da antiga marca da água. Depois do enchimento, surgiram formas que se deslocavam em "S" e outras que, vistas lateralmente, lembravam uma vírgula e permaneciam próximas à superfície. Assinale a interpretação biologicamente consistente desses achados.',ops:['O desenvolvimento embrionário dos ovos permaneceu suspenso durante os dez meses de dessecação e só começou com o novo contato com a água, completando-se em cerca de 48 horas; após essa etapa, os ovos passariam a suportar períodos secos prolongados. As formas em "S" correspondem a larvas, que se alimentam, crescem e respiram na superfície por sifão, podendo o quarto estádio prolongar-se em condições desfavoráveis. As formas com perfil de vírgula são pupas, não se alimentam, respiram por trompetas e completam a metamorfose em dois a três dias.','Os ovos podem concluir o desenvolvimento embrionário em cerca de 48 horas e eclodir quando alcançados pela água, mas sua resistência à dessecação fica limitada a aproximadamente dez meses. As formas em "S" são larvas, alimentam-se, crescem e respiram na superfície por sifão; em baixa temperatura ou com pouco alimento, o quarto estádio pode prolongar-se por semanas. As formas com perfil de vírgula são pupas, não se alimentam, respiram por trompetas e geralmente completam a metamorfose para o adulto em dois a três dias.','Os ovos podem concluir o desenvolvimento embrionário em cerca de 48 horas, conservar-se viáveis durante longos períodos de dessecação e eclodir quando a água os alcança. As formas em "S" são larvas, alimentam-se, crescem e respiram na superfície por sifão; em baixa temperatura ou com pouco alimento, o quarto estádio pode prolongar-se por semanas. As formas com perfil de vírgula são pupas, não se alimentam e respiram por trompetas, mas normalmente necessitam de cinco a sete dias para completar a metamorfose e originar o adulto.','Os ovos podem ter concluído a embriogênese em aproximadamente 48 horas antes de o reservatório secar e, depois disso, permanecer viáveis por mais de um ano até serem alcançados pela água. As formas em "S" são larvas em alimentação e crescimento; elas mantêm o sifão voltado à regulação osmótica e obtêm oxigênio principalmente pelas quatro brânquias lobuladas, podendo o quarto estádio prolongar-se sob baixa temperatura ou escassez de alimento. As formas com perfil de vírgula são pupas, respiram por trompetas, não se alimentam e completam a metamorfose em dois a três dias.','Os ovos podem concluir o desenvolvimento embrionário em cerca de 48 horas e, depois dessa etapa, resistir por mais de um ano à dessecação, eclodindo quando alcançados pela água. As formas em "S" são larvas, alimentam-se, crescem e respiram na superfície por sifão; em baixa temperatura ou com pouco alimento, o quarto estádio pode prolongar-se por semanas. As formas com perfil de vírgula são pupas, não se alimentam, respiram por trompetas e geralmente completam a metamorfose para o adulto em dois a três dias.'],g:4,exp:'Gabarito: E.'},
        {n:39,q:'Em um município infestado e estratificado, o Setor P foi classificado como área prioritária devido à persistência de indicadores entomológicos e epidemiológicos, embora não apresente notificação recente. O Setor N permaneceu não prioritário, mas recebeu a notificação de um caso suspeito. Após análise conjunta das vigilâncias epidemiológica e entomológica, delimitou-se a área de transmissão e indicou-se o bloqueio. Nos dois setores há embalagens descartáveis removíveis e reservatórios fixos de armazenamento de água que, naquele momento, não podem ser eliminados, vedados ou esvaziados. Assinale o plano operacional compatível com as Diretrizes Nacionais de 2025.',ops:['Nos dois setores, eliminar as embalagens passíveis de remoção e aplicar larvicida preconizado nos reservatórios não manejáveis, após medir sua capacidade total. No Setor P, realizar visitas bimestrais ou mais frequentes em todos os imóveis e verificar as ovitrampas semanal ou quinzenalmente. No Setor N, manter leitura mensal das armadilhas e orientar as visitas pela notificação recebida. Na área delimitada para o bloqueio, combinar busca e controle de focos com UBV portátil, adotando raio mínimo de 200 m contado do imóvel do caso.','Nos dois setores, retirar e destinar corretamente as embalagens removíveis e tratar os reservatórios não manejáveis com larvicida preconizado, após cubagem da capacidade total. No Setor P, visitar 100% dos imóveis em ciclos bimestrais ou mais frequentes, conforme o risco, e monitorar as ovitrampas semanal ou quinzenalmente. No Setor N, manter o monitoramento mensal e orientar as visitas pela notificação. No bloqueio delimitado, realizar busca e controle de criadouros concomitantemente à UBV portátil, em raio mínimo de 150 m a partir do imóvel do caso.','Nos dois setores, retirar as embalagens descartáveis removíveis e tratar com larvicida recomendado os reservatórios que não admitem manejo, mediante cubagem da capacidade total. No Setor P, alcançar todos os imóveis em ciclos de dois meses ou menores, de acordo com o risco, e monitorar ovitrampas semanal ou quinzenalmente. No Setor N, realizar o monitoramento das ovitrampas a cada dois meses e direcionar as visitas pela notificação. No bloqueio indicado, executar busca e controle larvário junto à UBV portátil, em raio de pelo menos 150 m desde o imóvel notificado.','Nos dois setores, remover e destinar adequadamente as embalagens descartáveis e aplicar o larvicida indicado nos reservatórios fixos, calculando a dose pelo volume de água encontrado no momento da visita. No Setor P, cobrir 100% dos imóveis a cada dois meses ou em intervalo menor, segundo o risco, com ovitrampas semanais ou quinzenais. No Setor N, conservar o monitoramento mensal e direcionar visitas pela notificação. Para o bloqueio, associar controle larvário e UBV portátil no perímetro de, no mínimo, 150 m medidos desde o imóvel notificado.','Nos dois setores, recolher e destinar as embalagens removíveis e tratar os reservatórios sem possibilidade de manejo, dimensionando o larvicida pela capacidade total. No Setor P, manter ovitrampas semanais ou quinzenais e concentrar as visitas bimestrais, com cobertura de 100%, nos imóveis situados até 200 m das armadilhas com indicadores persistentemente elevados. No Setor N, acompanhar mensalmente as ovitrampas e realizar visitas orientadas pela notificação. No bloqueio, executar controle de criadouros e UBV portátil de forma concomitante, alcançando pelo menos 150 m a partir da residência do caso.'],g:1,exp:'Gabarito: B.'},
        {n:40,q:'Durante a atualização da situação vacinal contra a febre amarela, foram analisados três registros: - Registro I: adulto de 37 anos, vacinado somente com a dose fracionada de 0,1 mL durante a estratégia excepcional de 2018 em município participante; - Registro II: adolescente de 12 anos, com uma dose padrão recebida aos 9 meses de idade; - Registro III: adulto de 24 anos, com uma dose padrão recebida aos 7 anos de idade. Não foram identificadas contraindicações ou situações especiais que alterassem os esquemas. A conduta correta para os três registros é:',ops:['Administrar outra dose fracionada de 0,1 mL no Registro I; administrar uma dose padrão no Registro II; considerar completo o esquema do Registro III.','Considerar completo o esquema do Registro I; administrar uma dose padrão no Registro II; considerar completo o esquema do Registro III.','Administrar uma dose padrão no Registro I; considerar completo o esquema do Registro II; considerar completo o esquema do Registro III.','Administrar uma dose padrão no Registro I; administrar uma dose padrão no Registro II; administrar uma dose padrão no Registro III.','Administrar uma dose padrão no Registro I; administrar uma dose padrão no Registro II; considerar completo o esquema do Registro III.'],g:4,exp:'Gabarito: E.'},
        {n:41,q:'Durante uma atividade no território, três moradores sem histórico de profilaxia antirrábica relataram exposições ocorridas naquele dia: - Registro I: mordedura superficial no antebraço por cão domiciliado, clinicamente sadio e disponível para observação; - Registro II: mordedura profunda na mão por gato domiciliado, clinicamente sadio e disponível para observação; - Registro III: arranhadura com solução de continuidade causada por sagui mantido em cativeiro. Após a lavagem das lesões e o encaminhamento dos moradores ao serviço de saúde, indique a aplicação correta do protocolo de pós-exposição.',ops:['No Registro I, observar o cão durante dez dias, sem profilaxia inicial; diante de morte, desaparecimento ou sinais de raiva, indicar vacina. No II, observar o gato sem iniciar profilaxia e, ocorrendo algum desses eventos, indicar vacina e SAR ou IGHAR. No III, iniciar imediatamente vacina e SAR ou IGHAR.','No Registro I, observar o cão durante dez dias, sem profilaxia inicial; se ele morrer, desaparecer ou apresentar sinais de raiva, indicar vacina e SAR ou IGHAR. No II, observar o gato sem iniciar profilaxia e, diante desses eventos, indicar vacina e SAR ou IGHAR. No III, iniciar vacina e SAR ou IGHAR.','No Registro I, observar o cão durante dez dias, sem profilaxia inicial; se ocorrer morte, desaparecimento ou sinais de raiva, indicar vacina. No II, observar o gato e, diante desses eventos, indicar vacina e SAR ou IGHAR. No III, iniciar a vacina sem SAR ou IGHAR, considerando a possibilidade de observação do sagui em cativeiro.','No Registro I, observar o cão durante dez dias, sem profilaxia inicial; diante de morte, desaparecimento ou sinais de raiva, indicar vacina. No II, observar o gato pelo mesmo período e, se ocorrer algum desses eventos, indicar apenas a vacina. No III, iniciar vacina e SAR ou IGHAR.','No Registro I, observar o cão durante dez dias, sem profilaxia inicial; diante de morte, desaparecimento ou sinais de raiva, indicar vacina. No II, iniciar a vacina enquanto o gato permanece em observação, acrescentando SAR ou IGHAR se ocorrer algum desses eventos. No III, iniciar vacina e SAR ou IGHAR.'],g:0,exp:'Gabarito: A.'},
        {n:42,q:'Um município no qual ainda não havia sido detectada a presença dos vetores da leishmaniose visceral recebeu a notificação do primeiro caso canino confirmado. O local provável de infecção foi estabelecido, e a equipe preparou a investigação entomológica. De acordo com o Manual de Vigilância e Controle da Leishmaniose Visceral de 2026, o planejamento adequado é:',ops:['Iniciar a investigação imediatamente; empregar o maior número possível de métodos, entre captura manual e armadilhas luminosas e adesivas; realizar as coletas uma hora após o crepúsculo, durante três noites consecutivas; abranger raio mínimo de 200 metros ou, ao menos, cem cães; e manter a atividade por até três meses ou até encontrar o vetor.','Iniciar a investigação imediatamente; empregar o maior número possível de métodos, entre captura manual e armadilhas luminosas e adesivas; realizar as coletas uma hora após o crepúsculo, durante três noites consecutivas; abranger raio mínimo de 200 metros ou, ao menos, cem cães; e manter a atividade por até seis meses ou até encontrar o vetor.','Iniciar a investigação imediatamente; empregar o maior número possível de métodos, entre captura manual e armadilhas luminosas e adesivas; realizar as coletas uma hora após o crepúsculo, durante três noites intercaladas; abranger raio mínimo de 200 metros ou, ao menos, cem cães; e manter a atividade por até três meses ou até encontrar o vetor.','Iniciar a investigação imediatamente; empregar o maior número possível de métodos, entre captura manual e armadilhas luminosas e adesivas; realizar as coletas uma hora após o crepúsculo, durante três noites consecutivas; abranger raio mínimo de 150 metros ou, ao menos, cem cães; e manter a atividade por até três meses ou até encontrar o vetor.','Iniciar a investigação imediatamente; empregar o maior número possível de métodos, entre captura manual e armadilhas luminosas e adesivas; realizar as coletas uma hora após o crepúsculo, durante duas noites consecutivas; abranger raio mínimo de 200 metros ou, ao menos, cem cães; e manter a atividade por até três meses ou até encontrar o vetor.'],g:0,exp:'Gabarito: A.'},
        {n:43,q:'Após uma enchente, um morador procurou atendimento com febre, cefaleia e mialgia iniciadas havia quatro dias. Doze dias antes dos sintomas, ele havia retirado lama de um depósito alagado. O ELISA-IgM realizado no quarto dia da doença apresentou resultado não reagente, e o caso foi comunicado à equipe de vigilância. A condução compatível com o Guia de Vigilância em Saúde é:',ops:['Manter o caso como suspeito e notificá-lo prontamente no Sinan; investigar ocupação, exposições e local provável de infecção nos trinta dias anteriores aos sintomas; e substituir a nova sorologia por PCR em amostra sanguínea coletada no oitavo dia da doença, quando o teste molecular passaria a orientar o encerramento.','Manter o caso como suspeito e notificá-lo prontamente no Sinan; não utilizar o primeiro resultado para o descarte; programar novo ELISA-IgM para o sexto dia de sintomas, tomando essa coleta como adequada à interpretação sorológica; e investigar ocupação, exposições e local provável de infecção nos trinta dias anteriores à doença.','Manter o caso como suspeito e iniciar a investigação das exposições e do local provável de infecção nos trinta dias anteriores aos sintomas; colher outra amostra a partir do sétimo dia da doença; e efetuar o registro no Sinan depois do resultado dessa nova coleta, caso permaneça a suspeita de leptospirose.','Manter o caso como suspeito e notificá-lo prontamente no Sinan; não utilizar o resultado precoce para o descarte; colher outra amostra a partir do sétimo dia de sintomas; e adotar os sessenta dias anteriores ao início da doença como janela para investigar ocupação, exposições e local provável de infecção no mapeamento territorial.','Manter o caso como suspeito e notificá-lo prontamente no Sinan; não utilizar o resultado precoce para o descarte; colher outra amostra a partir do sétimo dia de sintomas; e investigar ocupação, exposições e local provável de infecção nos trinta dias anteriores ao início da doença, incluindo-os no mapeamento territorial.'],g:4,exp:'Gabarito: E.'},
        {n:44,q:'Em uma visita conjunta, um ACE e um ACS encontraram um morador com sinais de doença de interesse para a vigilância, uma condição ambiental favorável à presença de vetores, cadastros familiar e domiciliar desatualizados e um animal morto com suspeita de zoonose, cuja amostra deveria seguir para o laboratório. A classificação dessas atividades, conforme a Diretriz Nacional para Atuação Integrada dos ACE e ACS, é:',ops:['A identificação, o encaminhamento, o registro e a comunicação do caso suspeito são atividades comuns. A pesquisa entomológica e o cadastro técnico do risco ambiental são típicos do ACE; a atualização dos cadastros individual, domiciliar e territorial é atividade comum; e a coleta e o encaminhamento da amostra animal cabem ao ACE, de forma assistida e condicionada à estrutura local.','A identificação, o encaminhamento, o registro e a comunicação do caso suspeito são atividades comuns. A pesquisa entomológica e o cadastro técnico do risco ambiental são típicos do ACE; a atualização dos cadastros individual, domiciliar e territorial é típica do ACS; e a coleta e o encaminhamento da amostra animal cabem ao ACE, de forma assistida e condicionada à estrutura local.','A identificação, o encaminhamento, o registro e a comunicação do caso suspeito são atividades comuns. A pesquisa entomológica e o cadastro técnico do risco ambiental também são atividades comuns; a atualização cadastral é típica do ACS; e a coleta e o encaminhamento da amostra animal cabem ao ACE, de forma assistida e condicionada à estrutura local.','A identificação, o encaminhamento, o registro e a comunicação do caso suspeito são atividades comuns. A pesquisa entomológica e o cadastro técnico do risco ambiental são típicos do ACE; a atualização cadastral é típica do ACS; e a coleta e o encaminhamento da amostra animal podem ser executados autonomamente pelo ACE treinado, com validação posterior do profissional de nível superior.','A identificação, o encaminhamento, o registro e a comunicação do caso suspeito constituem atividade típica do ACS. A pesquisa entomológica e o cadastro técnico do risco ambiental são típicos do ACE; a atualização cadastral, do ACS; e a coleta e o encaminhamento da amostra animal cabem ao ACE, de forma assistida e condicionada à estrutura local.'],g:1,exp:'Gabarito: B.'},
        {n:45,q:'Depois de sucessivos alagamentos ampliarem os riscos ambientais e a ocorrência de arboviroses, um município revisou seu projeto de educação ambiental para escolas e comunidades. A equipe procurou adequar a participação social, as metodologias educativas, os projetos institucionais de ensino e as ações não formais às mudanças introduzidas na Política Nacional de Educação Ambiental em 2024. Nesse contexto, assinale a proposta juridicamente adequada.',ops:['Estimular a participação individual e coletiva, incluídas as escolas de todos os níveis de ensino, nas ações de prevenção, mitigação e adaptação climática, proteção da biodiversidade e percepção de riscos. Desenvolver instrumentos e metodologias para assegurar a efetividade dessas ações; inserir os temas nos projetos da educação básica e superior; e promover a sensibilização não formal da sociedade.','Estimular a participação individual e coletiva, incluídas as escolas de todos os níveis de ensino, nas ações climáticas, de proteção da biodiversidade e de percepção de riscos. Adotar instrumentos e metodologias para mitigação e adaptação climática, tratando a prevenção como comunicação institucional; inserir os temas nos projetos da educação básica e superior; e desenvolver a sensibilização não formal da sociedade.','Estimular a participação individual e coletiva, incluídas as escolas de todos os níveis de ensino, nas ações de prevenção, mitigação e adaptação climática, proteção da biodiversidade e percepção de riscos. Desenvolver instrumentos e metodologias para assegurar a efetividade dessas ações; inserir os temas nos projetos da educação básica e, no ensino superior, nos projetos dos cursos da área ambiental; e sensibilizar a sociedade.','Estimular a participação individual e coletiva, incluídas as escolas de todos os níveis de ensino, nas ações de prevenção, mitigação e adaptação climática, proteção da biodiversidade e percepção de riscos. Desenvolver instrumentos e metodologias para assegurar a efetividade dessas ações; inserir os temas nos projetos da educação básica e superior; e tomar a decretação da emergência socioambiental como marco inicial para a sensibilização não formal da sociedade.','Estimular a participação individual e coletiva nas ações climáticas, integrando as escolas da educação básica e destinando às instituições de educação superior a produção de materiais. Desenvolver metodologias de prevenção, mitigação e adaptação climática; inserir os temas nos projetos da educação básica e superior; e sensibilizar a sociedade para os riscos socioambientais e a perda de biodiversidade.'],g:0,exp:'Gabarito: A.'},
        {n:46,q:'Durante o diagnóstico de um núcleo urbano, foram identificadas deficiências na captação e na distribuição de água, lançamento de esgoto sem tratamento, acúmulo de resíduos domiciliares e de varrição, além de alagamentos relacionados à insuficiência da rede pluvial. Ao elaborar o plano de intervenção, a equipe precisou delimitar corretamente os quatro componentes do saneamento básico e articulá-los à proteção da saúde. À luz da Lei nº 11.445/2007, com a redação vigente, assinale a interpretação adequada.',ops:['Na organização dos serviços, a captação, a produção e as ligações prediais integram o abastecimento de água potável. A coleta, o transporte, o tratamento e a destinação do esgoto integram o esgotamento sanitário. A coleta dos resíduos domiciliares pertence ao manejo de resíduos sólidos, enquanto varrição, asseio e conservação urbana ficam classificadas como manutenção geral do município. A retenção de cheias, o tratamento, a disposição das águas pluviais e a limpeza preventiva das redes compõem a drenagem. O conjunto deve articular promoção da saúde, proteção ambiental e peculiaridades locais.','Na organização dos serviços, a captação, a produção e as ligações prediais integram o abastecimento de água potável. A coleta, o transporte, o tratamento e a destinação do esgoto, inclusive para produção de água de reúso, integram o esgotamento sanitário. A cadeia dos resíduos domiciliares e da limpeza urbana pertence à limpeza urbana e ao manejo de resíduos sólidos. A retenção de cheias, o tratamento, a disposição das águas pluviais e a limpeza preventiva das redes compõem a drenagem. O conjunto deve articular promoção da saúde, proteção ambiental e peculiaridades locais.','Na organização dos serviços, o abastecimento de água potável começa na saída do tratamento; a captação integra a gestão do manancial, e não esse componente. A coleta, o transporte, o tratamento e a destinação do esgoto, inclusive para produção de água de reúso, integram o esgotamento sanitário. A cadeia dos resíduos domiciliares e da limpeza urbana pertence à limpeza urbana e ao manejo de resíduos sólidos. A retenção de cheias, o tratamento, a disposição das águas pluviais e a limpeza preventiva das redes compõem a drenagem. O conjunto deve articular promoção da saúde, proteção ambiental e peculiaridades locais.','Na organização dos serviços, a captação, a produção e as ligações prediais integram o abastecimento de água potável. A coleta, o transporte e o tratamento integram o esgotamento sanitário, mas a destinação para produção de água de reúso passa a compor a gestão de recursos hídricos. A cadeia dos resíduos domiciliares e da limpeza urbana pertence à limpeza urbana e ao manejo de resíduos sólidos. A retenção de cheias, o tratamento, a disposição das águas pluviais e a limpeza preventiva das redes compõem a drenagem. O conjunto deve articular promoção da saúde, proteção ambiental e peculiaridades locais.','Na organização dos serviços, a captação, a produção e as ligações prediais integram o abastecimento de água potável. A coleta, o transporte, o tratamento e a destinação do esgoto, inclusive para produção de água de reúso, integram o esgotamento sanitário. A cadeia dos resíduos domiciliares e da limpeza urbana pertence à limpeza urbana e ao manejo de resíduos sólidos. A drenagem abrange a condução das águas pluviais, enquanto retenção de cheias, tratamento, disposição final e limpeza preventiva das redes são classificados como gestão ambiental. O conjunto deve articular promoção da saúde, proteção ambiental e peculiaridades locais.'],g:1,exp:'Gabarito: B.'},
        {n:47,q:'Durante ação conjunta em um restaurante comercial, a equipe responsável registrou as seguintes situações: I. um lote de alimento preparado iniciou o resfriamento a 60 °C e, após exatamente duas horas, encontrava-se a 12 °C; II. a documentação continha comprovante da execução do controle químico por empresa especializada, mas o POP não descrevia as medidas preventivas e corretivas destinadas ao controle de vetores e pragas; III. carnes cruas e preparações prontas para o consumo eram manipuladas sucessivamente na mesma bancada, sem higienização entre as operações. De acordo com a RDC Anvisa nº 216/2004, a avaliação técnica adequada desses registros está indicada em:',ops:['O resfriamento está inadequado, pois deveria alcançar 10 °C em até duas horas; o POP está incompleto por não prever medidas preventivas e corretivas; e o uso sucessivo da bancada é admissível, porque a separação temporal evita a contaminação cruzada.','O resfriamento está inadequado, pois deveria alcançar 10 °C em até duas horas; o POP está incompleto por não prever medidas preventivas e corretivas; e o uso sucessivo da bancada, sem higienização entre alimentos crus e prontos, não controla a contaminação cruzada.','O resfriamento está adequado, pois foi concluído dentro de duas horas; o POP está incompleto por não prever medidas preventivas e corretivas; e o uso sucessivo da bancada, sem higienização entre alimentos crus e prontos, não controla a contaminação cruzada.','O resfriamento está inadequado, pois deveria alcançar 10 °C em até duas horas; o comprovante do controle químico torna suficiente o POP apresentado; e o uso sucessivo da bancada, sem higienização entre alimentos crus e prontos, não controla a contaminação cruzada.','O resfriamento está inadequado, pois deveria alcançar temperatura inferior a 5 °C em até duas horas; o POP está incompleto por não prever medidas preventivas e corretivas; e o uso sucessivo da bancada, sem higienização entre alimentos crus e prontos, não controla a contaminação cruzada.'],g:1,exp:'Gabarito: B.'},
        {n:48,q:'Um trabalhador rural apresentou febre acima de 38 °C, mialgia e cefaleia 22 dias depois de entrar em um galpão fechado com fezes, urina e sinais de roedores silvestres. Durante a investigação, outro depósito com características semelhantes foi identificado na propriedade e precisaria ser limpo. A equipe também encontrou condições ambientais favoráveis à permanência dos roedores. A orientação compatível com a vigilância e o controle da hantavirose é:',ops:['Considerar a exposição ocorrida nos 60 dias anteriores aos sintomas, providenciar a notificação imediata e investigar o local provável de infecção e os contatos sintomáticos. Antes da limpeza, arejar o galpão por 15 minutos; a equipe deve usar PFF3 e luvas, umedecer superfícies e vestígios com solução de água sanitária a 10% e aguardar meia hora. O controle começa pela antirratização; a desratização focal fica reservada às situações de alta infestação e deve ser executada por pessoal especializado.','Considerar a exposição ocorrida nos 60 dias anteriores aos sintomas, providenciar a notificação imediata e investigar o local provável de infecção e os contatos sintomáticos. Antes da limpeza, arejar o galpão por pelo menos 30 minutos; a equipe deve usar PFF2 e luvas, umedecer superfícies e vestígios com solução de água sanitária a 10% e aguardar meia hora. O controle começa pela antirratização; a desratização focal fica reservada às situações de alta infestação e deve ser executada por pessoal especializado.','Considerar a exposição ocorrida nos 60 dias anteriores aos sintomas, providenciar a notificação imediata e investigar o local provável de infecção e os contatos sintomáticos. Antes da limpeza, arejar o galpão por pelo menos 30 minutos; a equipe deve usar PFF3 e luvas, umedecer superfícies e vestígios com solução de água sanitária a 10% e aguardar meia hora. O controle começa pela antirratização; a desratização focal fica reservada às situações de alta infestação e deve ser executada por pessoal especializado.','Considerar a exposição ocorrida nos 30 dias anteriores aos sintomas, providenciar a notificação imediata e investigar o local provável de infecção e os contatos sintomáticos. Antes da limpeza, arejar o galpão por pelo menos 30 minutos; a equipe deve usar PFF3 e luvas, umedecer superfícies e vestígios com solução de água sanitária a 10% e aguardar meia hora. O controle começa pela antirratização; a desratização focal fica reservada às situações de alta infestação e deve ser executada por pessoal especializado.','Considerar a exposição ocorrida nos 60 dias anteriores aos sintomas, providenciar a notificação imediata e investigar o local provável de infecção e os contatos sintomáticos. Antes da limpeza, arejar o galpão por pelo menos 30 minutos; a equipe deve usar PFF3 e luvas, umedecer superfícies e vestígios com solução de água sanitária a 10% e aguardar meia hora. Havendo vestígios recentes, a desratização focal deve anteceder o manejo ambiental, ainda que não esteja caracterizada alta infestação.'],g:2,exp:'Gabarito: C.'},
        {n:49,q:'Um sistema de abastecimento com desinfecção por cloro atende 35 mil habitantes. Em amostra coletada pela vigilância municipal no ponto de consumo de uma escola, foram detectadas Escherichia coli em 100 mL e concentração de cloro residual livre de 0,1 mg/L. O relatório mensal de controle apresentado pelo responsável pelo sistema não registrava desconformidades nos demais pontos monitorados. Diante desses resultados, assinale a resposta tecnicamente adequada.',ops:['A presença de E. coli e o cloro residual livre de 0,1 mg/L indicam desconformidade, mas os resultados regulares do controle mantêm o evento em condição de alerta até uma recoleta de vigilância confirmar o achado. Nesse intervalo, o responsável intensifica o controle sem comunicar a população, e a autoridade municipal registra o resultado preliminar no Sisagua. Confirmada a alteração, iniciam-se inspeção, correções e comunicação do risco, integradas à avaliação ambiental e sanitária da área abastecida.','A presença de E. coli e o cloro residual livre de 0,1 mg/L indicam desconformidade e exigem resposta imediata. A vigilância municipal deve assumir temporariamente o controle regular do sistema, executar as correções operacionais e informar a população; ao responsável pelo abastecimento cabem o fornecimento dos registros e o apoio à inspeção. Depois da normalização, o controle retorna ao prestador, e os resultados são consolidados no Sisagua para a avaliação ambiental e sanitária da área abastecida.','A presença de E. coli torna a amostra imprópria, mas o cloro residual livre de 0,1 mg/L é aceitável no ponto de consumo, pois o mínimo de 0,2 mg/L alcança o reservatório e a rede. O responsável pelo sistema deve investigar a contaminação e comunicar o risco, enquanto a vigilância municipal registra os dados no Sisagua, inspeciona o abastecimento e acompanha novas amostras. O relatório de controle permanece válido para os demais pontos, sem afastar a avaliação ambiental e sanitária do local alterado.','A presença de E. coli viola o padrão de ausência em 100 mL, e o cloro residual livre de 0,1 mg/L está abaixo do mínimo de 0,2 mg/L também no ponto de consumo. O resultado regular do controle não anula a amostra de vigilância. O responsável pelo sistema deve adotar correções e comunicar o risco; à autoridade municipal cabem a vigilância, a inspeção, o registro no Sisagua e o acompanhamento da resposta, articulados à avaliação ambiental e sanitária da área abastecida.','A presença de E. coli pode ser computada na tolerância mensal de 5% aplicável aos sistemas que abastecem mais de 20 mil habitantes; já o cloro residual livre de 0,1 mg/L está abaixo do mínimo. O responsável pelo sistema deve corrigir a desinfecção e comunicar o risco, enquanto a vigilância municipal registra os dados no Sisagua, inspeciona o abastecimento e acompanha novas amostras. O relatório de controle permanece válido para os demais pontos, sem afastar a avaliação ambiental e sanitária do local alterado.'],g:3,exp:'Gabarito: D.'},
        {n:50,q:'Na investigação de diferentes ocorrências, a vigilância reuniu três registros: - Registro I: casos de doença hepática aguda entre pessoas que compartilharam uma refeição e consumiram água sem tratamento; - Registro II: detecção do vírus da hepatite D em pessoa que já possuía infecção crônica pelo vírus da hepatite B; - Registro III: resultado anti-HCV reagente em pessoa assintomática, ainda sem pesquisa de HCV-RNA. A leitura epidemiológica correta dos três registros é:',ops:['a (E). Os textos de apoio  "A complicada arte de ver" (Q1-Q10) e "Ode à Cebola" de Pablo Neruda (Q11-Q15)  foram incluídos na íntegra antes das questões que os referenciam. O PDF contém 22 páginas e a extração cobriu todas elas sem omissões.','No Registro I, a hipótese abrange hepatites A e E, transmitidas pela via fecal-oral, com investigação da água e da refeição compartilhadas. O Registro II caracteriza superinfecção pelo vírus D em portador crônico do B; nessa situação, a vacinação do próprio portador contra hepatite B constitui medida para bloquear a instalação do HDV. No III, o anti-HCV indica contato prévio, mas o HCV-RNA é necessário para demonstrar infecção atual; não há vacina contra hepatite C. Os casos confirmados e surtos seguem notificação regular no Sinan.','No Registro I, a hipótese abrange hepatites A e E, transmitidas pela via fecal-oral, com investigação da água e da refeição compartilhadas. O Registro II caracteriza superinfecção pelo vírus D em portador crônico do B; a vacina contra hepatite B protege indiretamente contra a D quem ainda não tem HBV. No III, o anti-HCV indica contato prévio, mas a pesquisa de HCV-RNA é necessária para demonstrar infecção atual, e não há vacina contra hepatite C. Os casos confirmados e surtos seguem notificação regular no Sinan.','No Registro I, a hipótese abrange hepatites A e E, transmitidas pela via fecal-oral, com investigação da água e da refeição compartilhadas. O Registro II caracteriza coinfecção pelos vírus B e D; a vacina contra hepatite B protege indiretamente contra a D quem ainda não tem HBV. No III, o anti-HCV indica contato prévio, mas a pesquisa de HCV-RNA é necessária para demonstrar infecção atual, e não há vacina contra hepatite C. Os casos confirmados e surtos seguem notificação regular no Sinan.','No Registro I, a hipótese abrange hepatites A e E, transmitidas pela via fecal-oral, com investigação da água e da refeição compartilhadas. O Registro II caracteriza superinfecção pelo vírus D em portador crônico do B; a vacina contra hepatite B protege indiretamente contra a D quem ainda não tem HBV. No III, o anti-HCV indica contato prévio e confere proteção contra reinfecção, embora o HCV-RNA seja necessário para demonstrar infecção atual; não há vacina contra hepatite C. Os casos confirmados e surtos seguem notificação regular no Sinan.'],g:2,exp:'Gabarito: C.'}
      ]}
    ]
