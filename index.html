        {n:41,q:"Qual mosquito é o principal vetor da dengue, Zika e Chikungunya no Brasil?",ops:["Anopheles darlingi","Aedes albopictus","Aedes aegypti","Culex quinquefasciatus"],g:2,exp:"O Aedes aegypti é o principal vetor das três arboviroses no Brasil. Prefere ambientes urbanos e criadouros artificiais com água limpa e parada."},
        {n:42,q:"A principal complicação da infecção por Zika em gestantes é:",ops:["Pré-eclâmpsia grave","Microcefalia e malformações do sistema nervoso central do feto","Diabetes gestacional","Parto prematuro sem sequelas neurológicas"],g:1,exp:"A síndrome congênita do Zika inclui microcefalia, calcificações cerebrais, artrogripose e outras malformações do SNC fetal, especialmente quando a infecção ocorre no primeiro trimestre."},
        {n:43,q:"A malária é endêmica principalmente em qual região do Brasil?",ops:["Nordeste","Sul","Região Amazônica","Centro-Oeste"],g:2,exp:"A região Amazônica concentra mais de 99% dos casos de malária no Brasil, onde temperatura, umidade e floresta criam condições ideais para o Anopheles."},
        {n:44,q:"O vetor da leishmaniose visceral no Brasil é:",ops:["Aedes aegypti","Anopheles darlingi","Lutzomyia longipalpis (flebotomíneo/mosquito-palha)","Triatoma infestans (barbeiro)"],g:2,exp:"O Lutzomyia longipalpis é o principal vetor da leishmaniose visceral no Brasil. É um mosquito pequeno, de voo silencioso e baixo, ativo ao entardecer e amanhecer."},
        {n:45,q:"A doença de Chagas é causada pelo:",ops:["Plasmodium falciparum","Leishmania chagasi","Trypanosoma cruzi","Wuchereria bancrofti"],g:2,exp:"O Trypanosoma cruzi é o agente etiológico da doença de Chagas, transmitido pelo barbeiro (Triatoma spp.). Foi descoberto pelo médico brasileiro Carlos Chagas em 1909."},
        {n:46,q:"A Síndrome de Weil, forma grave da leptospirose, apresenta a tríade:",ops:["Artralgia, rash e febre","Icterícia intensa, insuficiência renal aguda e fenômenos hemorrágicos","Febre periódica, calafrios e sudorese","Hepatomegalia, esplenomegalia e anemia"],g:1,exp:"A Síndrome de Weil é a forma mais grave da leptospirose: icterícia intensa (coloração amarela intensa), insuficiência renal aguda e fenômenos hemorrágicos (petéquias, hemorragia pulmonar). Alta letalidade."},
        {n:47,q:"Qual é a fase da dengue de maior risco de evolução grave?",ops:["Fase febril (1º ao 3º dia)","Fase crítica (3º ao 6º dia, após queda da febre)","Fase de recuperação (após 7º dia)","A doença não apresenta fases"],g:1,exp:"A fase crítica, coincidindo com a queda da febre, é quando pode ocorrer extravasamento de plasma, hemoconcentração e choque — principal causa de óbito por dengue."},
        {n:48,q:"O sinal de Romaña é característico da fase aguda de qual doença?",ops:["Dengue","Leishmaniose visceral","Malária","Doença de Chagas"],g:3,exp:"O sinal de Romaña é o edema bipalpebral unilateral indolor, ocorre quando o Trypanosoma cruzi entra pela conjuntiva ocular — porta de entrada para a infecção na face."},
        {n:49,q:"Qual é o reservatório animal mais importante da leishmaniose visceral no ambiente urbano?",ops:["Rato doméstico","Gato doméstico","Cão doméstico","Gambá"],g:2,exp:"O cão doméstico é o principal reservatório urbano da L. infantum/chagasi. O controle canino é parte essencial das estratégias de prevenção da leishmaniose visceral urbana."},
        {n:50,q:"A transmissão da leptospirose ocorre principalmente por:",ops:["Picada de inseto","Contato com água ou lama contaminada pela urina de ratos","Transmissão de pessoa a pessoa","Contato com saliva de animais infectados"],g:1,exp:"A Leptospira penetra pela pele com lesões ou mucosas em contato com água/lama contaminada pela urina de ratos, especialmente em enchentes urbanas."},
      ]},
      {nome:'Conhecimentos em Informática (Q51–Q60)',qs:[
        {n:51,q:"No MS-Windows, o atalho Ctrl+C realiza qual ação?",ops:["Recortar o item selecionado","Copiar o item selecionado para a área de transferência","Colar o conteúdo da área de transferência","Desfazer a última ação"],g:1,exp:"Ctrl+C copia o item selecionado para a área de transferência, mantendo o original. Ctrl+X recorta (remove o original). Ctrl+V cola. Ctrl+Z desfaz."},
        {n:52,q:"No MS-Word, qual recurso insere números de página automaticamente no documento?",ops:["Inserir > Cabeçalho","Inserir > Número de Página","Layout > Margens","Referências > Notas de Rodapé"],g:1,exp:"Em Inserir > Número de Página, o Word insere a numeração automaticamente nas posições escolhidas (topo, rodapé ou margens do documento)."},
        {n:53,q:"No MS-Word, qual atalho abre 'Localizar e Substituir'?",ops:["Ctrl+F","Ctrl+H","Ctrl+G","Ctrl+L"],g:1,exp:"Ctrl+H abre a caixa de diálogo 'Localizar e Substituir', que permite encontrar uma palavra/frase e substituí-la por outra automaticamente em todo o documento."},
        {n:54,q:"No MS-Excel, qual fórmula calcula a média aritmética do intervalo B2:B10?",ops:["=SOMA(B2:B10)","=MÉDIA(B2:B10)","=MÁXIMO(B2:B10)","=CONT.SE(B2:B10)"],g:1,exp:"=MÉDIA(intervalo) calcula a média aritmética do conjunto de valores. =SOMA() soma, =MÁXIMO() retorna o maior valor, =CONT.SE() conta condicionalmente."},
        {n:55,q:"No MS-Excel, o símbolo $ em uma referência como $A$1 indica:",ops:["Que a célula está vazia","Referência absoluta — a célula não muda ao copiar a fórmula","Que o valor é monetário","Erro na fórmula"],g:1,exp:"O $ fixa a referência de célula (referência absoluta). $A$1 sempre aponta para a célula A1, mesmo ao copiar a fórmula para outras células. Sem $, a referência é relativa e se ajusta automaticamente."},
        {n:56,q:"No MS-Excel, qual função verifica uma condição e retorna valores diferentes conforme o resultado?",ops:["=SOMA()","=PROCV()","=SE()","=CONT.NÚM()"],g:2,exp:"=SE(teste_lógico; valor_se_verdadeiro; valor_se_falso) é a função condicional básica do Excel. Exemplo: =SE(A1>10;\"Aprovado\";\"Reprovado\")."},
        {n:57,q:"No MS-PowerPoint, qual recurso aplica efeitos visuais a objetos (texto, imagem) DENTRO de um slide?",ops:["Transição","Design","Animação","Layout"],g:2,exp:"Animação aplica efeitos de entrada, ênfase ou saída a objetos dentro de um slide. Transição é o efeito entre slides ao avançar a apresentação."},
        {n:58,q:"No MS-PowerPoint, o modo 'Apresentação de Slides' (F5) serve para:",ops:["Editar o layout do slide","Exibir a apresentação em tela cheia para o público","Adicionar anotações ao apresentador","Imprimir os slides em preto e branco"],g:1,exp:"F5 inicia a apresentação de slides em tela cheia a partir do primeiro slide. Shift+F5 inicia a partir do slide atual."},
        {n:59,q:"Na internet, o que significa a sigla URL?",ops:["Universal Reading Language","Uniform Resource Locator (endereço de um recurso na internet)","United Remote Link","User Resource Login"],g:1,exp:"URL = Uniform Resource Locator: é o endereço que identifica e localiza um recurso na internet, especificando protocolo (https://), domínio (site.com.br) e caminho (/pagina)."},
        {n:60,q:"Ao enviar um e-mail com 'CC' (Com Cópia), o que ocorre?",ops:["O e-mail é enviado apenas para o destinatário em CC","Todos os destinatários (principal e CC) recebem o e-mail e podem ver os endereços uns dos outros","O e-mail fica em modo confidencial","Apenas o remetente recebe cópia"],g:1,exp:"CC (Com Cópia) envia uma cópia do e-mail para destinatários adicionais, e todos os destinatários conseguem ver os endereços de e-mail de quem está em CC. Para cópia oculta, usa-se CCO (Cópia Oculta)."},
      ]},
    ]
  },
  {
    id:'sim10',titulo:'aceEstuda – Questões Comentadas',banca:'VUNESP',ano:2025,
    edital:'Agente de Combate às Endemias',cargo:'ACE',
    secoes:[
      {nome:'Conhecimentos Específicos ACE (Q1)',qs:[
        {n:1,q:"A febre amarela é uma doença infecciosa viral de importância em saúde pública, transmitida por mosquitos e prevenível por vacinação. Agora, marque V para verdadeiro e F para falso:\n( ) A febre amarela pode ocorrer nos ciclos silvestre e urbano, envolvendo diferentes espécies de mosquitos vetores.\n( ) A vacinação é uma medida eficaz na prevenção da febre amarela e na redução da ocorrência de casos humanos.\n( ) A transmissão da febre amarela ocorre exclusivamente por contato direto entre pessoas infectadas.\n( ) O Agente de Combate às Endemias pode atuar na orientação da população sobre prevenção e na vigilância de áreas com circulação viral.\nA sequência correta é:",ops:["V, V, V, F.","F, V, V, F.","V, V, F, V.","V, F, F, V."],g:2,exp:"A febre amarela ocorre nos ciclos silvestre (vetores Haemagogus/Sabethes) e urbano (Aedes aegypti) — V. A vacinação é a principal medida preventiva — V. A transmissão NÃO ocorre por contato direto entre pessoas, mas sim por picada de mosquito infectado — F. O ACE atua na orientação da população e vigilância de áreas com circulação viral — V. Portanto: V, V, F, V."},
        {n:2,q:"O piso salarial dos ACE e ACS, estabelecido pela EC 120/2022, é de responsabilidade de qual ente federativo?",ops:["Da União.","Do Estado.","Do Distrito Federal apenas.","Do Município."],g:0,exp:"O vencimento dos ACE e ACS é de responsabilidade da UNIÃO, conforme a Constituição Federal (art. 198, § 5º, com redação dada pela EC 120/2022). Estados, DF e Municípios podem estabelecer incentivos, auxílios, gratificações e indenizações adicionais."},
        {n:3,q:"Sobre a Leptospirose, marque a alternativa CORRETA:",ops:["Em casos mais graves, podem aparecer icterícia e insuficiência renal (Síndrome de Weil).","A leptospirose ocorre somente durante o verão e pode afetar todas as pessoas.","A principal forma de prevenção é por meio da vacina contra a leptospirose.","É uma doença transmissível e causada por um vírus.","A transmissão ocorre exclusivamente por contato direto com roedores."],g:0,exp:"A leptospirose é causada pela bactéria Leptospira interrogans. A Síndrome de Weil é a forma grave, caracterizada por icterícia, insuficiência renal e hemorragias. Não existe vacina disponível para a leptospirose no calendário nacional. A transmissão ocorre principalmente pelo contato com água ou solo contaminados pela urina de roedores — não exclusivamente por contato direto com os animais."},
        {n:4,q:"Considere que o Agente de Combate a Endemias (ACE) recebeu um mapa territorializado com registros dos seguintes pontos de risco de infestação do mosquito Aedes aegypti, identificados com base no último LIRAa:\n• Setor 01: 1,5%\n• Setor 02: 4,1%\n• Setor 03: 3,8%\n• Setor 04: 0,9%\nSegundo o Ministério da Saúde, índices superiores a 4% configuram situação de risco. Com base nesses dados, assinale a afirmativa correta.",ops:["Os setores 02 e 03 estão em alerta e devem receber monitoramento e ação preventiva prioritária.","O setor 04 apresenta risco iminente de surto, exigindo ação emergencial.","Todos os setores devem ser tratados igualmente, pois estão acima do índice ideal.","Apenas o setor 01 deve receber ações intensificadas de controle e bloqueio."],g:0,exp:"Pelo LIRAa (Levantamento de Índice Rápido para Aedes aegypti), os índices são classificados em: satisfatório (< 1%), alerta (1% a 3,9%) e risco (≥ 4%). O Setor 02 (4,1%) está em situação de RISCO e o Setor 03 (3,8%) em situação de ALERTA — ambos demandam monitoramento e ação preventiva prioritária. O Setor 04 (0,9%) é satisfatório e o Setor 01 (1,5%) está em alerta, mas não é o mais crítico. A alternativa A é a que melhor reflete a priorização correta de acordo com os dados apresentados."},
        {n:5,q:"É uma doença parasitária, diretamente relacionada ao saneamento precário. A transmissão ocorre quando pessoas entram em contato com água doce contaminada por cercárias, formas infectantes do parasita, liberadas por caramujos. A qual doença se refere o texto?",ops:["Esquistossomose.","Leishmaniose.","Histoplasmose.","Hanseníase."],g:0,exp:"A esquistossomose (barriga d'água) é uma doença parasitária causada pelo Schistosoma mansoni, transmitida quando as cercárias (formas infectantes do parasita) liberadas por caramujos do gênero Biomphalaria penetram na pele humana em contato com água doce contaminada. Está diretamente relacionada ao saneamento precário. A histoplasmose é fúngica, a hanseníase é bacteriana e a leishmaniose é transmitida por flebotomíneos."},
        {n:6,q:"A Lei nº 8.080/1990, que dispõe sobre a organização e o funcionamento do Sistema Único de Saúde (SUS), estabelece diretrizes específicas para o Planejamento e o Orçamento das ações e serviços de saúde. Nesse contexto, é CORRETO afirmar que:",ops:["O processo de planejamento e orçamento do SUS será ascendente, do nível local até o federal.","O processo de planejamento e orçamento do SUS será progressivo, do nível local até o estadual.","O processo de planejamento e orçamento do SUS será decrescente, do nível federal até o local.","O processo de planejamento e orçamento do SUS será crescente, do nível local até o municipal."],g:0,exp:"Conforme Art. 36 da Lei 8.080/1990, o processo de planejamento e orçamento do Sistema Único de Saúde (SUS) será ascendente, do nível local até o federal. Isso significa que o planejamento parte das necessidades locais (municípios) e se consolida nos níveis estadual e federal, respeitando a descentralização do SUS."},
        {n:7,q:"A peste é uma zoonose de roedores que pode infectar outros mamíferos (cães, gatos, coelhos, camelos), inclusive o homem. Constitui-se em um perigo potencial para as populações, devido à persistência da infecção em roedores silvestres. Trata-se de uma doença infecciosa aguda, transmitida principalmente por picada de pulga infectada, que se manifesta sob três formas clínicas principais:",ops:["Cuneiforme, etimoidal e pneumônica.","Bubônica, bacteriana e pneumônica.","Bubônica, septicêmica e pneumônica.","Septicêmica, pneumônica e juvenil.","Talassêmica, cuneiforme, bubônica."],g:2,exp:"A peste manifesta-se sob três formas clínicas principais: bubônica (mais comum, com inflamação de linfonodos — os famosos 'bubões'), septicêmica (disseminação da bactéria Yersinia pestis no sangue) e pneumônica (forma mais grave, com comprometimento pulmonar e possibilidade de transmissão interpessoal por gotículas). As demais alternativas apresentam termos incorretos ou inexistentes na classificação clínica da doença."},
        {n:8,q:"As autoridades governamentais federal, estadual e municipal, preocupadas com a situação epidemiológica da Dengue e a infestação de quase todo território nacional pelo mosquito Aedes aegypti, estão normatizando várias ações de controle do mosquito transmissor da dengue e da febre amarela. Identifique qual é o mais eficiente, seguro, econômico e racional método de controle do mosquito vetor:",ops:["Controle perifocal.","Controle sanitário.","Controle químico.","Controle mecânico."],g:3,exp:"O controle mecânico (eliminação de criadouros, vedação de recipientes, descarte correto de materiais e manejo ambiental) é o método mais eficiente, seguro, econômico e racional para o controle do Aedes aegypti. Não utiliza substâncias químicas, não agride o meio ambiente, pode ser realizado pela população e tem efeito duradouro. O controle químico deve ser usado apenas como complemento em situações específicas de surto. O controle perifocal é uma técnica específica de aplicação de inseticida ao redor de criadouros de difícil remoção."},
        {n:9,q:"Conforme Portaria nº 2.436, de 21 de setembro de 2017, são atribuições comuns a todos os membros que atuam na Atenção Básica:",ops:["Indicar a necessidade de internação hospitalar ou domiciliar, mantendo a responsabilização pelo acompanhamento da pessoa.","Alimentar e garantir a qualidade do registro das atividades nos sistemas de informação da Atenção Básica conforme normativa vigente.","Realizar consultas clínicas, pequenos procedimentos cirúrgicos, atividades em grupo na UBS e, quando indicado ou necessário, no domicílio e/ou nos demais espaços comunitários.","Realizar e/ou supervisionar acolhimento com escuta qualificada e classificação de risco, de acordo com protocolos estabelecidos."],g:1,exp:"Conforme a Portaria 2.436/2017, alimentar e garantir a qualidade do registro das atividades nos sistemas de informação da Atenção Básica é atribuição COMUM a todos os membros das equipes. As demais alternativas referem-se a atribuições específicas de determinadas categorias profissionais (médicos, enfermeiros), não sendo comuns a todos."},
        {n:10,q:"De acordo com a Lei nº 8.080/1990, são atribuições comuns da União, dos Estados e dos Municípios no âmbito administrativo do Sistema Único de Saúde (SUS):",ops:["Participar na formulação e na implementação das políticas de controle das agressões ao meio ambiente, de saneamento básico e relativas às condições e aos ambientes de trabalho.","Elaborar normas técnicas e estabelecer padrões de qualidade para promoção da saúde do trabalhador.","Gerir laboratórios públicos de saúde e hemocentros.","Formular, avaliar e apoiar políticas de alimentação e nutrição.","Promover a descentralização para os municípios dos serviços e das ações de saúde."],g:1,exp:"Conforme Art. 15, VI da Lei 8.080/1990, é atribuição COMUM da União, dos Estados e dos Municípios elaborar normas técnicas e estabelecer padrões de qualidade para promoção da saúde do trabalhador. As demais alternativas referem-se a atribuições específicas de determinados entes: a gestão de hemocentros e laboratórios (C) e a descentralização para municípios (E) são atribuições da União/Estados; as políticas de alimentação e nutrição (D) têm competências diferenciadas por ente."},
        {n:11,q:"Qual ano foi criada a lei que regulamenta o trabalho do Agente de Combate às Endemias?",ops:["1999","2003","1990","2006","1994"],g:3,exp:"A Lei Federal nº 11.350, que regulamenta o trabalho do Agente de Combate às Endemias (ACE) e do Agente Comunitário de Saúde (ACS), foi publicada em 2006. Essa lei dispõe sobre o aproveitamento dos agentes, estipula requisitos para o exercício das atividades e define as atribuições da carreira."},
        {n:12,q:"No âmbito do Sistema Único de Saúde (SUS), são atribuições comuns à União, aos Estados, ao Distrito Federal e aos Municípios, EXCETO:",ops:["Gerir laboratórios públicos de saúde e hemocentros.","Participação na formulação e na execução da política de formação e desenvolvimento de recursos humanos para a saúde.","Administração dos recursos orçamentários e financeiros destinados, em cada ano, à saúde.","Elaboração e atualização periódica do plano de saúde.","Participação na formulação e implementação das políticas de controle das agressões ao meio ambiente."],g:0,exp:"Conforme Art. 18, VIII da Lei 8.080/1990, gerir laboratórios públicos de saúde e hemocentros é competência MUNICIPAL, não atribuição comum a todos os entes federados. As demais alternativas (formação de RH, administração de recursos, plano de saúde e controle ambiental) são atribuições comuns previstas no Art. 15 da mesma lei."},
        {n:13,q:"De acordo com a Constituição Federal, as ações e os serviços públicos de saúde constituem um sistema único, que tem como uma de suas diretrizes o(a):",ops:["Atendimento integral, com prioridade para os serviços assistenciais.","Rede regionalizada e sem hierarquia ou precedência.","Atendimento integral, com prioridade para as atividades emergenciais.","Participação da comunidade.","Centralização da direção em uma esfera, no caso o governo federal."],g:3,exp:"Conforme Art. 198 da CF/88, o SUS é constituído por uma rede regionalizada e hierarquizada e organizado com base em três diretrizes: I – descentralização, com direção única em cada esfera de governo; II – atendimento integral, com prioridade para as atividades PREVENTIVAS (não assistenciais nem emergenciais); III – participação da comunidade. A alternativa D corresponde exatamente à terceira diretriz constitucional do SUS."},
        {n:14,q:"As zoonoses são doenças ou infecções naturalmente transmitidas entre animais e seres humanos, representando um importante desafio para a saúde pública. O Agente de Combate às Endemias atua na orientação da população, na vigilância ambiental e no apoio às ações de prevenção e controle dessas doenças no território. Considerando os conceitos e as estratégias de prevenção das zoonoses, assinale a alternativa CORRETA:",ops:["A prevenção das zoonoses limita-se ao tratamento dos animais doentes, não sendo necessárias ações de vigilância ou educação em saúde.","O controle das zoonoses é responsabilidade exclusiva dos serviços hospitalares, não envolvendo ações no território.","As zoonoses são transmitidas entre animais e seres humanos e exigem ações preventivas integradas.","As zoonoses afetam exclusivamente animais domésticos, não oferecendo risco à saúde humana."],g:2,exp:"As zoonoses são doenças transmitidas entre animais e seres humanos e exigem ações preventivas integradas, incluindo vigilância ambiental, controle vetorial, orientação da população e educação em saúde. As demais alternativas estão incorretas: zoonoses afetam tanto animais domésticos quanto silvestres; o controle envolve ações no território (não apenas hospitais); e a prevenção vai muito além do tratamento de animais doentes."},
        {n:15,q:"A assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas, constitui um dos objetivos do SUS. Certo ou Errado?",ops:["Errado.","Certo."],g:1,exp:"CERTO. Conforme Art. 5º, III da Lei 8.080/1990, são objetivos do SUS: I – a identificação e divulgação dos fatores condicionantes e determinantes da saúde; II – a formulação de política de saúde para promover, proteger e recuperar a saúde; III – a assistência às pessoas por meio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas."},
        {n:16,q:"Qual é o ciclo de vida completo do Aedes aegypti?",ops:["Larva, pupa e adulto.","Ovo, ninfa e adulto.","Ovo, larva e adulto.","Ovo, larva, pupa e adulto."],g:3,exp:"O ciclo do Aedes aegypti tem 4 fases: ovo → larva → pupa → adulto. As fases de ovo, larva e pupa são aquáticas (dependem da água para se desenvolver), enquanto a fase adulta é aérea. O ciclo completo dura em média de 7 a 10 dias em condições ideais de temperatura e umidade. O termo 'ninfa' pertence ao ciclo de outros insetos (hemimetábolos), não ao mosquito."},
        {n:17,q:"No que se refere aos princípios do Sistema Único de Saúde (SUS), analise a afirmativa abaixo. A _______ assegura o acesso às ações e aos serviços de saúde a todos os cidadãos brasileiros, sem qualquer forma de discriminação. A incorporação desse princípio pela Constituição Federal de 1988 representou uma expressiva conquista democrática, ao reconhecer a saúde como direito de todos e dever do Estado. Assinale a alternativa que preenche corretamente a lacuna:",ops:["Universalidade.","Centralização.","Seletividade.","Equidade."],g:0,exp:"A universalidade é o princípio do SUS que assegura o acesso às ações e serviços de saúde a TODOS os cidadãos, sem discriminação de raça, cor, classe social ou qualquer outra condição. A CF/1988 reconheceu a saúde como direito de todos e dever do Estado (Art. 196). Não confundir com equidade (tratar desigualmente os desiguais para reduzir iniquidades) nem com integralidade (atenção ao indivíduo como um todo)."},
        {n:18,q:"Durante as vistorias em áreas rurais com ocorrência de pomares e reflorestamentos, o Agente de Combate às Endemias (ACE) orienta os trabalhadores sobre acidentes por lagartas do gênero Lonomia (lepidópteros). Em caso de acidente por contato com as cerdas desse animal, qual é a complicação grave esperada e o tratamento indicado?",ops:["Insuficiência respiratória aguda e paralisia motora espástica, tratada com soro antibotrópico via endovenosa.","Necrose cutânea progressiva com formação de bolhas, tratada com corticoides tópicos de efeito residual.","Síndrome hemorrágica com risco de insuficiência renal aguda, tratada com soro antilonômico específico.","Choque anafilático precoce e edema de glote imediato, tratado com vacina antitetânica e anti-histamínicos."],g:2,exp:"O acidente com lagartas do gênero Lonomia (taturana) pode causar síndrome hemorrágica grave — com distúrbios de coagulação, sangramento espontâneo e risco de insuficiência renal aguda. O tratamento específico é o soro antilonômico, produzido pelo Instituto Butantan. O soro antibotrópico é indicado para acidentes com serpentes do gênero Bothrops (jararaca), não para lepidópteros."},
        {n:19,q:"O Controle de pragas e vetores é um conjunto de medidas preventivas e corretivas para evitar a infestação, proliferação, acesso e abrigo para vetores e pragas. Essas ações trazem resultados positivos se adotadas com medidas sanitárias, promovendo impactos satisfatórios no aspecto ambiental. Identifique qual alternativa NÃO representa um impacto positivo do controle das pragas e vetores para a saúde e ambiente:",ops:["Minimiza a população de pragas e vetores para que não se torne um problema significativo.","Elimina fatores que possam ajudar na permanência das pragas e vetores, reduzindo ofertas de abrigo, água e comida.","Evita a transmissão de doenças transmissíveis e não transmissíveis.","Evita que pragas como insetos, roedores e aves transitem em espaços onde as portas e janelas possuem telas de proteção."],g:2,exp:"O controle de pragas e vetores NÃO evita a transmissão de doenças NÃO transmissíveis (como doenças crônicas, cardiovasculares, diabetes, hipertensão, etc.), pois estas têm causas multifatoriais sem relação com vetores. O controle de pragas atua na prevenção de doenças TRANSMISSÍVEIS causadas por vetores (dengue, leptospirose, malária, etc.). As demais alternativas descrevem impactos positivos reais do controle vetorial."},
        {n:20,q:"A Lei Orgânica 8.080, de 1990, define 'um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva'. Trata-se do conceito de:",ops:["Vigilância Ambiental.","Epidemiologia.","Promoção da saúde.","Vigilância Nutricional.","Vigilância Epidemiológica."],g:4,exp:"Conforme Art. 6º, §2º da Lei 8.080/1990, vigilância epidemiológica é 'um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos'."},
        {n:21,q:"A Lei nº 8.142/1990 dispõe sobre a participação da comunidade na gestão do Sistema Único de Saúde (SUS) e sobre as transferências intergovernamentais de recursos financeiros na área da saúde. Sobre o Conselho de Saúde, é CORRETO afirmar que:",ops:["É um órgão consultivo, sem poder de decisão sobre a política de saúde.","É um órgão temporário, reunindo-se a cada quatro anos para avaliar a situação de saúde e propor diretrizes.","É um órgão permanente e deliberativo, composto por representantes do governo, prestadores de serviço, profissionais de saúde e usuários, atuando na formulação de estratégias e no controle da execução da política de saúde.","É composto apenas por gestores e prestadores de serviço, sem participação de usuários."],g:2,exp:"Conforme Art. 1º, §2º da Lei nº 8.142/1990, o Conselho de Saúde é um órgão PERMANENTE e DELIBERATIVO, composto por representantes do governo, prestadores de serviço, profissionais de saúde e usuários. Atua na formulação de estratégias e no controle da execução da política de saúde, inclusive nos aspectos econômicos e financeiros. A alternativa B descreve a Conferência de Saúde (que se reúne a cada 4 anos). A alternativa A está errada (o Conselho é deliberativo, não consultivo). A alternativa D está errada (há participação paritária de usuários)."},
        {n:22,q:"O que é a fase leptospirêmica da doença?",ops:["A fase de recuperação da doença.","A fase inicial (1ª semana), com presença da bactéria no sangue, febre súbita, cefaleia e mialgia intensa.","A fase de transmissão para outros humanos.","A fase crônica da doença, com meses de duração."],g:1,exp:"A fase leptospirêmica ocorre nos primeiros 3 a 7 dias, quando a Leptospira está presente no sangue e no líquor. Caracteriza-se por febre de início súbito, cefaleia intensa, mialgia (principalmente nas panturrilhas) e conjuntivite. É a fase aguda inicial da leptospirose, antes de eventual evolução para a fase imunológica (síndrome de Weil), com icterícia, insuficiência renal e manifestações hemorrágicas."},
        {n:23,q:"Sobre a leishmaniose visceral, é correto afirmar que:",ops:["É sempre benigna.","É uma doença crônica e sistêmica, que pode ser fatal se não tratada.","Afeta apenas crianças.","Não tem tratamento."],g:1,exp:"A leishmaniose visceral é uma doença CRÔNICA e SISTÊMICA, que pode ser FATAL se não tratada. Afeta principalmente crianças e imunossuprimidos, mas pode ocorrer em adultos. O tratamento é disponibilizado pelo SUS (antimoniais pentavalentes como o Glucantime ou anfotericina B). Não é benigna — a letalidade sem tratamento pode ultrapassar 90%."},
        {n:24,q:"A Lei 8.080/1990 determina que a assistência terapêutica integral no SUS deve incluir:",ops:["Apenas medicamentos de alto custo.","Medicamentos de uso exclusivamente hospitalar.","O fornecimento gratuito de medicamentos essenciais.","Produtos que não necessitam de receita médica."],g:2,exp:"Conforme Art. 6º, I, 'd' da Lei 8.080/1990, a assistência terapêutica integral inclui a oferta de medicamentos. O SUS garante o acesso gratuito a medicamentos essenciais (Rename – Relação Nacional de Medicamentos Essenciais), não se restringindo a medicamentos de alto custo, uso hospitalar exclusivo ou produtos sem receita."},
      ]},
    ]
  },
];

// ===================== INIT =====================
window.addEventListener('DOMContentLoaded',()=>{
  buildFlashDados();
  renderResumo();
  renderFlashFiltro();
  renderFlash();
  renderMapa();
  renderExamesList();
  mostrarRelatorio();
  const dark = localStorage.getItem('aceDark');
  if(dark==='1') document.body.setAttribute('data-dark','');
});

// ===================== RESUMO =====================
function renderResumo(){
  const el = document.getElementById('sec-resumo');
  el.innerHTML = disciplinas.map((d,i)=>`
    <div class="disc-bloco">
      <div class="disc-header" onclick="toggleDisc(${i},this)" style="background:${d.cor}">
        ${d.nome} <span class="arrow">▼</span>
      </div>
      <div class="disc-topicos" id="disc-${i}">
        ${d.topicos.map(t=>`
          <div class="topico-item">
            <div style="flex:1">
              <div class="topico-nome">${t.t}</div>
              <div class="topico-desc">${t.d}</div>
            </div>
            <span class="freq-badge freq-${t.freq}">${t.freq.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleDisc(i,hdr){
  const el = document.getElementById('disc-'+i);
  const open = el.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

// ===================== FLASHCARDS =====================
function buildFlashDados(){
  flashDados=[];
  disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      flashDados.push({disc:d.nome, termo:t.t, def:t.d, freq:t.freq});
    });
  });
  flashDeck=[...flashDados];
}

function renderFlashFiltro(){
  const sel = document.getElementById('flash-filtro');
  disciplinas.forEach(d=>{
    const op = document.createElement('option');
    op.value = d.nome;
    op.textContent = d.nome.replace(/^.{2}/,'');
    sel.appendChild(op);
  });
}

function filtrarFlash(){
  const v = document.getElementById('flash-filtro').value;
  flashDeck = v==='todos' ? [...flashDados] : flashDados.filter(f=>f.disc===v);
  flashIdx=0;
  renderFlash();
}

function shuffleFlash(){
  for(let i=flashDeck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];
  }
  flashIdx=0;
  document.getElementById('flash-inner').classList.remove('virado');
  renderFlash();
  toast('Embaralhado!');
}

function renderFlash(){
  if(!flashDeck.length) return;
  const c = flashDeck[flashIdx];
  document.getElementById('flash-termo').textContent = c.termo;
  document.getElementById('flash-def').textContent = c.def;
  document.getElementById('flash-prog').textContent = `${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-inner').classList.remove('virado');
}

function virarCard(){
  document.getElementById('flash-inner').classList.toggle('virado');
}

function navFlash(d){
  flashIdx = (flashIdx+d+flashDeck.length)%flashDeck.length;
  renderFlash();
}

function falarCard(){
  const virado = document.getElementById('flash-inner').classList.contains('virado');
  const txt = virado ? document.getElementById('flash-def').textContent : document.getElementById('flash-termo').textContent;
  falar(txt);
}

function falar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR'; u.rate=_speechRate;
  speechSynthesis.speak(u);
}

// ===================== MAPA =====================
function renderMapa(){
  const filtros = document.getElementById('mapa-filtros');
  const grid = document.getElementById('mapa-grid');
  const nomes = ['Todos',...disciplinas.map(d=>d.nome)];
  filtros.innerHTML = nomes.map((n,i)=>`<button class="${i===0?'ativo':''}" onclick="filtrarMapa(this,'${n}')">${n}</button>`).join('');
  _renderMapaGrid('Todos');
}

function filtrarMapa(btn,disc){
  document.querySelectorAll('.mapa-filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  _renderMapaGrid(disc);
}

function _renderMapaGrid(disc){
  const grid = document.getElementById('mapa-grid');
  let items=[];
  disciplinas.forEach(d=>{
    if(disc==='Todos'||d.nome===disc){
      d.topicos.forEach(t=>items.push({disc:d.nome,t}));
    }
  });
  grid.innerHTML = items.map(({disc,t})=>`
    <div class="mapa-card" onclick="toast('${t.t}')">
      <div class="mc-disc">${disc.replace(/^.{2}/,'')}</div>
      <div class="mc-nome">${t.t}</div>
      <span class="freq-badge freq-${t.freq} mc-freq">${t.freq.toUpperCase()}</span>
    </div>
  `).join('');
}

function iniciarQuiz(){
  const filtro = document.getElementById('quiz-filtro').value;
  let banco = filtro==='todos' ? [...questoes] : questoes.filter(q=>q.disc===filtro);
  for(let i=banco.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[banco[i],banco[j]]=[banco[j],banco[i]];}
  quizPerguntas = banco.slice(0,Math.min(10,banco.length));
  quizIdx=0; quizCertas=0; quizErradas=0; respondeu=false;
  document.getElementById('quiz-placar').classList.remove('show');
  document.getElementById('quiz-box').style.display='block';
  renderQuestao();
}

function renderQuestao(){
  if(quizIdx>=quizPerguntas.length){encerrarQuiz();return;}
  respondeu=false;
  const q = quizPerguntas[quizIdx];
  document.getElementById('q-disc').textContent = q.disc;
  const temaEl = document.getElementById('q-tema');
  temaEl.textContent = q.tema || '';
  temaEl.style.display = q.tema ? '' : 'none';
  document.getElementById('q-num').textContent = `${quizIdx+1}/${quizPerguntas.length}`;
  document.getElementById('q-pergunta').textContent = q.p;
  document.getElementById('q-exp').classList.remove('show');
  document.getElementById('btn-prox-q').style.display='none';
  const ops = document.getElementById('q-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="quiz-op" onclick="verificarResposta(${i})">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span> ${o}
    </button>
  `).join('');
  const vid = q.tema ? (videoMap[q.tema] || '') : '';
  const wrap = document.getElementById('q-video-wrap');
  if(vid){
    wrap.style.display = 'block';
    wrap.innerHTML = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${vid}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="border-radius:12px;display:block;margin-top:10px"></iframe>`;
  } else {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
  }
}

function verificarResposta(idx){
  if(respondeu) return;
  respondeu=true;
  const q = quizPerguntas[quizIdx];
  const btns = document.querySelectorAll('.quiz-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  if(idx===q.c) quizCertas++; else quizErradas++;
  salvarRespostaQuiz(idx===q.c);
  document.getElementById('q-exp').textContent = q.exp;
  document.getElementById('q-exp').classList.add('show');
  document.getElementById('btn-prox-q').style.display='inline-block';
}

function proximaQuestao(){
  quizIdx++;
  renderQuestao();
}

function encerrarQuiz(){
  document.getElementById('quiz-box').style.display='none';
  const placar = document.getElementById('quiz-placar');
  placar.classList.add('show');
  const total = quizCertas+quizErradas;
  document.getElementById('placar-num').textContent = `${quizCertas}/${total}`;
  const pct = total?Math.round(quizCertas/total*100):0;
  document.getElementById('placar-label').textContent = `${pct}% de aproveitamento – ${quizCertas} certa(s), ${quizErradas} errada(s)`;
}

function salvarRespostaQuiz(acertou){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.quizTotal = (dados.quizTotal||0)+1;
  dados.quizCertas = (dados.quizCertas||0)+(acertou?1:0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

// ===================== SIMULADOS =====================
function renderExamesList(){
  const el = document.getElementById('exames-lista');
  el.innerHTML = EXAMES_DATA.map(e=>`
    <div class="exame-card">
      <div class="exame-info">
        <h3>${e.titulo}</h3>
        <p>${e.banca} · ${e.ano} · ${e.cargo}</p>
      </div>
      <button class="btn-iniciar" onclick="iniciarExame('${e.id}')">▶ Iniciar</button>
    </div>
  `).join('');
}

function iniciarExame(id){
  exAtual = EXAMES_DATA.find(e=>e.id===id);
  exSecAtual=0; exQAtual=0; exRespostas={}; exStarted=true;
  document.getElementById('exames-lista').style.display='none';
  const ativo = document.getElementById('exame-ativo');
  ativo.classList.add('show');
  document.getElementById('ex-titulo').textContent = exAtual.titulo;
  document.getElementById('ex-info').textContent = `${exAtual.banca} · ${exAtual.ano}`;
  document.getElementById('ex-resultado').classList.remove('show');
  document.getElementById('ex-corpo').style.display='block';
  renderQuestaoExame();
}

function renderQuestaoExame(){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  document.getElementById('ex-sec-label').textContent = sec.nome;

  // pergunta
  const pergEl = document.getElementById('ex-pergunta');
  pergEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
  pergEl.querySelector('span').textContent = `Q${q.n}. ${q.q}`;
  pergEl.querySelector('.audio-btn').addEventListener('click', ()=>falar(`Q${q.n}. ${q.q}`));

  document.getElementById('ex-exp').classList.remove('show');
  document.getElementById('btn-ex-prox').style.display='none';

  // alternativas
  const ops = document.getElementById('ex-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="ex-op" data-idx="${i}">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span>
      <span style="flex:1"></span>
      <span class="audio-btn-op" data-audio="${i}" title="Ouvir alternativa">🔊</span>
    </button>
  `).join('');

  // preenche texto e listeners sem risco de escape
  ops.querySelectorAll('.ex-op').forEach((btn, i)=>{
    btn.querySelector('span:nth-child(2)').textContent = q.ops[i];
    btn.addEventListener('click', (e)=>{
      if(e.target.classList.contains('audio-btn-op')) return;
      responderExame(i);
    });
    btn.querySelector('.audio-btn-op').addEventListener('click', (e)=>{
      e.stopPropagation();
      falar(q.ops[i]);
    });
  });
}

function responderExame(idx){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  const key = `${exSecAtual}_${exQAtual}`;
  if(exRespostas[key]!==undefined) return;
  exRespostas[key]=idx;
  const btns = document.querySelectorAll('.ex-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.g) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  document.getElementById('ex-exp').textContent = q.exp;
  document.getElementById('ex-exp').classList.add('show');
  document.getElementById('btn-ex-prox').style.display='inline-block';
}

function avancarExame(){
  const sec = exAtual.secoes[exSecAtual];
  exQAtual++;
  if(exQAtual>=sec.qs.length){
    exSecAtual++;
    exQAtual=0;
    if(exSecAtual>=exAtual.secoes.length){finalizarExame();return;}
  }
  renderQuestaoExame();
}

function finalizarExame(){
  document.getElementById('ex-corpo').style.display='none';
  let total=0,certas=0;
  exAtual.secoes.forEach((s,si)=>{
    s.qs.forEach((q,qi)=>{
      total++;
      if(exRespostas[`${si}_${qi}`]===q.g) certas++;
    });
  });
  document.getElementById('ex-res-num').textContent = `${certas}/${total}`;
  const pct=Math.round(certas/total*100);
  document.getElementById('ex-res-label').textContent = `${pct}% de aproveitamento`;
  document.getElementById('ex-resultado').classList.add('show');
  salvarResultadoSimulado(certas,total);
}

function salvarResultadoSimulado(certas,total){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.simTotal = (dados.simTotal||0)+1;
  dados.simCertas = (dados.simCertas||0)+certas;
  dados.simQuestoes = (dados.simQuestoes||0)+total;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function voltarExames(){
  document.getElementById('exame-ativo').classList.remove('show');
  document.getElementById('exames-lista').style.display='grid';
  exAtual=null; exStarted=false;
}

// ===================== RELATÓRIO =====================
function mostrarRelatorio(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0, qC=dados.quizCertas||0;
  const sT=dados.simTotal||0, sC=dados.simCertas||0, sQ=dados.simQuestoes||0;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${qT}</div><div class="stat-label">Quiz respondidas</div></div>
    <div class="stat-card"><div class="stat-num">${qT?Math.round(qC/qT*100):0}%</div><div class="stat-label">Acerto no Quiz</div></div>
    <div class="stat-card"><div class="stat-num">${sT}</div><div class="stat-label">Simulados feitos</div></div>
    <div class="stat-card"><div class="stat-num">${sQ?Math.round(sC/sQ*100):0}%</div><div class="stat-label">Acerto Simulados</div></div>
  `;
}

function exportarTXT(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0,qC=dados.quizCertas||0;
  const sT=dados.simTotal||0,sC=dados.simCertas||0,sQ=dados.simQuestoes||0;
  const txt=`RELATÓRIO ACE – Agente de Combate às Endemias
Gerado em: ${new Date().toLocaleString('pt-BR')}

QUIZ
  Questões respondidas: ${qT}
  Acertos: ${qC} (${qT?Math.round(qC/qT*100):0}%)
  Erros: ${qT-qC}

SIMULADOS
  Simulados realizados: ${sT}
  Questões respondidas: ${sQ}
  Acertos: ${sC} (${sQ?Math.round(sC/sQ*100):0}%)

---
Bons estudos! 🌿
`;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='relatorio-ace.txt';
  a.click();
  toast('Exportado com sucesso!');
}

function limparDados(){
  if(!confirm('Limpar todo o histórico de respostas?')) return;
  localStorage.removeItem(STORAGE_KEY);
  mostrarRelatorio();
  toast('Dados apagados!');
}

// ===================== UTILS =====================
function mudarTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('sec-'+id).classList.add('ativa');
  if(id==='relatorio') mostrarRelatorio();
}

function setSpeed(v, btn){
  _speechRate = v;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function toggleDark(){
  const dark = document.body.hasAttribute('data-dark');
  dark ? document.body.removeAttribute('data-dark') : document.body.setAttribute('data-dark','');
  localStorage.setItem('aceDark', dark?'0':'1');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
