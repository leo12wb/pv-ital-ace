<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACE – Agente de Combate às Endemias</title>
<style>
:root{
  --ace-primary:#15803d;--ace-secondary:#16a34a;--ciano:#0d9488;--azul:#22c55e;
  --bg:#f0fdf4;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#d1fae5;
  --shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px;
}
[data-dark]{
  --bg:#0a0a0a;--card:#111;--text:#f0f0f0;--muted:#9ca3af;--border:#1f2937;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
/* HEADER */
header{background:linear-gradient(135deg,#052e16,#15803d,#16a34a);padding:18px 20px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hdr-row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.badge{background:#fff2;color:#fff;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid #fff4;letter-spacing:.5px}
.hdr-titles h1{font-size:1.1rem;font-weight:700;color:#fff;line-height:1.2}
.hdr-titles p{font-size:.72rem;color:#bbf7d0;margin-top:2px}
.hdr-actions{margin-left:auto;display:flex;gap:8px}
.hdr-btn{background:#fff2;border:1px solid #fff3;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.75rem;transition:background .2s}
.hdr-btn:hover{background:#fff3}
.speed-group{display:flex;border:1px solid #fff3;border-radius:8px;overflow:hidden}
.speed-btn{background:#fff2;border:none;border-right:1px solid #fff3;color:#fff;padding:6px 9px;cursor:pointer;font-size:.72rem;font-weight:600;transition:background .2s}
.speed-btn:last-child{border-right:none}
.speed-btn:hover{background:#fff3}
.speed-btn.ativo{background:#fff4;font-weight:800}
/* TABS */
.tabs-wrap{background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:72px;z-index:90}
.tabs{display:flex;gap:0;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.tab.ativo{color:var(--ace-primary);border-bottom-color:var(--ace-primary)}
.tab:hover:not(.ativo){color:var(--ace-secondary)}
/* CONTENT */
.content{max-width:900px;margin:0 auto;padding:16px}
.secao{display:none}.secao.ativa{display:block}
/* RESUMO */
.disc-bloco{background:var(--card);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.disc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--ace-primary);color:#fff;font-weight:600;font-size:.9rem;user-select:none}
.disc-header:hover{opacity:.92}
.disc-header .arrow{transition:transform .3s;font-size:.8rem}
.disc-header.open .arrow{transform:rotate(180deg)}
.disc-topicos{display:none;padding:0}
.disc-topicos.open{display:block}
.topico-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.topico-item:last-child{border-bottom:none}
.freq-badge{font-size:.65rem;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;margin-top:2px}
.freq-alto{background:#fef2f2;color:#dc2626}
.freq-medio{background:#fffbeb;color:#d97706}
.freq-baixo{background:#f0fdf4;color:#15803d}
.topico-nome{font-weight:600;font-size:.85rem;margin-bottom:3px}
.topico-desc{font-size:.78rem;color:var(--muted);line-height:1.5}
/* FLASHCARDS */
.flash-ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.flash-ctrl select,.flash-ctrl button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);font-size:.82rem;cursor:pointer;background:var(--card);color:var(--text)}
.flash-ctrl button{background:var(--ace-primary);color:#fff;border:none;font-weight:600}
.flash-ctrl button:hover{background:var(--ace-secondary)}
.flash-prog{font-size:.8rem;color:var(--muted);margin-left:auto}
.flash-box{perspective:1000px;margin:0 auto 16px}
.flash-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash-inner.virado{transform:rotateY(180deg)}
.flash-frente,.flash-verso{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);backface-visibility:hidden;padding:32px 24px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.flash-verso{position:absolute;top:0;left:0;width:100%;transform:rotateY(180deg);background:linear-gradient(135deg,#052e16,#15803d)}
.flash-frente .label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-frente .termo{font-size:1.4rem;font-weight:700;color:var(--ace-primary)}
.flash-verso .label{font-size:.7rem;color:#bbf7d0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-verso .def{font-size:.88rem;color:#fff;line-height:1.6}
.flash-nav{display:flex;justify-content:center;gap:12px}
.flash-nav button{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.82rem}
.btn-ant{background:var(--border);color:var(--text)}
.btn-prox{background:var(--ace-primary);color:#fff}
.btn-prox:hover{background:var(--ace-secondary)}
/* MAPA */
.mapa-filtros{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mapa-filtros button{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;cursor:pointer}
.mapa-filtros button.ativo{background:var(--ace-primary);color:#fff;border-color:var(--ace-primary)}
.mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mapa-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--ace-primary);cursor:pointer;transition:transform .15s}
.mapa-card:hover{transform:translateY(-2px)}
.mapa-card .mc-disc{font-size:.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.mapa-card .mc-nome{font-size:.82rem;font-weight:600;margin-bottom:4px}
.mapa-card .mc-freq{font-size:.65rem}
/* QUIZ */
.quiz-ctrl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.quiz-ctrl select{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.82rem}
.quiz-ctrl button{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.quiz-ctrl button:hover{background:var(--ace-secondary)}
.quiz-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.quiz-info{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quiz-badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
.qbadge-disc{background:#dcfce7;color:#15803d}
.qbadge-num{background:#f0fdf4;color:#166534;border:1px solid var(--border)}
[data-dark] .qbadge-disc{background:#052e16;color:#86efac}
[data-dark] .qbadge-num{background:#052e16;color:#86efac}
.qbadge-tema{background:#1b766c;color:#fff}
[data-dark] .qbadge-tema{background:#0f4a44;color:#5eead4}
.quiz-video{margin-top:14px}
.qvid-iframe{width:100%;height:315px;border:none;display:block;border-radius:12px;margin-top:10px}
.quiz-pergunta{font-size:.95rem;font-weight:600;line-height:1.6;margin-bottom:16px}
.quiz-ops{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.quiz-op{padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.84rem;text-align:left;transition:background .15s,border-color .15s;display:flex;align-items:flex-start;gap:8px}
.quiz-op:hover:not(:disabled){background:#dcfce7;border-color:var(--ace-primary)}
.quiz-op.correta{background:#dcfce7;border-color:#15803d;font-weight:600}
.quiz-op.errada{background:#fee2e2;border-color:#dc2626}
.quiz-explicacao{background:#f0fdf4;border-left:4px solid var(--ace-primary);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.82rem;line-height:1.6;margin-bottom:14px;display:none}
[data-dark] .quiz-explicacao{background:#052e16}
.quiz-explicacao.show{display:block}
.quiz-nav{display:flex;gap:8px;flex-wrap:wrap}
.quiz-nav button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.82rem;font-weight:600}
.btn-prox-q{background:var(--ace-primary);color:#fff}
.btn-prox-q:hover{background:var(--ace-secondary)}
.quiz-placar{text-align:center;padding:24px;display:none}
.quiz-placar.show{display:block}
.placar-num{font-size:3rem;font-weight:800;color:var(--ace-primary)}
.placar-label{color:var(--muted);font-size:.88rem;margin-bottom:16px}
/* SIMULADOS */
.exames-lista{display:grid;gap:10px}
.exame-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.exame-info h3{font-size:.9rem;font-weight:700;margin-bottom:4px}
.exame-info p{font-size:.75rem;color:var(--muted)}
.btn-iniciar{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.btn-iniciar:hover{background:var(--ace-secondary)}
.exame-ativo{display:none}
.exame-ativo.show{display:block}
.ex-header{background:var(--ace-primary);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.ex-header h2{font-size:.95rem;font-weight:700}
.ex-header p{font-size:.75rem;color:#bbf7d0;margin-top:3px}
.ex-secao-label{font-size:.78rem;font-weight:700;color:var(--ace-primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ex-pergunta{font-size:.9rem;font-weight:600;line-height:1.6;margin-bottom:14px}
.ex-ops{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.ex-op{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.82rem;text-align:left;transition:all .15s;display:flex;gap:8px;align-items:flex-start}
.ex-op:hover:not(:disabled){background:#dcfce7;border-color:var(--ace-primary)}
.ex-op.selecionada{background:#dcfce7;border-color:var(--ace-primary);font-weight:600}
.ex-op.correta{background:#dcfce7;border-color:#15803d}
.ex-op.errada{background:#fee2e2;border-color:#dc2626}
.ex-explicacao{background:#f0fdf4;border-left:4px solid var(--ace-primary);padding:12px;border-radius:0 8px 8px 0;font-size:.8rem;line-height:1.6;margin-bottom:12px;display:none}
[data-dark] .ex-explicacao{background:#052e16}
.ex-explicacao.show{display:block}
.ex-nav{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.ex-nav button{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600}
.audio-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:.82rem;color:var(--ace-primary);flex-shrink:0;transition:background .15s}
.audio-btn:hover{background:var(--border)}
.audio-btn-op{background:none;border:none;cursor:pointer;font-size:.78rem;padding:0 2px;opacity:.5;flex-shrink:0;transition:opacity .15s}
.audio-btn-op:hover{opacity:1}
.btn-ex-prox{background:var(--ace-primary);color:#fff}
.btn-ex-prox:hover{background:var(--ace-secondary)}
.btn-ex-voltar{background:var(--border);color:var(--text)}
.ex-resultado{display:none;text-align:center;padding:28px}
.ex-resultado.show{display:block}
.ex-res-num{font-size:3.5rem;font-weight:800;color:var(--ace-primary)}
.ex-res-label{color:var(--muted);font-size:.9rem;margin-bottom:20px}
/* RELATÓRIO */
.relatorio-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.relatorio-box h3{font-size:.9rem;font-weight:700;margin-bottom:14px;color:var(--ace-primary)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-num{font-size:1.8rem;font-weight:800;color:var(--ace-primary)}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:2px}
.btn-exportar{padding:10px 20px;border-radius:8px;border:none;background:var(--ciano);color:#fff;font-weight:600;cursor:pointer;font-size:.84rem}
.btn-exportar:hover{opacity:.88}
.btn-limpar{padding:10px 20px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-weight:600;cursor:pointer;font-size:.84rem;margin-left:8px}
/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;max-width:280px}
#toast.show{opacity:1}
/* DARK */
[data-dark] .disc-topicos,.disc-topicos{background:var(--card)}
[data-dark] .quiz-op,[data-dark] .ex-op{background:var(--bg);color:var(--text)}
[data-dark] .freq-alto{background:#2a0808;color:#fca5a5}
[data-dark] .freq-medio{background:#2a1a00;color:#fcd34d}
[data-dark] .freq-baixo{background:#052e16;color:#86efac}
/* RESPONSIVE */
@media(max-width:600px){
  .flash-frente .termo{font-size:1.1rem}
  .hdr-titles h1{font-size:.95rem}
  .tab{padding:10px 12px;font-size:.76rem}
}
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <span class="badge">ACE</span>
    <div class="hdr-titles">
      <h1>Agente de Combate às Endemias</h1>
      <p>Língua Portuguesa · Matemática · Conhecimentos Específicos</p>
    </div>
    <div class="hdr-actions">
      <div class="speed-group">
        <button class="speed-btn ativo" onclick="setSpeed(1,this)">1×</button>
        <button class="speed-btn" onclick="setSpeed(1.5,this)">1.5×</button>
        <button class="speed-btn" onclick="setSpeed(2,this)">2×</button>
      </div>
      <button class="hdr-btn" onclick="toggleDark()">🌙</button>
      <button class="hdr-btn" onclick="falarCard()">🔊</button>
    </div>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab ativo" onclick="mudarTab('resumo',this)">📚 Resumo</div>
    <div class="tab" onclick="mudarTab('flash',this)">🃏 Flashcards</div>
    <div class="tab" onclick="mudarTab('mapa',this)">🗺️ Mapa</div>
    <div class="tab" onclick="mudarTab('quiz',this)">❓ Quiz</div>
    <div class="tab" onclick="mudarTab('simulados',this)">📝 Simulados</div>
    <div class="tab" onclick="mudarTab('relatorio',this)">📊 Relatório</div>
  </div>
</div>

<div class="content">

  <!-- RESUMO -->
  <div id="sec-resumo" class="secao ativa"></div>

  <!-- FLASHCARDS -->
  <div id="sec-flash" class="secao">
    <div class="flash-ctrl">
      <select id="flash-filtro" onchange="filtrarFlash()">
        <option value="todos">Todas as disciplinas</option>
      </select>
      <button onclick="shuffleFlash()">🔀 Embaralhar</button>
      <span class="flash-prog" id="flash-prog"></span>
    </div>
    <div class="flash-box" style="width:100%">
      <div class="flash-inner" id="flash-inner" onclick="virarCard()">
        <div class="flash-frente" id="flash-frente">
          <div class="label">TERMO</div>
          <div class="termo" id="flash-termo"></div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:16px">Clique para ver a definição</div>
        </div>
        <div class="flash-verso" id="flash-verso">
          <div class="label">DEFINIÇÃO</div>
          <div class="def" id="flash-def"></div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn-ant" onclick="navFlash(-1)">← Anterior</button>
      <button class="btn-prox" onclick="navFlash(1)">Próximo →</button>
    </div>
  </div>

  <!-- MAPA -->
  <div id="sec-mapa" class="secao">
    <div class="mapa-filtros" id="mapa-filtros"></div>
    <div class="mapa-grid" id="mapa-grid"></div>
  </div>

  <!-- QUIZ -->
  <div id="sec-quiz" class="secao">
    <div class="quiz-ctrl">
      <select id="quiz-filtro">
        <option value="todos">Todas as disciplinas</option>
        <option value="Português">Língua Portuguesa</option>
        <option value="Matemática">Matemática</option>
        <option value="SUS">Saúde Pública / SUS</option>
        <option value="Visitas">Visitas e Fiscalização</option>
        <option value="Endemias">Endemias e Doenças</option>
        <option value="Informática">Conhecimentos em Informática</option>
      </select>
      <button onclick="iniciarQuiz()">▶ Iniciar Quiz</button>
    </div>
    <div class="quiz-box" id="quiz-box" style="display:none">
      <div class="quiz-info">
        <span class="quiz-badge qbadge-disc" id="q-disc"></span>
        <span class="quiz-badge qbadge-tema" id="q-tema"></span>
        <span class="quiz-badge qbadge-num" id="q-num"></span>
      </div>
      <div class="quiz-pergunta" id="q-pergunta"></div>
      <div class="quiz-video" id="q-video-wrap" style="display:none"></div>
      <div class="quiz-ops" id="q-ops"></div>
      <div class="quiz-explicacao" id="q-exp"></div>
      <div class="quiz-nav">
        <button class="btn-prox-q" id="btn-prox-q" onclick="proximaQuestao()" style="display:none">Próxima →</button>
      </div>
    </div>
    <div class="quiz-placar" id="quiz-placar">
      <div class="placar-num" id="placar-num"></div>
      <div class="placar-label" id="placar-label"></div>
      <button onclick="iniciarQuiz()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.85rem">Novo Quiz</button>
    </div>
  </div>

  <!-- SIMULADOS -->
  <div id="sec-simulados" class="secao">
    <div id="exames-lista" class="exames-lista"></div>
    <div id="exame-ativo" class="exame-ativo">
      <div class="ex-header">
        <h2 id="ex-titulo"></h2>
        <p id="ex-info"></p>
      </div>
      <div id="ex-corpo">
        <div class="ex-secao-label" id="ex-sec-label"></div>
        <div class="ex-pergunta" id="ex-pergunta"></div>
        <div class="ex-ops" id="ex-ops"></div>
        <div class="ex-explicacao" id="ex-exp"></div>
        <div class="ex-nav">
          <button class="btn-ex-voltar" onclick="voltarExames()">← Sair</button>
          <button class="btn-ex-prox" id="btn-ex-prox" onclick="avancarExame()">Próxima →</button>
        </div>
      </div>
      <div class="ex-resultado" id="ex-resultado">
        <div class="ex-res-num" id="ex-res-num"></div>
        <div class="ex-res-label" id="ex-res-label"></div>
        <button onclick="voltarExames()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer">Voltar</button>
      </div>
    </div>
  </div>

  <!-- RELATÓRIO -->
  <div id="sec-relatorio" class="secao">
    <div class="relatorio-box">
      <h3>📊 Estatísticas Gerais</h3>
      <div class="stats-grid" id="stats-grid"></div>
      <button class="btn-exportar" onclick="exportarTXT()">⬇ Exportar TXT</button>
      <button class="btn-limpar" onclick="limparDados()">🗑 Limpar Dados</button>
    </div>
    <div class="relatorio-box" id="horario-box"></div>
  </div>

</div>

<div id="toast"></div>

<script>
// ===================== DADOS =====================

const disciplinas = [
  {
    nome:"📖 Língua Portuguesa",
    cor:"linear-gradient(135deg,#15803d,#16a34a)",
    topicos:[
      {t:"Interpretação de Texto",d:"Leitura e compreensão de textos variados. Identificar tema, ideia central, inferências e recursos argumentativos do autor.",freq:"alto"},
      {t:"Ortografia e Acentuação",d:"Uso do acento agudo, circunflexo e til. Regras do novo acordo ortográfico (2009). Uso correto de maiúsculas e hifens.",freq:"alto"},
      {t:"Classes de Palavras",d:"Substantivo, adjetivo, verbo, advérbio, preposição, conjunção, interjeição, numeral e artigo. Funções e flexões de cada classe.",freq:"medio"},

        {n:1,q:"Durante uma visita domiciliar, o ACE encontra um pneu com água no quintal. Qual é a conduta correta?",ops:["Registrar e seguir para o próximo imóvel","Eliminar o criadouro (esvaziar/virar o pneu) e orientar o morador","Multar o morador","Acionar a vigilância sanitária"],g:1,exp:"O ACE deve eliminar o criadouro no ato da visita (esvaziar, tampar, descartar) e educar o morador sobre prevenção."},
        {n:2,q:"O LIRAa (Levantamento de Índice Rápido para Aedes aegypti) é realizado com qual periodicidade?",ops:["Mensal","Anual","Quadrimestral (3 vezes ao ano)","Semanal"],g:2,exp:"O LIRAa é realizado 3 vezes ao ano (quadrimestral), nos meses de fevereiro, maio/junho e outubro."},
        {n:3,q:"Qual tipo de recipiente é considerado o principal criadouro do Aedes aegypti no Brasil?",ops:["Calhas entupidas","Caixas d'água sem tampa","Pneus","Vasos de plantas"],g:1,exp:"Caixas d'água sem tampa são o principal criadouro por armazenar grande volume de água limpa e parada — condição ideal para o Aedes."},
        {n:4,q:"Quando o morador recusa a entrada do ACE em seu imóvel, o agente deve:",ops:["Forçar a entrada","Registrar a recusa no boletim e comunicar o supervisor","Abandonar a visita sem registro","Chamar a polícia"],g:1,exp:"O ACE deve registrar a recusa no BAC, informar ao supervisor e, se necessário, buscar apoio jurídico para acesso ao imóvel."},
        {n:5,q:"O que é um imóvel 'B' na classificação do LIRAa?",ops:["Imóvel vistoriado sem foco","Imóvel com foco de Aedes","Imóvel fechado","Imóvel demolido"],g:1,exp:"Na classificação do LIRAa: A = visitado sem foco, B = visitado com foco, F = fechado, R = recusa, T = terreno baldio."},
      ]},
      {nome:'Endemias Avançado (Q6–Q10)',qs:[
        {n:6,q:"Qual é o reservatório animal mais importante da leishmaniose visceral no ambiente urbano?",ops:["Rato","Gato","Cão doméstico","Gambá"],g:2,exp:"O cão doméstico é o principal reservatório urbano de Leishmania chagasi, sendo fundamental seu controle para prevenir a doença humana."},
        {n:7,q:"A síndrome de Weil, forma grave da leptospirose, é caracterizada por:",ops:["Artralgia e rash cutâneo","Icterícia, insuficiência renal e hemorragia","Febre periódica e anemia","Edema e hipertensão"],g:1,exp:"Síndrome de Weil: tríade de icterícia intensa, insuficiência renal aguda e fenômenos hemorrágicos. Alta letalidade se não tratada."},
        {n:8,q:"Na doença de Chagas, a cardiopatia é a manifestação mais frequente da fase:",ops:["Aguda","Indeterminada","Crônica","Pré-patente"],g:2,exp:"Na fase crônica, a cardiomiopatia chagásica (arritmias, insuficiência cardíaca) é a complicação mais grave e comum."},
        {n:9,q:"Qual a principal diferença entre dengue clássica e dengue grave?",ops:["A grave tem mais febre","A grave apresenta extravasamento de plasma e choque","A clássica tem erupção cutânea","A grave dura menos tempo"],g:1,exp:"A dengue grave ocorre na fase crítica com extravasamento plasmático, levando a hemoconcentração, derrame e choque hipovolêmico."},
        {n:10,q:"O Plasmodium vivax se diferencia do P. falciparum porque:",ops:["É mais letal","Pode causar recaídas (hipnozoítas no fígado)","Não tem tratamento","Transmite-se pelo Aedes"],g:1,exp:"P. vivax forma hipnozoítas (formas dormente no fígado), causando recaídas semanas ou meses após o tratamento. Por isso usa-se primaquina."},
      ]},
    ]
  },
  {
    id:'sim4',titulo:'Simulado 4 – Língua Portuguesa e Endemias',banca:'Ação Bahia',ano:2025,
    edital:'ACE Municipal – Bahia',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q5)',qs:[
        {n:1,q:"Assinale a alternativa em que a palavra destacada é um SUBSTANTIVO COLETIVO:",ops:["Bando de pássaros","Vários pássaros","Pássaro cantor","Pássaro raro"],g:0,exp:"'Bando' é o substantivo coletivo de pássaros, indicando um conjunto deles com um único termo."},
        {n:2,q:"Na frase 'Espero que todos compareçam à reunião', o verbo destacado está no modo:",ops:["Indicativo","Subjuntivo","Imperativo","Infinitivo"],g:1,exp:"'Compareçam' está no presente do subjuntivo, usado em orações subordinadas após verbos de desejo ou esperança."},
        {n:3,q:"Qual alternativa apresenta uma ORAÇÃO SUBORDINADA ADVERBIAL CAUSAL?",ops:["Ele saiu porque estava doente.","Ele saiu para descansar.","Ele saiu quando terminou.","Ele saiu embora estivesse cansado."],g:0,exp:"Oração causal indica a causa do fato. 'Porque estava doente' explica o motivo da saída. Conjunção causal: porque, pois, já que."},
        {n:4,q:"'Os agentes de saúde trabalharam arduamente.' O advérbio modifica:",ops:["O substantivo agentes","O adjetivo saúde","O verbo trabalharam","O artigo Os"],g:2,exp:"Advérbios modificam verbos, adjetivos ou outros advérbios. 'Arduamente' modifica o verbo 'trabalharam', indicando modo."},
        {n:5,q:"Em qual alternativa há erro de REGÊNCIA VERBAL?",ops:["Preciso de ajuda.","Aspirei ao cargo.","Assisti ao filme.","Obedeci o regulamento."],g:3,exp:"'Obedecer' é verbo transitivo indireto: exige preposição 'a'. O correto é 'obedeci ao regulamento'."},
      ]},
      {nome:'Endemias (Q6–Q10)',qs:[
        {n:6,q:"O Aedes aegypti se desenvolve preferencialmente em água:",ops:["Salgada e quente","Limpa e parada","Corrente e fria","Turva e quente"],g:1,exp:"O Aedes aegypti deposita seus ovos em água limpa e parada, como a encontrada em caixas d'água, pneus e vasos de planta."},
        {n:7,q:"Qual é o nome do exame laboratorial utilizado para confirmar dengue nos primeiros 5 dias de sintomas?",ops:["Sorologia IgM","NS1 (antígeno não estrutural)","PCR de fezes","Hemocultura"],g:1,exp:"O antígeno NS1 é detectável nos primeiros dias de infecção (fase aguda). A sorologia IgM só aparece após o 5.º dia."},
        {n:8,q:"A chikungunya se diferencia da dengue principalmente pela:",ops:["Ausência de febre","Artralgia intensa e prolongada","Presença de manchas hemorrágicas","Maior taxa de mortalidade"],g:1,exp:"A artralgia (dor articular) intensa e que pode persistir por meses é a marca registrada da chikungunya, diferenciando-a da dengue."},
        {n:9,q:"Na leishmaniose tegumentar, a lesão mais característica é:",ops:["Vesículas na pele","Úlcera com bordas elevadas (aspecto vulcânico)","Manchas avermelhadas sem ulceração","Nódulos subcutâneos"],g:1,exp:"A úlcera leishmaniótica tem bordas bem delimitadas e elevadas (aspecto de cratera de vulcão), geralmente indolor."},
        {n:10,q:"Qual medida é indicada para controle do barbeiro transmissor da doença de Chagas?",ops:["Aplicação de larvicida na água","Borrifação de inseticida nas residências","Uso de repelente corporal","Drenagem de charcos"],g:1,exp:"O controle do barbeiro (Triatoma) é feito pela borrifação de inseticidas residuais no interior e exterior das habitações, especialmente rurais."},
      ]},
    ]
  },
  {
    id:'sim5',titulo:'Simulado 5 – Matemática e Saúde Pública',banca:'Ação Bahia',ano:2025,
    edital:'ACE Municipal – Bahia',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Matemática (Q1–Q5)',qs:[
        {n:1,q:"Um ACE percorre 240 imóveis em 6 dias. Quantos imóveis percorrerá em 10 dias, mantendo o mesmo ritmo?",ops:["360","400","420","480"],g:1,exp:"240 ÷ 6 = 40 imóveis/dia. 40 × 10 = 400 imóveis."},
        {n:2,q:"Numa sala, 30% dos alunos foram aprovados. Se a sala tem 40 alunos, quantos foram aprovados?",ops:["10","12","14","15"],g:1,exp:"30% de 40 = 40 × 0,30 = 12 alunos aprovados."},
        {n:3,q:"Qual é o valor de 2³ × 3²?",ops:["36","48","72","96"],g:2,exp:"2³ = 8 e 3² = 9. 8 × 9 = 72."},
        {n:4,q:"Uma caixa d'água tem capacidade de 500 L. Já está com 3/5 do volume. Quantos litros faltam para encher?",ops:["150 L","200 L","250 L","300 L"],g:1,exp:"3/5 de 500 = 300 L (cheio). Faltam 500 – 300 = 200 L."},
        {n:5,q:"Se a taxa de incidência de dengue numa cidade foi de 150 casos por 100.000 habitantes e a população é 200.000, quantos casos ocorreram?",ops:["150","250","300","350"],g:2,exp:"150/100.000 × 200.000 = 300 casos."},
      ]},
      {nome:'Saúde Pública (Q6–Q10)',qs:[
        {n:6,q:"Qual é a principal diferença entre incidência e prevalência?",ops:["Incidência mede casos antigos; prevalência mede casos novos","Incidência mede casos novos num período; prevalência mede total de casos existentes","São sinônimos na epidemiologia","Incidência aplica-se só a doenças crônicas"],g:1,exp:"Incidência: número de casos NOVOS num período. Prevalência: total de casos existentes (novos + antigos) num momento."},
        {n:7,q:"O controle vetorial é classificado como qual nível de prevenção?",ops:["Prevenção primária","Prevenção secundária","Prevenção terciária","Reabilitação"],g:0,exp:"Prevenção primária age antes da doença se instalar, eliminando o risco. O controle vetorial evita a transmissão."},
        {n:8,q:"A descentralização no SUS significa que:",ops:["O Ministério da Saúde concentra todas as decisões","Municípios e estados assumem responsabilidades na gestão da saúde","Apenas hospitais privados prestam serviços","Os usuários pagam pelos serviços"],g:1,exp:"Descentralização: redistribuição de poder e responsabilidades para estados e municípios, aproximando a gestão da realidade local."},
        {n:9,q:"O que é a 'Cadeia Epidemiológica'?",ops:["Lista de vacinas disponíveis no SUS","Sequência agente etiológico → mecanismo de transmissão → hospedeiro suscetível","Conjunto de hospitais de referência","Protocolo de atendimento de urgência"],g:1,exp:"A cadeia epidemiológica descreve o processo de transmissão: agente causador, fonte de infecção, via de transmissão e hospedeiro suscetível."},
        {n:10,q:"Qual documento estabelece os princípios do SUS na Constituição Federal?",ops:["Lei 8.142/1990","Decreto 7.508/2011","Constituição Federal de 1988, Art. 196–200","Lei 9.961/2000"],g:2,exp:"Os artigos 196 a 200 da CF/1988 estabelecem a saúde como direito de todos e dever do Estado, fundando o SUS."},
      ]},
    ]
  },
  {
    id:'sim6',titulo:'Simulado 6 – Completo ACE',banca:'Ação Bahia',ano:2025,
    edital:'ACE Municipal – Bahia',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q4)',qs:[
        {n:1,q:"'O agente realizou as visitas conforme o planejado.' A palavra 'conforme' exerce a função de:",ops:["Preposição","Conjunção conformativa","Advérbio de modo","Pronome relativo"],g:1,exp:"'Conforme' introduz oração subordinada adverbial conformativa, indicando que a ação foi feita de acordo com algo."},
        {n:2,q:"Qual alternativa está correta quanto ao uso do hífen?",ops:["Anti-inflamatório","Antiinflamatório","Anti inflamatório","Antiinflamatorio"],g:0,exp:"Usa-se hífen quando o segundo elemento começa com vogal igual à última do prefixo (anti + inflamatório = anti-inflamatório)."},
        {n:3,q:"'Ninguém fez nada.' Esta frase apresenta:",ops:["Pleonasmo vicioso","Dupla negação enfática (correta em português)","Erro de concordância","Ambiguidade"],g:1,exp:"Em português, a dupla negação (ninguém... nada) é recurso enfático correto, diferente do inglês onde seria erro."},
        {n:4,q:"O sujeito da oração 'Chove muito no inverno baiano' é:",ops:["muito","inverno baiano","Chove","Sujeito inexistente (oração impessoal)"],g:3,exp:"Verbos meteorológicos (chover, nevar, trovejar) são impessoais — não têm sujeito."},
      ]},
      {nome:'Matemática (Q5–Q7)',qs:[
        {n:5,q:"Qual é o MDC de 36 e 48?",ops:["6","12","18","24"],g:1,exp:"Fatores de 36: 1,2,3,4,6,9,12,18,36. Fatores de 48: 1,2,3,4,6,8,12,16,24,48. MDC = 12."},
        {n:6,q:"Uma solução larvicida cobre 500 m². Quantas aplicações são necessárias para cobrir 3.500 m²?",ops:["5","6","7","8"],g:2,exp:"3.500 ÷ 500 = 7 aplicações."},
        {n:7,q:"Em um ciclo de 60 dias, um ACE visitou 420 imóveis. Qual a média diária?",ops:["6","7","8","9"],g:1,exp:"420 ÷ 60 = 7 imóveis por dia."},
      ]},
      {nome:'Endemias e SUS (Q8–Q10)',qs:[
        {n:8,q:"A forma de transmissão da leptospirose mais comum em surtos urbanos é:",ops:["Picada de inseto","Contato com água/lama contaminada pela urina de roedores","Transfusão de sangue","Contato com saliva de animais"],g:1,exp:"Em enchentes urbanas, o solo e a água ficam contaminados pela urina de ratos, e o contato com mucosas ou pele com ferimentos permite a infecção."},
        {n:9,q:"Qual é o papel do ACE na vigilância entomológica?",ops:["Realizar diagnóstico clínico de doenças","Monitorar e controlar a densidade de vetores como o Aedes aegypti","Prescrever medicamentos para pacientes","Realizar exames laboratoriais"],g:1,exp:"O ACE atua na vigilância entomológica monitorando índices vetoriais, identificando criadouros e aplicando medidas de controle."},
        {n:10,q:"O princípio da INTEGRALIDADE no SUS significa:",ops:["Atender somente casos urgentes","Oferecer atenção completa ao indivíduo, da prevenção à reabilitação","Integrar serviços públicos e privados","Garantir atendimento apenas em hospitais"],g:1,exp:"Integralidade: o cuidado deve abranger todas as necessidades do indivíduo — promoção, prevenção, tratamento e reabilitação — de forma contínua."},
      ]},
    ]
  },
  {
    id:'sim7',titulo:'Simulado 7 – Conhecimentos em Informática',banca:'VUNESP',ano:2025,
    edital:'ACE Municipal',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Informática – MS-Windows e MS-Word (Q1–Q5)',qs:[
        {n:1,q:"No MS-Windows, a 'área de transferência' é usada para:",ops:["Armazenar arquivos permanentemente","Guardar temporariamente itens copiados ou recortados para serem colados","Conectar à internet","Gerenciar impressoras"],g:1,exp:"A área de transferência (clipboard) guarda temporariamente o que foi copiado (Ctrl+C) ou recortado (Ctrl+X) para ser colado (Ctrl+V)."},
        {n:2,q:"No MS-Windows, qual atalho de teclado desfaz a última ação realizada?",ops:["Ctrl+C","Ctrl+Z","Ctrl+V","Ctrl+X"],g:1,exp:"Ctrl+Z desfaz a última ação na maioria dos programas. Ctrl+Y refaz o que foi desfeito."},
        {n:3,q:"No MS-Windows, 'atalho' (shortcut) em uma pasta é:",ops:["Uma cópia completa do arquivo","Um arquivo compactado","Um ponteiro/link que aponta para o arquivo ou pasta original","Uma pasta protegida por senha"],g:2,exp:"Um atalho é um arquivo .lnk que aponta para o objeto original. Deletar o atalho não afeta o arquivo original."},
        {n:4,q:"No MS-Word, qual recurso gera automaticamente o sumário com base nos estilos de título?",ops:["Inserir > Tabela","Referências > Sumário","Revisão > Ortografia","Layout > Colunas"],g:1,exp:"Em Referências > Sumário, o Word gera automaticamente o índice baseado nos estilos Título 1, Título 2 etc."},
        {n:5,q:"No MS-Word, o recurso 'Localizar e Substituir' (Ctrl+H) serve para:",ops:["Salvar em outro formato","Encontrar e trocar palavras ou trechos no documento","Verificar a ortografia","Inserir comentários"],g:1,exp:"Ctrl+H abre 'Localizar e Substituir', permitindo encontrar uma palavra/frase e substituí-la por outra automaticamente em todo o documento."},
      ]},
      {nome:'Informática – MS-Excel, PowerPoint e Internet (Q6–Q10)',qs:[
        {n:6,q:"No MS-Excel, a fórmula =SOMA(A1:A5) soma:",ops:["Apenas A1 e A5","Todas as células de A1 até A5","Apenas 5 células aleatórias","Células de A até E na linha 1"],g:1,exp:"O intervalo A1:A5 inclui todas as células de A1 até A5, ou seja, A1, A2, A3, A4 e A5."},
        {n:7,q:"No MS-Excel, qual função retorna o maior valor de um intervalo?",ops:["=SOMA()","=MÉDIA()","=MÁXIMO()","=CONT.SE()"],g:2,exp:"=MÁXIMO() retorna o maior valor numérico do intervalo. =MÍNIMO() retorna o menor. =MÉDIA() calcula a média aritmética."},
        {n:8,q:"No MS-Excel, a função =SE() serve para:",ops:["Somar células de um intervalo","Executar um teste lógico e retornar valores diferentes conforme o resultado","Contar células com texto","Calcular a média"],g:1,exp:"=SE(teste_lógico; valor_se_verdadeiro; valor_se_falso) avalia uma condição e retorna um de dois resultados possíveis."},
        {n:9,q:"No MS-PowerPoint, qual recurso define o efeito visual ao mudar de um slide para o próximo?",ops:["Animação","Transição","Design","Layout"],g:1,exp:"Transição define o efeito visual de mudança entre slides. Animação aplica efeitos a objetos dentro de um mesmo slide."},
        {n:10,q:"O protocolo utilizado para envio de e-mails entre servidores é:",ops:["HTTP","FTP","SMTP","DNS"],g:2,exp:"SMTP (Simple Mail Transfer Protocol) é o protocolo padrão para envio de e-mails. POP3 e IMAP são usados para recebimento/acesso."},
      ]},
      {nome:'Informática – Avançado (Q11–Q20)',qs:[
        {n:11,q:"No MS-Windows, a extensão de arquivo '.docx' está associada a qual programa?",ops:["MS-Excel","MS-PowerPoint","MS-Word","MS-Paint"],g:2,exp:".docx é o formato padrão do MS-Word a partir da versão 2007. .xlsx é do Excel, .pptx é do PowerPoint."},
        {n:12,q:"No MS-Windows, o Gerenciador de Tarefas (Ctrl+Alt+Del) permite:",ops:["Instalar novos programas","Monitorar e encerrar processos em execução","Formatar o disco rígido","Configurar a impressora"],g:1,exp:"O Gerenciador de Tarefas monitora uso de CPU, memória e rede, além de permitir encerrar processos travados ou com alto consumo de recursos."},
        {n:13,q:"No MS-Word, 'mala direta' é usada para:",ops:["Enviar e-mails em massa","Criar documentos personalizados com dados variáveis (nome, endereço etc.)","Formatar automaticamente parágrafos","Inserir tabelas dinamicamente"],g:1,exp:"Mala direta combina um documento-modelo com uma fonte de dados (planilha) para gerar cópias personalizadas em série — útil para cartas, etiquetas e comunicados."},
        {n:14,q:"No MS-Word, o recurso 'controle de alterações' serve para:",ops:["Desfazer todas as alterações de uma vez","Rastrear e revisar modificações feitas no documento por diferentes autores","Bloquear a edição do arquivo","Salvar automaticamente a cada minuto"],g:1,exp:"Controle de Alterações (Revisão > Controlar Alterações) registra cada modificação com autor, data e tipo de mudança — essencial para revisão colaborativa."},
        {n:15,q:"No MS-Excel, qual função conta o número de células que atendem a uma condição?",ops:["=SOMA()","=MÉDIA()","=CONT.SE()","=MÁXIMO()"],g:2,exp:"=CONT.SE(intervalo; critério) conta quantas células de um intervalo atendem ao critério especificado. Ex: =CONT.SE(A1:A10;\">5\") conta células maiores que 5."},
        {n:16,q:"No MS-Excel, o operador '&' (e comercial) em fórmulas serve para:",ops:["Multiplicação","Concatenar (unir) textos","Divisão","Comparação lógica"],g:1,exp:"O operador & concatena textos no Excel. Exemplo: =A1&\" \"&B1 une o conteúdo de A1, um espaço e B1 em uma única célula."},
        {n:17,q:"No MS-PowerPoint, o 'Painel de Anotações' serve para:",ops:["Exibir o slide em tela cheia","Adicionar lembretes e notas visíveis ao apresentador durante a apresentação","Inserir imagens no slide","Configurar a transição entre slides"],g:1,exp:"O Painel de Anotações (abaixo do slide) permite ao apresentador adicionar notas de apoio, visíveis apenas para ele durante a apresentação."},
        {n:18,q:"Na internet, o protocolo HTTPS difere do HTTP porque:",ops:["É mais lento","Adiciona criptografia SSL/TLS à transmissão de dados","Funciona apenas em redes privadas","Permite apenas e-mails"],g:1,exp:"HTTPS usa criptografia SSL/TLS para proteger os dados transmitidos entre o navegador e o servidor, essencial em logins, transações e dados pessoais."},
        {n:19,q:"Uma URL (Uniform Resource Locator) é:",ops:["Um tipo de vírus","O endereço que identifica e localiza um recurso na internet","Um protocolo de e-mail","Um formato de arquivo de imagem"],g:1,exp:"A URL identifica e localiza um recurso na internet (página, arquivo, imagem), especificando o protocolo (https://), domínio e caminho do recurso."},
        {n:20,q:"Ao 'anexar' um arquivo em um e-mail, o usuário está:",ops:["Copiando o e-mail para outra pasta","Incluindo um arquivo para ser enviado junto com a mensagem","Encaminhando o e-mail para outro destinatário","Salvando o e-mail como rascunho"],g:1,exp:"Anexar (attach) significa incluir um arquivo (documento, imagem, planilha) junto à mensagem de e-mail para que o destinatário possa visualizá-lo ou baixá-lo."},
      ]},
    ]
  },
  {
    id:'sim8',titulo:'Simulado 8 – Endemias e Doenças (Completo)',banca:'IBFC',ano:2025,
    edital:'ACE Municipal',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Dengue (Q1–Q10)',qs:[
        {n:1,q:"Qual é o principal vetor transmissor da dengue no Brasil?",ops:["Anopheles darlingi","Aedes aegypti","Culex quinquefasciatus","Lutzomyia longipalpis"],g:1,exp:"O Aedes aegypti é o principal vetor da dengue no Brasil. Também transmite Zika e Chikungunya. Prefere ambientes urbanos e criadouros com água limpa e parada."},
        {n:2,q:"Quais são os sintomas clássicos da dengue?",ops:["Tosse, coriza e febre baixa","Febre alta súbita, dor muscular intensa, dor retro-orbital e exantema","Diarreia, vômito e icterícia","Artralgia prolongada e rash cutâneo apenas"],g:1,exp:"A dengue clássica apresenta febre alta súbita (38–40°C), cefaleia, dor retro-orbital, mialgia, artralgia e exantema. Pode evoluir para formas graves."},
        {n:3,q:"Segundo a classificação do Ministério da Saúde, a dengue é dividida em:",ops:["Leve, moderada e grave","Dengue, dengue com sinais de alarme e dengue grave","Fase febril, crítica e de recuperação apenas","Tipo 1, 2, 3 e 4"],g:1,exp:"A classificação vigente divide a dengue em: dengue (sem sinais de alarme), dengue com sinais de alarme e dengue grave — baseada no risco de evolução clínica."},
        {n:4,q:"Qual é o sinal de alarme mais importante que indica risco de evolução para dengue grave?",ops:["Febre acima de 38°C","Dor abdominal intensa e contínua","Tosse seca persistente","Manchas avermelhadas na pele"],g:1,exp:"Dor abdominal intensa e contínua é um dos principais sinais de alarme da dengue, indicando extravasamento de plasma e risco de choque — requer hospitalização imediata."},
        {n:5,q:"A dengue grave é caracterizada por:",ops:["Febre alta por mais de 7 dias","Extravasamento grave de plasma, sangramento grave ou comprometimento grave de órgãos","Artralgia mais intensa que a dengue clássica","Ausência de febre com rash cutâneo"],g:1,exp:"A dengue grave ocorre quando há: extravasamento de plasma com choque, acúmulo de fluidos com dificuldade respiratória, sangramento grave ou comprometimento de órgãos."},
        {n:6,q:"O tratamento específico para a dengue é:",ops:["Antibióticos de largo espectro","Antivirais específicos como oseltamivir","Sintomático: hidratação oral/venosa, analgésicos e antipirética (evitar AAS)","Corticoides em todos os casos"],g:2,exp:"Não há antiviral específico para dengue. O tratamento é sintomático: hidratação adequada, paracetamol para febre e dor. Ácido acetilsalicílico (AAS) e anti-inflamatórios são contraindicados pelo risco de sangramento."},
        {n:7,q:"O período de incubação da dengue no ser humano, após a picada do mosquito infectado, é de:",ops:["1 a 2 dias","4 a 10 dias","15 a 20 dias","30 dias ou mais"],g:1,exp:"O período de incubação da dengue no ser humano é de 4 a 10 dias após a picada do Aedes aegypti infectado. No mosquito, o vírus leva 8 a 12 dias para se tornar infectante."},
        {n:8,q:"Qual exame laboratorial confirma a dengue nos primeiros 5 dias de sintomas?",ops:["Sorologia IgM","Antígeno NS1","Hemocultura","PCR de fezes"],g:1,exp:"O antígeno NS1 (proteína não estrutural 1) é detectável nos primeiros dias de infecção (fase aguda). A sorologia IgM/IgG só é detectável a partir do 5º dia."},
        {n:9,q:"O Aedes aegypti se desenvolve preferencialmente em água:",ops:["Salgada e quente","Limpa e parada em recipientes como pneus, vasos e caixas d'água","Corrente e fria","Turva com matéria orgânica"],g:1,exp:"O Aedes aegypti deposita seus ovos em água limpa e parada. Os principais criadouros são: caixas d'água sem tampa, pneus, vasos de plantas, calhas e garrafas."},
        {n:10,q:"Qual é a fase da dengue em que ocorre maior risco de evolução grave?",ops:["Fase febril (1º ao 3º dia)","Fase crítica (3º ao 6º dia, após queda da febre)","Fase de recuperação (após o 7º dia)","A doença não apresenta fases distintas"],g:1,exp:"A fase crítica ocorre entre o 3º e o 6º dia, coincidindo com a queda da febre. É nesta fase que pode ocorrer extravasamento de plasma, levando a hemoconcentração e choque."},
      ]},
      {nome:'Zika e Chikungunya (Q11–Q20)',qs:[
        {n:11,q:"Qual é o principal vetor da Zika e da Chikungunya no Brasil?",ops:["Anopheles darlingi","Culex quinquefasciatus","Aedes aegypti","Triatoma infestans"],g:2,exp:"O Aedes aegypti é o principal vetor da Zika e da Chikungunya no Brasil, além da dengue. O Aedes albopictus também pode transmitir, mas tem menor relevância epidemiológica no Brasil."},
        {n:12,q:"A principal complicação associada à infecção pelo Zika vírus em gestantes é:",ops:["Pré-eclâmpsia","Microcefalia e outras malformações do sistema nervoso central do feto","Diabetes gestacional","Parto prematuro sem sequelas"],g:1,exp:"A infecção pelo Zika vírus durante a gestação, especialmente no primeiro trimestre, está associada à síndrome congênita do Zika — microcefalia, calcificações cerebrais e outras malformações do SNC."},
        {n:13,q:"O Zika vírus pode ser transmitido por quais outras vias além do mosquito?",ops:["Apenas pelo mosquito","Sexual, transfusão sanguínea e transmissão vertical (mãe para filho)","Apenas por transfusão","Contato com objetos contaminados"],g:1,exp:"O Zika se diferencia por ter transmissão sexual comprovada, além de transmissão pelo mosquito, transfusão sanguínea e transmissão vertical da mãe para o feto durante a gestação."},
        {n:14,q:"O principal sintoma que diferencia a Chikungunya da dengue é:",ops:["Febre alta","Artralgia intensa e prolongada (pode durar meses ou anos)","Exantema cutâneo","Cefaleia intensa"],g:1,exp:"A artralgia (dor articular) intensa e que pode persistir por meses ou anos é a marca registrada da Chikungunya, diferenciando-a clinicamente da dengue."},
        {n:15,q:"O nome 'Chikungunya' em swahili significa:",ops:["Febre do mosquito","Aquele que se curva (pela dor articular)","Doença das manchas","Febre da floresta"],g:1,exp:"'Chikungunya' vem da língua makonde (África) e significa 'aquele que se curva' ou 'dobrado pela dor', referindo-se à postura característica dos pacientes devido à artralgia intensa."},
        {n:16,q:"Qual é o período de incubação da Chikungunya no ser humano?",ops:["1 a 2 dias","1 a 12 dias (geralmente 3 a 7 dias)","15 a 20 dias","30 dias"],g:1,exp:"O período de incubação da Chikungunya é de 1 a 12 dias, com média de 3 a 7 dias após a picada do mosquito infectado."},
        {n:17,q:"A fase crônica da Chikungunya é caracterizada por:",ops:["Febre recorrente e rash cutâneo","Artralgia persistente por mais de 3 meses após a infecção aguda","Comprometimento renal grave","Cardiopatia progressiva"],g:1,exp:"Na fase crônica da Chikungunya (após 3 meses), a artralgia persistente é o sintoma predominante, podendo durar anos e comprometer significativamente a qualidade de vida."},
        {n:18,q:"Em relação à Zika, gestantes que viajam para áreas endêmicas devem:",ops:["Tomar vacina específica antes da viagem","Evitar viagens a áreas com transmissão ativa e, se necessário, usar repelente e roupas protetoras","Usar apenas protetor solar","Tomar antibióticos preventivos"],g:1,exp:"Não há vacina disponível para Zika. As medidas preventivas incluem evitar áreas endêmicas, usar repelente, roupas de manga longa e eliminar criadouros do Aedes aegypti."},
        {n:19,q:"O diagnóstico laboratorial do Zika vírus na fase aguda é feito por:",ops:["Hemograma completo apenas","RT-PCR para detecção do RNA viral","Teste rápido de IgM","Sorologia ELISA convencional"],g:1,exp:"Na fase aguda (até o 5º dia), o RT-PCR (reação em cadeia da polimerase em tempo real) é o método de escolha para detectar o RNA do Zika vírus no sangue, urina ou saliva."},
        {n:20,q:"Qual das seguintes afirmações sobre a Chikungunya está CORRETA?",ops:["Não causa morte","A artralgia é sempre resolvida em menos de 1 semana","Pode causar formas graves em recém-nascidos, idosos e imunossuprimidos","Tem tratamento antiviral específico aprovado"],g:2,exp:"Embora a letalidade seja baixa, a Chikungunya pode causar formas graves em grupos vulneráveis como recém-nascidos (transmissão perinatal), idosos e imunossuprimidos. Não há antiviral específico aprovado."},
      ]},
      {nome:'Malária (Q21–Q30)',qs:[
        {n:21,q:"Qual é o agente causador da malária?",ops:["Trypanosoma cruzi","Plasmodium spp. (falciparum, vivax, malariae, ovale)","Leishmania chagasi","Leptospira interrogans"],g:1,exp:"A malária é causada por protozoários do gênero Plasmodium. No Brasil, as espécies mais prevalentes são P. vivax (maioria) e P. falciparum (mais letal). P. malariae e P. ovale são raros."},
        {n:22,q:"Qual inseto transmite a malária ao ser humano?",ops:["Fêmea do Aedes aegypti","Fêmea do Anopheles (mosquito-prego)","Triatoma infestans (barbeiro)","Lutzomyia longipalpis (mosquito-palha)"],g:1,exp:"A malária é transmitida pela picada da fêmea do mosquito Anopheles (popularmente chamado de mosquito-prego ou muriçoca). Apenas a fêmea se alimenta de sangue para desenvolver os ovos."},
        {n:23,q:"Os sintomas clássicos da malária incluem:",ops:["Artralgia intensa e rash cutâneo","Febre periódica com calafrios e sudorese (tríade malárica)","Icterícia, insuficiência renal e hemorragia","Tosse crônica e dificuldade respiratória"],g:1,exp:"A tríade malárica é: calafrio (fase fria), febre alta (fase quente) e sudorese (fase de sudorese). Os paroxismos ocorrem em intervalos regulares conforme a espécie: 48h (vivax/falciparum) ou 72h (malariae)."},
        {n:24,q:"Qual espécie de Plasmodium causa a forma mais grave da malária?",ops:["P. vivax","P. malariae","P. ovale","P. falciparum"],g:3,exp:"P. falciparum é o mais virulento, podendo causar malária cerebral, insuficiência renal aguda, anemia grave, hipoglicemia e morte se não tratada rapidamente."},
        {n:25,q:"O P. vivax se diferencia do P. falciparum por:",ops:["Ser mais letal","Causar formas hipnozoítas no fígado que podem causar recaídas","Não ter tratamento eficaz","Ser transmitido pelo Aedes aegypti"],g:1,exp:"O P. vivax forma hipnozoítas (formas dormentes no fígado), causando recaídas semanas ou meses após o tratamento. Por isso, o esquema com primaquina (que elimina os hipnozoítas) é essencial."},
        {n:26,q:"Em qual região do Brasil a malária é mais endêmica?",ops:["Nordeste","Sul","Região Amazônica (Norte)","Centro-Oeste"],g:2,exp:"A região Amazônica concentra mais de 99% dos casos de malária no Brasil, onde as condições de temperatura, umidade e floresta favorecem a proliferação do Anopheles."},
        {n:27,q:"Qual medicamento é utilizado para eliminar os hipnozoítas hepáticos do P. vivax e prevenir recaídas?",ops:["Cloroquina","Primaquina","Artesunato","Doxiciclina"],g:1,exp:"A primaquina é o único medicamento capaz de eliminar os hipnozoítas de P. vivax e P. ovale no fígado, prevenindo recaídas. É contraindicada em gestantes e em pessoas com deficiência de G6PD."},
        {n:28,q:"O diagnóstico laboratorial da malária é realizado principalmente por:",ops:["Hemograma completo","Gota espessa e esfregaço sanguíneo (microscopia óptica)","Sorologia IgM","Cultura de sangue"],g:1,exp:"A gota espessa é o exame padrão-ouro para diagnóstico da malária no Brasil — permite identificar o Plasmodium e quantificar a parasitemia. Testes rápidos (TDR) também são usados em áreas remotas."},
        {n:29,q:"A malária cerebral é uma complicação grave causada principalmente por:",ops:["P. vivax","P. malariae","P. falciparum","P. ovale"],g:2,exp:"A malária cerebral é causada por P. falciparum, que provoca sequestro de hemácias parasitadas nos capilares cerebrais, levando a coma, convulsões e elevada letalidade sem tratamento imediato."},
        {n:30,q:"O controle da malária no Brasil é realizado principalmente por:",ops:["Vacinação em massa da população","Controle vetorial (larvicidas, inseticidas residuais) e diagnóstico/tratamento precoce","Uso de antibióticos preventivos","Drenagem de todos os rios da Amazônia"],g:1,exp:"O controle da malária combina: controle vetorial (redução do Anopheles), diagnóstico laboratorial precoce, tratamento oportuno e medidas de proteção individual (mosquiteiros impregnados, repelentes)."},
      ]},
      {nome:'Leishmaniose (Q31–Q40)',qs:[
        {n:31,q:"Qual é o agente etiológico da leishmaniose?",ops:["Trypanosoma cruzi","Plasmodium falciparum","Leishmania spp.","Leptospira interrogans"],g:2,exp:"A leishmaniose é causada por protozoários do gênero Leishmania. No Brasil, as principais espécies são L. braziliensis e L. amazonensis (tegumentar) e L. chagasi/infantum (visceral)."},
        {n:32,q:"Qual inseto transmite a leishmaniose ao ser humano?",ops:["Fêmea do Aedes aegypti","Triatoma infestans (barbeiro)","Lutzomyia longipalpis (flebotomíneo/mosquito-palha)","Fêmea do Anopheles"],g:2,exp:"A leishmaniose é transmitida pela picada do flebotomíneo (mosquito-palha, birigui), do gênero Lutzomyia no Brasil. É um mosquito pequeno, de voo silencioso, ativo ao entardecer."},
        {n:33,q:"Quais são as duas formas principais da leishmaniose no Brasil?",ops:["Pulmonar e hepática","Tegumentar americana (LTA) e visceral (calazar)","Cutânea e hemática","Aguda e crônica apenas"],g:1,exp:"No Brasil, as principais formas são: Leishmaniose Tegumentar Americana (LTA) — úlceras na pele e mucosas — e Leishmaniose Visceral (LV ou calazar) — compromete órgãos internos como fígado, baço e medula."},
        {n:34,q:"A lesão cutânea característica da leishmaniose tegumentar é:",ops:["Vesículas com líquido amarelado","Manchas avermelhadas sem ulceração","Úlcera com bordas elevadas e bem delimitadas (aspecto de cratera de vulcão)","Nódulos subcutâneos dolorosos"],g:2,exp:"A úlcera leishmaniótica tem bordas bem delimitadas e elevadas, fundo granuloso (aspecto de cratera de vulcão), geralmente indolor. Localiza-se mais frequentemente em membros inferiores."},
        {n:35,q:"O principal reservatório urbano da leishmaniose visceral no Brasil é:",ops:["Rato doméstico","Gato doméstico","Cão doméstico","Gambá"],g:2,exp:"O cão doméstico é o principal reservatório urbano da L. infantum/chagasi. O controle canino (eutanásia de cães soropositivos, coleiras inseticidas) é parte essencial das medidas de controle."},
        {n:36,q:"A leishmaniose visceral (calazar) se caracteriza por:",ops:["Úlceras exclusivamente na pele","Febre prolongada, hepatoesplenomegalia, anemia e emagrecimento","Artralgia intensa e rash cutâneo","Febre periódica com calafrios"],g:1,exp:"O calazar apresenta: febre irregular e prolongada, hepatoesplenomegalia (baço muito aumentado), anemia, leucopenia, hipoalbuminemia e emagrecimento progressivo. É fatal se não tratado."},
        {n:37,q:"Qual medicamento é considerado de primeira escolha para o tratamento da leishmaniose?",ops:["Cloroquina","Antimonial pentavalente (glucantime)","Penicilina","Ivermectina"],g:1,exp:"O antimoniato de N-metilglucamina (Glucantime) é o medicamento de primeira linha para leishmaniose tegumentar e visceral no Brasil, via parenteral. A anfotericina B lipossomal é alternativa para casos graves."},
        {n:38,q:"A leishmaniose mucosa (espúndia) é uma forma grave de LTA que afeta:",ops:["Apenas a pele das extremidades","As mucosas do nariz, boca e faringe, causando destruição tecidual","Os órgãos internos (fígado e baço)","O sistema nervoso central"],g:1,exp:"A forma mucosa da LTA pode causar destruição progressiva das mucosas nasal, oral e faríngea, levando a desfiguramento grave. É causada principalmente pela L. braziliensis."},
        {n:39,q:"Como o ACE pode contribuir para o controle da leishmaniose visceral?",ops:["Aplicando medicamento nos cães","Educando a comunidade sobre o flebotomíneo, eliminando criadouros e comunicando casos suspeitos à vigilância","Vacinando os cães da área","Apenas fazendo borrifação de inseticida"],g:1,exp:"O ACE contribui com: educação em saúde sobre o vetor, eliminação de matéria orgânica e locais de reprodução do flebotomíneo, identificação de casos suspeitos e articulação com serviços de saúde."},
        {n:40,q:"Em qual tipo de ambiente o flebotomíneo (vetor da leishmaniose) prefere habitar?",ops:["Apenas em ambientes aquáticos","Ambientes úmidos, sombreados, com matéria orgânica em decomposição (folhas, lixo, animais)","Apenas em ambientes urbanos secos","Dentro de residências com ar-condicionado"],g:1,exp:"O flebotomíneo prefere ambientes com umidade, sombra e matéria orgânica em decomposição — como pilhas de folhas, entulho, canis e currais. Controlar esses ambientes é medida preventiva essencial."},
      ]},
      {nome:'Doença de Chagas (Q41–Q50)',qs:[
        {n:41,q:"Qual é o agente causador da doença de Chagas?",ops:["Plasmodium falciparum","Leishmania braziliensis","Trypanosoma cruzi","Leptospira interrogans"],g:2,exp:"A doença de Chagas é causada pelo protozoário Trypanosoma cruzi, descoberto por Carlos Chagas em 1909 — uma das maiores contribuições da ciência brasileira à medicina mundial."},
        {n:42,q:"Qual é o principal vetor da doença de Chagas no Brasil?",ops:["Aedes aegypti","Anopheles darlingi","Triatoma infestans e outras espécies de barbeiro (Triatoma spp.)","Lutzomyia longipalpis"],g:2,exp:"O barbeiro (Triatoma infestans e outras espécies), da família Triatominae, é o principal vetor. Defeca após a picada e as fezes contaminadas com T. cruzi penetram pela pele ou mucosas coçadas."},
        {n:43,q:"Como ocorre a transmissão vetorial da doença de Chagas?",ops:["Pela picada direta do barbeiro que injeta o parasita","Pelo contato com as fezes do barbeiro contaminadas com T. cruzi na pele ou mucosas","Pela inalação de poeira contaminada","Pelo contato com urina do barbeiro"],g:1,exp:"O barbeiro pica e defeca próximo ao local da picada. As fezes contêm o T. cruzi na forma tripomastigota. Ao coçar o local, o hospedeiro introduz o parasita pela pele lesada ou mucosas."},
        {n:44,q:"O sinal de Romaña, característico da fase aguda da doença de Chagas, consiste em:",ops:["Lesão ulcerada na pele no local da picada","Edema bipalpebral unilateral indolor quando o parasita entra pela conjuntiva ocular","Febre com manchas hemorrágicas","Artralgia intensa dos membros inferiores"],g:1,exp:"O sinal de Romaña é o edema bipalpebral unilateral indolor, que ocorre quando o T. cruzi penetra pela conjuntiva ocular — porta de entrada para a infecção na face."},
        {n:45,q:"A fase crônica da doença de Chagas pode se manifestar como:",ops:["Apenas febre prolongada","Cardiopatia chagásica (arritmias, insuficiência cardíaca) e forma digestiva (megaesôfago, megacólon)","Artralgia crônica","Comprometimento exclusivo do sistema nervoso"],g:1,exp:"Na fase crônica, a cardiopatia chagásica (arritmias, bloqueios, insuficiência cardíaca, morte súbita) é a complicação mais grave. A forma digestiva cursa com megaesôfago e megacólon."},
        {n:46,q:"Além da via vetorial, a doença de Chagas pode ser transmitida por:",ops:["Contato com fezes de ratos","Transfusão sanguínea, transmissão congênita, transplante de órgãos e ingestão de alimentos contaminados","Picada de mosquito Aedes","Contato sexual apenas"],g:1,exp:"Vias de transmissão não vetorial: transfusão sanguínea, transplante de órgãos, transmissão congênita (mãe para filho), acidentes laboratoriais e ingestão oral (surtos por açaí e caldo de cana contaminados)."},
        {n:47,q:"Qual é o medicamento utilizado no tratamento etiológico da doença de Chagas?",ops:["Cloroquina","Benznidazol (ou nifurtimox)","Penicilina benzatina","Ivermectina"],g:1,exp:"O Benznidazol é o medicamento de primeira escolha no Brasil para o tratamento etiológico. É mais eficaz na fase aguda. Na fase crônica, o tratamento é paliativo (cardiopatia, digestivo)."},
        {n:48,q:"A principal medida de controle do barbeiro nas residências rurais é:",ops:["Uso de repelente corporal","Borrifação de inseticidas residuais no interior e exterior das habitações, especialmente em frestas e paredes","Aplicação de larvicidas em água","Drenagem de charcos próximos"],g:1,exp:"O controle do barbeiro é feito pela borrifação de inseticidas residuais (organofosforados, piretroides) nas habitações, especialmente em paredes de pau-a-pique, frestas e ocos de madeira onde o inseto se abriga."},
        {n:49,q:"A fase indeterminada da doença de Chagas é caracterizada por:",ops:["Sintomas graves de cardiopatia","Ausência de sintomas clínicos com sorologia positiva para T. cruzi","Presença de parasitas no sangue periférico em grande quantidade","Febre e edema generalizados"],g:1,exp:"Na fase indeterminada (pode durar décadas ou toda a vida), o paciente tem sorologia positiva mas sem sintomas clínicos, alterações eletrocardiográficas ou de exames de imagem. Cerca de 60-70% dos infectados permanecem nesta fase."},
        {n:50,q:"O controle da doença de Chagas inclui qual ação do ACE?",ops:["Aplicar medicamento diretamente nas pessoas","Identificar e notificar habitações infestadas por barbeiros e orientar sobre melhoria das moradias","Realizar cirurgias cardíacas nas comunidades","Vacinar os moradores contra o T. cruzi"],g:1,exp:"O ACE contribui identificando triatomíneos (barbeiros) nas residências, notificando à vigilância entomológica, orientando moradores sobre melhoria das condições habitacionais e medidas preventivas."},
      ]},
      {nome:'Leptospirose (Q51–Q60)',qs:[
        {n:51,q:"Qual é o agente causador da leptospirose?",ops:["Trypanosoma cruzi","Plasmodium vivax","Leptospira interrogans (bactéria espiroqueta)","Leishmania braziliensis"],g:2,exp:"A leptospirose é causada pela bactéria Leptospira interrogans, uma espiroqueta (bactéria com forma espiralada). Existem mais de 200 sorovares patogênicos, sendo o sorovar icterohaemorrhagiae o mais grave."},
        {n:52,q:"Como ocorre a principal forma de transmissão da leptospirose ao ser humano?",ops:["Picada de mosquito","Contato da pele ou mucosas com água ou lama contaminada pela urina de ratos","Ingestão de carne crua contaminada","Transmissão de pessoa a pessoa"],g:1,exp:"A Leptospira penetra pela pele com lesões ou mucosas íntegras em contato com água, lama ou solo contaminados pela urina de ratos, especialmente em enchentes urbanas."},
        {n:53,q:"Qual animal é o principal reservatório urbano da leptospirose?",ops:["Cão doméstico","Bovino","Rato (roedor sinantrópico)","Pombo"],g:2,exp:"O rato doméstico (Rattus norvegicus) é o principal reservatório urbano da leptospirose. Ele elimina a Leptospira pela urina cronicamente, sem adoecer, contaminando o ambiente."},
        {n:54,q:"Quais são os sintomas iniciais mais característicos da leptospirose?",ops:["Artralgia crônica e rash cutâneo","Febre súbita, cefaleia intensa, mialgia (especialmente nas panturrilhas) e conjuntivite","Tosse e coriza","Diarreia e vômito apenas"],g:1,exp:"A leptospirose inicia com febre alta súbita, cefaleia intensa, mialgia (especialmente nas panturrilhas — 'dor nas batatas das pernas'), prostração, conjuntivite e fotofobia."},
        {n:55,q:"A Síndrome de Weil, forma grave da leptospirose, é caracterizada pela tríade:",ops:["Febre, artralgia e rash","Icterícia intensa, insuficiência renal aguda e fenômenos hemorrágicos","Febre, cefaleia e convulsões","Hepatomegalia, esplenomegalia e anemia"],g:1,exp:"A Síndrome de Weil é a forma mais grave: tríade de icterícia intensa (coloração amarela), insuficiência renal aguda e fenômenos hemorrágicos (petéquias, equimoses, hemorragia pulmonar). Letalidade elevada."},
        {n:56,q:"Em qual período do ano os casos de leptospirose aumentam significativamente no Brasil?",ops:["Inverno (junho a agosto)","Período de chuvas intensas e enchentes (verão — dezembro a março)","Primavera","Outono"],g:1,exp:"Os casos de leptospirose aumentam significativamente no período de chuvas intensas (verão), quando enchentes disseminam a urina de ratos pelo ambiente urbano, ampliando a exposição humana."},
        {n:57,q:"Qual é o tratamento de escolha para a leptospirose?",ops:["Antivirais como oseltamivir","Antibióticos: penicilina G cristalina (casos graves) ou doxiciclina (casos leves)","Apenas sintomático, sem antibiótico","Corticoides em alta dose"],g:1,exp:"O tratamento é com antibióticos: penicilina G cristalina IV nos casos graves (Síndrome de Weil) e doxiciclina VO nos casos leves. O diagnóstico e tratamento precoces reduzem drasticamente a letalidade."},
        {n:58,q:"Como o ACE pode contribuir para a prevenção da leptospirose?",ops:["Aplicando vacinas nos ratos","Realizando o controle de roedores sinantrópicos (desratização) e orientando a comunidade sobre riscos em enchentes","Apenas notificando casos confirmados","Distribuindo antibióticos preventivos"],g:1,exp:"O ACE contribui com ações de controle de roedores (desratização), orientação da comunidade sobre riscos de exposição em enchentes, uso de EPI (botas, luvas) e notificação de casos suspeitos."},
        {n:59,q:"A leptospirose não se transmite de:",ops:["Contato com urina de animais infectados","Contato com água ou lama contaminada","Transmissão direta de pessoa a pessoa","Contato com solo contaminado"],g:2,exp:"A transmissão de pessoa para pessoa é rara ou inexistente na leptospirose. A doença se transmite pelo contato ambiental com urina de animais infectados, não diretamente entre humanos."},
        {n:60,q:"Qual é a notificação obrigatória da leptospirose no Brasil?",ops:["Não é de notificação obrigatória","É doença de notificação compulsória imediata apenas em surtos","É doença de notificação compulsória (SINAN), com notificação de todos os casos confirmados e suspeitos","É notificada apenas ao município, não ao estado"],g:2,exp:"A leptospirose é doença de notificação compulsória no Brasil (SINAN). Todos os casos suspeitos e confirmados devem ser notificados, permitindo o monitoramento epidemiológico e a resposta oportuna às epidemias."},
      ]},
    ]
  },
  {
    id:'sim9',titulo:'Simulado 9 – Completo ACE (Todos os Tópicos)',banca:'Ação Bahia',ano:2025,
    edital:'ACE Municipal – Bahia',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q10)',qs:[
        {n:1,q:"Assinale a alternativa em que a vírgula está empregada CORRETAMENTE:",ops:["Comprei, luvas, botas e, repelente.","Os agentes, que se dedicam, obtêm bons resultados.","Carlos, chefe da equipe, apresentou o relatório.","Ela chegou, e saiu rapidamente."],g:2,exp:"Vírgula de aposto: 'chefe da equipe' é aposto explicativo de 'Carlos' e deve ser isolado por vírgulas. Nas demais alternativas o uso da vírgula é incorreto."},
        {n:2,q:"Na frase 'Os imóveis foram vistoriados pelo ACE', a voz verbal é:",ops:["Ativa","Reflexiva","Passiva sintética","Passiva analítica"],g:3,exp:"Passiva analítica: auxiliar 'foram' + particípio 'vistoriados' + agente da passiva 'pelo ACE'. Equivale a: 'O ACE vistoriou os imóveis'."},
        {n:3,q:"Assinale a frase com crase CORRETAMENTE empregada:",ops:["Fomos à reunião de equipe.","Entreguei o boletim à ele.","Refiro-me à aquele imóvel.","Fui à pé até o posto."],g:0,exp:"'À reunião' = preposição 'a' + artigo feminino 'a'. Não se usa crase antes de pronome masculino ('ele') nem antes de artigo que já está na palavra."},
        {n:4,q:"'Haviam muitos criadouros no imóvel.' Esta frase apresenta erro de:",ops:["Regência verbal","Colocação pronominal","Concordância verbal","Ortografia"],g:2,exp:"'Haver' no sentido de existir é impessoal e fica sempre no singular: 'Havia muitos criadouros no imóvel'."},
        {n:5,q:"Em qual alternativa o uso do hífen está CORRETO?",ops:["Anti-inflamatório","Antiinflamatório","Anti inflamatório","Antiinflamatorio"],g:0,exp:"Usa-se hífen quando o segundo elemento começa com vogal idêntica à última letra do prefixo: anti + inflamatório = anti-inflamatório."},
        {n:6,q:"O sujeito da oração 'É obrigatório notificar casos de dengue' é:",ops:["casos de dengue","notificar","É obrigatório","Sujeito inexistente — oração impessoal"],g:3,exp:"A construção 'É obrigatório + infinitivo' forma uma oração impessoal — não há sujeito que pratique a ação de 'ser obrigatório'."},
        {n:7,q:"A figura de linguagem em 'O mosquito é um inimigo invisível' é:",ops:["Comparação","Hipérbole","Metáfora","Metonímia"],g:2,exp:"Metáfora: identifica implicitamente 'mosquito' e 'inimigo invisível' sem o uso de conectivo comparativo 'como'."},
        {n:8,q:"Na frase 'Preciso que você venha logo ao campo', o modo verbal de 'venha' é:",ops:["Indicativo","Subjuntivo","Imperativo afirmativo","Imperativo negativo"],g:1,exp:"O subjuntivo presente é usado em orações subordinadas após verbos de desejo ou necessidade como 'precisar'."},
        {n:9,q:"Qual é o par de PARÔNIMOS?",ops:["Dengue / dengoso","Descrição / discrição","Amor / desamor","Casa / casinha"],g:1,exp:"Parônimos: palavras de grafia e pronúncia semelhantes mas sentidos diferentes. 'Descrição' = ato de descrever; 'discrição' = qualidade de discreto."},
        {n:10,q:"Em 'O agente orientou os moradores conforme o protocolo', a palavra 'conforme' exerce a função de:",ops:["Preposição","Conjunção conformativa","Advérbio de modo","Pronome relativo"],g:1,exp:"'Conforme' introduz oração subordinada adverbial conformativa, indicando que a ação foi realizada de acordo com algo previsto."},
      ]},
      {nome:'Matemática (Q11–Q20)',qs:[
        {n:11,q:"Um ACE percorre 300 imóveis em 5 dias. Quantos imóveis percorrerá em 8 dias?",ops:["420","460","480","500"],g:2,exp:"300 ÷ 5 = 60 imóveis/dia. 60 × 8 = 480 imóveis."},
        {n:12,q:"Numa rua, 40% dos imóveis tinham criadouros. Se a rua tem 75 imóveis, quantos tinham criadouros?",ops:["25","30","35","40"],g:1,exp:"40% de 75 = 75 × 0,40 = 30 imóveis com criadouros."},
        {n:13,q:"Se 5 agentes visitam 200 imóveis em 2 dias, quantos imóveis 8 agentes visitariam no mesmo tempo?",ops:["280","300","320","350"],g:2,exp:"5 agentes → 200 imóveis em 2 dias. 1 agente → 40 em 2 dias. 8 agentes → 320 imóveis."},
        {n:14,q:"A taxa de incidência de dengue numa cidade foi de 200 casos por 100.000 hab. Se a população é 150.000, quantos casos ocorreram?",ops:["250","300","350","400"],g:1,exp:"200/100.000 × 150.000 = 300 casos."},
        {n:15,q:"Um depósito de larvicida tem 48 litros. Cada aplicação usa 3/8 do total. Quantos litros são usados por aplicação?",ops:["12 L","16 L","18 L","20 L"],g:2,exp:"3/8 de 48 = 48 × 3 ÷ 8 = 144 ÷ 8 = 18 litros por aplicação."},
        {n:16,q:"Em um ciclo de 60 dias, um ACE visitou 540 imóveis. Qual a média diária?",ops:["7","8","9","10"],g:2,exp:"540 ÷ 60 = 9 imóveis por dia."},
        {n:17,q:"Uma solução inseticida cobre 400 m². Para cobrir 2.800 m², quantas aplicações são necessárias?",ops:["5","6","7","8"],g:2,exp:"2.800 ÷ 400 = 7 aplicações."},
        {n:18,q:"Qual é o MDC de 48 e 60?",ops:["6","10","12","24"],g:2,exp:"Fatores de 48: 1,2,3,4,6,8,12,16,24,48. Fatores de 60: 1,2,3,4,5,6,10,12,15,20,30,60. MDC = 12."},
        {n:19,q:"Numa turma de agentes, 25% são do sexo masculino. Se há 12 homens, quantos agentes há no total?",ops:["36","42","48","56"],g:2,exp:"25% = 12 → 100% = 12 ÷ 0,25 = 48 agentes no total."},
        {n:20,q:"A área de um terreno retangular de 20 m × 12 m é:",ops:["64 m²","120 m²","240 m²","480 m²"],g:2,exp:"Área = base × altura = 20 × 12 = 240 m²."},
      ]},
      {nome:'Saúde Pública e SUS (Q21–Q30)',qs:[
        {n:21,q:"Qual princípio do SUS garante atendimento a todos os cidadãos, independentemente de contribuição?",ops:["Integralidade","Universalidade","Equidade","Descentralização"],g:1,exp:"Universalidade: o SUS atende a todos sem distinção, como direito garantido pela Constituição Federal de 1988 (art. 196)."},
        {n:22,q:"O princípio da EQUIDADE no SUS significa:",ops:["Atender a todos da mesma forma","Tratar desigualmente os desiguais, priorizando quem mais necessita para reduzir iniquidades","Integrar serviços públicos e privados","Garantir atendimento apenas nas UBSs"],g:1,exp:"Equidade não é igualdade: é dar mais a quem mais precisa, reconhecendo as diferenças e vulnerabilidades de cada grupo para reduzir desigualdades em saúde."},
        {n:23,q:"A Lei Orgânica da Saúde que regulamenta o SUS é a:",ops:["Lei 8.142/1990","Lei 8.080/1990","Lei 7.498/1986","Lei 9.656/1998"],g:1,exp:"A Lei 8.080/1990 dispõe sobre as condições para a promoção, proteção e recuperação da saúde, além de organizar e regular as ações do SUS."},
        {n:24,q:"O SINAN é o sistema de informação utilizado para:",ops:["Registrar internações hospitalares","Notificações compulsórias de doenças e agravos","Controle de estoque de medicamentos","Pagamento dos servidores da saúde"],g:1,exp:"SINAN = Sistema de Informação de Agravos de Notificação. Registra casos de doenças de notificação compulsória, como dengue, leptospirose e leishmaniose."},
        {n:25,q:"O LIRAa (Levantamento de Índice Rápido para Aedes aegypti) é realizado com qual periodicidade?",ops:["Mensal","Anual","Quadrimestral (3 vezes ao ano)","Semanal"],g:2,exp:"O LIRAa é realizado 3 vezes ao ano (quadrimestral), nos meses de fevereiro, maio/junho e outubro, para monitorar os índices de infestação do Aedes aegypti."},
        {n:26,q:"A Estratégia Saúde da Família (ESF) está inserida em qual nível de atenção do SUS?",ops:["Atenção terciária","Atenção secundária","Atenção básica (primária)","Alta complexidade"],g:2,exp:"A ESF é a principal estratégia da Atenção Básica/Primária, sendo a porta de entrada preferencial do SUS e base para o cuidado longitudinal da população."},
        {n:27,q:"Qual é a principal característica da prevenção primária em saúde?",ops:["Diagnóstico precoce de doenças já instaladas","Reabilitação do paciente","Ações antes da instalação da doença, eliminando fatores de risco","Tratamento de doenças crônicas"],g:2,exp:"Prevenção primária age antes da doença se instalar: vacinação, controle de vetores, saneamento e educação em saúde são exemplos. O controle vetorial do Aedes é prevenção primária da dengue."},
        {n:28,q:"A cadeia epidemiológica descreve:",ops:["Lista de vacinas disponíveis no SUS","A sequência: agente etiológico → mecanismo de transmissão → hospedeiro suscetível","O protocolo de atendimento hospitalar","A lista de doenças de notificação compulsória"],g:1,exp:"A cadeia epidemiológica descreve o processo de transmissão: agente causador, fonte de infecção, via de transmissão e hospedeiro suscetível. Quebrar qualquer elo interrompe a transmissão."},
        {n:29,q:"Incidência e prevalência diferem porque:",ops:["São sinônimos na epidemiologia","Incidência mede casos NOVOS num período; prevalência mede total de casos existentes num momento","Incidência aplica-se só a doenças crônicas","Prevalência é sempre menor que a incidência"],g:1,exp:"Incidência: número de casos NOVOS em um período. Prevalência: total de casos existentes (novos + antigos) em um momento ou período. São medidas epidemiológicas complementares."},
        {n:30,q:"O conceito ampliado de saúde definido pela OMS (1946) inclui:",ops:["Apenas ausência de doenças","Completo bem-estar físico, mental e social — não apenas ausência de doença","Ter plano de saúde privado","Realizar exames preventivos regulares"],g:1,exp:"A OMS (1946) definiu saúde como 'completo estado de bem-estar físico, mental e social, e não apenas ausência de doença ou enfermidade' — base do conceito ampliado de saúde no SUS."},
      ]},
      {nome:'Visitas e Fiscalização (Q31–Q40)',qs:[
        {n:31,q:"O principal objetivo da visita domiciliar do ACE é:",ops:["Vacinar os moradores","Eliminar criadouros do Aedes aegypti e orientar os moradores","Realizar consultas médicas domiciliares","Distribuir medicamentos"],g:1,exp:"O ACE inspeciona imóveis em busca de recipientes com água parada que sirvam de criadouro para o mosquito, eliminando-os no ato e educando o morador sobre prevenção."},
        {n:32,q:"Qual tipo de recipiente é considerado o principal criadouro do Aedes aegypti no Brasil?",ops:["Calhas entupidas","Caixas d'água sem tampa","Pneus velhos","Vasos de flores com pires"],g:1,exp:"Caixas d'água sem tampa são o principal criadouro por armazenar grande volume de água limpa e parada — condição ideal para a oviposição do Aedes aegypti."},
        {n:33,q:"Quando o morador recusa a entrada do ACE em seu imóvel, o agente deve:",ops:["Forçar a entrada com apoio policial","Registrar a recusa no boletim de campo (BAC) e comunicar ao supervisor","Abandonar a visita e não registrar","Multar o morador imediatamente"],g:1,exp:"O ACE deve registrar a recusa no BAC, informar ao supervisor e, se necessário, buscar apoio jurídico para acesso compulsório ao imóvel. Não pode forçar a entrada por conta própria."},
        {n:34,q:"Na classificação do LIRAa, o imóvel 'B' significa:",ops:["Imóvel vistoriado sem foco de Aedes","Imóvel vistoriado com foco de Aedes","Imóvel fechado","Imóvel demolido"],g:1,exp:"Classificação LIRAa: A = visitado sem foco, B = visitado COM foco, F = fechado, R = recusa, T = terreno baldio. O índice de infestação é calculado com base nos imóveis 'B'."},
        {n:35,q:"O ciclo de trabalho do ACE no LIRAa tem duração de:",ops:["30 dias","45 dias","60 dias","90 dias"],g:2,exp:"O ciclo operacional do LIRAa tem duração de 60 dias, sendo realizado 3 vezes ao ano. Cada ciclo abrange todo o território municipal do agente."},
        {n:36,q:"O Boletim de Acompanhamento de Campo (BAC) é usado para:",ops:["Registrar apenas os imóveis com foco","Registrar todos os imóveis visitados, pendências, recusas e focos encontrados","Solicitar materiais ao almoxarifado","Comunicar ausências ao supervisor"],g:1,exp:"O BAC é o instrumento de registro de campo do ACE, onde são anotados todos os imóveis visitados, sua classificação (A, B, F, R, T), focos encontrados e ações realizadas."},
        {n:37,q:"Durante a visita domiciliar, o ACE encontra um pneu com água no quintal. A conduta correta é:",ops:["Registrar e seguir para o próximo imóvel","Eliminar o criadouro (esvaziar/virar o pneu) e orientar o morador sobre prevenção","Multar o morador","Acionar a vigilância sanitária"],g:1,exp:"O ACE deve eliminar o criadouro no ato da visita (esvaziar, virar, descartar) e educar o morador sobre como evitar o acúmulo de água parada."},
        {n:38,q:"A estratificação de risco no trabalho do ACE serve para:",ops:["Definir quais agentes trabalham em cada bairro","Priorizar áreas com maior índice de infestação e risco epidemiológico para ações intensificadas","Calcular o salário dos agentes","Determinar o número de criadouros por imóvel"],g:1,exp:"A estratificação de risco classifica as áreas do município conforme o índice de infestação e histórico epidemiológico, permitindo priorizar recursos e intensificar ações nas áreas de maior risco."},
        {n:39,q:"Qual é o papel da educação em saúde nas visitas domiciliares do ACE?",ops:["Substituir o tratamento médico","Orientar os moradores sobre eliminação de criadouros, sinais de alerta e importância da prevenção","Fiscalizar e punir moradores negligentes","Apenas distribuir material educativo impresso"],g:1,exp:"A educação em saúde é parte fundamental do trabalho do ACE: orientar sobre eliminação de criadouros, reconhecimento dos sintomas, procura de serviço de saúde e importância da prevenção coletiva."},
        {n:40,q:"Imóveis 'fechados' (F) no ciclo do ACE devem ser:",ops:["Desconsiderados no relatório","Registrados como pendência e revisitados na próxima rodada","Notificados diretamente à polícia","Considerados sem foco automaticamente"],g:1,exp:"Imóveis fechados são registrados no BAC como pendência e devem ser revisitados na próxima rodada do ciclo para garantir a cobertura completa do território."},
      ]},
      {nome:'Endemias e Doenças (Q41–Q50)',qs:[
