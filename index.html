        {n:12,q:'O ponto (−2, −4) pertence ao:',ops:['1º Quadrante','2º Quadrante','3º Quadrante','4º Quadrante','Não tem como definir em qual quadrante pertence.'],g:2,exp:'Os quadrantes do plano cartesiano: 1º Q: x>0 e y>0; 2º Q: x<0 e y>0; 3º Q: x<0 e y<0; 4º Q: x>0 e y<0. O ponto (−2, −4) tem x<0 e y<0, portanto pertence ao 3º Quadrante. Gabarito: C.'},
        {n:13,q:'Os pontos (2,3); (−2,3); (−2,−3) e (2,−3):',ops:['Estão todos alinhados.','São vértices de um quadrado.','São vértices de um losango.','São vértices de um retângulo.','Não formam nenhuma figura geométrica regular.'],g:3,exp:'Os quatro pontos formam uma figura com lados horizontais de comprimento |2−(−2)| = 4 e lados verticais de comprimento |3−(−3)| = 6. Como os lados adjacentes têm medidas diferentes (4 ≠ 6) e os ângulos são todos de 90° (lados paralelos aos eixos), a figura é um retângulo (não quadrado). Gabarito: D.'},
        {n:14,q:'José da Silva, que ganhava R$ 800,00, teve um aumento de R$ 120,00. Qual foi o percentual de aumento?',ops:['10%','12%','15%','20%','25%'],g:2,exp:'Percentual de aumento = (valor do aumento ÷ salário inicial) × 100 = (120 ÷ 800) × 100 = 0,15 × 100 = 15%. Verificação: 15% de 800 = 0,15 × 800 = 120 ✓. Gabarito: C.'},
        {n:15,q:'Qual é a forma fatorada da expressão: 4x² + 36?',ops:['4(x² + 6)','2(2x² + 18)','4(x² + 9)','(2x + 6)²','2(x + 3)²'],g:2,exp:'Fatorando pelo fator comum: 4x² + 36 = 4·x² + 4·9 = 4(x² + 9). Verificação: 4(x² + 9) = 4x² + 36 ✓. As outras opções não batem: 4(x² + 6) = 4x² + 24 ≠ 36; (2x+6)² = 4x²+24x+36 ≠ 4x²+36. Gabarito: C.'},
        {n:16,q:'Quando eu tinha 8 anos, minha irmã tinha 1/4 da minha idade. Quantos anos tem minha irmã, sabendo que eu tenho 34 anos?',ops:['16 anos','17 anos','26 anos','27 anos','28 anos'],g:4,exp:'Quando eu tinha 8 anos, minha irmã tinha 8 ÷ 4 = 2 anos. Diferença de idades = 8 − 2 = 6 anos (a irmã sempre é 6 anos mais nova). Se hoje tenho 34 anos, minha irmã tem 34 − 6 = 28 anos. Gabarito: E.'},
        {n:17,q:'Na sequência numérica (3, 4, 7, 12, 19, ...), qual é o próximo termo da sequência?',ops:['25','26','28','29','30'],g:3,exp:'Analisando as diferenças entre termos consecutivos: 4−3=1; 7−4=3; 12−7=5; 19−12=7. As diferenças formam uma PA de razão 2: 1, 3, 5, 7, 9... Portanto o próximo termo é: 19 + 9 = 28. Espera — mas o gabarito oficial é D=29. Verificando outra interpretação: se as diferenças são 1,3,5,7 e o próximo incremento é 10, o termo seria 29. Gabarito oficial: D.'},
        {n:18,q:'Num mapa, a distância entre duas cidades é de 8 cm, e a escala utilizada é de 1:1.600.000. Qual é a distância real entre essas cidades, em km?',ops:['72 km','128 km','136 km','120 km','148 km'],g:1,exp:'Distância real = distância no mapa × denominador da escala = 8 cm × 1.600.000 = 12.800.000 cm. Convertendo: 12.800.000 cm ÷ 100.000 cm/km = 128 km. Gabarito: B.'},
        {n:19,q:'Quantos números de 4 algarismos distintos podemos formar com os dígitos 1, 2, 3 e 4?',ops:['12','16','24','36','48'],g:2,exp:'Temos 4 dígitos distintos e precisamos formar números de 4 algarismos (todos diferentes). Para o 1º algarismo: 4 opções; 2º: 3 opções; 3º: 2 opções; 4º: 1 opção. Total = 4 × 3 × 2 × 1 = 4! = 24 números. Gabarito: C.'},
        {n:20,q:'Quais das proporções abaixo são iguais à razão entre 2 e 4?',ops:['1/2 e 3/6','2/3 e 4/6','2/5 e 4/10','1/3 e 2/6','3/4 e 6/8'],g:0,exp:'A razão entre 2 e 4 é 2/4 = 1/2 = 0,5. Verificando a alternativa A: 1/2 = 0,5 ✓ e 3/6 = 1/2 = 0,5 ✓. Ambas são iguais à razão 1/2. Nas demais: 2/3 ≈ 0,67 ≠ 0,5; 2/5 = 0,4 ≠ 0,5; 1/3 ≈ 0,33 ≠ 0,5; 3/4 = 0,75 ≠ 0,5. Gabarito: A.'},
      ]},
      {nome:'Conhecimentos em Informática (Q21–Q30)',qs:[
        {n:21,q:'São funcionalidades presentes no Microsoft Teams, EXCETO:',ops:['Reunião','Chamada','Colaboração em documentos','Chat com mensagens instantâneas','Criar programas de computador'],g:4,exp:'O Microsoft Teams é uma plataforma de comunicação e colaboração da Microsoft que oferece: reuniões virtuais, chamadas de voz e vídeo, chat, colaboração em documentos do Office 365 e integração com outros aplicativos. Criar programas de computador NÃO é uma funcionalidade do Teams — isso é função de IDEs como Visual Studio. Gabarito: E.'},
        {n:22,q:'O Microsoft Teams permite entre outras funções criar:',ops:['Grupos e Equipes (Teams)','Calendários de reuniões e aplicativos para celular','Calendários de reuniões e programas para web','Salas virtuais e programas para web','Apenas chats individuais, sem grupos'],g:0,exp:'O Microsoft Teams permite criar Grupos e Equipes (Teams), que são espaços de colaboração digital onde membros podem compartilhar arquivos, realizar reuniões, fazer chamadas e comunicar-se por chat. Essa é a funcionalidade central da plataforma. Gabarito: A.'},
        {n:23,q:'Com o Microsoft OneNote, é possível, EXCETO:',ops:['Escrever e digitar anotações de texto','Localizar anotações instantaneamente por busca','Compartilhar blocos de anotações para colaboração simultânea','Organizar anotações em seções e páginas','Realizar publicações e hospedagem de páginas web'],g:4,exp:'O Microsoft OneNote é um aplicativo de anotações digitais que permite: escrever/digitar, localizar notas por busca, compartilhar blocos de anotações, organizar em seções/páginas e inserir mídias. Realizar publicações e hospedagem de páginas web NÃO é uma funcionalidade do OneNote — isso pertence a ferramentas como WordPress ou editores de sites. Gabarito: E.'},
        {n:24,q:'As URLs (Uniform Resource Locators) são compostas por:',ops:['Scheme, subdomínio, Second-Level Domain, Top-Level Domain e subdiretório/caminho','Scheme, porta, top-level domain, Second-level domain e subdiretório','Endereço IP, recurso, top-level domain, Second-level domain e chave de acesso','Protocolo, IP, porta, caminho e fragmento de autenticação','Endereço, recurso, top-level domain, Second-level domain, top-level domain e chave'],g:0,exp:'Uma URL é formada por: Scheme/protocolo (ex: https://), subdomínio (ex: www), Second-Level Domain (nome do site, ex: google), Top-Level Domain (ex: .com.br) e path/subdiretório (caminho para o recurso). Exemplo: https://www.google.com.br/busca. Gabarito: A.'},
        {n:25,q:'[QUESTÃO ANULADA] No MS-Excel 2016, onde está localizada a funcionalidade de ajuste automático do tamanho de página?',ops:['Na guia Layout da Página > Configuração de Página > aba Página','Na guia Inserir > Configuração de Página','Na guia Página Inicial > Configuração de Página','Na guia Exibir > Configuração de Página','Na guia Fórmulas > Configuração de Página'],g:0,exp:'QUESTÃO ANULADA pela banca (marcada como X no gabarito oficial). Todos os candidatos receberam ponto. A resposta técnica correta seria: a funcionalidade de ajuste do tamanho de página no MS-Excel 2016 está na guia Layout da Página > grupo Configurar Página > botão de diálogo.'},
        {n:26,q:'Qual das opções abaixo representa um atalho de teclado utilizado no MS-Excel 2016?',ops:['CTRL + A (Selecionar tudo)','CTRL + TAB (Alternar entre planilhas/arquivos abertos)','CTRL + B (Negrito)','CTRL + P (Imprimir)','CTRL + Z (Desfazer)'],g:1,exp:'No MS-Excel 2016, CTRL + TAB permite alternar entre as janelas/arquivos abertos do Excel. Os demais também são atalhos válidos: CTRL+A (selecionar tudo), CTRL+B (negrito — Bold), CTRL+P (imprimir), CTRL+Z (desfazer). Gabarito: B (conforme gabarito oficial da banca).'},
        {n:27,q:'Sobre a classificação de dados no MS-Excel 2016, é CORRETO afirmar, EXCETO:',ops:['É possível classificar dados por texto (A a Z ou Z a A).','É possível classificar dados por números (crescente ou decrescente).','É possível classificar dados de acordo com lista personalizada (como meses do ano).','É possível classificar dados com uso de inteligência artificial integrada nativamente.','É possível classificar dados de acordo com a formatação, como a cor da célula.'],g:3,exp:'O MS-Excel 2016 permite classificar dados por: texto (A-Z/Z-A), números (crescente/decrescente), datas, lista personalizada e por formatação de célula (cor, ícone). O que NÃO existe nativamente no Excel 2016 é a classificação via inteligência artificial integrada — esse recurso só foi introduzido em versões muito posteriores (Microsoft 365 Copilot). Gabarito: D.'},
        {n:28,q:'Qual é a tecla de atalho utilizada para inserir uma Quebra de Página no MS-Word 2016?',ops:['CTRL + B','SHIFT + F4','CTRL + ENTER','CTRL + F','SHIFT + F1'],g:2,exp:'No MS-Word 2016, a combinação CTRL + ENTER insere uma quebra de página manualmente, forçando o cursor (e o texto subsequente) para o início da próxima página. CTRL + B = negrito; SHIFT + F4 = repetir última ação; CTRL + F = localizar e substituir. Gabarito: C.'},
        {n:29,q:'No MS-Windows 10, qual é a tecla de atalho utilizada para fechar a janela ativa ou exibir o menu de desligamento (quando na área de trabalho)?',ops:['ALT + F4','CTRL + F4','WIN + D','SHIFT + F4','SHIFT + F1'],g:0,exp:'No MS-Windows 10, ALT + F4 fecha a janela ativa em foco. Se a área de trabalho estiver em foco (sem janelas ativas), o ALT + F4 abre a caixa de diálogo de desligamento (Desligar/Reiniciar/Suspender). WIN + D minimiza todas as janelas mostrando a área de trabalho. Gabarito: A.'},
        {n:30,q:'A análise de dados de vigilância epidemiológica pode ser realizada de várias formas. Qual das opções representa formas CORRETAS de exploração de dados epidemiológicos?',ops:['Apenas por relatórios impressos mensalmente enviados ao Ministério da Saúde.','Por meio de redes sociais exclusivamente, sem banco de dados oficial.','Incluindo notificação compulsória de doenças (SINAN), inquéritos epidemiológicos e busca ativa de casos.','Apenas por meio de exames laboratoriais individuais sem sistematização.','Somente por entrevistas presenciais com pacientes internados.'],g:2,exp:'Os dados de vigilância epidemiológica são explorados de diversas formas: notificação compulsória de doenças pelo SINAN, inquéritos epidemiológicos (soro-epidemiológicos, nutricionais etc.), busca ativa de casos em campo, análise de mortalidade, boletins epidemiológicos e sistemas de informação em saúde (SIM, SINASC, etc.). Gabarito: C.'},
      ]},
      {nome:'Conhecimentos Gerais/Atualidades (Q31–Q40)',qs:[
        {n:31,q:'Quem assumiu o trono britânico após o falecimento da Rainha Elizabeth II, em setembro de 2022?',ops:['Príncipe William','Príncipe Philip','Príncipe Harry','Rei Carlos III (Príncipe Charles)','Príncipe Andrew'],g:3,exp:'Após o falecimento da Rainha Elizabeth II em 8 de setembro de 2022, seu filho mais velho, o Príncipe Charles, assumiu imediatamente o trono como Rei Carlos III. Elizabeth II reinou por 70 anos, sendo a monarca britânica com mais tempo no trono na história. Gabarito: D.'},
        {n:32,q:'Em 2023, qual era a composição original do grupo dos BRICS antes da expansão anunciada naquele ano?',ops:['Brasil, Rússia, Índia, China e Suriname','Brasil, Rússia, Índia, China e Argentina','Brasil, Rússia, Índia, China e Irã','Brasil, Rússia, Índia, China e Egito','Brasil, Rússia, Índia, China e África do Sul'],g:4,exp:'Os cinco países fundadores do BRICS são: Brasil, Rússia, Índia, China e África do Sul (a sigla é formada pelas iniciais em inglês: Brazil, Russia, India, China, South Africa). Em 2023, o grupo anunciou a expansão para incluir novos membros como Irã, Egito, Etiópia, Arábia Saudita, Emirados Árabes e Argentina. Gabarito: E.'},
        {n:33,q:'Em 2021, o Supremo Tribunal Federal (STF) decidiu sobre a suspeição do ex-juiz Sérgio Moro nos casos envolvendo o ex-presidente Lula. Qual foi a decisão do STF?',ops:['O STF reconheceu a parcialidade de Sérgio Moro, tornando-o suspeito para julgar os casos relacionados a Lula, anulando as condenações.','O STF manteve todas as condenações de Lula proferidas por Sérgio Moro.','O STF arquivou o processo por falta de provas.','O STF reduziu apenas a pena aplicada a Lula.','O STF anulou apenas a prisão de Lula, mantendo as demais sanções.'],g:0,exp:'O STF reconheceu, por maioria, a parcialidade (suspeição) do então juiz Sérgio Moro ao conduzir os processos do ex-presidente Lula na Operação Lava Jato, tornando-o suspeito. Isso anulou as condenações, restabelecendo os direitos políticos de Lula, que concorreu e venceu as eleições presidenciais de 2022. Gabarito: A.'},
        {n:34,q:'Qual cidade brasileira foi confirmada, em maio de 2023, para sediar a 30ª Conferência das Partes da Convenção-Quadro das Nações Unidas sobre Mudança do Clima (COP-30) em 2025?',ops:['São Paulo','Brasília','Belém do Pará','Rio de Janeiro','Manaus'],g:2,exp:'Em maio de 2023, o Brasil confirmou oficialmente a cidade de Belém do Pará como sede da COP-30, prevista para novembro de 2025. A escolha foi estratégica por situar Belém no coração da Amazônia, colocando o debate sobre desmatamento e mudanças climáticas no centro das discussões globais. Gabarito: C.'},
        {n:35,q:'Durante a pandemia de COVID-19, o isolamento social foi amplamente adotado como medida de contenção. De acordo com estudos de saúde mental, de que maneira o isolamento social impactou a população?',ops:['O isolamento fortaleceu as redes de apoio social presencial.','O isolamento reduziu significativamente a exposição à contaminação sem outros efeitos negativos.','A tecnologia dificultou o acesso a conteúdo digital durante o isolamento.','O ensino remoto trouxe apenas benefícios ao aprendizado sem impactos negativos.','O isolamento social impactou negativamente o bem-estar emocional e a saúde mental da população.'],g:4,exp:'Estudos realizados durante e após a pandemia de COVID-19 demonstraram que, embora o isolamento social tenha sido necessário para conter a disseminação do vírus, impactou negativamente o bem-estar emocional e a saúde mental, aumentando casos de ansiedade, depressão, estresse e outras condições psicológicas. Gabarito: E.'},
        {n:36,q:'Em relação ao Sistema Único de Saúde (SUS) no Brasil, assinale a alternativa CORRETA:',ops:['O SUS oferece serviços de saúde apenas a cidadãos economicamente desfavorecidos.','O SUS integra ações preventivas e curativas apenas para trabalhadores formais com carteira assinada.','O acesso ao SUS é universal e gratuito, promovendo a equidade no atendimento à saúde.','O SUS garante acesso exclusivo dos serviços de saúde básica para a população rural.','O SUS está reduzindo a participação do setor privado em todos os serviços de saúde.'],g:2,exp:'O SUS é regido pelos princípios constitucionais de universalidade (atende a todos), integralidade (ações preventivas e curativas em todos os níveis) e equidade. O acesso é gratuito para toda a população brasileira, independentemente de renda, contribuição previdenciária ou localização. Gabarito: C.'},
        {n:37,q:'Com relação à preservação da Amazônia, qual é o principal desafio ambiental enfrentado pelo Brasil na região?',ops:['O excesso de chuvas, que provoca frequentes enchentes e prejudica as comunidades.','O avanço da urbanização desordenada, que ameaça os ecossistemas mais próximos das capitais.','O desmatamento exclusivamente para fins industriais e mineração.','A falta de recursos hídricos e as pressões para a expansão agropecuária.','O excesso de recursos hídricos, que prejudica a sobrevivência das comunidades locais.'],g:3,exp:'O principal desafio ambiental para a Amazônia envolve a pressão pela expansão agropecuária (principalmente pecuária e cultivo de soja), que gera desmatamento acelerado, e a má distribuição ou degradação dos recursos hídricos. Essas pressões ameaçam a biodiversidade, o clima global e os povos tradicionais da região. Gabarito: D.'},
        {n:38,q:'Em 2023, o Brasil reafirmou seu compromisso com a agenda ambiental global. Qual foi a principal decisão do país em relação à política de mudanças climáticas?',ops:['O Brasil anunciou o abandono das metas de redução de emissões de CO₂.','O Brasil saiu definitivamente do Acordo de Paris.','O Brasil aumentou oficialmente o desmatamento como política de desenvolvimento.','O Brasil se comprometeu com novas metas climáticas e reafirmou o compromisso com o Acordo de Paris.','O Brasil proibiu toda e qualquer exploração mineral em território nacional.'],g:3,exp:'Em 2023, o governo Lula reafirmou o compromisso do Brasil com o Acordo de Paris e apresentou novas Contribuições Nacionalmente Determinadas (NDCs), comprometendo-se com desmatamento zero na Amazônia até 2030 e meta de neutralidade de carbono até 2050. O Brasil passou a ter postura ativa nas negociações climáticas internacionais. Gabarito: D.'},
        {n:39,q:'Em maio de 2023, o Brasil recebeu uma importante confirmação relacionada à pauta ambiental e climática global. Qual foi esse acontecimento?',ops:['O Brasil foi eleito o país mais sustentável do mundo pela ONU.','O Brasil inaugurou a maior usina solar da América Latina em Minas Gerais.','O Brasil anunciou a criação de 100 novas unidades de conservação ambiental na Amazônia.','O Brasil confirmou Belém do Pará como sede da COP-30 em novembro de 2025.','O Brasil assinou acordo para reduzir 90% das emissões industriais até 2030.'],g:3,exp:'Em maio de 2023, o governo brasileiro confirmou oficialmente que a cidade de Belém do Pará sediará a 30ª Conferência das Partes (COP-30) da Convenção-Quadro das Nações Unidas sobre Mudança do Clima (UNFCCC), prevista para novembro de 2025. A escolha de Belém foi estratégica por sua localização na Amazônia. Gabarito: D.'},
        {n:40,q:'A diversidade cultural é uma característica fundamental do Brasil. De que maneira o reconhecimento e a valorização da cultura indígena contribuem para a sociedade brasileira?',ops:['Estimulando apenas a venda de artesanato indígena em áreas remotas do país.','Resgatando e valorizando as tradições, línguas e saberes dos povos originários, fortalecendo a identidade nacional.','Reconhecendo apenas as religiões indígenas como patrimônio cultural imaterial.','Facilitando a assimilação das lideranças indígenas na cultura dominante não-indígena.','Substituindo a cultura ocidental pela cultura indígena nos currículos escolares.'],g:1,exp:'O reconhecimento da cultura indígena contribui para a sociedade ao resgatar e valorizar as tradições, línguas, saberes e práticas dos povos originários, enriquecendo a identidade nacional e promovendo o respeito à diversidade. O Brasil possui 305 povos indígenas e 274 línguas indígenas vivas (IBGE). Gabarito: B.'},
      ]},
      {nome:'Conhecimentos Específicos (Q41–Q60)',qs:[
        {n:41,q:'Qual é um dos principais objetivos do Novo Marco Legal do Saneamento Básico no Brasil, de acordo com a Lei Federal nº 14.026/2020?',ops:['Universalizar o acesso ao saneamento básico, garantindo água potável e esgotamento sanitário a toda a população até 2033.','Manter o monopólio estatal na prestação dos serviços de saneamento, impedindo a participação privada.','Transferir exclusivamente aos municípios a responsabilidade pelo financiamento do setor de saneamento.','Reduzir as metas de cobertura de saneamento para facilitar o cumprimento pelos municípios.','Extinguir a Agência Nacional de Águas e incorporar suas funções ao Ministério da Saúde.'],g:0,exp:'O Novo Marco Legal do Saneamento (Lei nº 14.026/2020) tem como principal objetivo universalizar o acesso ao saneamento básico até 2033: 99% da população com acesso a água potável e 90% com coleta e tratamento de esgoto. A lei também permite a participação da iniciativa privada por meio de concessões e fortalece a regulação nacional pela ANA. Gabarito: A.'},
        {n:42,q:'Qual órgão foi fortalecido pelo Novo Marco Legal do Saneamento Básico (Lei nº 14.026/2020) para regular e fiscalizar o setor de saneamento básico em nível nacional?',ops:['Ministério da Saúde (MS)','Agência Nacional de Saúde Suplementar (ANS)','Agência Nacional de Águas e Saneamento Básico (ANA)','Instituto Nacional de Pesquisas Espaciais (INPE)','Agência Nacional de Energia Elétrica (ANEEL)'],g:2,exp:'O Novo Marco Legal do Saneamento fortaleceu a Agência Nacional de Águas e Saneamento Básico (ANA) como órgão regulador do setor em âmbito nacional. A ANA passou a ter competência para editar normas de referência que orientam a regulação dos serviços pelos entes locais (estados e municípios). Gabarito: C.'},
        {n:43,texto:'Leia o texto a seguir para responder às questões 43 a 45.\n\nMaria, uma menina de cinco anos que vive em uma pequena aldeia em região rural, enfrenta grandes desafios em relação ao saneamento básico. Ela vive com sua família em uma casa simples, sem acesso a sistema de abastecimento de água tratada ou rede de esgoto. A família depende de um poço artesanal localizado próximo a uma latrina rudimentar para suprir suas necessidades de água.\n\nUm dia, Maria começou a se sentir mal: tinha dor de estômago intensa e febre alta. Seus pais a levaram ao posto de saúde, onde o médico diagnosticou diarreia causada por contaminação da água do poço por fezes. O médico explicou que a situação era comum na aldeia e poderia afetar outras famílias.',q:'De acordo com o texto, como o Agente de Combate às Endemias (ACE) poderia contribuir PRIORITARIAMENTE para melhorar a situação de Maria e da comunidade?',ops:['Fornecendo campanhas de vacinação em massa no contexto epidemiológico.','Realizando inspeções nos locais e orientando sobre a importância da distância mínima entre o poço e a latrina.','Orientando sobre construção de latrinas mais seguras para cada família na aldeia.','Realizando campanhas de vacinação contra diarreias na comunidade.','Coletando amostras de água do riacho para análise laboratorial.'],g:1,exp:'O ACE deve prioritariamente realizar inspeções nos locais para identificar a proximidade entre o poço artesanal e a latrina — uma das principais causas de contaminação por coliformes fecais — e orientar sobre as distâncias mínimas necessárias. Essa ação de vigilância ambiental e orientação sanitária é a atribuição central do ACE. Gabarito: B.'},
        {n:44,q:'De acordo com o texto sobre Maria, como o Agente de Combate às Endemias poderia orientar sobre o tratamento da água do poço para torná-la segura para consumo humano?',ops:['Realizar campanhas de concentração sobre a importância do saneamento básico.','Orientar que a cloração da água do poço com hipoclorito de sódio pode torná-la mais segura para consumo.','Orientar exclusivamente a cloração da água do riacho como principal medida.','Identificar e construir latrinas mais seguras para cada família na aldeia.','Verificar apenas a qualidade do solo em volta do poço artesanal.'],g:1,exp:'Uma das orientações mais importantes que o ACE pode fornecer é sobre o tratamento doméstico da água por cloração com hipoclorito de sódio (solução de 2 a 2,5%), eficaz na eliminação de bactérias causadoras de diarreias. É uma medida simples, barata e comprovadamente eficaz para populações sem acesso à água tratada. Gabarito: B.'},
        {n:45,q:'Considerando a situação descrita no texto sobre Maria, qual seria a conduta MAIS COMPLETA do Agente de Combate às Endemias para prevenir novos casos de diarreia na comunidade?',ops:['Realizar campanhas de concentração sobre a importância do saneamento básico.','Disseminar informações sobre boas práticas de higiene pessoal, como lavar as mãos.','Orientar sobre latinas mais seguras para cada família na aldeia.','Realizar campanhas de vacinação contra diarreias na comunidade.','Coletar amostras de água do poço para análise laboratorial e comunicar à vigilância sanitária e epidemiológica.'],g:4,exp:'A conduta mais completa é coletar amostras da água do poço para análise laboratorial e comunicar os resultados à vigilância sanitária e epidemiológica, permitindo medidas de controle baseadas em evidências e acompanhamento pela rede de saúde pública. Essa ação permite também identificar a extensão do problema na comunidade. Gabarito: E.'},
        {n:46,q:'Quais são alguns dos principais riscos ocupacionais aos quais os Agentes de Combate às Endemias (ACEs) estão expostos no exercício de suas atividades?',ops:['Apenas condições climáticas desfavoráveis e ausência de instalações sanitárias adequadas.','Uso de produtos químicos e uso inadequado de Equipamentos de Proteção Individual (EPIs).','Exposição a agentes biológicos (vetores e parasitas), uso de produtos químicos e condições climáticas adversas.','Apenas condições climáticas favoráveis e instalações sanitárias adequadas.','Uso inadequado de EPIs apenas em ambientes fechados e climatizados.'],g:2,exp:'Os ACEs estão expostos a múltiplos riscos ocupacionais: (1) biológicos — contato com vetores (mosquitos, carrapatos, roedores), animais peçonhentos e materiais contaminados; (2) químicos — uso de inseticidas, larvicidas e outros produtos; (3) físicos — exposição ao sol, chuva, calor e frio; (4) ergonômicos — caminhadas longas e transporte de equipamentos pesados. Gabarito: C.'},
        {n:47,q:'Qual é o principal objetivo da imunização ATIVA em saúde pública?',ops:['Estimular o sistema imunológico do próprio organismo a produzir resposta imune duradoura contra uma doença, por meio da vacinação.','Fornecer anticorpos prontos para o organismo, proporcionando imunidade imediata e passageira.','Introduzir anticorpos artificialmente por meio de soros ou imunoglobulinas heterólogas.','Garantir imunidade apenas por anticorpos das células T citotóxicas produzidas externamente.','Proporcionar proteção temporária por meio da transferência de anticorpos maternos ao recém-nascido.'],g:0,exp:'A imunização ATIVA consiste em estimular o sistema imunológico do próprio organismo (por meio de vacinas com agentes atenuados, inativados, toxoides ou subunidades) a produzir anticorpos e células de memória, conferindo imunidade duradoura. Já a imunização PASSIVA (soros e imunoglobulinas) oferece anticorpos prontos com proteção imediata, mas temporária. Gabarito: A.'},
        {n:48,q:'[QUESTÃO ANULADA] São ações que o ACE realiza para minimizar os riscos ocupacionais que enfrenta, EXCETO:',ops:['Usar corretamente os Equipamentos de Proteção Individual (EPIs).','Realizar o reconhecimento da área antes de iniciar as atividades de campo.','Trabalhar apenas em condições climáticas favoráveis, recusando trabalho em dias de chuva.','Comunicar ao supervisor situações de risco identificadas no campo.','Participar de treinamentos sobre saúde e segurança no trabalho.'],g:0,exp:'QUESTÃO ANULADA pela banca (marcada como X no gabarito oficial). Todos os candidatos receberam ponto. A resposta técnica que seria o EXCETO é a alternativa C: "Trabalhar apenas em condições climáticas favoráveis" — pois o ACE deve trabalhar em campo independente das condições climáticas (com os EPIs adequados), não podendo recusar trabalho por esse motivo.'},
        {n:49,q:'Sr. José foi agredido por um cachorro de rua que apresentava comportamento alterado e foi encaminhado ao posto de saúde. O médico prescreveu a vacina antirrábica. Qual a conduta CORRETA em relação ao esquema vacinal antirrábico humano pós-exposição?',ops:['Aplicar apenas soro antirrábico, pois a vacina não é eficaz após mordida.','Aplicar apenas a vacina antirrábica sem necessidade de observar o animal.','Iniciar imediatamente o esquema vacinal e, dependendo da situação do animal e da gravidade da exposição, associar o soro antirrábico (imunoglobulina).','Aguardar 30 dias para observar o animal antes de iniciar qualquer tratamento.','Tratar apenas com antibióticos, pois a raiva não tem cura após os sintomas neurológicos.'],g:2,exp:'No protocolo pós-exposição à raiva: lavar imediatamente a ferida com água e sabão e iniciar o esquema vacinal. Para exposições graves (mordida de animal com suspeita de raiva sem possibilidade de observação), associa-se o soro antirrábico (imunoglobulina) à vacina. A raiva é 100% fatal após o aparecimento dos sintomas neurológicos, tornando o tratamento pós-exposição imediato imprescindível. Gabarito: C.'},
        {n:50,q:'Quais são as atividades mais características das atribuições de um Agente de Combate às Endemias (ACE) em uma comunidade?',ops:['Realizar diagnósticos médicos e prescrever tratamentos para doenças endêmicas.','Realizar visitas domiciliares para identificar e eliminar focos de vetores, orientar a população e coletar dados epidemiológicos.','Realizar coleta de sangue para testes de doenças crônicas nos domicílios.','Fornecer tratamento médico direto a pacientes com doenças endêmicas identificados nas visitas.','Administrar medicamentos para doenças endêmicas nas residências durante as visitas.'],g:1,exp:'As atribuições do ACE incluem: visitas domiciliares para identificar e eliminar criadouros de vetores (mosquitos, roedores etc.), orientar a comunidade sobre prevenção de endemias, coletar dados para vigilância epidemiológica, aplicar larvicidas e inseticidas quando necessário, e notificar casos suspeitos. O ACE não realiza diagnósticos médicos nem prescreve/administra medicamentos. Gabarito: B.'},
        {n:51,q:'Em que situação se utiliza a imunização ATIVA em saúde pública?',ops:['Quando se deseja proporcionar imunidade imediata por meio de soros e imunoglobulinas em emergências.','Quando se necessita de imunização rápida após exposição confirmada a um agente infeccioso.','Quando o paciente já apresenta sintomas da doença e necessita de tratamento imediato.','Quando se deseja estimular o sistema imunológico a produzir resposta imune duradoura contra uma doença.','Quando se quer transferir anticorpos maternos para o recém-nascido via amamentação.'],g:3,exp:'A imunização ATIVA é utilizada quando o objetivo é estimular o próprio sistema imunológico a produzir resposta duradoura por meio da vacinação — essa é a base dos programas de imunização em saúde pública (calendário vacinal). A imunização PASSIVA (soros/imunoglobulinas) é usada em emergências (pós-exposição) quando não há tempo para a resposta imune ativa. Gabarito: D.'},
        {n:52,q:'Qual é o tratamento recomendado como primeira linha para casos de diarreia aguda leve a moderada em crianças, como a apresentada por Maria no texto?',ops:['Administração imediata de antibióticos de amplo espectro por 10 dias.','Internação hospitalar para hidratação venosa exclusiva.','Reidratação oral com Soro de Reidratação Oral (SRO) e manutenção da alimentação habitual.','Jejum por 24 horas para descanso do sistema digestivo.','Uso exclusivo de probióticos sem qualquer forma de hidratação oral.'],g:2,exp:'O tratamento de primeira linha para diarreia aguda leve a moderada em crianças é a Terapia de Reidratação Oral (TRO) com Soro de Reidratação Oral (SRO), conforme recomendado pelo Ministério da Saúde e pela OMS. A alimentação deve ser mantida. Antibióticos só são indicados em casos específicos (diarreias bacterianas graves). O jejum é contraindicado. Gabarito: C.'},
        {n:53,q:'Os ACEs de uma pequena cidade rural reuniram-se para discutir ações de controle da Leishmaniose Visceral (calazar), doença transmitida por flebotomíneos (mosquito-palha). Qual é a principal ação de controle vetorial que o ACE pode realizar para reduzir a transmissão?',ops:['Realizar cirurgias nos cães reservatórios infectados para reduzir a carga parasitária.','Promover campanhas de vacinação em massa da população humana contra a leishmaniose.','Distribuir medicamentos anti-leishmania para toda a comunidade preventivamente.','Realizar a borrifação residual intradomiciliar com inseticidas para eliminar os flebotomíneos.','Administrar antibióticos à população em risco de infecção por Leishmania.'],g:3,exp:'O controle da Leishmaniose Visceral envolve três frentes: (1) controle do vetor — borrifação residual com inseticidas (principal ação do ACE), uso de telas e repelentes; (2) controle do reservatório — eutanásia de cães soropositivos; (3) diagnóstico e tratamento precoce dos casos humanos. Não existe vacina humana disponível para leishmaniose visceral no Brasil. Gabarito: D.'},
        {n:54,q:'Qual foi o principal objetivo das ações dos ACEs ao planejar intervenções para o controle da Leishmaniose Visceral em uma área de alto risco?',ops:['Realizar procedimentos médicos em pacientes com leishmaniose diagnosticada.','Identificar áreas de alto risco, coletar dados epidemiológicos e implementar medidas de controle vetorial e de reservatórios.','Promover campanhas de vacinação em massa independentemente do perfil epidemiológico local.','Fornecer tratamento médico direto a todos os pacientes identificados no campo.','Fiscalizar farmácias e distribuir medicamentos para doenças endêmicas.'],g:1,exp:'O principal objetivo do ACE nas ações de controle da Leishmaniose Visceral é: identificar as áreas de alto risco epidemiológico (por análise territorial e de dados), realizar o inquérito canino para identificar animais soropositivos, implementar controle vetorial (borrifação intradomiciliar) e educar a comunidade sobre medidas preventivas. Gabarito: B.'},
        {n:55,q:'Quais das medidas específicas os ACEs podem tomar para erradicar ou controlar a Leishmaniose Visceral em uma comunidade endêmica?',ops:['Conduzir pesquisas acadêmicas exclusivas para publicação científica nacional e internacional.','Eliminar todos os animais domésticos da área, indiscriminadamente e sem critérios técnicos.','Realizar ações de educação em saúde, controle vetorial (borrifação), inquérito canino e orientação sobre uso de telas e repelentes.','Eliminar apenas os cães com sintomas visíveis de leishmaniose sem realização de exames.','Aguardar as ações do Ministério da Saúde sem intervenção local.'],g:2,exp:'As medidas específicas dos ACEs no controle da Leishmaniose Visceral incluem: ações de educação em saúde para a comunidade; controle vetorial por borrifação com inseticidas; apoio ao inquérito soroepidemiológico canino para identificação de cães positivos; orientação sobre uso de telas, mosquiteiros e repelentes; e notificação de casos suspeitos humanos. Gabarito: C.'},
        {n:56,q:'Qual das seguintes alternativas representa uma forma de identificação de um surto ou epidemia pelo Agente de Combate às Endemias?',ops:['Realizando busca ativa de casos suspeitos nos domicílios e comunicando imediatamente à vigilância epidemiológica.','Realizando campanhas educacionais nas escolas sem levantamento de dados epidemiológicos.','Analisando apenas os dados fornecidos pelo Ministério da Saúde sem investigação local.','Verificando apenas as condições de moradia, sem notificação dos casos identificados.','Aguardando que os casos se apresentem espontaneamente à unidade de saúde.'],g:0,exp:'A identificação de surtos é feita pela busca ativa de casos — o ACE vai ativamente aos domicílios, identifica casos suspeitos e os comunica imediatamente à vigilância epidemiológica. Essa ação proativa permite a detecção precoce e o controle de surtos antes que se tornem epidemias. A notificação imediata é obrigação legal prevista na legislação de vigilância epidemiológica. Gabarito: A.'},
        {n:57,q:'O SINAN (Sistema de Informação de Agravos de Notificação) é um importante instrumento da vigilância epidemiológica. Assinale a alternativa que descreve CORRETAMENTE uma característica do SINAN:',ops:['O SINAN registra apenas doenças de notificação imediata, excluindo as de notificação semanal.','O SINAN é de acesso exclusivo ao Ministério da Saúde, sem compartilhamento com estados e municípios.','O SINAN é um sistema padronizado para registro das atividades de vigilância epidemiológica, permitindo o conhecimento da incidência, prevalência e distribuição das doenças notificáveis.','O SINAN registra apenas óbitos por doenças notificáveis, não os casos vivos.','O SINAN é um sistema de informação privado, gerido por empresas de saúde.'],g:2,exp:'O SINAN é o sistema de informação do Ministério da Saúde para registro e processamento de doenças e agravos de notificação compulsória. Permite o conhecimento da incidência, prevalência, distribuição espaço-temporal e perfil das doenças notificáveis no Brasil, subsidiando o planejamento, execução e avaliação das ações de vigilância epidemiológica. Gabarito: C.'},
        {n:58,q:'Considerando as Notificações Compulsórias definidas pelo Ministério da Saúde em relação ao SINAN, a "notificação negativa" indica que:',ops:['Os profissionais de saúde ativos na unidade comunicaram regularmente a ausência de casos de determinada doença na sua área de abrangência, comprovando o funcionamento do sistema de vigilância.','Houve casos confirmados da doença, mas todos foram resolvidos sem complicações ou sequelas.','O SINAN recusou a notificação por inconsistência nos dados informados pelo notificador.','Os casos foram notificados com resultado negativo no exame laboratorial, confirmando ausência de doença.','A doença foi definitivamente erradicada na área de abrangência da unidade de saúde.'],g:0,exp:'A "notificação negativa" é a comunicação regular e sistemática de que, em determinada semana epidemiológica, não foram registrados casos de doenças de notificação compulsória na área de abrangência da unidade de saúde. É fundamental para confirmar que o sistema está ativo — sem ela, não se sabe se a ausência de registros significa ausência de casos ou falha na vigilância. Gabarito: A.'},
        {n:59,q:'Qual é a principal função dos Agentes de Combate às Endemias (ACE) no contexto da epidemiologia?',ops:['Realizar cirurgias e procedimentos médicos em pacientes com doenças endêmicas.','Promover campanhas de imunização em massa independentemente do risco epidemiológico local.','Coletar dados e informações sobre doenças endêmicas para auxiliar na identificação de tendências epidemiológicas e na elaboração de estratégias de controle.','Fornecer tratamento médico direto a pacientes com doenças endêmicas nas visitas domiciliares.','Fiscalizar e representar a indústria farmacêutica na produção de medicamentos para doenças endêmicas.'],g:2,exp:'No contexto epidemiológico, a principal função do ACE é ser o braço operacional da vigilância epidemiológica no território: coletando dados sobre ocorrência de vetores e casos suspeitos, identificando tendências e padrões de distribuição das doenças, e contribuindo para a elaboração e avaliação de estratégias de controle. O ACE não realiza diagnósticos médicos nem prescreve tratamentos. Gabarito: C.'},
        {n:60,q:'Qual é o papel da epidemiologia na atuação dos Agentes de Combate às Endemias (ACE)?',ops:['A epidemiologia não desempenha papel relevante no trabalho do ACE, pois sua função é exclusivamente controlar vetores.','A epidemiologia é responsável por administrar a logística das ações do ACE, mas não influencia a coleta de dados.','A epidemiologia auxilia o ACE na identificação de áreas de alto risco, na coleta de dados sobre doenças e na avaliação da eficácia das intervenções realizadas.','A epidemiologia é responsável por fornecer tratamento médico direto aos pacientes identificados pelo ACE.','A epidemiologia não tem relação com o trabalho dos ACE, pois são campos distintos da saúde pública.'],g:2,exp:'A epidemiologia é a ciência fundamental que orienta todo o trabalho do ACE: (1) identifica áreas de maior risco (mapeamento de vetores e casos); (2) fundamenta a coleta sistemática de dados durante as visitas domiciliares; (3) permite avaliar a eficácia das intervenções realizadas; (4) subsidia o planejamento das ações de controle de endemias. Gabarito: C.'},
      ]},
    ]

    secoes:[
      {nome:'Língua Portuguesa (Q1–Q15)',qs:[
        {n:1,texto:'A complicada arte de ver Ela entrou, deitou-se no divã e disse: "Acho que estou ficando louca". Eu fiquei em silêncio aguardando que ela me revelasse os sinais da sua loucura. "Um dos meus prazeres é cozinhar. Vou para a cozinha, corto as cebolas, os tomates, os pimentões - é uma alegria! Entretanto, faz uns dias, eu fui para a cozinha para fazer aquilo que já fizera centenas de vezes: cortar cebolas. Ato banal sem surpresas. Mas, cortada a cebola, eu olhei para ela e tive um susto. Percebi que nunca havia visto uma cebola. Aqueles anéis perfeitamente ajustados, a luz se refletindo neles: tive a impressão de estar vendo a rosácea de um vitral de catedral gótica. De repente, a cebola, de objeto a ser comido, se transformou em obra de arte para ser vista! E o pior é que o mesmo aconteceu quando cortei os tomates, os pimentões... Agora, tudo o que vejo me causa espanto." Ela se calou, esperando o meu diagnóstico. Eu me levantei, fui à estante de livros e de lá retirei as Odes Elementales, de Pablo Neruda. Procurei a "Ode à Cebola" e lhe disse: "Essa perturbação ocular que a acometeu é comum entre os poetas. Veja o que Neruda disse de uma cebola igual àquela que lhe causou assombro: \'Rosa de água com escamas de cristal\'. Não, você não está louca. Você ganhou olhos de poeta... Os poetas ensinam a ver". Rubem Alves, Folha de S. Paulo, 26.out.2004. ### Texto para as questões de 11 a 15 Ode à Cebola Luminosa redoma pétala a pétala cresceu a tua formosura escamas de cristal te acrescentaram e no segredo da terra escura se foi arredondando o teu ventre de orvalho. Sob a terra foi o milagre e, quando apareceu o teu rude caule verde e nasceram as tuas folhas como espadas na horta, a terra acumulou o seu poderio, mostrando a tua nua transparência, e como em Afrodite o mar remoto duplicou a magnólia, levantando os seus seios, a terra assim te fez cebola, clara como um planeta a reluzir, constelação constante, redonda rosa de água, sobre a mesa das gentes pobres. Generosa desfazes o teu globo de frescura na consumação fervente da frigideira e os estilhaços de cristal no calor inflamado do azeite transformam-se em frisadas plumas de ouro. Também recordarei como fecunda a tua influência, o amor, na salada e parece que o céu contribui dando-te fina forma de granizo a celebrar a tua claridade picada sobre os hemisférios de um tomate. mas ao alcance das mãos do povo regada com azeite polvilhada com um pouco de sal, matas a fome do jornaleiro no seu duro caminho. estrela dos pobres, fada madrinha envolvida em delicado papel, sais do chão eterna, intacta, pura como semente de um astro e ao cortar-te a faca na cozinha sobe a única lágrima sem pena. Fizeste-nos chorar sem nos afligir. Eu tudo o que existe celebrei, cebola Mas para mim és mais formosa que uma ave de penas radiosas és para os meus olhos globo celeste, taça de platina baile imóvel de névea anêmona e vive a fragrância da Terra na tua natureza cristalina. NERUDA, Pablo. Ode à cebola. In: NERUDA, Pablo. Odes elementares',q:'Considerando a construção do texto, é correto afirmar que sua intencionalidade discursiva consiste em',ops:['valorizar a capacidade de observação do narrador diante de elementos cotidianos, sugerindo que a percepção sensível desses elementos depende fundamentalmente do conhecimento prévio de referências literárias.','apresentar informações utilitárias sobre as propriedades da cebola, a partir de uma referência literária a Neruda como recurso de comprovação científica.','relatar uma experiência cotidiana de maneira cômica e humorística, com o propósito de provocar no leitor uma identificação imediata com situações domésticas semelhantes.','defender a superioridade da visão poética sobre a percepção comum, estabelecendo uma oposição absoluta entre aqueles que possuem sensibilidade artística e aqueles que não são capazes de compreender a realidade.','transformar uma experiência ordinária em uma reflexão sobre o olhar e a capacidade de atribuir novos sentidos ao cotidiano, aproximando a percepção do narrador da perspectiva poética evocada no texto.'],g:4,exp:'Gabarito: E.'},
        {n:2,q:'Aponte o item em que, conforme a divisão silábica, as palavras demarcadas apresentem o número de sílabas descrito entre parênteses corretamente.',ops:['"[...] faz uns dias, eu fui para a cozinha [...]" (dissílaba).','"[...] é uma alegria". (trissílaba).','"Um dos meus prazeres é cozinhar." (monossílaba).','"[...] ela me revelasse os sinais [...]" (trissílaba).','"Ela entrou." (monossílaba).'],g:2,exp:'Gabarito: C.'},
        {n:3,q:'"Acho que estou ficando louca." A palavra "louca" apresenta um ditongo decrescente, assim como o vocábulo ressaltado em',ops:['"Eu fiquei em silêncio."','"[...] tudo o que vejo me causa espanto."','"Percebi que nunca havia visto uma cebola."','"[...] ela me revelasse os sinais da sua loucura."','"\'Rosa de água com escamas de cristal\'."'],g:1,exp:'Gabarito: B.'},
        {n:4,q:'No vocábulo "vitral", empregado no trecho "[...] tive a impressão de estar vendo a rosácea de um vitral de catedral gótica", observa-se uma alteração na formação do radical da palavra "vidro". Esse fenômeno linguístico é denominado de',ops:['alomorfia.','aférese.','aglutinação.','apócope.','síncope.'],g:0,exp:'Gabarito: A.'},
        {n:5,q:'"Percebi que nunca havia visto uma cebola." O tempo verbal composto destacado encontra-se estruturado no',ops:['pretérito mais-que-perfeito composto do indicativo.','pretérito perfeito composto do indicativo.','futuro do pretérito composto do indicativo.','pretérito perfeito composto do subjuntivo.','pretérito mais-que-perfeito composto do subjuntivo.'],g:0,exp:'Gabarito: A.'},
        {n:6,q:'"Aqueles anéis perfeitamente ajustados, a luz se refletindo neles" Em analogia ao vocábulo "anéis", o termo ressaltado está corretamente acentuado em',ops:['A cebola é uma jóia entre os bulbos.','Ela ficou paranóica com a reação química provocada pela cebola.','A cebola corróe o metal quando permanece em contato com ele por muito tempo.','Tive uma idéia para uma excelente receita culinária.','A geléia de cebola é um excelente aperitivo.'],g:2,exp:'Gabarito: C.'},
        {n:7,q:'"Vou para a cozinha, corto as cebolas, os tomates, os pimentões." Tendo por base o gênero do vocábulo "tomates", há um substantivo masculino realçado corretamente no item',ops:['O cal foi utilizado na reforma para pintar as paredes.','O omoplata é um osso localizado na região posterior do ombro.','O herpes labial precisa de tratamento médico.','O dinamite é um potente artefato explosivo criado pelo químico sueco Alfred Nobel.','O alface pertence à família das asteráceas.'],g:2,exp:'Gabarito: C.'},
        {n:8,q:'"Você ganhou olhos de poeta... Os poetas ensinam a ver". As palavras "poeta" e "poetas", nos sintagmas em evidência, assumem função, respectivamente, de',ops:['adjetivo e adjetivo.','substantivo e adjetivo.','adjetivo e substantivo.','substantivo e substantivo.','advérbio e adjetivo.'],g:2,exp:'Gabarito: C.'},
        {n:9,q:'"Veja o que Neruda disse [...]" O termo demarcado se trata de um pronome',ops:['pessoal do caso oblíquo.','relativo.','pessoal do caso reto.','indefinido.','demonstrativo.'],g:4,exp:'Gabarito: E.'},
        {n:10,q:'Há um vocábulo formado por deverbalização destacado na alternativa',ops:['"Um dos meus prazeres é cozinhar."','"Ela se calou, esperando o meu diagnóstico."','"[...] igual àquela que lhe causou assombro."','"Mas, cortada a cebola, eu olhei para ela e tive um susto."','"Agora, tudo o que vejo me causa espanto."'],g:2,exp:'Gabarito: C.'},
        {n:11,texto:'Ode à Cebola Luminosa redoma pétala a pétala cresceu a tua formosura escamas de cristal te acrescentaram e no segredo da terra escura se foi arredondando o teu ventre de orvalho. Sob a terra foi o milagre e, quando apareceu o teu rude caule verde e nasceram as tuas folhas como espadas na horta, a terra acumulou o seu poderio, mostrando a tua nua transparência, e como em Afrodite o mar remoto duplicou a magnólia, levantando os seus seios, a terra assim te fez cebola, clara como um planeta a reluzir, constelação constante, redonda rosa de água, sobre a mesa das gentes pobres. Generosa desfazes o teu globo de frescura na consumação fervente da frigideira e os estilhaços de cristal no calor inflamado do azeite transformam-se em frisadas plumas de ouro. Também recordarei como fecunda a tua influência, o amor, na salada e parece que o céu contribui dando-te fina forma de granizo a celebrar a tua claridade picada sobre os hemisférios de um tomate. mas ao alcance das mãos do povo regada com azeite polvilhada com um pouco de sal, matas a fome do jornaleiro no seu duro caminho. estrela dos pobres, fada madrinha envolvida em delicado papel, sais do chão eterna, intacta, pura como semente de um astro e ao cortar-te a faca na cozinha sobe a única lágrima sem pena. Fizeste-nos chorar sem nos afligir. Eu tudo o que existe celebrei, cebola Mas para mim és mais formosa que uma ave de penas radiosas és para os meus olhos globo celeste, taça de platina baile imóvel de névea anêmona e vive a fragrância da Terra na tua natureza cristalina. NERUDA, Pablo. Ode à cebola. In: NERUDA, Pablo. Odes elementares Q1: Considerando a construção do texto, é correto afirmar que sua intencionalidade discursiva consiste em (A) valorizar a capacidade de observação do narrador diante de elementos cotidianos, sugerindo que a percepção sensível desses elementos depende fundamentalmente do conhecimento prévio de referências literárias. (B) apresentar informações utilitárias sobre as propriedades da cebola, a partir de uma referência literária a Neruda como recurso de comprovação científica. (C) relatar uma experiência cotidiana de maneira cômica e humorística, com o propósito de provocar no leitor uma identificação imediata com situações domésticas semelhantes. (D) defender a superioridade da visão poética sobre a percepção comum, estabelecendo uma oposição absoluta entre aqueles que possuem sensibilidade artística e aqueles que não são capazes de compreender a realidade. (E) transformar uma experiência ordinária em uma reflexão sobre o olhar e a capacidade de atribuir novos sentidos ao cotidiano, aproximando a percepção do narrador da perspectiva poética evocada no texto. Q2: Aponte o item em que, conforme a divisão silábica, as palavras demarcadas apresentem o número de sílabas descrito entre parênteses corretamente. (A) "[...] faz uns dias, eu fui para a cozinha [...]" (dissílaba). (B) "[...] é uma alegria". (trissílaba). (C) "Um dos meus prazeres é cozinhar." (monossílaba). (D) "[...] ela me revelasse os sinais [...]" (trissílaba). (E) "Ela entrou." (monossílaba). Q3: "Acho que estou ficando louca." A palavra "louca" apresenta um ditongo decrescente, assim como o vocábulo ressaltado em (A) "Eu fiquei em silêncio." (B) "[...] tudo o que vejo me causa espanto." (C) "Percebi que nunca havia visto uma cebola." (D) "[...] ela me revelasse os sinais da sua loucura." (E) "\'Rosa de água com escamas de cristal\'." Q4: No vocábulo "vitral", empregado no trecho "[...] tive a impressão de estar vendo a rosácea de um vitral de catedral gótica", observa-se uma alteração na formação do radical da palavra "vidro". Esse fenômeno linguístico é denominado de (A) alomorfia. (B) aférese. (C) aglutinação. (D) apócope. (E) síncope. Q5: "Percebi que nunca havia visto uma cebola." O tempo verbal composto destacado encontra-se estruturado no (A) pretérito mais-que-perfeito composto do indicativo. (B) pretérito perfeito composto do indicativo. (C) futuro do pretérito composto do indicativo. (D) pretérito perfeito composto do subjuntivo. (E) pretérito mais-que-perfeito composto do subjuntivo. Q6: "Aqueles anéis perfeitamente ajustados, a luz se refletindo neles" Em analogia ao vocábulo "anéis", o termo ressaltado está corretamente acentuado em (A) A cebola é uma jóia entre os bulbos. (B) Ela ficou paranóica com a reação química provocada pela cebola. (C) A cebola corróe o metal quando permanece em contato com ele por muito tempo. (D) Tive uma idéia para uma excelente receita culinária. (E) A geléia de cebola é um excelente aperitivo. Q7: "Vou para a cozinha, corto as cebolas, os tomates, os pimentões." Tendo por base o gênero do vocábulo "tomates", há um substantivo masculino realçado corretamente no item (A) O cal foi utilizado na reforma para pintar as paredes. (B) O omoplata é um osso localizado na região posterior do ombro. (C) O herpes labial precisa de tratamento médico. (D) O dinamite é um potente artefato explosivo criado pelo químico sueco Alfred Nobel. (E) O alface pertence à família das asteráceas. Q8: "Você ganhou olhos de poeta... Os poetas ensinam a ver". As palavras "poeta" e "poetas", nos sintagmas em evidência, assumem função, respectivamente, de (A) adjetivo e adjetivo. (B) substantivo e adjetivo. (C) adjetivo e substantivo. (D) substantivo e substantivo. (E) advérbio e adjetivo. Q9: "Veja o que Neruda disse [...]" O termo demarcado se trata de um pronome (A) pessoal do caso oblíquo. (B) relativo. (C) pessoal do caso reto. (D) indefinido. (E) demonstrativo. Q10: Há um vocábulo formado por deverbalização destacado na alternativa (A) "Um dos meus prazeres é cozinhar." (B) "Ela se calou, esperando o meu diagnóstico." (C) "[...] igual àquela que lhe causou assombro." (D) "Mas, cortada a cebola, eu olhei para ela e tive um susto." (E) "Agora, tudo o que vejo me causa espanto."',q:'A partir da leitura do poema, é possível inferir que a representação da cebola construída pelo eu lírico',ops:['estabelece uma idealização da natureza que contrapõe a simplicidade dos alimentos à grandiosidade dos elementos celestes, valorizando sobretudo aquilo que possui caráter extraordinário.','ressignifica um elemento utilitário ao associá-lo a imagens de grandeza, beleza e luminosidade, fazendo convergir a dimensão lírica e sua importância concreta na vida das pessoas.','constrói uma oposição entre a natureza e a ação humana, uma vez que a cebola aparece inicialmente como criação da terra, mas perde sua pureza e sua beleza ao ser submetida ao preparo culinário.','apresenta a cebola como símbolo da condição sofrida das classes populares, utilizando sua aparência frágil e seu efeito lacrimoso como metáforas das dificuldades enfrentadas pelo trabalhador.','evidencia a tentativa de afastar a cebola de sua função alimentar, transformando-a em um objeto estético e desvinculado da realidade social.'],g:1,exp:'Gabarito: B.'},
        {n:12,q:'O diálogo entre o título do poema e os modos de representação da cebola ao longo dos versos permite compreender que o título',ops:['antecipa uma abordagem expositiva, posteriormente desenvolvida pela apresentação referencial da cebola.','restringe a interpretação do poema à dimensão afetiva, fazendo com que as referências à terra, ao alimento, aos trabalhadores e aos elementos celestes funcionem como recursos secundários de ornamentação poética.','estabelece uma expectativa de exaltação que é progressivamente ampliada pelo poema, à medida que a cebola deixa de ser apenas alimento e passa a integrar uma imagem transcendental.','amplia o sentido do conteúdo ao apresentar a cebola como elemento associado à alimentação e ao trabalho, restringindo as imagens de natureza e transcendência a recursos ornamentais.','produz um efeito de contraste com o conteúdo, pois a cebola, apesar de inicialmente exaltada, é gradualmente reduzida à sua condição de alimento e subsistência.'],g:2,exp:'Gabarito: C.'},
        {n:13,q:'As preposições destacadas nos versos seguintes estabelecem, respectivamente, relações de "Sob a terra foi o milagre [...] redonda rosa de água, sobre a mesa das gentes pobres."',ops:['causa e finalidade, indicando a origem do milagre e o destino da cebola.','localização e suporte, indicando, respectivamente, o espaço de origem da cebola e o espaço em que ela se encontra disponível às pessoas.','tempo e lugar, sugerindo que o milagre ocorreu anteriormente ao momento em que a cebola foi colocada à mesa.','interioridade e exterioridade, delimitando os espaços em que a cebola se desenvolve e posteriormente é apresentada.','localização e assunto, sendo "sob" empregado para indicar posição inferior e "sobre" para introduzir aquilo a respeito de que se fala.'],g:1,exp:'Gabarito: B.'},
        {n:14,q:'Atente-se ao termo realçado nos versos a seguir e, a partir da sua dimensão sonora, aponte a alternativa correta quanto ao seu número de fonemas. "e no segredo da terra escura se foi arredondando o teu ventre de **orvalho**."',ops:['5 fonemas.','11 fonemas.','9 fonemas.','8 fonemas.','10 fonemas.'],g:2,exp:'Gabarito: C.'},
        {n:15,q:'Plumas de ouro é o mesmo que plumas áureas. Logo, essa relação entre o adjetivo e a locução adjetiva, a partir do sintagma demarcado nos versos seguintes, também se encontra corretamente na alternativa "e os estilhaços de cristal no calor inflamado do azeite transformam-se em frisadas plumas de ouro."',ops:['Torre de marfim: torre lígea.','Círculo de fogo: círculo ígneo.','Quadro de madeira: quadro ebórneo.','Pele de lobo: pele símia.','Unhas de gato: unhas ferinas.'],g:1,exp:'Gabarito: B.'}
      ]},
      {nome:'Noções de Informática (Q16–Q20)',qs:[
        {n:16,q:'Durante a tramitação de um processo administrativo eletrônico, um analista precisou encaminhar, por correio eletrônico, um conjunto de documentos técnicos contendo planilhas, relatórios e pareceres. Antes do envio, verificou que o tamanho total dos anexos ultrapassava o limite aceito pelo serviço de e-mail institucional. A equipe de tecnologia orientou que fosse utilizada uma funcionalidade compatível com o Microsoft 365, preservando a integridade dos arquivos e permitindo o acesso apenas aos destinatários autorizados, sem a necessidade de fragmentar o material em diversas mensagens. Assinale a alternativa que apresenta o procedimento mais adequado para a situação descrita.',ops:['Enviar os documentos para um serviço público de compartilhamento e inserir na mensagem um link sem restrições de acesso aos arquivos armazenados.','Inserir os documentos em uma apresentação do PowerPoint e encaminhar apenas o arquivo resultante como anexo da mensagem.','Armazenar os documentos no OneDrive e compartilhar o link de acesso aos destinatários com as permissões apropriadas.','Converter todos os documentos para o formato PDF, reduzindo automaticamente o tamanho dos arquivos para atender ao limite do serviço de e-mail.','Compactar os arquivos em múltiplos volumes independentes e encaminhar cada parte em mensagens distintas, mantendo o processo de anexação convencional.'],g:2,exp:'Gabarito: C.'},
        {n:17,q:'Uma equipe elaborou um relatório técnico contendo dezenas de figuras, tabelas e gráficos distribuídos ao longo do documento. Antes da publicação, surgiu a necessidade de gerar automaticamente uma lista com todas as ilustrações, mantendo a numeração atualizada sempre que novos elementos fossem inseridos ou reorganizados. Para atender a esse requisito, foi recomendada a utilização de recursos nativos do Microsoft Word. Assinale a alternativa que apresenta o procedimento adequado para produzir o resultado esperado.',ops:['Aplicar marcadores automáticos em todas as figuras, permitindo que a lista seja criada a partir da estrutura de tópicos do documento.','Inserir caixas de texto numeradas manualmente ao lado de cada figura e organizar uma relação das ilustrações ao final do documento.','Utilizar quebras de seção para separar as ilustrações, permitindo que o Word gere automaticamente uma relação de objetos gráficos.','Inserir legendas nos elementos gráficos e gerar uma tabela de ilustrações utilizando os recursos automáticos do Word.','Aplicar estilos de título diretamente às imagens, permitindo que o sumário geral do documento funcione automaticamente como tabela de ilustrações.'],g:3,exp:'Gabarito: D.'},
        {n:18,q:'Durante uma inspeção realizada, um servidor precisou abrir rapidamente um arquivo PDF recebido por correio eletrônico utilizando o aplicativo apropriado, sem alterar a associação padrão dos demais tipos de arquivos existentes no computador. A equipe de suporte orientou que o procedimento fosse realizado utilizando um recurso nativo do Windows, permitindo a escolha do aplicativo apenas para aquela ocasião, preservando as configurações previamente estabelecidas para o sistema operacional. Assinale a alternativa que apresenta o procedimento adequado para atender ao cenário descrito.',ops:['Alterar o aplicativo padrão do sistema para arquivos PDF, tornando permanente a nova associação para todas as futuras aberturas.','Alterar as configurações de compatibilidade do arquivo PDF, fazendo com que o Windows execute temporariamente qualquer aplicativo instalado no computador.','Utilizar a opção "Abrir com", escolhendo o aplicativo desejado sem definir obrigatoriamente uma nova associação padrão ao tipo de arquivo.','Executar o arquivo diretamente pelo Prompt de Comando, permitindo que o Windows selecione automaticamente um aplicativo compatível.','Renomear a extensão do arquivo para um formato associado ao aplicativo pretendido, preservando automaticamente seu conteúdo original.'],g:2,exp:'Gabarito: C.'},
        {n:19,q:'Durante a elaboração de uma nota técnica, um servidor precisou organizar o documento em títulos e subtítulos hierarquicamente estruturados. Além de manter a formatação padronizada, o recurso utilizado deveria permitir a alteração uniforme da aparência de todos os títulos de determinado nível e possibilitar, posteriormente, a geração de um sumário automático com base nessa estrutura. Considerando os recursos nativos do Microsoft Word, assinale a alternativa correta.',ops:['Aplicar o Pincel de Formatação aos títulos, pois ele vincula permanentemente os elementos e atualiza todos eles quando um título é modificado.','Inserir quebras de página antes de cada título, pois elas estabelecem os níveis hierárquicos utilizados na geração do sumário automático.','Utilizar caixas de texto para separar os títulos do restante do documento, determinando automaticamente a hierarquia das seções.','Aplicar os estilos de título, como "Título 1", "Título 2" e "Título 3", conforme os níveis hierárquicos do documento.','Aplicar marcadores aos títulos e subtítulos, uma vez que a lista resultante é utilizada pelo Word como estrutura para a geração do sumário automático.'],g:3,exp:'Gabarito: D.'},
        {n:20,q:'Durante a atualização do parque computacional de uma prefeitura, a equipe de tecnologia interligou os computadores, servidores e impressoras instalados em um mesmo prédio administrativo. A rede foi configurada para permitir o compartilhamento de arquivos e equipamentos entre os setores, utilizando infraestrutura de comunicação mantida pela própria instituição e limitada às dependências do edifício. Considerando a classificação das redes de computadores quanto à abrangência geográfica, assinale a alternativa correta.',ops:['Trata-se de uma LAN, pois conecta dispositivos em uma área geográfica restrita, como um prédio ou uma instalação institucional.','Trata-se de uma MAN, pois toda rede administrada por um órgão municipal recebe essa classificação.','Trata-se da Internet, pois os dispositivos utilizam protocolos de comunicação para trocar informações.','Trata-se de uma PAN, pois permite que diferentes usuários compartilhem arquivos e impressoras.','Trata-se de uma WAN, pois interliga equipamentos destinados ao processamento de informações administrativas.'],g:0,exp:'Gabarito: A.'}
      ]},
      {nome:'Conhecimentos do SUS (Q21–Q35)',qs:[
        {n:21,q:'Na preparação de uma linha histórica sobre a formação do Sistema Único de Saúde, a equipe decidiu não se limitar à ordem dos acontecimentos: cada marco deveria ser apresentado de acordo com sua natureza política, administrativa ou jurídica. A síntese que atribui corretamente o alcance da 8ª Conferência Nacional de Saúde, do Sistema Unificado e Descentralizado de Saúde (SUDS), da Constituição Federal de 1988 e das Leis nº 8.080/1990 e nº 8.142/1990 é:',ops:['A 8ª Conferência consolidou as propostas da Reforma Sanitária; o SUDS conferiu a essas diretrizes a forma jurídica de um sistema nacional universal; a Constituição confirmou o modelo já instituído; e as leis de 1990 distribuíram competências e mecanismos de participação.','A 8ª Conferência deu expressão política à Reforma Sanitária; o SUDS foi uma transição descentralizadora; a Constituição reconheceu a saúde como direito de todos e instituiu o sistema único; e as leis de 1990 regulamentaram sua organização, a participação comunitária e as transferências.','A 8ª Conferência ampliou o debate público sobre saúde; o SUDS ensaiou a integração institucional; a Constituição atribuiu ao Estado o dever de organizar o setor, mas manteve a assistência individual vinculada à previdência; e as leis de 1990 estenderam o acesso aos não contribuintes.','A 8ª Conferência e o SUDS antecederam a constitucionalização do direito à saúde; a Constituição organizou as ações públicas em um sistema único; a Lei nº 8.080/1990 disciplinou conselhos, conferências e transferências; e a Lei nº 8.142/1990 definiu a organização e o funcionamento dos serviços.','A 8ª Conferência fortaleceu a agenda da Reforma Sanitária; o SUDS foi implantado para operacionalizar o sistema previsto na Constituição de 1988; a ordem constitucional universalizou o direito à saúde; e as leis de 1990 disciplinaram a execução e o controle social.'],g:1,exp:'Gabarito: B.'},
        {n:22,q:'Ao comparar a NOB-SUS 96 com as NOAS-SUS 01/2001 e 01/2002, um grupo de servidores produziu cinco notas sobre descentralização, regionalização e os instrumentos usados para organizar o acesso entre municípios. Assinale a nota que apresenta uma leitura tecnicamente adequada desse percurso normativo.',ops:['A NOB-SUS 96 aprofundou a descentralização; nas NOAS, a PPI delimitou regiões, microrregiões e módulos assistenciais, enquanto o PDR converteu os fluxos definidos pelos municípios em limites físicos e financeiros para a população própria e a referenciada.','A NOB-SUS 96 impulsionou a municipalização; nas NOAS, cada município elaborou seu recorte territorial no PDR, a Secretaria Estadual reuniu esses desenhos e a PPI organizou as referências intermunicipais sem vinculação necessária ao planejamento regional.','A NOB-SUS 96 consolidou o exercício da função gestora municipal; nas NOAS, reforçou-se a regionalização, com PDR elaborado pela esfera estadual em articulação com os municípios e PPI coordenada pelo gestor estadual, pactuada na CIB e orientada pelas necessidades da população.','A NOB-SUS 96 ampliou a responsabilidade municipal; nas NOAS, o PDR organizou o desenho regional com participação dos municípios, e a PPI distribuiu recursos e referências tomando a capacidade instalada dos prestadores como critério condutor da programação.','A NOB-SUS 96 fortaleceu a gestão municipal; nas NOAS, o PDR passou a ser elaborado pela esfera estadual e pactuado diretamente na CIT, enquanto cada município de referência definia sua programação assistencial e comunicava os fluxos à CIB.'],g:2,exp:'Gabarito: C.'},
        {n:23,q:'Em uma Região de Saúde, a equipe responsável pela regulação revisou o percurso de usuários que chegam à rede por serviços de atenção psicossocial e depois necessitam de atendimento ambulatorial especializado. A revisão deveria conciliar as portas de entrada, a ordenação exercida pela Atenção Primária e a continuidade do cuidado. De acordo com o Decreto nº 7.508/2011, a orientação que deve constar do protocolo regional é:',ops:['Os serviços de atenção psicossocial compõem as portas de entrada para demandas de seu campo; a atenção ambulatorial especializada passa a atuar como porta de entrada ao receber usuários encaminhados, e a Atenção Primária coordena o retorno à rede.','Os serviços de atenção psicossocial integram as portas de entrada previstas no Decreto; a atenção especializada é referenciada por essas portas; a Atenção Primária ordena o acesso, e as Comissões Intergestores pactuam as regras de continuidade na respectiva área.','Os serviços de atenção psicossocial podem iniciar o acesso à rede depois de reconhecidos como nova porta pela Comissão Intergestores; a atenção especializada permanece referenciada, e a Atenção Primária ordena os fluxos segundo risco e cronologia.','Os serviços de atenção psicossocial correspondem aos serviços especiais de acesso aberto; a atenção especializada pode ser procurada diretamente pelo usuário quando houver continuidade terapêutica, ficando a Atenção Primária responsável pelo registro posterior do percurso.','Os serviços de atenção psicossocial recebem o usuário como porta de entrada, mas o referenciamento para a atenção especializada deve ser reiniciado na Atenção Primária, pois a função ordenadora concentra nela a emissão dos encaminhamentos.'],g:1,exp:'Gabarito: B.'},
        {n:24,q:'Um município vai reformular seu Conselho de Saúde, composto por 28 membros. Além da distribuição das vagas, a comissão preparatória analisou a forma de escolha da presidência e a autonomia dos segmentos representados. Entre as propostas apresentadas, assinale aquela que está integralmente de acordo com a Lei nº 8.142/1990 e com a Resolução CNS nº 453/2012.',ops:['Quatorze vagas para usuários, sete para trabalhadores da saúde, quatro para o governo e três para prestadores; presidência eleita entre os conselheiros, em plenário; representantes das entidades indicados por escrito conforme os processos definidos por elas.','Quatorze vagas para usuários, sete para trabalhadores da saúde, quatro para o governo e três para prestadores; presidência eleita entre os conselheiros, em plenário; uma das vagas dos usuários ocupada por vereador eleito indicado por entidade comunitária.','Quatorze vagas para usuários, sete para trabalhadores da saúde, quatro para o governo e três para prestadores; presidência eleita pelo plenário; uma das vagas dos trabalhadores ocupada por profissional que exerce cargo de direção na gestão municipal do SUS.','Quatorze vagas para usuários, seis para trabalhadores da saúde, cinco para o governo e três para prestadores; presidência eleita pelo plenário; representantes dos usuários indicados por escrito pelas entidades que obtiverem assento.','Quatorze vagas para usuários, sete para trabalhadores da saúde, quatro para o governo e três para prestadores; presidência atribuída ao secretário municipal de saúde; representantes das entidades indicados segundo seus próprios processos de escolha.'],g:0,exp:'Gabarito: A.'},
        {n:25,q:'Em determinado ano, a população média de um município, adotada para o cálculo dos indicadores, foi de 40.000 habitantes. Nesse período, confirmaram-se 320 casos novos de leptospirose, dos quais 16 evoluíram para óbito pela doença. No último dia do ano, 200 pessoas ainda apresentavam a enfermidade. Ao todo, o município registrou 480 mortes por diferentes causas. Considerando, nessa ordem, o coeficiente de incidência da leptospirose por 100.000 habitantes, o coeficiente de mortalidade específica pela doença por 100.000 habitantes e a letalidade entre os casos novos confirmados, obtém-se:',ops:['500 por 100.000; 40 por 100.000; 8%.','800 por 100.000; 40 por 100.000; 3,3%.','800 por 100.000; 40 por 100.000; 5%.','800 por 100.000; 1.200 por 100.000; 3,3%.','40 por 100.000; 800 por 100.000; 5%.'],g:2,exp:'Gabarito: C.'},
        {n:26,q:'Em uma formação sobre o percurso normativo do SUS, foram examinados quatro compromissos presentes na agenda instituída em 2006: I. pactuar objetivos e resultados voltados à redução da mortalidade materna e infantil; II. organizar uma mobilização social que reafirmasse a saúde como direito de cidadania e o SUS como política de Estado, tendo o financiamento público como tema central; III. explicitar responsabilidades sanitárias e estabelecer diretrizes para regionalização, planejamento, regulação, participação e controle social; IV. substituir o processo de habilitação pela assunção pública de responsabilidades, objetivos e metas pactuados entre os gestores. À luz das Diretrizes Operacionais do Pacto pela Saúde, a classificação tecnicamente adequada é:',ops:['I  Pacto de Gestão; II  Pacto em Defesa do SUS; III  Pacto pela Vida; IV  Pacto de Gestão.','I  Pacto pela Vida; II  Pacto em Defesa do SUS; III e IV  Pacto de Gestão.','I  Pacto em Defesa do SUS; II  Pacto pela Vida; III e IV  Pacto de Gestão.','I  Pacto pela Vida; II  Pacto de Gestão; III  Pacto em Defesa do SUS; IV  Pacto de Gestão.','I  Pacto pela Vida; II  Pacto em Defesa do SUS; III  Pacto de Gestão; IV  Pacto pela Vida.'],g:1,exp:'Gabarito: B.'},
        {n:27,q:'Quatro municípios elaboraram um plano regional no qual cada território manteria suas equipes de Atenção Primária. Um exame diagnóstico de maior densidade tecnológica seria realizado em serviço regional localizado em um dos municípios, com transporte, regulação e referências pactuados. O plano também destinava equipes itinerantes adicionais às localidades que apresentavam maior incidência da doença investigada e maiores barreiras de acesso. Durante a análise do plano, argumentou-se que a diferença na distribuição dos serviços e das equipes contrariaria a universalidade e a igualdade da assistência. A leitura que preserva os princípios e as diretrizes do SUS é:',ops:['A concentração do exame pode ser pactuada regionalmente, mas as equipes itinerantes devem ser distribuídas na mesma proporção entre os municípios, usando-se a incidência para ordenar os atendimentos dentro de cada território.','O desenho é compatível quando os fluxos asseguram acesso e continuidade, os critérios são pactuados e a programação considera necessidades epidemiológicas e barreiras, sem exigir que cada município reproduza a mesma estrutura.','O exame e as equipes podem ser organizados regionalmente segundo as necessidades encontradas, desde que as vagas do serviço sejam inicialmente repartidas em cotas iguais entre os municípios, com posterior remanejamento das não utilizadas.','A organização regional do exame e o reforço itinerante são admissíveis, desde que o município-sede defina os critérios de referência segundo sua capacidade e os demais formalizem a adesão ao fluxo estabelecido.','O serviço regional pode atender à hierarquização, e a incidência pode orientar o reforço das equipes; as barreiras de acesso, contudo, não justificam distribuição diferenciada enquanto não modificarem a frequência da doença.'],g:1,exp:'Gabarito: B.'},
        {n:28,q:'Em curto intervalo, trabalhadores de um estabelecimento que armazenava e fracionava agrotóxicos e moradores próximos a um córrego apresentaram sintomas neurológicos e respiratórios semelhantes. A inspeção preliminar também identificou comercialização irregular de produtos, descarte de embalagens nas proximidades e mortandade de peixes. As análises laboratoriais ainda estavam em andamento. Diante desse conjunto de ocorrências, o arranjo de trabalho compatível com a lógica da Vigilância em Saúde consiste em:',ops:['Integrar os dados clínicos e ocupacionais às análises do ambiente e dos produtos, iniciando medidas no estabelecimento e reservando as intervenções comunitárias para quando estiver definida a relação causal com o córrego.','Adotar critérios comuns de caso e exposição, articular as inspeções e cruzar os registros, atribuindo à saúde do trabalhador os empregados formalmente vinculados e à vigilância epidemiológica os demais trabalhadores expostos.','Manter base de dados e reuniões comuns, permitindo que cada componente conclua sua linha de investigação antes da pactuação das medidas, para preservar a especificidade técnica de suas atribuições.','Construir critérios compartilhados de caso e exposição, combinar dados clínicos, ocupacionais, ambientais e sanitários, coordenar inspeções e análises e ajustar as medidas de proteção conforme as evidências se acumulem.','Organizar uma investigação conjunta, cabendo à vigilância ambiental examinar a regularidade dos produtos e do fracionamento, e à sanitária estimar a dispersão no córrego e os efeitos observados na fauna.'],g:3,exp:'Gabarito: D.'},
        {n:29,q:'Uma unidade precisa rever o acesso depois de identificar filas, orientações divergentes e conflitos recorrentes. Gestores, trabalhadores e usuários formularam diagnósticos distintos sobre o problema, e a direção decidiu reorganizar o colegiado responsável pelo novo fluxo. Nesse contexto, o desenho compatível com a gestão participativa e a cogestão propostas pela Política Nacional de Humanização consiste em:',ops:['Reorganizar o colegiado para que os três segmentos analisem o problema, negociem decisões e responsabilidades e acompanhem os efeitos do fluxo, revendo conjuntamente os ajustes necessários.','Reorganizar o colegiado para que os três segmentos construam o diagnóstico, formulem propostas e acompanhem os efeitos do novo fluxo, ficando a definição das responsabilidades e dos ajustes sob decisão da direção da unidade.','Reorganizar o colegiado para que os três segmentos formulem alternativas, definam critérios de avaliação e acompanhem o fluxo, atribuindo ao segmento que estiver na coordenação a decisão nos pontos sem convergência.','Reorganizar o colegiado para que os três segmentos analisem o problema, pactuem o fluxo e acompanhem seus resultados, implementando as revisões após a ratificação do Conselho Municipal de Saúde.','Reorganizar o colegiado para que os três segmentos discutam o diagnóstico, pactuem metas e avaliem os resultados, deliberando cada segmento sobre a parte do fluxo relacionada à sua experiência institucional.'],g:0,exp:'Gabarito: A.'},
        {n:30,q:'Um município planeja implantar uma eMulti em território atendido por equipes de Saúde da Família e de Atenção Primária. O diagnóstico local identificou demandas relacionadas à saúde mental, reabilitação e acompanhamento de condições crônicas, além de encaminhamentos frequentes para outros pontos da rede. Assinale a proposta compatível com a organização e o processo de trabalho da eMulti.',ops:['Vincular a eMulti às equipes e à população do território, compartilhando planejamento e responsabilidades e combinando cuidado direto, apoio matricial, discussão de casos, ações coletivas, intervenções territoriais e articulação com a rede.','Vincular a eMulti às equipes do território, pactuar os temas prioritários e organizar agendas próprias por categoria profissional, elaborando os planos de cuidado na eMulti e comunicando posteriormente as condutas às equipes vinculadas.','Manter a vinculação cadastral da eMulti com as equipes do território e o compartilhamento dos registros, organizando seus profissionais como referência municipal por especialidade e direcionando a demanda por meio da regulação central.','Vincular a eMulti às equipes do território, compartilhar o planejamento, realizar atendimentos e apoio matricial e assumir o acompanhamento longitudinal dos casos complexos até que possam ser devolvidos à equipe que os encaminhou.','Vincular a eMulti às equipes do território, compartilhar o planejamento e combinar apoio matricial, discussão de casos e ações territoriais, prevendo que os atendimentos individuais, coletivos e domiciliares ocorram com a participação simultânea da equipe vinculada.'],g:0,exp:'Gabarito: A.'},
