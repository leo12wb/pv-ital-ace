        {n:31,q:"O Agente de Combate às Endemias (ACE) tem como atribuição o exercício de atividades de vigilância, prevenção e controle de doenças e promoção da saúde, desenvolvidas em conformidade com as diretrizes do SUS e sob supervisão do gestor de cada ente federado. Assinale a alternativa que SE REFERE a uma atividade típica do ACE conforme a Lei nº 11.350:",ops:["Investigação diagnóstica laboratorial de zoonoses de relevância para a saúde pública.","Identificação de casos suspeitos de doenças e agravos à saúde e encaminhamento, quando indicado, para a unidade de saúde de referência, assim como comunicação do fato à autoridade sanitária responsável.","Coleta de animais e recebimento, acondicionamento, conservação e transporte de espécimes ou amostras biológicas de animais para laboratórios de identificação ou diagnóstico de zoonoses.","Necropsia de animais com diagnóstico suspeito de zoonoses, auxiliando na coleta e no encaminhamento de amostras laboratoriais.","Planejamento, execução e avaliação das ações de vacinação animal contra zoonoses normatizadas pelo Ministério da Saúde."],g:1,exp:"Conforme a Lei nº 11.350/2006, a identificação de casos suspeitos de doenças e agravos e o encaminhamento à unidade de referência é atividade típica do ACE. As demais alternativas (C, D, E) envolvem procedimentos que exigem profissional de nível superior ou são atividades específicas da vigilância veterinária, fora do escopo do ACE."},
        {n:32,q:"Por que os cães infectados pela Leishmania infantum possuem tanta relevância epidemiológica na Leishmaniose Visceral urbana mesmo quando ainda estão completamente assintomáticos (aparentemente saudáveis)?",ops:["Porque o cão assintomático não possui nenhum parasito no corpo.","Porque apenas cães com mais de 15 anos podem se infectar.","Porque o cão apresenta intenso parasitismo cutâneo (grande quantidade de formas amastigotas de Leishmania na pele íntegra, mesmo sem feridas externas), servindo como excelente fonte de infecção para os flebotomíneos que o picam, além de a infecção canina preceder cronologicamente o aparecimento de casos humanos na localidade.","Porque o cão transmite a doença diretamente pelo latido.","Porque o cão elimina cistos infectantes na água das piscinas."],g:2,exp:"Diferente do ser humano (que tem baixo parasitismo na pele na LV), o cão tem altíssimo parasitismo cutâneo tanto sintomático quanto assintomático, infectando facilmente o Lutzomyia longipalpis (vetor). Além disso, o aparecimento de casos caninos precede cronologicamente os casos humanos, tornando a vigilância canina uma ferramenta fundamental de alerta epidemiológico."},
        {n:33,q:"De acordo com o art. 19-H da Lei nº 8.080/1990, as populações indígenas terão direito a participar dos organismos colegiados de formulação, acompanhamento e avaliação das políticas de saúde, tais como:",ops:["Exclusivamente comissões parlamentares internacionais.","Somente reuniões administrativas internas do Ministério da Fazenda.","Apenas associações privadas sem poder de deliberação.","Nenhum organismo colegiado, pois a legislação veda a participação indígena no controle social do SUS.","O Conselho Nacional de Saúde e os Conselhos Estaduais e Municipais de Saúde, quando for o caso, além dos Conselhos Locais e Distritais de Saúde Indígena."],g:4,exp:"O art. 19-H da Lei nº 8.080/1990 assegura expressamente a participação das populações indígenas no Conselho Nacional de Saúde, nos Conselhos Estaduais e Municipais de Saúde (quando for o caso) e nas instâncias específicas do controle social indígena (Conselhos Locais e CONDISI — Conselhos Distritais de Saúde Indígena)."},
        {n:34,q:"O Decreto nº 7.508/2011 regulamenta a Lei nº 8.080/1990 para dispor sobre a organização do SUS, o planejamento da saúde, a assistência à saúde e a articulação interfederativa. De acordo com o art. 2º desse decreto, o espaço geográfico contínuo constituído por agrupamentos de Municípios limítrofes, delimitado a partir de identidades culturais, econômicas e sociais e de redes de comunicação e infraestrutura de transportes compartilhados, com a finalidade de integrar a organização, o planejamento e a execução de ações e serviços de saúde, denomina-se:",ops:["Contrato Organizativo da Ação Pública.","Região de Saúde.","Mapa da Saúde.","Porta de Entrada.","Protocolo Clínico."],g:1,exp:"Conforme art. 2º, inciso I, do Decreto nº 7.508/2011, Região de Saúde é o espaço geográfico contínuo constituído por agrupamentos de Municípios limítrofes, delimitado a partir de identidades culturais, econômicas e sociais e de redes de comunicação e infraestrutura de transportes compartilhados, com a finalidade de integrar a organização, o planejamento e a execução de ações e serviços de saúde."},
        {n:35,q:"De acordo com a Lista Nacional de Notificação Compulsória vigente no Brasil, qual é a periodicidade de notificação dos casos suspeitos ou confirmados de Leptospirose?",ops:["Notificação apenas anual.","Somente casos em cães domésticos são notificados.","Notificação compulsória mensal.","A leptospirose não faz parte da Lista Nacional de Notificação Compulsória.","Notificação compulsória IMEDIATA (em até 24 horas)."],g:4,exp:"A Leptospirose exige notificação compulsória IMEDIATA (até 24h) devido à alta letalidade potencial e à necessidade de investigação ambiental e ações de desratização focal. A notificação imediata permite respostas rápidas da vigilância epidemiológica para conter surtos, especialmente em períodos de enchentes."},
        {n:36,q:"Sobre o tratamento da leptospirose, é correto afirmar que:",ops:["O tratamento é feito com antibióticos, como penicilina ou doxiciclina, conforme avaliação médica.","O tratamento é feito com antivirais.","Não há tratamento.","O tratamento é apenas sintomático."],g:0,exp:"O tratamento da leptospirose é feito com antibióticos (penicilina, doxiciclina, ceftriaxona, entre outros), conforme avaliação médica e gravidade do caso. O diagnóstico precoce e o tratamento adequado são fundamentais para reduzir a letalidade. A leptospirose é uma doença bacteriana (Leptospira), portanto antivirais não têm eficácia."},
        {n:37,q:"A malária é uma doença parasitária transmitida por vetores, com maior ocorrência em regiões específicas do país. O Agente de Combate às Endemias atua em ações de vigilância, prevenção e controle. Considerando os aspectos epidemiológicos e as ações de controle da malária, assinale a alternativa CORRETA:",ops:["A malária não apresenta relação com fatores ambientais, e a identificação precoce dos casos não interfere na dinâmica de transmissão.","A malária é transmitida principalmente por contato direto entre pessoas infectadas, sendo desnecessárias ações de vigilância entomológica.","O controle da malária baseia-se exclusivamente no tratamento medicamentoso dos casos confirmados, não sendo necessárias ações preventivas ou ambientais.","A malária é transmitida pela picada de mosquitos do gênero Anopheles infectados, e seu controle envolve vigilância entomológica, orientação da população e identificação precoce dos casos."],g:3,exp:"A malária é transmitida pela picada de mosquitos do gênero Anopheles infectados por protozoários do gênero Plasmodium. O controle envolve vigilância entomológica (monitoramento do vetor), orientação da população (uso de mosquiteiros, repelentes) e identificação precoce dos casos (diagnóstico e tratamento). A malária tem forte relação com fatores ambientais e não é transmitida por contato direto entre pessoas."},
        {n:38,q:"De acordo com a Lei 8.080/1990, compete ao governo estadual no SUS:",ops:["Coordenar exclusivamente os serviços de vigilância sanitária.","Supervisionar as atividades do governo federal no SUS.","Executar ações de saúde apenas em hospitais estaduais.","Coordenar e prestar apoio técnico aos municípios."],g:3,exp:"Conforme Art. 17 da Lei 8.080/1990, compete à direção estadual do SUS prestar apoio técnico e financeiro aos Municípios, além de coordenar e complementar as ações municipais. O Estado não supervisiona o governo federal, nem se restringe a hospitais estaduais ou apenas à vigilância sanitária."},
        {n:39,q:"Em relação aos objetivos do SUS, a Lei 8.080/1990 indica que o sistema deve:",ops:["Garantir ações de promoção, proteção e recuperação da saúde.","Definir os medicamentos que não necessitam de receita.","Priorizar os tratamentos de alto custo para doenças raras.","Fornecer atendimento prioritário a regiões urbanas."],g:0,exp:"Conforme Art. 5º, III da Lei 8.080/1990, são objetivos do SUS 'a assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde'. O SUS não se restringe a regiões urbanas nem prioriza tratamentos de alto custo — deve atender a todos com integralidade e universalidade."},
        {n:40,q:"Durante o trabalho de campo, o Agente de Combate às Endemias encontra um terreno baldio abandonado, murado e trancado, sem moradores, com acúmulo visível de pneus, caixas d'água abertas e entulhos em área com transmissão ativa de dengue. Qual é o procedimento administrativo e legal adequado para viabilizar o acesso e a eliminação dos focos?",ops:["Registrar o imóvel como fechado/abandonado com risco iminente, notificar o supervisor de campo e a coordenação de vigilância para identificação do proprietário e adoção dos trâmites legais previstos na Lei nº 13.301/2016 e no código sanitário municipal (notificação formal, auto de infração/vistoria e, persistindo a ausência ou recusa em situação de iminente perigo à saúde pública, ingresso forçado acompanhado de testemunhas/autoridade sanitária e lavratura de auto circunstanciado).","Aplicar multa pessoal diretamente ao vizinho da casa ao lado.","Ignorar o terreno baldio definitivamente porque imóveis sem moradores não podem ser vistoriados pelo poder público.","Pular o muro sozinho sem testemunhas nem autorização formal e demolir as paredes do terreno.","Jogar gasolina por cima do muro e atear fogo nos pneus acumulados."],g:0,exp:"O ingresso forçado previsto na Lei nº 13.301/2016 exige respaldo institucional, designação formal da autoridade sanitária, esgotamento das tentativas prévias de contato com o proprietário e lavratura de auto circunstanciado — nunca uma iniciativa solitária e informal do agente. O ACE deve sempre comunicar a situação à coordenação e aguardar os trâmites legais."},
        {n:41,q:"A Administração Pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios constitucionais expressos no caput do art. 37 da Constituição Federal de 1988. Assinale a alternativa que apresenta EXCLUSIVAMENTE esses cinco princípios constitucionais:",ops:["Eficiência, Autonomia Privada, Gratuidade, Soberania e Sigilo.","Legalidade, Onerosidade, Sigilo Absoluto, Pessoalidade e Lucratividade.","Impessoalidade, Parcialidade, Moralidade, Segredo e Celeridade.","Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência.","Universalidade, Equidade, Integralidade, Descentralização e Hierarquização."],g:3,exp:"Os cinco princípios constitucionais expressos no art. 37, caput, da CF/88 formam o clássico mnemônico LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência. A alternativa E traz os princípios do SUS (Lei 8.080/1990), não da Administração Pública em geral."},
        {n:42,q:"Assinale a alternativa correta sobre os fluxos de referência e contrarreferência:",ops:["A Referência e a Contrarreferência em Saúde são mecanismos do SUS que favorecem a troca de informações na rede de atenção, o trânsito do usuário no sistema e a continuidade do cuidado.","A Contrarreferência é o encaminhamento do paciente de um ponto da rede (geralmente UBS) para outro nível de atenção (média ou alta complexidade).","O sistema de Referência e Contrarreferência tem como principal objetivo a preservação da autonomia financeira das unidades de saúde.","A Referência é o processo inverso, onde o serviço de maior complexidade devolve o paciente à atenção primária, com um relatório do que foi feito.","A principal função da Contrarreferência é apenas informar ao paciente sobre a alta hospitalar, sem a necessidade de comunicar à unidade de saúde de origem."],g:0,exp:"A Referência e Contrarreferência são mecanismos do SUS que garantem a troca de informações entre os níveis de atenção, o trânsito do usuário no sistema e a continuidade do cuidado. A Referência é o encaminhamento da UBS para serviços de maior complexidade. A Contrarreferência é o retorno do serviço de maior complexidade à UBS com informações sobre o atendimento realizado."},
        {n:43,q:"De acordo com o art. 4º do Decreto nº 7.508/2011, as Regiões de Saúde serão instituídas pelo Estado, em articulação com os Municípios, respeitadas as diretrizes gerais pactuadas na Comissão Intergestores Tripartite (CIT), podendo ser instituídas Regiões de Saúde interestaduais compostas por Municípios limítrofes. Segundo o parágrafo único desse artigo, a instituição de Regiões de Saúde situadas em áreas de fronteira com outros países deverá respeitar:",ops:["Exclusivamente o código tributário do município brasileiro.","A proibição de atendimento a populações fronteiriças.","As leis sanitárias privadas das empresas exportadoras.","A autorização prévia da Organização Mundial do Comércio.","As normas que regem as relações internacionais."],g:4,exp:"O art. 4º, parágrafo único, do Decreto nº 7.508/2011 estabelece expressamente que 'a instituição de Regiões de Saúde situadas em áreas de fronteira com outros países deverá respeitar as normas que regem as relações internacionais'."},
        {n:44,q:"A Política Nacional de Vigilância em Saúde (PNVS), instituída pela Resolução CNS nº 588/2018, define a Vigilância em Saúde como um processo contínuo e sistemático de coleta, consolidação, análise de dados e disseminação de informações sobre eventos relacionados à saúde. De acordo com a PNVS, a Vigilância em Saúde articula saberes, processos e práticas relacionados a quatro componentes principais. Assinale a alternativa que apresenta CORRETAMENTE esses quatro componentes:",ops:["Vigilância ambulatorial, vigilância de fronteiras, vigilância bancária e vigilância veterinária.","Vigilância entomológica, vigilância tributária, vigilância nutricional e vigilância genética.","Vigilância epidemiológica, vigilância sanitária, vigilância em saúde ambiental e vigilância em saúde do trabalhador.","Vigilância laboratorial, vigilância de medicamentos, vigilância escolar e vigilância prisional.","Vigilância hospitalar, vigilância farmacêutica, vigilância previdenciária e vigilância odontológica."],g:2,exp:"Conforme o art. 2º da Resolução CNS nº 588/2018 (PNVS), a Vigilância em Saúde articula-se em quatro grandes áreas: vigilância epidemiológica, vigilância sanitária, vigilância em saúde ambiental e vigilância em saúde do trabalhador. Esses quatro componentes são integrados e complementares na proteção da saúde da população."},
        {n:45,q:"A gripe espanhola (1918) e a COVID-19 são exemplos históricos de:",ops:["Surto","Pandemia","Endemia","Epidemia"],g:1,exp:"Pandemia é a disseminação de uma doença infecciosa em escala mundial, afetando vários países e continentes simultaneamente. A gripe espanhola de 1918 e a COVID-19 (2020) são os exemplos mais emblemáticos de pandemias na história. Surto é localizado; epidemia é regional/nacional; endemia é a ocorrência constante esperada em determinada região."},
        {n:46,q:"De acordo com a Política Nacional de Atenção Básica (2017), é uma atribuição comum dos Agentes Comunitários de Saúde e dos Agentes de Combate às Endemias:",ops:["Informar os usuários sobre as datas e horários de consultas e exames agendados.","Executar a organização, limpeza, assepsia, desinfecção e esterilização do instrumental, dos equipamentos odontológicos e do ambiente de trabalho.","Executar ações de campo para pesquisa entomológica, malacológica ou coleta de reservatórios de doenças.","Identificar casos suspeitos de doenças e agravos, encaminhar os usuários para a unidade de saúde de referência, registrar e comunicar o fato à autoridade de saúde responsável pelo território."],g:3,exp:"A PNAB 2017 (Portaria nº 2.436/2017) define como atribuição comum entre ACS e ACE a identificação de casos suspeitos de doenças e agravos, o encaminhamento à unidade de referência e a comunicação à autoridade de saúde responsável. As demais alternativas são atribuições de outras categorias profissionais (recepcionistas, auxiliares de saúde bucal e agentes específicos de vigilância)."},
        {n:47,q:"Considerando o papel do ACE e o conceito de doenças emergentes e reemergentes, marque V para verdadeiro e F para falso:\n\n(  ) A febre amarela é considerada reemergente em diversas regiões do Brasil; sua prevenção depende de estratégias integradas de imunização e controle do vetor.\n(  ) Doenças emergentes são aquelas que, após longo período de controle, voltam a apresentar incidência significativa.\n(  ) Arboviroses como chikungunya e zika são exemplos clássicos de doenças emergentes, pois foram introduzidas recentemente e causaram surtos com elevada morbidade.\n(  ) A atuação do ACE deve se limitar ao controle de vetores, não sendo sua função participar da vigilância ativa de casos suspeitos.\n\nA sequência está correta em:",ops:["F, F, F, F.","V, F, V, F.","F, V, F, V.","V, V, V, V."],g:1,exp:"A febre amarela é reemergente (V). Doenças emergentes são novas ou recém-introduzidas — doenças que voltam após controle são as REemergentes (F). Chikungunya e zika são emergentes, introduzidas recentemente no Brasil (V). O ACE não se limita ao controle de vetores; participa da vigilância ativa de casos suspeitos conforme a Lei 11.350/2006 e PNAB 2017 (F). Portanto: V, F, V, F."},
        {n:48,q:"À direção nacional do Sistema Único de Saúde (SUS) compete definir e coordenar, EXCETO os sistemas de:",ops:["Redes de assistência à saúde suplementar.","Vigilância sanitária.","Rede de laboratórios de saúde pública.","Vigilância epidemiológica."],g:0,exp:"Conforme Art. 16 da Lei 8.080/1990, compete à direção nacional do SUS definir e coordenar os sistemas de: redes de laboratórios de saúde pública, vigilância epidemiológica e vigilância sanitária. As redes de assistência à saúde suplementar são reguladas pela ANS (Agência Nacional de Saúde Suplementar), não pela direção nacional do SUS."},
        {n:49,q:"A Lei Federal nº 8.080/1990 (art. 7º, VIII) consagra a 'Participação da Comunidade' como princípio do SUS, e a CF/88 (art. 198, §11, incluído pela EC nº 120/2022) assegura a transparência e o repasse direto dos recursos para o vencimento dos ACS e ACE. Sobre a Assistência Financeira Complementar (AFC) da União para custeio dos ACEs, assinale a alternativa CORRETA:",ops:["Os recursos repassados pela União para pagamento dos ACEs podem ser usados pelo município para pagar obras viárias sem repassar aos agentes.","O piso salarial dos ACEs é custeado exclusivamente pela cobrança de taxas domiciliares aos moradores visitados.","A Assistência Financeira Complementar da União não exige que os ACEs estejam devidamente cadastrados no sistema oficial (CNES).","Os recursos financeiros repassados pela União aos Estados, ao Distrito Federal e aos Municípios para pagamento do vencimento ou de qualquer outra vantagem dos ACEs e ACSs NÃO serão objeto de inclusão no cálculo para fins do limite de despesa com pessoal previsto na Lei de Responsabilidade Fiscal (LC nº 101/2000), assegurando o cumprimento do piso nacional sem estrangular o limite fiscal municipal.","A EC nº 120/2022 extinguiu o repasse federal destinado aos Agentes de Combate às Endemias."],g:3,exp:"Regra constitucional importantíssima (CF/88, Art. 198, §11 — EC 120/2022): os recursos federais repassados para pagamento dos ACEs e ACSs NÃO entram no teto de despesa com pessoal da Lei de Responsabilidade Fiscal (LRF). Isso permite que os municípios cumpram o piso nacional dos agentes sem comprometer seus limites fiscais."},
        {n:50,q:"A qualidade da água é um fator determinante para a prevenção de diversas doenças. Sobre a vigilância da água para consumo humano, assinale a alternativa correta:",ops:["A análise microbiológica da água deve ser feita apenas em caso de surtos de doenças gastrointestinais.","A cloração da água é um dos principais métodos de prevenção contra doenças transmitidas por micro-organismos patogênicos.","A água subterrânea extraída de poços artesianos não precisa passar por tratamento, pois é naturalmente potável.","A fervura da água por menos de 1 minuto já é suficiente para eliminar todas as bactérias e vírus presentes."],g:1,exp:"A cloração da água é um dos principais métodos de prevenção contra doenças transmitidas por micro-organismos patogênicos, garantindo a potabilidade. Água de poços artesianos pode estar contaminada e deve ser analisada e tratada. A fervura por menos de 1 minuto não elimina todos os patógenos (recomenda-se manter a fervura por pelo menos 1 minuto). A análise microbiológica deve ser realizada regularmente, não apenas em surtos."},
        {n:51,q:"No Brasil, qual região eliminou o ciclo urbano da raiva?",ops:["Região Nordeste","Região Sul","Região Centro-Oeste","Região Norte","Região Sudeste"],g:1,exp:"No Brasil, a Região Sul foi a única a eliminar o ciclo urbano da raiva. Nas demais regiões, a raiva urbana (transmitida por cães e gatos) e a raiva silvestre (transmitida por morcegos e outros animais silvestres) ainda são endêmicas, exigindo campanhas de vacinação animal e vigilância constante."},
        {n:52,q:"O PRINCIPAL vetor da Leishmaniose Visceral é conhecido como:",ops:["Mosquito Prego.","Mosquito Palha.","Aedes aegypti.","Culex."],g:1,exp:"O principal vetor da Leishmaniose Visceral no Brasil é o Lutzomyia longipalpis, popularmente conhecido como mosquito-palha ou birigui (flebotomíneo). O Aedes aegypti transmite dengue, zika e chikungunya. O Culex transmite filariose linfática. O Anopheles (mosquito-prego) transmite malária."},
      ]},
    ]
  },
  {
    id:'sim-ac4',titulo:'aceEstuda 4 – Questões Comentadas',banca:'aceEstuda',ano:2025,
    edital:'Agente de Combate às Endemias',cargo:'ACE',
    secoes:[
      {nome:'Conhecimentos Específicos ACE',qs:[
        {n:1,q:"De acordo com o modelo da História Natural da Doença (Leavell & Clark), as ações de prevenção organizam-se em níveis distintos conforme o período evolutivo do agravo. Assinale a alternativa que associa CORRETAMENTE o nível de prevenção ao exemplo prático correspondente:",ops:["Prevenção Secundária: realizada antes da exposição ao agente etiológico, consiste exclusivamente na aplicação de vacinas.","Prevenção Secundária: engloba apenas a construção de redes de esgoto e abastecimento de água tratada.","Prevenção Primária: corresponde à reabilitação física e fisioterapia motora de pacientes com sequelas neurológicas pós-chikungunya ou Zika.","Prevenção Terciária: consiste no diagnóstico precoce por meio de exames de rastreamento em indivíduos assintomáticos.","Prevenção Primária: realizada no período pré-patogênico, inclui promoção da saúde (saneamento básico, educação ambiental) e proteção específica (vacinação, eliminação de criadouros de vetores, uso de repelentes)."],g:4,exp:"A Prevenção Primária atua no período pré-patogênico (antes do adoecimento) por meio de Promoção da Saúde e Proteção Específica. A Prevenção Secundária atua no período patogênico visando diagnóstico precoce e tratamento imediato (limitação da invalidez). A Prevenção Terciária foca na reabilitação e redução de sequelas — não no diagnóstico de rastreamento."},
        {n:2,q:"O 'Coeficiente de Mortalidade Infantil' (CMI) é considerado internacionalmente um dos indicadores mais sensíveis das condições socioeconômicas, nutricionais, de saneamento básico e de acesso aos serviços de saúde de uma população. Como esse indicador é calculado?",ops:["Número de crianças vacinadas dividido pelo número de escolas públicas.","Número de óbitos de crianças de 0 a 14 anos dividido pela população total multiplicado por 100.000.","Número de óbitos fetais dividido pelo número de hospitais do município.","Número de óbitos de crianças menores de 1 ano de idade (0 a 364 dias) residentes em determinado local e ano, dividido pelo número total de nascidos vivos de mães residentes no mesmo local e ano, multiplicado por 1.000.","Número de gestantes atendidas no pré-natal dividido pelo número de nascidos vivos."],g:3,exp:"CMI = (Óbitos < 1 ano / Nascidos vivos) × 1.000. Divide-se em componente neonatal precoce (0–6 dias), neonatal tardio (7–27 dias) e pós-neonatal ou infantil tardio (28–364 dias — fortemente ligado a diarreias, pneumonias e saneamento básico precário)."},
        {n:3,q:"É uma doença parasitária, diretamente relacionada ao saneamento precário. A transmissão ocorre quando pessoas entram em contato com água doce contaminada por cercárias, formas infectantes do parasita, liberadas por caramujos. A qual doença se refere o texto?",ops:["Leishmaniose.","Esquistossomose.","Histoplasmose.","Hanseníase."],g:1,exp:"A esquistossomose (barriga d'água) é uma doença parasitária causada pelo Schistosoma mansoni, transmitida quando as cercárias (formas infectantes do parasita) liberadas por caramujos do gênero Biomphalaria penetram na pele humana em contato com água doce contaminada. Está diretamente relacionada ao saneamento precário. A histoplasmose é fúngica, a hanseníase é bacteriana e a leishmaniose é transmitida por flebotomíneos."},
        {n:4,q:"Sobre o tratamento específico da Leptospirose no Sistema Único de Saúde, assinale a alternativa CORRETA:",ops:["O tratamento consiste exclusivamente na aplicação de soro antiofídico.","Baseia-se na antibioticoterapia precoce iniciada preferencialmente na primeira semana de sintomas (utilizando Doxiciclina ou Amoxicilina nos casos leves ambulatoriais, e Penicilina G Cristalina, Ceftriaxona ou Ampicilina intravenosa nos casos graves hospitalizados), associada ao suporte hidroeletrolítico e hemodiálise precoce quando necessária — NÃO se devendo aguardar resultado sorológico para iniciar o antibiótico.","O uso de antibióticos é contraindicado na fase inicial da doença.","Deve-se aguardar 30 dias pela confirmação do teste de microaglutinação (MAT) antes de prescrever qualquer medicamento.","Por ser causada por um vírus, a leptospirose não responde a nenhum antibiótico."],g:1,exp:"Leptospirose é BACTERIANA (espiroqueta Leptospira) → antibiótico precoce na suspeita clínica reduz gravidade e letalidade. Casos leves: Doxiciclina ou Amoxicilina VO. Casos graves: Penicilina G Cristalina, Ceftriaxona ou Ampicilina IV. NÃO aguardar confirmação sorológica (MAT) para iniciar tratamento."},
        {n:5,q:"O Sistema Único de Saúde poderá recorrer aos serviços ofertados pela iniciativa privada quando as suas disponibilidades forem insuficientes para garantir a cobertura assistencial à população de uma determinada área.",ops:["Certo","Errado"],g:0,exp:"Conforme Art. 24 da Lei 8.080/1990, quando as disponibilidades do SUS forem insuficientes, poderá recorrer aos serviços ofertados pela iniciativa privada."},
        {n:6,texto:'A Política Nacional de Atenção Básica (PNAB), aprovada pela Portaria de Consolidação nº 2/2017 (antiga Portaria GM/MS nº 2.436/2017), define a Atenção Básica como o conjunto de ações de saúde individuais, familiares e coletivas que envolvem promoção, prevenção, proteção, diagnóstico, tratamento, reabilitação, redução de danos, cuidados paliativos e vigilância em saúde.',q:"Sobre os princípios e diretrizes da Atenção Básica previstos na PNAB, assinale a alternativa CORRETA:",ops:["A territorialização consiste em impedir que moradores de uma microárea sejam acompanhados por equipes de saúde.","A Estratégia Saúde da Família (ESF) foi extinta pela PNAB de 2017.","São princípios da Atenção Básica: Universalidade, Equidade e Integralidade; e são diretrizes: Regionalização e Hierarquização, Territorialização, População Adscrita, Cuidado Centrado na Pessoa, Resolutividade, Longitudinalidade do cuidado, Coordenação do cuidado, Ordenação da rede e Participação da comunidade.","A longitudinalidade do cuidado significa atender o paciente apenas uma única vez em situações de emergência.","A Atenção Básica atua exclusivamente no tratamento curativo de doenças crônicas, não possuindo relação com a vigilância em saúde."],g:2,exp:"A alternativa C elenca com precisão os três princípios (Universalidade, Equidade e Integralidade) e as nove diretrizes da Atenção Básica estabelecidas na PNAB vigente."},
      ]},
    ]
  },
  {
    id:'sim-info1',titulo:'Informática – Atalhos e Excel',banca:'Ação Bahia',ano:2025,
    edital:'Conhecimentos de Informática',cargo:'Nível Médio',
    secoes:[
      {nome:'Atalhos de Teclado',qs:[
        {n:1,q:'No Microsoft Windows, qual atalho de teclado é utilizado para COPIAR um item selecionado?',ops:['Ctrl+X','Ctrl+C','Ctrl+V','Ctrl+S','Ctrl+P'],g:1,exp:'Ctrl+C copia o item selecionado para a área de transferência.'},
        {n:2,q:'No Microsoft Windows, qual atalho de teclado é utilizado para COLAR um item copiado ou recortado?',ops:['Ctrl+X','Ctrl+C','Ctrl+V','Ctrl+Z','Ctrl+A'],g:2,exp:'Ctrl+V cola o conteúdo da área de transferência no local do cursor.'},
        {n:3,q:'No Microsoft Windows, qual atalho de teclado é utilizado para RECORTAR um item selecionado?',ops:['Ctrl+C','Ctrl+V','Ctrl+Z','Ctrl+X','Ctrl+P'],g:3,exp:'Ctrl+X recorta o item selecionado (remove do local original e copia para a área de transferência).'},
        {n:4,q:'No Microsoft Windows, qual atalho é utilizado para DESFAZER a última ação realizada?',ops:['Ctrl+Y','Ctrl+Z','Ctrl+S','Ctrl+A','Ctrl+D'],g:1,exp:'Ctrl+Z desfaz a última ação realizada. Pode ser pressionado múltiplas vezes para desfazer várias ações.'},
        {n:5,q:'No Microsoft Windows, qual atalho é utilizado para REFAZER uma ação desfeita?',ops:['Ctrl+Z','Ctrl+X','Ctrl+Y','Ctrl+R','Ctrl+F'],g:2,exp:'Ctrl+Y refaz a última ação desfeita com Ctrl+Z.'},
        {n:6,q:'Ao pressionar Ctrl+A em um documento do Microsoft Word, qual ação é executada?',ops:['Abre um novo documento.','Salva o documento.','Seleciona todo o conteúdo do documento.','Fecha o programa.','Abre a caixa de localizar.'],g:2,exp:'Ctrl+A (Select All) seleciona todo o conteúdo do documento atual.'},
        {n:7,q:'Qual atalho de teclado é utilizado para SALVAR um documento no Microsoft Word?',ops:['Ctrl+P','Ctrl+N','Ctrl+O','Ctrl+S','Ctrl+F'],g:3,exp:'Ctrl+S (Save) salva o documento. Se o documento ainda não tiver nome, abre a caixa "Salvar como".'},
        {n:8,q:'Para abrir a caixa de diálogo de impressão no Microsoft Word, utiliza-se o atalho:',ops:['Ctrl+S','Ctrl+I','Ctrl+P','Ctrl+D','Ctrl+Q'],g:2,exp:'Ctrl+P (Print) abre o painel de impressão, onde é possível configurar impressora, número de cópias e páginas.'},
        {n:9,q:'No Microsoft Word, o atalho Ctrl+F abre a ferramenta de:',ops:['Formatação de fonte.','Inserção de figura.','Localizar texto.','Criar tabela.','Verificação ortográfica.'],g:2,exp:'Ctrl+F (Find) abre o painel de Localizar, permitindo buscar palavras ou trechos no documento.'},
        {n:10,q:'No Microsoft Word, o atalho Ctrl+H abre a ferramenta de:',ops:['Localizar.','Substituir.','Inserir hiperlink.','Histórico.','Ajuda.'],g:1,exp:'Ctrl+H abre a caixa de diálogo Localizar e Substituir, útil para trocar palavras em todo o documento.'},
        {n:11,q:'Para aplicar NEGRITO a um trecho selecionado no Microsoft Word, utiliza-se o atalho:',ops:['Ctrl+N','Ctrl+G','Ctrl+B','Ctrl+D','Ctrl+K'],g:2,exp:'Ctrl+B (Bold) aplica ou remove o negrito do texto selecionado.'},
        {n:12,q:'Para aplicar ITÁLICO a um trecho selecionado no Microsoft Word, utiliza-se o atalho:',ops:['Ctrl+B','Ctrl+I','Ctrl+U','Ctrl+T','Ctrl+E'],g:1,exp:'Ctrl+I (Italic) aplica ou remove o itálico do texto selecionado.'},
        {n:13,q:'Para aplicar SUBLINHADO a um trecho selecionado no Microsoft Word, utiliza-se o atalho:',ops:['Ctrl+B','Ctrl+I','Ctrl+S','Ctrl+U','Ctrl+L'],g:3,exp:'Ctrl+U (Underline) aplica ou remove o sublinhado do texto selecionado.'},
        {n:14,q:'No Microsoft Windows, o atalho Alt+F4 é utilizado para:',ops:['Abrir o menu Iniciar.','Tirar print da tela.','Fechar a janela ou programa ativo.','Alternar entre janelas.','Bloquear o computador.'],g:2,exp:'Alt+F4 fecha a janela ou programa em uso. Se nenhum programa estiver aberto, exibe a caixa de diálogo para desligar o computador.'},
        {n:15,q:'No Microsoft Windows, o atalho Alt+Tab é utilizado para:',ops:['Fechar a janela ativa.','Abrir o Gerenciador de Tarefas.','Alternar entre as janelas abertas.','Bloquear o computador.','Exibir a área de trabalho.'],g:2,exp:'Alt+Tab alterna entre as janelas abertas, exibindo uma prévia de cada uma.'},
        {n:16,q:'No Microsoft Windows, a combinação Windows+D é utilizada para:',ops:['Abrir o Explorador de Arquivos.','Bloquear o computador.','Exibir ou ocultar a área de trabalho.','Abrir a caixa Executar.','Abrir o Gerenciador de Tarefas.'],g:2,exp:'Windows+D minimiza todas as janelas abertas e exibe a área de trabalho. Pressionado novamente, restaura as janelas.'},
        {n:17,q:'No Microsoft Windows, qual atalho é utilizado para BLOQUEAR o computador rapidamente?',ops:['Ctrl+Alt+Del','Windows+L','Windows+D','Alt+F4','Ctrl+Shift+Esc'],g:1,exp:'Windows+L bloqueia imediatamente o computador, exibindo a tela de login. Útil para preservar a privacidade ao se afastar do computador.'},
        {n:18,q:'Para abrir o Gerenciador de Tarefas DIRETAMENTE no Microsoft Windows, utiliza-se o atalho:',ops:['Ctrl+Alt+Del','Alt+F4','Ctrl+Shift+Esc','Windows+R','Ctrl+Esc'],g:2,exp:'Ctrl+Shift+Esc abre o Gerenciador de Tarefas diretamente. Já Ctrl+Alt+Del exibe um menu com várias opções, sendo o Gerenciador apenas uma delas.'},
        {n:19,q:'No Microsoft Word, o atalho Ctrl+N é utilizado para:',ops:['Aplicar negrito.','Criar um novo documento em branco.','Numerar parágrafos.','Inserir nota de rodapé.','Salvar o documento.'],g:1,exp:'Ctrl+N (New) cria um novo documento em branco. Atenção: no Word em português, Ctrl+N pode aplicar negrito; em inglês, Ctrl+N cria novo documento. Em versões brasileiras do Office, Ctrl+N geralmente cria novo documento.'},
        {n:20,q:'Para ABRIR um arquivo existente no Microsoft Word, utiliza-se o atalho:',ops:['Ctrl+N','Ctrl+S','Ctrl+A','Ctrl+O','Ctrl+F'],g:3,exp:'Ctrl+O (Open) abre a caixa de diálogo para localizar e abrir um arquivo existente.'},
        {n:21,q:'No Microsoft Word, para fechar apenas o documento atual (sem fechar o programa), utiliza-se o atalho:',ops:['Alt+F4','Ctrl+Q','Ctrl+W','Ctrl+F4','Ctrl+X'],g:2,exp:'Ctrl+W fecha o documento atual. Se houver alterações não salvas, o Word perguntará se deseja salvar antes de fechar.'},
        {n:22,q:'No Microsoft Word, o atalho Ctrl+Home leva o cursor para:',ops:['O final do documento.','O início da linha atual.','O início do documento.','O início do parágrafo.','A célula inicial de uma tabela.'],g:2,exp:'Ctrl+Home move o cursor para o início do documento (antes do primeiro caractere).'},
        {n:23,q:'No Microsoft Word, o atalho Ctrl+End leva o cursor para:',ops:['O início do documento.','O final da linha atual.','O final do parágrafo atual.','O final do documento.','A última célula de uma tabela.'],g:3,exp:'Ctrl+End move o cursor para o final do documento (após o último caractere).'},
        {n:24,q:'A tecla Print Screen (PrtSc) no Microsoft Windows é utilizada para:',ops:['Imprimir o documento aberto diretamente.','Capturar uma imagem da tela inteira e copiá-la para a área de transferência.','Tirar foto com a webcam.','Salvar um arquivo em PDF.','Abrir o aplicativo de câmera.'],g:1,exp:'Print Screen captura toda a tela e copia a imagem para a área de transferência. Para salvar apenas a janela ativa, usa-se Alt+Print Screen.'},
        {n:25,q:'No Windows Explorer (Explorador de Arquivos), para RENOMEAR um arquivo ou pasta selecionado(a), utiliza-se a tecla:',ops:['F1','F2','F3','F4','F5'],g:1,exp:'F2 coloca o nome do arquivo ou pasta em modo de edição, permitindo renomeá-lo. Também pode-se clicar duas vezes lentamente no nome.'},
        {n:26,q:'A tecla F5 no Microsoft PowerPoint é utilizada para:',ops:['Salvar a apresentação.','Abrir uma nova apresentação.','Iniciar a apresentação de slides a partir do primeiro slide.','Inserir um novo slide.','Fechar o programa.'],g:2,exp:'F5 inicia a apresentação do primeiro slide. Para iniciar a partir do slide atual, usa-se Shift+F5.'},
        {n:27,q:'No Microsoft Windows, a combinação Ctrl+Alt+Del abre:',ops:['O Explorador de Arquivos.','O navegador padrão.','A tela de opções de segurança do Windows (bloquear, trocar usuário, gerenciar tarefas, entre outros).','O Painel de Controle.','As configurações de rede.'],g:2,exp:'Ctrl+Alt+Del exibe a tela de opções de segurança, que inclui: Bloquear, Trocar usuário, Sair, Gerenciador de Tarefas e Alterar senha.'},
        {n:28,q:'No Microsoft Windows, o atalho Windows+E é utilizado para:',ops:['Abrir o editor de texto padrão.','Abrir o Explorador de Arquivos.','Abrir as configurações de e-mail.','Executar um programa.','Exibir a área de trabalho.'],g:1,exp:'Windows+E (Explorer) abre o Explorador de Arquivos, permitindo navegar pelas pastas e arquivos do computador.'},
        {n:29,q:'No Windows Explorer, para criar uma NOVA PASTA rapidamente, utiliza-se o atalho:',ops:['Ctrl+N','Ctrl+Shift+N','Ctrl+Alt+N','Ctrl+F','Alt+N'],g:1,exp:'Ctrl+Shift+N cria uma nova pasta no diretório atual do Explorador de Arquivos, com o nome em modo de edição.'},
        {n:30,q:'No Microsoft Windows, o atalho Windows+R é utilizado para:',ops:['Reiniciar o computador.','Abrir o Explorador de Arquivos.','Abrir a caixa de diálogo Executar.','Restaurar uma janela minimizada.','Gravar a tela.'],g:2,exp:'Windows+R abre a caixa de diálogo Executar, onde é possível digitar comandos como "cmd", "calc", "notepad", "msconfig", entre outros.'},
      ]},
      {nome:'Microsoft Excel',qs:[
        {n:1,q:'No Microsoft Excel, a fórmula utilizada para SOMAR um intervalo de células de A1 a A10 é:',ops:['=TOTAL(A1:A10)','=ADICIONAR(A1:A10)','=SOMA(A1:A10)','=SOMAR(A1:A10)','=ACUMULAR(A1:A10)'],g:2,exp:'=SOMA(A1:A10) soma todos os valores do intervalo A1 até A10. É uma das funções mais utilizadas no Excel.'},
        {n:2,q:'No Microsoft Excel, a fórmula =MÉDIA(B1:B5) calcula:',ops:['O maior valor do intervalo B1:B5.','A soma dos valores do intervalo B1:B5.','O número de células preenchidas em B1:B5.','A média aritmética dos valores do intervalo B1:B5.','O menor valor do intervalo B1:B5.'],g:3,exp:'=MÉDIA calcula a média aritmética (soma ÷ quantidade) dos valores do intervalo especificado.'},
        {n:3,q:'No Microsoft Excel, qual fórmula retorna o MAIOR valor de um intervalo?',ops:['=MENOR(A1:A10)','=TOPO(A1:A10)','=MAIOR(A1:A10;1)','=MÁXIMO(A1:A10)','=ALTO(A1:A10)'],g:3,exp:'=MÁXIMO retorna o maior valor numérico de um intervalo. Exemplo: =MÁXIMO(A1:A10).'},
        {n:4,q:'No Microsoft Excel, qual fórmula retorna o MENOR valor de um intervalo?',ops:['=MÍNIMO(A1:A10)','=BAIXO(A1:A10)','=MENOR(A1:A10;1)','=REDUZIR(A1:A10)','=MINÚSCULO(A1:A10)'],g:0,exp:'=MÍNIMO retorna o menor valor numérico de um intervalo. Exemplo: =MÍNIMO(A1:A10).'},
        {n:5,q:'No Microsoft Excel, a função SE é utilizada para:',ops:['Somar valores que atendem a um critério.','Retornar um valor se uma condição for verdadeira e outro valor se for falsa.','Calcular a média de um conjunto de valores.','Contar células não vazias.','Localizar um valor em uma tabela.'],g:1,exp:'=SE(teste_lógico; valor_se_verdadeiro; valor_se_falso). Exemplo: =SE(A1>10;"Aprovado";"Reprovado").'},
        {n:6,q:'No Microsoft Excel, a função CONT.SE é utilizada para:',ops:['Somar células que atendem a um critério.','Calcular a média de células que atendem a um critério.','Contar o número de células em um intervalo que atendem a um critério especificado.','Verificar se uma célula está vazia.','Exibir o conteúdo de outra planilha.'],g:2,exp:'=CONT.SE(intervalo; critério). Exemplo: =CONT.SE(A1:A10;"Sim") conta quantas células contêm "Sim".'},
        {n:7,q:'No Microsoft Excel, a função SOMASE é utilizada para:',ops:['Somar todos os valores de um intervalo sem condição.','Somar células de um intervalo que atendem a um critério especificado.','Calcular a média somente de valores positivos.','Contar células com texto.','Substituir valores em um intervalo.'],g:1,exp:'=SOMASE(intervalo; critério; intervalo_soma). Exemplo: =SOMASE(A1:A10;"Sul";B1:B10) soma os valores de B onde A é "Sul".'},
        {n:8,q:'No Microsoft Excel, a função PROCV é utilizada para:',ops:['Calcular o desvio padrão de um intervalo.','Procurar um valor na primeira linha de uma tabela.','Procurar um valor na primeira coluna de uma tabela e retornar um valor de outra coluna na mesma linha.','Contar valores duplicados em um intervalo.','Ordenar uma coluna em ordem crescente.'],g:2,exp:'=PROCV(valor_procurado; matriz_tabela; núm_índice_col; [procurar_intervalo]). Busca verticalmente na primeira coluna da tabela.'},
        {n:9,q:'No Microsoft Excel, o símbolo $ em uma referência como $A$1 indica:',ops:['Que a célula contém um valor monetário.','Que a referência é absoluta e não será alterada ao copiar a fórmula.','Que a célula está protegida contra edição.','Que o valor é negativo.','Que a célula pertence a outra planilha.'],g:1,exp:'O $ fixa a linha ou coluna da referência. $A$1 = absoluta (linha e coluna fixas); A$1 = mista (só linha fixa); $A1 = mista (só coluna fixa); A1 = relativa (nada fixo).'},
        {n:10,q:'No Microsoft Excel, as colunas são identificadas por:',ops:['Números.','Letras.','Símbolos.','Cores.','Números romanos.'],g:1,exp:'As colunas são identificadas por letras (A, B, C... Z, AA, AB...) e as linhas por números (1, 2, 3...). A célula B3, por exemplo, está na coluna B, linha 3.'},
        {n:11,q:'No Microsoft Excel, as linhas são identificadas por:',ops:['Letras.','Símbolos.','Números.','Cores.','Letras minúsculas.'],g:2,exp:'As linhas são identificadas por números (1, 2, 3...). O Excel suporta até 1.048.576 linhas e 16.384 colunas.'},
        {n:12,q:'No Microsoft Excel, a função CONCATENAR (ou o operador &) é utilizada para:',ops:['Somar valores numéricos.','Unir dois ou mais textos em uma única célula.','Calcular o comprimento de um texto.','Converter texto em número.','Separar textos em colunas distintas.'],g:1,exp:'=CONCATENAR(A1;B1) ou =A1&" "&B1 une os textos das células. Exemplo: "João"&" "&"Silva" resulta em "João Silva".'},
        {n:13,q:'No Microsoft Excel, a função HOJE() retorna:',ops:['A hora atual do sistema.','A data e hora atuais.','A data atual do sistema, sem o horário.','O número de dias do mês atual.','O número do dia da semana atual.'],g:2,exp:'=HOJE() retorna a data atual do computador e se atualiza automaticamente a cada abertura da planilha. Não inclui horário.'},
        {n:14,q:'No Microsoft Excel, a função AGORA() retorna:',ops:['Apenas a data atual.','A data e a hora atuais do sistema.','Apenas a hora atual.','O número de segundos desde meia-noite.','O fuso horário configurado no sistema.'],g:1,exp:'=AGORA() retorna a data e hora atuais do sistema, atualizando-se a cada recalculação da planilha.'},
        {n:15,q:'No Microsoft Excel, a Formatação Condicional permite:',ops:['Proteger células contra edição.','Aplicar formatação visual automaticamente às células com base em regras ou valores definidos pelo usuário.','Criar fórmulas condicionais com SE.','Ocultar linhas que não atendam a um critério.','Converter valores de texto em formato de data.'],g:1,exp:'A Formatação Condicional destaca visualmente células que atendem a critérios definidos (ex.: células com valor acima de 100 ficam vermelhas), facilitando a análise dos dados.'},
        {n:16,q:'No Microsoft Excel, a Tabela Dinâmica (Tabela de Pivot) é utilizada para:',ops:['Criar tabelas com bordas decorativas.','Resumir, analisar, explorar e apresentar dados de uma planilha de forma interativa.','Importar dados de outro programa.','Mesclar células de uma tabela.','Converter uma tabela em gráfico automaticamente.'],g:1,exp:'A Tabela Dinâmica permite consolidar grandes volumes de dados, agrupando-os, calculando totais e subtotais sem alterar os dados originais.'},
        {n:17,q:'No Microsoft Excel, para ativar ou desativar o Filtro Automático em uma planilha, utiliza-se o atalho:',ops:['Ctrl+F','Ctrl+Shift+F','Ctrl+Shift+L','Ctrl+Alt+F','Alt+F'],g:2,exp:'Ctrl+Shift+L ativa/desativa as setas de filtro automático nas colunas selecionadas (ou na tabela inteira, se nenhuma célula específica for selecionada).'},
        {n:18,q:'No Microsoft Excel, para inserir um gráfico com base nos dados selecionados, o usuário deve acessar a guia:',ops:['Página Inicial','Fórmulas','Dados','Inserir','Exibição'],g:3,exp:'A guia Inserir contém o grupo Gráficos, onde é possível escolher o tipo de gráfico (colunas, linhas, pizza, etc.) a ser criado com os dados selecionados.'},
        {n:19,q:'No Microsoft Excel, ao editar uma fórmula, pressionar F4 sobre uma referência de célula tem o efeito de:',ops:['Excluir a fórmula.','Copiar a fórmula para a célula abaixo.','Alternar entre os tipos de referência (relativa, absoluta e mista).','Abrir a janela de ajuda.','Confirmar a entrada e mover para a próxima célula.'],g:2,exp:'Pressionando F4 sobre uma referência: 1ª vez → $A$1 (absoluta); 2ª vez → A$1 (linha fixa); 3ª vez → $A1 (coluna fixa); 4ª vez → A1 (relativa novamente).'},
        {n:20,q:'No Microsoft Excel, o atalho Ctrl+; (ponto e vírgula) é utilizado para:',ops:['Inserir a hora atual na célula.','Inserir a data atual na célula como valor fixo.','Criar uma fórmula de subtração.','Separar argumentos de uma função.','Aplicar o formato de data longa.'],g:1,exp:'Ctrl+; insere a data atual como valor fixo (não se atualiza). Diferente de =HOJE(), que atualiza automaticamente.'},
        {n:21,q:'No Microsoft Excel, a função CONT.NÚM é utilizada para:',ops:['Contar células que contêm texto.','Contar células não vazias de qualquer tipo.','Contar apenas as células que contêm valores numéricos.','Somar os valores numéricos de um intervalo.','Contar células que atendem a um critério.'],g:2,exp:'=CONT.NÚM conta apenas células com números. =CONT.VALORES conta células não vazias (qualquer tipo). =CONTAR.VAZIO conta células vazias.'},
        {n:22,q:'No Microsoft Excel, a função ABS é utilizada para:',ops:['Retornar o valor absoluto (módulo) de um número, sempre positivo.','Somar todos os valores de um intervalo.','Arredondar um número para o inteiro mais próximo.','Calcular a raiz quadrada de um número.','Converter um número negativo em texto.'],g:0,exp:'=ABS(número) retorna o valor absoluto. Exemplo: =ABS(-15) = 15; =ABS(15) = 15.'},
        {n:23,q:'No Microsoft Excel, a função INT é utilizada para:',ops:['Calcular o valor inteiro de uma divisão.','Converter texto em número inteiro.','Arredondar um número para baixo até o inteiro mais próximo.','Calcular o número de caracteres de um texto.','Verificar se um número é inteiro.'],g:2,exp:'=INT(número) arredonda sempre para baixo. Exemplo: =INT(4,9) = 4; =INT(-4,1) = -5 (arredonda para o inteiro menor).'},
        {n:24,q:'No Microsoft Excel, a função MOD retorna:',ops:['O resultado de uma divisão inteira.','O resto da divisão entre dois números.','O módulo de um número negativo.','A moda estatística de um conjunto de valores.','O maior divisor comum entre dois números.'],g:1,exp:'=MOD(número; divisor) retorna o resto da divisão. Exemplo: =MOD(10;3) = 1, pois 10 ÷ 3 = 3 com resto 1.'},
        {n:25,q:'No Microsoft Excel, a função ARRED é utilizada para:',ops:['Arredondar um número para um número especificado de dígitos decimais.','Sempre arredondar para cima, independentemente do valor decimal.','Sempre arredondar para baixo, independentemente do valor decimal.','Remover os decimais sem arredondar.','Converter número em texto com casas decimais.'],g:0,exp:'=ARRED(número; núm_dígitos) arredonda conforme a regra matemática. Exemplo: =ARRED(2,567;2) = 2,57; =ARRED(2,564;2) = 2,56.'},
        {n:26,q:'No Microsoft Excel, a função NÚM.CARACT é utilizada para:',ops:['Contar o número de células preenchidas.','Retornar o número de caracteres de uma cadeia de texto.','Converter números em texto.','Extrair parte de um texto a partir de uma posição.','Remover espaços extras de um texto.'],g:1,exp:'=NÚM.CARACT(texto) conta todos os caracteres, incluindo espaços. Exemplo: =NÚM.CARACT("ACE") = 3.'},
        {n:27,q:'No Microsoft Excel, o recurso Congelar Painéis (guia Exibição) é utilizado para:',ops:['Proteger células contra edição.','Dividir a janela em dois painéis de rolagem independentes.','Manter linhas e/ou colunas específicas visíveis ao rolar a planilha.','Ocultar linhas e colunas selecionadas.','Aplicar bordas fixas na planilha.'],g:2,exp:'Congelar Painéis mantém a linha de cabeçalho e/ou a primeira coluna sempre visíveis ao rolar a planilha, facilitando a leitura de tabelas grandes.'},
        {n:28,q:'No Microsoft Excel, a Validação de Dados (guia Dados) permite:',ops:['Verificar automaticamente as fórmulas da planilha.','Definir restrições sobre os tipos ou valores que podem ser inseridos em uma célula.','Importar dados de fontes externas.','Classificar os dados em ordem alfabética.','Proteger a planilha com senha.'],g:1,exp:'Com Validação de Dados é possível permitir apenas números inteiros, datas, listas suspensas, entre outros, exibindo mensagens de erro quando o usuário inserir um valor inválido.'},
        {n:29,q:'No Microsoft Excel, para selecionar uma COLUNA INTEIRA, utiliza-se o atalho:',ops:['Shift+Espaço','Ctrl+Shift+Espaço','Ctrl+Espaço','Alt+Espaço','Ctrl+Shift+Seta para cima'],g:2,exp:'Ctrl+Espaço seleciona a coluna inteira da célula ativa. Shift+Espaço seleciona a linha inteira.'},
        {n:30,q:'No Microsoft Excel, ao pressionar Ctrl+Seta (direita, esquerda, cima ou baixo) dentro de um bloco de dados, o cursor se move para:',ops:['A célula A1.','O final da planilha (última linha ou coluna usável).','A última célula preenchida na direção da seta dentro do bloco de dados contíguo.','A próxima planilha na direção pressionada.','A célula oposta na mesma linha.'],g:2,exp:'Ctrl+Seta pula para a última célula preenchida do bloco na direção indicada. Se a célula atual for a última do bloco, pula para a próxima célula preenchida ou vai até a borda da planilha.'},
      ]},
    ]
  },
  {
    id:'sim-visita1',titulo:'ACE Visita Domiciliar',banca:'aceEstuda',ano:2025,
    edital:'Agente de Combate às Endemias – Lei 13.595/2018',cargo:'ACE',
    secoes:[
      {nome:'Visita Domiciliar',qs:[
        {n:1,q:"A Lei 13.595, de 5 de janeiro de 2018, dispõe sobre as atribuições do Agente de Combate às Endemias.\n\nUma dessas atribuições é a visita domiciliar, em que o ACE trabalha em contato direto com a população. Para que uma visita domiciliar seja bem feita, é necessário:",ops:["Planejamento","Mobilização","Diagnóstico","Vínculo"],g:0,exp:"O planejamento é etapa fundamental para que a visita domiciliar seja realizada de forma eficaz. Planejar significa definir previamente os objetivos, o roteiro, os materiais necessários e as prioridades do território a ser visitado, garantindo organização e qualidade no trabalho do ACE."},
        {n:2,q:"Na Estratégia Saúde da Família, a finalidade da visita domiciliar é:",ops:["Prestar atenção básica à saúde.","Realizar procedimento de alta complexidade.","Realizar notificação de doenças.","Diagnosticar as doenças detectadas na demanda passiva."],g:0,exp:"A visita domiciliar na Estratégia Saúde da Família tem como finalidade principal prestar atenção básica à saúde, aproximando a equipe da realidade do paciente em seu próprio ambiente. Procedimentos de alta complexidade não são realizados no domicílio, e a notificação e diagnóstico são consequências pontuais, não a finalidade principal da visita."},
        {n:3,q:"Qual é o papel do Agente de Endemias na visita domiciliar?",ops:["Realizar exames laboratoriais em casa.","Fornecer informações e orientações sobre prevenção e controle de doenças, identificar criadouros de vetores e realizar ações educativas.","Coordenar a construção de novas unidades de saúde.","Administrar campanhas de arrecadação de fundos para a saúde pública."],g:1,exp:"O ACE tem papel essencial na visita domiciliar: orientar a população sobre prevenção e controle de doenças, identificar e eliminar criadouros de vetores (como o Aedes aegypti) e realizar ações de educação em saúde. Exames laboratoriais, construção de unidades de saúde e arrecadação de fundos não fazem parte de suas atribuições."},
      ]},
    ]
  },
  {
    id:'sim-passei1',titulo:'Português - Ação Bahia - Curso Preparatório Passei',banca:'Passei',ano:2025,
    edital:'Curso Preparatório Passei – Ação Bahia',cargo:'ACE',
    secoes:[
      {nome:'Língua Portuguesa',qs:[
        {n:1,q:"Assinale a alternativa que completa adequadamente a lacuna no título do texto:",ops:["Porque","Porquê","Por que","Por quê","NDA"],g:2,exp:"'Por que' (separado e sem acento) é usado em perguntas diretas e indiretas, equivalendo a 'pelo qual / pela qual'. Nas locuções interrogativas ou relativas dentro de frases, usa-se 'por que'. 'Porque' é conjunção causal/explicativa. 'Porquê' é substantivo (artigo + substantivo). 'Por quê' aparece no final de frases interrogativas."},
        {n:2,q:"Classifique o sujeito da oração abaixo:\n\"Continua trovejando\"",ops:["Oração sem sujeito","Sujeito simples","Sujeito elíptico","Sujeito composto","Sujeito indeterminado"],g:0,exp:"Verbos que indicam fenômenos da natureza (trovejar, chover, nevar, ventar etc.) são impessoais e formam orações sem sujeito. 'Continua trovejando' usa 'continuar' como verbo auxiliar de um verbo de fenômeno natural, tornando toda a construção uma oração sem sujeito."},
        {n:3,q:"No quadrinho abaixo temos um exemplo de qual figura de linguagem?\n\nMenino 1: Meu pai tem oitocentas cabeças de gado! E o seu?\nMenino 2: O meu pai só tem um boi, mas ele tá inteirinho!",ops:["Pleonasmo","Metonímia","Catacrese","Metáfora","Hipérbole"],g:1,exp:"A Metonímia é a figura de linguagem que consiste na substituição de um termo por outro com o qual mantém relação de contiguidade. No quadrinho, 'cabeças de gado' usa a parte (cabeça) pelo todo (animal), caracterizando a metonímia."},
        {n:4,q:"Assinale a alternativa em que a frase está na voz reflexiva:",ops:["Feri-me com a faca.","A casa caiu.","Ela foi ferida.","O cachorro foi levado por Ana.","Ana levou o cachorro."],g:0,exp:"Na voz reflexiva, o sujeito pratica e ao mesmo tempo sofre a ação do verbo. Em 'Feri-me com a faca', o sujeito (eu) feriu a si mesmo, caracterizando a voz reflexiva. 'Ela foi ferida' e 'O cachorro foi levado por Ana' estão na voz passiva. 'Ana levou o cachorro' está na voz ativa. 'A casa caiu' é voz ativa sem complemento."},
      ]},
    ]
  },
  {
    id:'sim-figuras1',titulo:'Figuras de Linguagem e Acentuação - Ação Bahia',banca:'Ação Bahia',ano:2025,
    edital:'Curso Preparatório – Ação Bahia',cargo:'ACE',
    secoes:[
      {nome:'Figuras de Linguagem (Q1–Q20)',qs:[
        {n:1,q:"Leia o trecho e identifique a figura de linguagem:\n\"A vida é uma viagem sem destino certo.\"",ops:["Comparação","Metonímia","Metáfora","Hipérbole","Ironia"],g:2,exp:"A Metáfora é a transferência de sentido entre dois termos por semelhança, sem o uso de conectivos comparativos ('como', 'tal qual'). Em 'A vida é uma viagem', a vida é identificada diretamente com uma viagem, caracterizando a metáfora."},
        {n:2,q:"Identifique a figura de linguagem no trecho:\n\"Já te disse um milhão de vezes para não fazer isso!\"",ops:["Ironia","Antítese","Hipérbole","Metonímia","Pleonasmo"],g:2,exp:"A Hipérbole consiste no exagero intencional de uma ideia para enfatizá-la. Dizer 'um milhão de vezes' é claramente um exagero com fins expressivos."},
        {n:3,q:"No trecho \"O vento sussurrava segredos entre as árvores\", a figura de linguagem presente é:",ops:["Metáfora","Comparação","Metonímia","Personificação","Catacrese"],g:3,exp:"A Personificação (ou Prosopopeia) atribui características humanas a seres inanimados ou irracionais. 'O vento sussurrava segredos' atribui ao vento a capacidade humana de sussurrar e guardar segredos."},
        {n:4,q:"Identifique a figura de linguagem:\n\"Ele é valente como um leão.\"",ops:["Metáfora","Hipérbole","Comparação","Metonímia","Ironia"],g:2,exp:"A Comparação (ou Símile) aproxima dois termos por semelhança usando conectivos comparativos como 'como', 'tal qual', 'assim como'. O uso de 'como' distingue a comparação da metáfora."},
        {n:5,q:"Qual figura de linguagem está presente na frase:\n\"O braço da poltrona estava quebrado.\"",ops:["Personificação","Metáfora","Catacrese","Pleonasmo","Hipérbole"],g:2,exp:"A Catacrese é o uso de uma palavra fora de seu sentido original, por falta de termo específico, de modo que a expressão já não causa estranhamento. 'Braço da poltrona' é catacrese, pois não há outro termo para essa parte do móvel."},
        {n:6,q:"\"Descer para baixo\" é exemplo de qual figura de linguagem?",ops:["Metáfora","Hipérbole","Ironia","Pleonasmo","Gradação"],g:3,exp:"O Pleonasmo é a repetição redundante de uma ideia já expressa. 'Descer para baixo' é pleonástico, pois 'descer' já implica movimento para baixo."},
        {n:7,q:"Na frase \"Ela partiu para uma viagem sem volta\", o falante usa qual recurso para se referir à morte?",ops:["Ironia","Hipérbole","Antítese","Metáfora","Eufemismo"],g:4,exp:"O Eufemismo é a substituição de uma expressão desagradável ou chocante por outra mais suave. 'Partiu para uma viagem sem volta' é uma forma atenuada de dizer que a pessoa morreu."},
        {n:8,q:"Um aluno entregou a prova em branco e o professor disse: \"Que trabalho caprichado!\". A figura de linguagem usada é:",ops:["Hipérbole","Comparação","Eufemismo","Ironia","Antítese"],g:3,exp:"A Ironia consiste em afirmar o contrário do que se quer dizer, geralmente com intenção crítica ou humorística. O professor elogia justamente o que não foi feito, caracterizando a ironia."},
        {n:9,q:"\"O amor e o ódio são faces da mesma moeda.\" Essa frase contém a figura de linguagem denominada:",ops:["Paradoxo","Antítese","Gradação","Eufemismo","Hipérbole"],g:1,exp:"A Antítese é a aproximação de ideias contrárias ou opostas. 'Amor' e 'ódio' são termos de sentido oposto colocados em relação de contraste na mesma frase."},
        {n:10,q:"\"O rato roeu a roupa do rei de Roma.\" Essa frase é um exemplo clássico de:",ops:["Onomatopeia","Assonância","Aliteração","Anáfora","Eufonia"],g:2,exp:"A Aliteração é a repetição de consoantes iguais ou semelhantes para criar efeito sonoro. A repetição do fonema /r/ em 'rato, roeu, roupa, rei, Roma' caracteriza a aliteração."},
        {n:11,q:"Na frase \"O relógio fazia tic-tac na parede\", a palavra destacada representa qual figura?",ops:["Aliteração","Metáfora","Onomatopeia","Personificação","Metonímia"],g:2,exp:"A Onomatopeia é a palavra que imita o som natural do ser ou objeto que designa. 'Tic-tac' reproduz o som característico do relógio."},
        {n:12,q:"Na frase \"Preciso ler mais Machado de Assis\", o autor é citado no lugar de suas obras. Isso é exemplo de:",ops:["Metáfora","Comparação","Hipérbole","Metonímia","Personificação"],g:3,exp:"A Metonímia é a substituição de um termo por outro com o qual mantém relação de contiguidade (autor pela obra, parte pelo todo, etc.). Citar o autor para referir-se às suas obras é metonímia."},
        {n:13,q:"\"Vim, vi, venci.\" — frase atribuída a Júlio César. A figura de linguagem presente é:",ops:["Anáfora","Aliteração","Pleonasmo","Gradação","Elipse"],g:3,exp:"A Gradação (ou Clímax) é a apresentação de ideias em ordem crescente (ou decrescente) de intensidade. 'Vim, vi, venci' representa uma progressão de ações que culminam no sucesso."},
        {n:14,q:"\"É preciso morrer um pouco para aprender a viver.\" Essa frase apresenta a figura de linguagem:",ops:["Antítese","Paradoxo","Hipérbole","Ironia","Eufemismo"],g:1,exp:"O Paradoxo apresenta ideias que parecem contraditórias mas que expressam uma verdade mais profunda. 'Morrer para viver' é aparentemente impossível, mas carrega sentido filosófico."},
        {n:15,q:"\"Ela tinha um sorriso gostoso e um olhar doce.\" A mistura de sentidos (paladar e visão) presente nessa frase é chamada de:",ops:["Metáfora","Comparação","Sinestesia","Personificação","Hipérbole"],g:2,exp:"A Sinestesia é a mistura de impressões sensoriais de sentidos diferentes (visão, audição, paladar, tato, olfato). 'Sorriso gostoso' (visão + paladar) e 'olhar doce' (visão + paladar) são sinestesias."},
        {n:16,q:"\"Quero paz. Quero amor. Quero justiça.\" A repetição da palavra 'Quero' no início de cada frase é uma figura chamada:",ops:["Gradação","Aliteração","Anáfora","Pleonasmo","Elipse"],g:2,exp:"A Anáfora é a repetição de uma palavra ou expressão no início de versos ou orações consecutivas, criando ênfase e ritmo."},
        {n:17,q:"Na frase \"Na sala, silêncio absoluto\", houve a omissão de um verbo (havia/reinava). Essa figura é chamada de:",ops:["Zeugma","Elipse","Silepse","Anacoluto","Assíndeto"],g:1,exp:"A Elipse é a omissão de um termo que pode ser facilmente subentendido. A omissão do verbo 'havia' ou 'reinava' não prejudica a compreensão da frase."},
        {n:18,q:"\"Pedro foi ao cinema e Maria, ao teatro.\" A omissão do verbo 'foi' na segunda oração é uma figura chamada:",ops:["Elipse","Silepse","Zeugma","Anacoluto","Assíndeto"],g:2,exp:"O Zeugma é uma variação da elipse em que se omite um termo (geralmente um verbo) já mencionado anteriormente. 'Maria, ao teatro' omite 'foi', que já apareceu na primeira oração."},
        {n:19,q:"\"A maioria saiu e foram para casa.\" A concordância com o sentido (plural) em vez de com a palavra 'maioria' (singular) é chamada de:",ops:["Pleonasmo","Zeugma","Silepse","Anacoluto","Elipse"],g:2,exp:"A Silepse é a concordância feita com a ideia ou sentido implícito do termo, e não com sua forma gramatical explícita. 'Maioria' é singular, mas o falante concorda com a ideia de plural implícita."},
        {n:20,q:"\"Cheguei, olhei, fiquei, amei.\" A ausência de conjunções ligando os verbos é chamada de:",ops:["Polissíndeto","Gradação","Assíndeto","Anáfora","Aliteração"],g:2,exp:"O Assíndeto é a ausência de conjunções entre termos ou orações que poderiam ser ligados por elas. A enumeração sem conectivos cria um ritmo mais rápido e dinâmico."},
      ]},
      {nome:'Acentuação (Q21–Q40)',qs:[
        {n:21,q:"De acordo com o Novo Acordo Ortográfico de 2009, qual a grafia CORRETA?",ops:["vôo","voo","vóo","vòo","vôô"],g:1,exp:"Com o Novo Acordo Ortográfico (2009), palavras com sequência 'oo' deixaram de ser acentuadas. 'Voo' (não mais 'vôo') é a grafia correta atual."},
        {n:22,q:"Qual palavra teve seu acento REMOVIDO pelo Novo Acordo Ortográfico de 2009?",ops:["saúde","país","ideia","médico","café"],g:2,exp:"'Ideia' (antes grafada 'idéia') perdeu o acento sobre o 'e' com o Acordo de 2009, que eliminou o acento em ditongos 'ei' e 'oi' abertos em palavras paroxítonas."},
        {n:23,q:"Assinale a alternativa em que TODAS as palavras estão grafadas CORRETAMENTE conforme o Acordo Ortográfico de 2009:",ops:["vôo, idéia, assembléia","voo, ideia, assembleia","voo, idéia, assembleia","vôo, ideia, assembléia","heróico, bóia, paranóico"],g:1,exp:"Todas as palavras da alternativa B estão corretas: 'voo' (sem acento no oo), 'ideia' (sem acento no ei), 'assembleia' (sem acento no ei). As demais alternativas mantêm grafias antigas, já abolidas."},
        {n:24,q:"Em qual das alternativas o acento diferencial está empregado CORRETAMENTE?",ops:["O time não pôde jogar ontem, pois estava suspenso.","Ele pode ir amanhã, pôis ficou doente.","Vou por a mesa agora.","Preciso pára antes de continuar.","Ele pôr o casaco no cabide."],g:0,exp:"'Pôde' (com circunflexo) é o pretérito perfeito do verbo 'poder', diferenciando-se de 'pode' (presente do indicativo). Esse acento diferencial foi mantido pelo Acordo de 2009."},
        {n:25,q:"Qual das palavras abaixo é PROPAROXÍTONA?",ops:["café","Brasil","médico","fácil","país"],g:2,exp:"Proparoxítonas têm a sílaba tônica na antepenúltima posição. 'Médico' (MÉ-di-co) é proparoxítona. Todas as proparoxítonas são acentuadas em português."},
        {n:26,q:"Assinale a alternativa em que a palavra é OXÍTONA e recebe acento gráfico:",ops:["fácil","médico","vírus","café","ordem"],g:3,exp:"'Café' (ca-FÉ) é oxítona terminada em 'e', recebendo acento agudo conforme a regra de acentuação de oxítonas terminadas em a, e, o (e seus plurais)."},
        {n:27,q:"Qual das palavras é uma PAROXÍTONA que, por terminar em 'l', recebe acento gráfico?",ops:["casa","mesa","fácil","Brasil","café"],g:2,exp:"Paroxítonas terminadas em l, r, x, n, ps, ã, ão, i, u, um, uns e ditongos recebem acento gráfico. 'Fácil' (FÁ-cil) é paroxítona terminada em -l e, por isso, é acentuada."},
        {n:28,q:"Qual das palavras a seguir tem seu acento justificado por conter um HIATO com vogal tônica?",ops:["heroico","saúde","voo","ideia","assembleia"],g:1,exp:"'Saúde' (sa-Ú-de) contém um hiato em que o 'u' é a vogal tônica. Vogais 'i' e 'u' tônicas em hiato, quando não seguidas de 'nh' e sozinhas na sílaba, recebem acento."},
        {n:29,q:"Assinale a alternativa com a palavra grafada INCORRETAMENTE de acordo com o Novo Acordo Ortográfico:",ops:["voo","heroico","ideia","assembléia","jiboia"],g:3,exp:"'Assembléia' é grafia antiga. Com o Acordo Ortográfico de 2009, o acento sobre o 'e' em ditongos 'ei' de paroxítonas foi eliminado. A grafia correta é 'assembleia'."},
        {n:30,q:"Qual palavra abaixo NÃO recebe acento gráfico de acordo com as regras do Acordo Ortográfico de 2009?",ops:["saúde","país","egoísta","heroico","médico"],g:3,exp:"'Heroico' (he-ROI-co) é paroxítona com ditongo 'oi'. O Acordo de 2009 eliminou o acento em ditongos 'ei' e 'oi' de paroxítonas. Portanto, 'heroico' NÃO é mais acentuado."},
        {n:31,q:"Assinale a alternativa em que a palavra é acentuada por ser PROPAROXÍTONA:",ops:["café","saúde","público","fácil","ímã"],g:2,exp:"'Público' (PÚ-bli-co) é proparoxítona (sílaba tônica na antepenúltima). Todas as proparoxítonas recebem acento obrigatoriamente em português."},
        {n:32,q:"Qual das alternativas apresenta uma palavra corretamente acentuada por ser PAROXÍTONA terminada em 'n'?",ops:["jovem","ótimo","hífen","também","alguém"],g:2,exp:"'Hífen' (HÍ-fen) é paroxítona terminada em -n, o que a obriga a receber acento gráfico. 'Também' e 'alguém' são oxítonas terminadas em -em."},
        {n:33,q:"Assinale a alternativa em que a palavra é acentuada por conter um HIATO com vogal 'i' ou 'u' tônica:",ops:["treino","heroico","cafeína","ideia","assembleia"],g:2,exp:"'Cafeína' (ca-fe-Í-na) contém hiato com 'í' tônico. A vogal 'i' (ou 'u') tônica em hiato, sozinha na sílaba e não seguida de 'nh', recebe acento. 'Ideia' e 'assembleia' não têm hiato — têm ditongo."},
        {n:34,q:"Qual palavra abaixo perdeu o trema (ü) com o Novo Acordo Ortográfico de 2009?",ops:["saúde","país","tranquilo","médico","café"],g:2,exp:"'Tranquilo' (antes grafado 'tranqüilo') perdeu o trema com o Acordo de 2009. O trema foi eliminado do português brasileiro, exceto em nomes próprios estrangeiros e seus derivados."},
        {n:35,q:"Assinale a alternativa em que TODAS as palavras estão INCORRETAMENTE grafadas segundo o Acordo Ortográfico atual:",ops:["vôo, idéia, assembléia","voo, ideia, assembleia","heroico, jiboia, paranoico","saúde, país, egoísta","médico, público, lúcido"],g:0,exp:"'Vôo', 'idéia' e 'assembléia' são grafias antigas, eliminadas pelo Acordo de 2009. As demais alternativas apresentam pelo menos uma palavra grafada corretamente."},
        {n:36,q:"Na frase \"Ele pôde concluir o trabalho ontem\", o acento em 'pôde' indica que se trata de:",ops:["Verbo no presente do indicativo","Verbo no pretérito perfeito","Substantivo","Adjetivo","Advérbio"],g:1,exp:"'Pôde' (com circunflexo) é a 3ª pessoa do singular do pretérito perfeito do verbo 'poder'. 'Pode' (sem acento) é o presente. Esse acento diferencial foi mantido pelo Acordo de 2009."},
        {n:37,q:"Assinale a alternativa em que a classificação quanto à posição da sílaba tônica está CORRETA:",ops:["ca-fé → paroxítona","mé-di-co → paroxítona","fá-cil → oxítona","sa-ú-de → paroxítona","Bra-sil → paroxítona"],g:3,exp:"'Saúde' (sa-Ú-de): a sílaba tônica é a penúltima ('ú'), portanto é PAROXÍTONA. Café é oxítona. Médico é proparoxítona. Fácil é paroxítona (não oxítona). Brasil é oxítona."},
        {n:38,q:"Assinale a alternativa em que a palavra é OXÍTONA terminada em -em e recebe acento gráfico:",ops:["jovem","também","falam","ótimo","fácil"],g:1,exp:"'Também' (tam-BÉM) é oxítona terminada em -em e recebe acento agudo. 'Jovem' é paroxítona terminada em -em (sem acento). 'Falam' é paroxítona terminada em -am (sem acento)."},
        {n:39,q:"Qual das palavras abaixo NÃO recebe acento gráfico de acordo com as regras atuais?",ops:["saúde","país","egoísta","voo","médico"],g:3,exp:"'Voo' não recebe acento gráfico pelas regras atuais. Antes era 'vôo', mas o Acordo Ortográfico de 2009 eliminou o acento em palavras com sequência 'oo'."},
        {n:40,q:"Assinale a alternativa em que a palavra é acentuada por ser PAROXÍTONA terminada em ditongo oral crescente:",ops:["água","café","Brasil","país","médico"],g:0,exp:"'Água' (Á-gua) é paroxítona terminada em ditongo oral crescente '-ua'. Paroxítonas terminadas em ditongo recebem acento gráfico obrigatório."},
      ]},
    ]
  },
  {
    id:'sim-porques1',titulo:'Porques - Ação Bahia',banca:'Ação Bahia',ano:2024,
    edital:'Curso Preparatório – Simulado Temático',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Porquês (Q1–Q20)',qs:[
        {n:1,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Ele faltou ao trabalho ___ estava doente.'",ops:["por que","porquê","por quê","porque","pôr que"],g:3,exp:"'Porque' é conjunção subordinativa causal/coordenativa explicativa que une duas orações, indicando o motivo da falta. Pode ser substituído por 'pois' ou 'visto que'."},
        {n:2,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Esta é a razão ___ me dedico tanto aos estudos.'",ops:["porque","porquê","por quê","pôr que","por que"],g:4,exp:"'Por que' (separado, sem acento) funciona como pronome relativo equivalente a 'pela qual': 'Esta é a razão pela qual me dedico...' O antecedente é 'razão'."},
        {n:3,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Ninguém soube explicar o ___ da briga.'",ops:["porque","por que","por quê","pôr que","porquê"],g:4,exp:"'Porquê' (junto, com acento circunflexo) é substantivo quando precedido de artigo, pronome ou numeral. Equivale a 'motivo' ou 'razão'. Plural: os porquês."},
        {n:4,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Ele foi embora sem dizer ___.'",ops:["porque","porquê","por que","por quê","pôr que"],g:3,exp:"'Por quê' (separado, com acento) é usado no final de frase ou antes de ponto final/vírgula. Equivale a 'por qual motivo' em posição final."},
        {n:5,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Não sei ___ ele agiu daquela forma.'",ops:["por quê","porquê","por que","porque","pôr que"],g:2,exp:"Em perguntas indiretas (oração subordinada interrogativa indireta), usa-se 'por que' (separado, sem acento), equivalente a 'por qual motivo'."},
        {n:6,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Estudei muito, ___ quero passar no concurso.'",ops:["por que","por quê","porquê","pôr que","porque"],g:4,exp:"'Porque' como conjunção causal introduz a oração que expressa a causa/motivo do estudo intenso. Pode ser substituído por 'pois' ou 'uma vez que'."},
        {n:7,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Qual é o ___ de tanto esforço?'",ops:["porque","por que","por quê","pôr que","porquê"],g:4,exp:"Precedido do artigo 'o', 'porquê' funciona como substantivo sinônimo de 'motivo' ou 'razão'. Grafia: junto e com acento circunflexo."},
        {n:8,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Me conte ___ você estava chorando.'",ops:["porquê","por quê","por que","porque","pôr que"],g:2,exp:"'Por que' (separado, sem acento) em oração subordinada interrogativa indireta. A oração 'você estava chorando' é subordinada à principal 'Me conte'."},
        {n:9,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Ela ajuda os outros ___ é muito generosa.'",ops:["por que","porquê","por quê","pôr que","porque"],g:4,exp:"'Porque' é conjunção causal: a generosidade é apresentada como causa/motivo do ato de ajudar. Substituível por 'pois' ou 'dado que'."},
        {n:10,q:"Assinale a alternativa que preenche corretamente a lacuna: 'O candidato não entendeu ___ foi eliminado.'",ops:["porque","porquê","por quê","por que","pôr que"],g:3,exp:"'Por que' em oração subordinada interrogativa indireta: equivale a 'por qual motivo'. O candidato não entendeu a razão da eliminação."},
        {n:11,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Você foi embora? ___?'",ops:["Porque","Porquê","Por que","Pôr que","Por quê"],g:4,exp:"'Por quê' (separado, com acento) é usado em perguntas diretas quando aparece isolado ou no final da frase — antes de ponto de interrogação."},
        {n:12,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Há muitos ___ para a evasão escolar.'",ops:["por que","por quê","porque","pôr que","porquês"],g:4,exp:"'Porquês' é o plural do substantivo 'porquê'. Nesta frase está no plural pois há vários motivos implícitos. Grafia: junto, com acento, acrescido de -s."},
        {n:13,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Fui ao pronto-socorro ___ estava com febre alta.'",ops:["por que","porquê","por quê","pôr que","porque"],g:4,exp:"'Porque' conjunção causal indica que a febre foi o motivo da ida ao pronto-socorro. Poderia ser substituído por 'pois' ou 'visto que'."},
        {n:14,q:"Assinale a alternativa que preenche corretamente a lacuna: 'O professor explicou o ___ das regras gramaticais.'",ops:["por que","por quê","porque","pôr que","porquê"],g:4,exp:"Precedido do artigo 'o', 'porquê' é substantivo (= motivo, razão). A grafia correta é junto e com acento: 'o porquê'."},
        {n:15,q:"Assinale a alternativa que preenche corretamente a lacuna: 'A razão ___ lutamos é a paz.'",ops:["porque","porquê","por quê","pôr que","por que"],g:4,exp:"'Por que' como pronome relativo, equivalente a 'pela qual': 'A razão pela qual lutamos é a paz.' O antecedente é 'razão'."},
        {n:16,q:"Assinale a alternativa em que o uso do 'porque/por que/porquê/por quê' está INCORRETO:",ops:["Não sei por que ela partiu.","Ele saiu porque estava cansado.","Explique o porquê da sua atitude.","Você saiu, mas não disse o por quê.","Por que você está triste?"],g:3,exp:"'O por quê' está incorreto. Quando precedido de artigo, o vocábulo é substantivo e deve ser grafado junto: 'o porquê' (não 'o por quê'). As demais alternativas apresentam uso correto."},
        {n:17,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Trabalhamos duro ___ acreditamos no nosso potencial.'",ops:["por que","porquê","por quê","pôr que","porque"],g:4,exp:"'Porque' é conjunção causal: a crença no potencial é a causa do trabalho intenso. Substituível por 'pois', 'uma vez que' ou 'visto que'."},
        {n:18,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Desejo saber os ___ da sua decisão.'",ops:["por quê","por que","porque","pôr que","porquês"],g:4,exp:"'Porquês' (plural de 'porquê') é substantivo precedido do artigo 'os'. Grafia: junto, com acento, acrescido de -s para o plural."},
        {n:19,q:"Assinale a alternativa que preenche corretamente a lacuna: 'Você sabe ___ a dengue se prolifera no verão?'",ops:["porquê","por quê","porque","pôr que","por que"],g:4,exp:"'Por que' em pergunta indireta integrada à oração principal 'Você sabe'. Equivale a 'por qual motivo'. Grafia: separado, sem acento."},
        {n:20,q:"Assinale a frase em que 'porque' é conjunção EXPLICATIVA (e não causal):",ops:["Corri porque estava atrasado.","Ela não saiu porque estava doente.","Deve estar chovendo, porque as ruas estão molhadas.","Ele estudou porque queria passar.","Fui ao médico porque sentia dor."],g:2,exp:"Em 'Deve estar chovendo, porque as ruas estão molhadas', o 'porque' é explicativo: apresenta uma evidência para justificar a afirmação anterior — equivale a 'pois' (coordenativa explicativa). Nas demais, 'porque' é causal (subordinativa)."},
      ]},
      {nome:'Vozes Verbais (Q21–Q40)',qs:[
        {n:21,q:"'O agente de endemias aplicou o inseticida.' Esta frase está na:",ops:["Voz passiva analítica","Voz reflexiva","Voz passiva sintética","Voz ativa","Voz impessoal"],g:3,exp:"Na voz ativa, o sujeito ('O agente de endemias') é o agente — pratica a ação expressa pelo verbo transitivo direto 'aplicou'. O objeto direto é 'o inseticida'."},
        {n:22,q:"'O relatório foi elaborado pela equipe.' Esta frase está na:",ops:["Voz ativa","Voz reflexiva","Voz passiva sintética","Voz impessoal","Voz passiva analítica"],g:4,exp:"Voz passiva analítica: formada por verbo auxiliar 'ser' + verbo principal no particípio ('elaborado'). O sujeito ('O relatório') é paciente da ação. 'pela equipe' é o agente da passiva."},
        {n:23,q:"'Vendem-se casas neste bairro.' O pronome 'se' nessa frase tem valor de:",ops:["Partícula expletiva","Índice de indeterminação do sujeito","Pronome apassivador — voz passiva sintética","Pronome reflexivo — voz reflexiva","Pronome reflexivo recíproco"],g:2,exp:"'Vendem-se casas' = 'Casas são vendidas' — o 'se' é pronome apassivador, pois o verbo 'vender' é transitivo direto e o termo 'casas' funciona como sujeito paciente. Há concordância: 'vendem-se' (plural)."},
        {n:24,q:"'A criança se machucou ao cair.' O 'se' indica:",ops:["Voz passiva sintética","Voz ativa","Índice de indeterminação do sujeito","Voz reflexiva","Partícula expletiva"],g:3,exp:"Na voz reflexiva, o sujeito ('A criança') é ao mesmo tempo agente e paciente da ação. O pronome 'se' é objeto direto reflexivo — indica que a criança se machucou a si mesma."},
        {n:25,q:"Transforme 'Os técnicos elaboraram o laudo.' para a voz passiva analítica. A alternativa CORRETA é:",ops:["O laudo elaborou-se pelos técnicos.","O laudo foi elaborado pelos técnicos.","Os técnicos foram elaborados pelo laudo.","Elaborou-se o laudo pelos técnicos.","O laudo elaborou pelos técnicos."],g:1,exp:"Na transformação: OD 'o laudo' → sujeito paciente; sujeito 'Os técnicos' → agente da passiva 'pelos técnicos'; verbo 'elaboraram' (pret. perfeito) → 'foi elaborado' (ser no mesmo tempo + particípio)."},
        {n:26,q:"'O ACE combate o Aedes aegypti diariamente.' Na transformação para a voz passiva analítica, a alternativa CORRETA é:",ops:["O Aedes aegypti é combatido pelo ACE diariamente.","O Aedes aegypti combateu-se pelo ACE diariamente.","O ACE é combatido pelo Aedes aegypti diariamente.","Combate-se o Aedes aegypti pelo ACE diariamente.","O Aedes aegypti foi combatido pelo ACE diariamente."],g:0,exp:"OD 'o Aedes aegypti' → sujeito paciente; sujeito 'O ACE' → agente da passiva 'pelo ACE'; verbo 'combate' (presente) → 'é combatido' (ser no presente + particípio). A alternativa E usa pretérito, alterando o tempo verbal."},
