  {
    id:'sim-joaopessoa-2024',
    titulo:'Prova ACE João Pessoa PB - IDECAN 2024',
    banca:'IDECAN',
    ano:2024,
    edital:'Concurso Público – Prefeitura Municipal de João Pessoa/PB',
    cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q20)',qs:[
        {n:1,texto:'Energia cara é um gargalo da economia brasileira Estudo calcula custos de R$ 100 bi anuais com regras mal desenhadas, como subsídios em excesso, e desperdício; é preciso resgatar o foco na eficiência do modelo que modernizou o setor nos anos 1990. Quando se trata do custo da energia, insumo essencial para a produção em geral e a competitividade da indústria em particular, o Brasil está longe das melhores práticas globais e erodindo sua posição como potencial destino de investimentos. Empresas brasileiras pagam muito mais que seus concorrentes nas modalidades principais, da energia elétrica ao gás natural. As famílias arcam com uma conta de luz que é uma das maiores do mundo − ainda mais quando se considera o nível médio de renda da população brasileira. A causa é o acúmulo de políticas mal desenhadas e a submissão a interesses particulares que encontram guarida no governo e no Congresso Nacional. Pesquisa da Abrace, associação que representa mais de 40% do consumo industrial de energia do país, mostra que há cerca de R$ 100 bilhões anuais em ineficiências e subsídios, 20% acima do que se verificaria na projeção de uma regulação mais eficiente. Desse total, mais de R$ 30 bilhões decorrem de ações mal desenhadas, que vão do excesso de subsídios às fontes renováveis até valores para favorecer fontes poluentes, como o carvão. A meritória privatização da Eletrobras não veio sem encargos, caso da obrigatoriedade de contratação de usinas termelétricas a gás em locais de viabilidade duvidosa. No caso do gás, o quase monopólio da Petrobras e interesses estaduais na distribuição levam os custos a patamares muito superiores aos de outros países. Outros R$ 63 bilhões anuais se referem a custos como a aquisição de energia mais cara contratada no mercado regulado das distribuidoras e taxas para a iluminação pública, entre outros. A má gestão estatal também se dá na usina de Itaipu − que deveria gerar energia barata, já que os investimentos foram totalmente amortizados. Mas o governo usa a empresa para outras ações, como aportes em infraestrutura para servir a interesses paroquiais. A agência regulatória Aneel sofre com indicações políticas e carência de recursos para que possa cumprir seu papel. É preciso resgatar a visão que norteou o processo de modernização do setor nos anos 1990. Gestão profissional, foco na eficiência do sistema e barateamento do insumo essencial. O que se vê até agora, porém, é a continuidade de práticas perniciosas. Folha de São Paulo − 10/09/2024',q:'No primeiro parágrafo do texto, seu autor afirma que "Quando se trata do custo da energia, insumo essencial para a produção em geral e a competitividade da indústria em particular, o Brasil está longe das melhores práticas globais". A partir da leitura do texto, podemos inferir que, para se aproximar destas melhores práticas globais, o país deve',ops:['investir nas termelétricas a gás, já que a Petrobras detém quase o monopólio da geração desta fonte de energia.','libertar-se de interesses particulares amparados pelo governo e pelo Congresso Nacional.','conceder mais subsídios às fontes renováveis de energia elétrica.','atender aos interesses regionais na distribuição de energia elétrica.','contratar energia no mercado regulado das distribuidoras.'],g:1,exp:'Gabarito: B.'},
        {n:2,q:'No trecho "A meritória privatização da Eletrobras não veio sem encargos, caso da obrigatoriedade de contratação de usinas termelétricas a gás em locais de viabilidade duvidosa." As palavras em destaque classificam-se, morfologicamente, como, respectivamente,',ops:['adjetivo, substantivo e advérbio.','substantivo, substantivo e adjetivo.','substantivo, adjetivo e advérbio.','adjetivo, substantivo e substantivo.','advérbio, substantivo e substantivo.'],g:3,exp:'Gabarito: D.'},
        {n:3,q:'O texto comenta sobre as empresas brasileiras que pagam muito mais que seus concorrentes nas modalidades principais de energia e elenca algumas causas para tal. Sabendo disso, assinale a única alternativa que constitui um dos motivos para tal.',ops:['Privatização da Eletrobrás.','O fim das práticas perniciosas implantadas na década de 1990.','Excesso de subsídios às fontes de energia renovável.','A visão implementada no setor de energia elétrica na década de 1990.','Altos preços cobrados pelas contas de luz das famílias.'],g:2,exp:'Gabarito: C.'},
        {n:4,q:'Assinale o único comentário correto em relação aos processos de formação das palavras grifadas no trecho: "Quando se trata do custo da energia, insumo essencial para a produção em geral e a competitividade da indústria em particular, o Brasil está longe das melhores práticas globais e erodindo sua posição como potencial destino de investimentos."',ops:['A segunda palavra é formada por derivação sufixal, por meio do acréscimo do sufixo "-ndo", um dos sufixos formadores de adjetivos derivados de verbos.','A primeira palavra é formada por composição e a segunda por derivação.','A primeira palavra é formada por derivação sufixal, por meio do acréscimo do sufixo "-idade", um dos principais sufixos formadores de substantivos derivados de adjetivos.','Ambas as palavras são formadas por derivação sufixal, sendo a primeira um adjetivo e a segunda um advérbio.','A primeira palavra é formada por derivação prefixal e sufixal, por meio dos acréscimos do prefixo "com-" e do sufixo "-idade".'],g:2,exp:'Gabarito: C.'},
        {n:5,q:'A tonicidade silábica diz respeito à sílaba que apresenta maior proeminência em uma palavra. Essa sílaba é chamada de tônica ou acentuada. Sabendo disso, assinale o único dos pares de palavras retirados do texto que compartilham a mesma classificação quanto à tonicidade.',ops:['Particular e Natural','Privatização e Obrigatoriedade','Produção e Indústria','Acúmulo e Submissão','Energia e Essencial'],g:0,exp:'Gabarito: A.'},
        {n:6,q:'Assinale a opção que completa, com uso adequado da conjunção e mantendo o sentido da relação entre as ideias fornecidas no texto, o trecho fornecido abaixo. "Empresas brasileiras pagam muito mais que seus concorrentes pela energia elétrica..."',ops:['contudo o acúmulo de políticas mal desenhadas e a submissão a interesses particulares.','porquanto se acumulam políticas mal desenhadas que encontram respaldo no governo e no Congresso Nacional.','apesar do acúmulo de políticas mal desenhadas e da submissão a interesses particulares.','já que o acúmulo de políticas mal desenhadas e a submissão a interesses particulares.','então se submetem a interesses particulares e produzem políticas mal desenhadas.'],g:1,exp:'Gabarito: B.'},
        {n:7,q:'O texto nos diz, em seu primeiro parágrafo, que a energia é um "insumo essencial para a produção em geral." Sabendo disso, podemos afirmar que a palavra "insumo" se refere a algo que',ops:['é dispensável na produção de mercadorias e/ou serviços.','acrescenta custos desnecessários ao preço de mercadorias e/ou serviços.','interfere apenas nos preços de produtos industriais.','é necessário para produzir mercadorias e/ou serviços.','reduz os custos de mercadorias e/ou serviços.'],g:3,exp:'Gabarito: D.'},
        {n:8,q:'[QUESTÃO ANULADA] A separação de sílabas é um assunto básico, mas mesmo assim, há algumas palavras que causam dúvidas. As sílabas encontram-se corretamente separadas, em ambas as palavras, apenas no item:',ops:['Prin-ci-pa-is / e-ner-gia','As-so-cia-ção / mai-o-res','Bra-si-le-i-ras / con-cor-ren-tes','Fa-mí-li-a / ex-ces-so','Quan-do / e-ner-gi-a'],g:0,exp:'QUESTÃO ANULADA pela banca.'},
        {n:9,q:'De acordo com Evanildo Bechara (Moderna Gramática Portuguesa), os encontros vocálicos podem ocorrer pela aproximação, por fonética sintática, de duas ou mais palavras, como ocorre no trecho "A causa é o acúmulo de políticas mal desenhadas e a submissão", em que a conjunção e o artigo formam',ops:['um hiato interlexical.','um hiato intraverbal.','um ditongo intraverbal.','um ditongo interverbal.','um ditongo intraoracional.'],g:3,exp:'Gabarito: D.'},
        {n:10,q:'Assinale a única das alternativas em que todas as palavras estão corretamente acentuadas.',ops:['Eu a amava, mas percebi que aquele amor não era reciproco.','O advogado pediu ao juri que aplicasse uma pena menor ao réu por conta dos atenuantes que ele apresentou.','O novo acordo ortográfico complicou ainda mais as regras sobre o uso dos hífens.','Alguma coisa que comi ontem está me deixando com uma sensação bastante desagradável.','O uso de aparelhos celulares em salas de aula está proíbido em todo o Estado de São Paulo.'],g:3,exp:'Gabarito: D.'},
        {n:11,q:'O uso das letras "x", "s" e "z", bem como o uso do dígrafo "ch", causa dúvidas na escrita da língua portuguesa. Entre os itens abaixo, assinale a alternativa em que uma das palavras destacadas está corretamente grafada.',ops:['Aquela modelo era bastante exsibida.','Não consegui chegar a nenhuma conclusão.','Você precisa enchugar a louça agora mesmo!','Ir à missa me trás muita paz.','Sua resposta me pareceu deboxada.'],g:1,exp:'Gabarito: B.'},
        {n:12,q:'Uma das dificuldades impostas pela norma culta da língua portuguesa é a representação gráfica do som /S/, que varia bastante. Sabendo disso, assinale abaixo a única opção em que a palavra em destaque está corretamente grafada.',ops:['Nosso chefe de TI tem um comportamento bastante escêntrico.','Preciso contratar um funcionário com bastante experiência.','O facismo é uma ideologia política ultranacionalista e autoritária.','Nossa empresa precisa crecer para continuar empregando.','Não podemos ter essesso de funcionários, pois isto aumentaria nossos custos.'],g:1,exp:'Gabarito: B.'},
        {n:13,q:'Assinale a única alternativa em que a explicação para a presença do acento está correta.',ops:['A cafeína é muito utilizada por atletas para dar disposição durante os treinos − São acentuadas as paroxítonas terminadas em A, E ou O.','Os juízes já decidiram este caso − As letras i e u tônicas recebem acento quando formam hiato e estão sozinhas na sílaba ou acompanhadas apenas de "s".','O açúcar ajuda a acalmar algumas pessoas − São acentuadas as paroxítonas terminadas em a, seguidas ou não de R.','É seríssimo o problema das enchentes no Rio Grande do Sul − São acentuadas as oxítonas terminadas em A, E ou O, seguidos ou não de "s".','O sermão dado pelo padre naquele dia teve um tom poético − Acentuam-se os hiatos quando uma das vogais que o formam estiver na sílaba tônica.'],g:1,exp:'Gabarito: B.'},
        {n:14,q:'Com o sujeito composto, a concordância verbal traz alguns desafios. Entre as alternativas abaixo, a única em que está correta a concordância é:',ops:['João foram só alegrias quando viu o caderno de provas.','Três quilos são muito para quem tenta perder peso.','O aprovado ou aprovados neste concurso será nomeado em breve.','A direita ou a esquerda governará o Brasil após as próximas eleições.','Com certeza eu acertei uma ou outra questões.'],g:3,exp:'Gabarito: D.'},
        {n:15,q:'A concordância verbal refere-se especificamente à harmonia entre o sujeito e o verbo com o qual ele se relaciona. Há relação harmônica e adequada ao que preceitua a norma padrão apenas no item:',ops:['Já deve fazerem muitos anos que os investimentos na usina de Itaipu foram totalmente amortizados, mas há muitas pessoas no governo que ainda hesitam em baratear os custos da energia elétrica por ela produzida.','Já devem fazer muitos anos que os investimentos na usina de Itaipu foram totalmente amortizados, mas tem muitas pessoas no governo que ainda hesita em baratear os custos da energia elétrica por ela produzida.','Já deve fazer muitos anos que os investimentos na usina de Itaipu foram totalmente amortizados, mas tem muitas pessoas no governo que ainda hesitam em baratear os custos da energia elétrica por ela produzida.','Já deve fazer muitos anos que os investimentos na usina de Itaipu foram totalmente amortizados, mas há muitas pessoas no governo que ainda hesita em baratear os custos da energia elétrica por ela produzida.','Já deve fazer muitos anos que os investimentos na usina de Itaipu foram totalmente amortizados, mas há muitas pessoas no governo que ainda hesitam em baratear os custos da energia elétrica por ela produzida.'],g:4,exp:'Gabarito: E.'},
        {n:16,q:'Em língua portuguesa encontramos diversos encontros consonantais, alguns que ocorrem na mesma sílaba, outros que ocorrem em sílabas diferentes e até outros menos comuns, como os dífonos. Sabendo disso, assinale abaixo a única opção que contém uma palavra em que encontramos um dífono.',ops:['Excelente','Especial','Étnico','Digno','Complexo'],g:4,exp:'Gabarito: E.'},
        {n:17,q:'Na formação do feminino de substantivos em português, são admitidos vários processos. Há aqueles que mudam a vogal de "o" para "a" como em filho/filha e outros mais complexos, como os que têm palavras diferentes para um e outro sexo e os que têm uma só forma para os dois sexos. Entre estes estão os substantivos "comuns de dois", exemplificado no item:',ops:['Estudante.','Cobra.','Capital.','Padre.','Criança.'],g:0,exp:'Gabarito: A.'},
        {n:18,q:'A concordância diz respeito à harmonia entre constituintes de uma frase ou período. Ela segue regras específicas na norma culta, que estão respeitadas apenas no item:',ops:['Já seriam 8 horas quando se iniciou os debates no Senado Federal sobre cinema e literatura brasileiras.','Já seriam 8 horas quando se iniciaram os debates no Senado Federal sobre cinema e literatura brasileira.','Já seria 8 horas quando se iniciaram os debates no Senado Federal sobre cinema e literatura brasileira.','Já seriam 8 horas quando se iniciou os debates no Senado Federal sobre cinema e literatura brasileira.','Já seria 8 horas quando se iniciou os debates no Senado Federal sobre cinema e literatura brasileiros.'],g:1,exp:'Gabarito: B.'},
        {n:19,q:'As preposições são uma classe de palavras que ligam dois termos em um enunciado para estabelecer algum tipo de relação entre eles. Elas podem ser essenciais ou acidentais, e algumas delas se contraem com artigos. Sabendo disso, assinale o único item que contém uma análise adequada da preposição apresentada.',ops:['"Com esta vida agitada, não consigo mais vê-la" − preposição essencial que estabelece relação de companhia.','"O acesso à escola foi ampliado nos últimos anos" − contração do artigo feminino "a" com a preposição acidental "a" que estabelece relação de lugar.','"Estou em casa" − preposição essencial que estabelece relação de lugar.','"Fora meu irmão, todos foram promovidos" − preposição essencial que estabelece relação de exclusão.','"Separou a carne em bifes com uma faca bem amolada" − preposição acidental que estabelece relação de instrumento.'],g:2,exp:'Gabarito: C.'},
        {n:20,q:'Conforme a Moderna Gramática Brasileira, de Evanildo Bechara, são critérios de acordo com os quais classificam-se as consoantes:',ops:['o modo de articulação, o papel das cavidades bucal e nasal e a intensidade.','o modo de articulação, a zona de articulação e o papel das cordas vocais.','o modo de articulação, a zona de articulação e a intensidade.','o papel das cavidades bucal e nasal, a intensidade e o timbre.','a zona de articulação, o papel das cordas vocais e o timbre.'],g:1,exp:'Gabarito: B.'}
      ]},
      {nome:'Noções de Informática (Q21–Q30)',qs:[
        {n:21,q:'Armazenamento de dados na nuvem é uma solução que permite a armazenagem de dados em servidores remotos acessíveis via Internet. Assim, o armazenamento em nuvem arquivístico',ops:['oferece bancos de dados na nuvem gerenciados pelo provedor, permitindo que os usuários criem, consultem e gerenciem bancos de dados sem se preocupar com a infraestrutura subjacente.','armazena e processa dados em tempo real para aplicações que requerem análise instantânea.','replica as informações armazenadas em, no mínimo, 10 servidores diferentes.','armazena cópias de segurança de dados na nuvem para garantir a recuperação em caso de perda de dados ou falha.','oferece armazenamento de longo prazo para dados que são acessados com pouca frequência, geralmente a um custo reduzido.'],g:4,exp:'Gabarito: E.'},
        {n:22,q:'Nos grupos de discussão na internet, o Reddit é uma plataforma de discussão e agregação de notícias. Nesse contexto, os subreddits são',ops:['recursos de moderação para controlar conteúdo ofensivo em postagens.','ferramentas para postar imagens como conteúdo principal.','comunidades temáticas que permitem discussão sobre tópicos específicos.','ferramentas para criar e gerenciar eventos e encontros ao vivo.','áreas de armazenamento de arquivos para compartilhamento de documentos.'],g:2,exp:'Gabarito: C.'},
        {n:23,q:'A principal diferença entre o motor de busca DuckDuckGo e o Google é:',ops:['DuckDuckGo oferece resultados mais rápidos que o Google.','Google não indexa sites tão rapidamente quanto o DuckDuckGo.','Google oferece menos resultados por página do que o DuckDuckGo.','DuckDuckGo somente funciona nos Estados Unidos da América.','DuckDuckGo prioriza a privacidade dos usuários, enquanto o Google coleta dados para personalização de anúncios.'],g:4,exp:'Gabarito: E.'},
        {n:24,q:'Em uma rede local (LAN), o protocolo utilizado para atribuir endereços IP automaticamente aos dispositivos conectados é conhecido como',ops:['DHCP.','HTTP.','UDP.','FTP.','DNS.'],g:0,exp:'Gabarito: A.'},
        {n:25,q:'Assinale a alternativa que apresenta a principal diferença entre vírus, worms e pragas virtuais em termos de como eles se propagam e afetam sistemas.',ops:['Um vírus pode ser removido manualmente, enquanto worms só podem ser removidos por meio de formatação do disco rígido.','Um vírus precisa ser executado por um usuário ou programa, enquanto um worm pode se replicar e se espalhar sozinho sem interação humana.','As pragas virtuais não usam códigos maliciosos, enquanto o vírus é um tipo de código malicioso.','Um worm apenas infecta arquivos de texto, enquanto vírus afetam arquivos de áudio e vídeo.','Pragas virtuais referem-se a qualquer tipo de malware que não se propaga, incluindo vírus e worms.'],g:1,exp:'Gabarito: B.'},
        {n:26,q:'Assinale a alternativa que apresenta um procedimento de segurança usado para proteger dados durante a transmissão através de redes inseguras.',ops:['Hashing de senhas.','Uso de sítios com HTTP.','Criptografia de ponta a ponta.','Criptografia de dados em repouso.','Autenticação baseada em certificados.'],g:2,exp:'Gabarito: C.'},
        {n:27,q:'As instruções em linha de comando, tanto no Linux como no Windows, são utilizadas constantemente para executar instruções básicas. Os comandos utilizados para exibir o conteúdo de um diretório no Linux e no Windows são, respectivamente:',ops:['rm no Linux e mkdir no Windows.','cd no Linux e dir no Windows.','dir no Linux e ls no Windows.','ls no Linux e dir no Windows.','mkdir no Linux e cd no Windows.'],g:3,exp:'Gabarito: D.'},
        {n:28,q:'Considerando os conceitos de procedimentos de Backup, uma janela de Backup é',ops:['a frequência com a qual os backups são realizados, como diária, semanal ou mensal.','um software de backup em nuvem.','a duração do ciclo de vida de uma fita de backup antes que precise ser substituída.','a quantidade de tempo disponível e sua localização no calendário para realizar a cópia de um determinado volume de dados.','a quantidade de espaço em disco necessário para armazenar todos os backups realizados em um determinado período.'],g:3,exp:'Gabarito: D.'},
        {n:29,q:'No Microsoft Word, a inserção de índice e ilustrações é realizada clicando na seção',ops:['Design.','Referências.','Layout.','Ajuda.','Exibir.'],g:1,exp:'Gabarito: B.'},
        {n:30,q:'O comando no Linux que é para atualizar a lista de pacotes disponíveis, no gerenciador de pacotes dnf, é o',ops:['dnf check-update.','dnf update.','dnf kill.','dnf search.','dnf clean.'],g:0,exp:'Gabarito: A.'}
      ]},
      {nome:'Conhecimentos do SUS (Q31–Q50)',qs:[
        {n:31,q:'O Programa Nacional de Transplantes do Ministério da Saúde é responsável pela organização e regulação do processo de transplante de órgãos e tecidos no Brasil, sob a coordenação do Sistema Nacional de Transplantes (SNT). Esse programa é fundamental para garantir o acesso igualitário, gratuito e de alta qualidade ao transplante de órgãos pelo Sistema Único de Saúde (SUS). O Sistema Nacional de Transplantes (SNT) cuja função de órgão central é exercida pelo Ministério da Saúde, por meio da Coordenação-Geral do Sistema Nacional de Transplantes (CGSNT), é responsável pela regulamentação, controle e monitoramento do processo de doação e transplantes realizados no país, com o objetivo de desenvolver o processo de doação, captação e distribuição de órgãos, tecidos e células-tronco hematopoéticas para fins terapêuticos, assinale a alternativa correta.',ops:['No Brasil, os transplantes de órgãos pelo SUS são realizados apenas em hospitais públicos, sendo proibida a participação de instituições privadas nesse processo.','A doação de órgãos de pessoas não identificadas pode ser realizada mediante autorização judicial após solicitação da equipe médica da unidade em que se encontra o doador não identificado.','A retirada post mortem de tecidos, órgãos ou partes do corpo humano destinados a transplante ou tratamento deverá ser precedida de diagnóstico de morte encefálica, constatada e registrada por um médico não participante das equipes de remoção e transplante.','É obrigatório, para todos os estabelecimentos de saúde notificar, às centrais de notificação, captação e distribuição de órgãos da unidade federada onde ocorrer, o diagnóstico de morte encefálica feito em pacientes por eles atendidos.','O Brasil é um dos poucos países onde a doação de órgãos para transplantes pelo SUS é compulsória, ou seja, é obrigatória em todos os casos de morte encefálica confirmada.'],g:3,exp:'Gabarito: D.'},
        {n:32,q:'Os fatores determinantes e condicionantes do processo saúde-doença podem ser classificados em microdeterminantes e macrodeterminantes, que abrangem aspectos individuais e coletivos que influenciam a saúde da população, e podem variar conforme aspectos sociais, econômicos, ambientais e biológicos. Com base nessa classificação, assinale a alternativa correta.',ops:['Características genéticas e imunológicas são consideradas macrodeterminantes, pois afetam diretamente a saúde de uma pessoa e de um grupo com as mesmas características.','O acesso aos serviços de saúde é um fator que impacta diretamente indivíduos e grupos de uma determinada localidade, sendo assim considerado um macrodeterminante.','As iniquidades sociais são um exemplo clássico de macrodeterminantes, pois abrangem desigualdades no acesso a recursos, serviços e oportunidades que afetam a saúde de grandes populações.','Escolaridade e educação são classificadas como um macrodeterminante, pois têm um impacto coletivo na sociedade diretamente relacionado a sua capacidade de adotar comportamentos saudáveis e acessar serviços.','A renda é considerada um macrodeterminante causada pelas inequidades sociais existentes no Brasil e no mundo.'],g:2,exp:'Gabarito: C.'},
        {n:33,q:'A Política Nacional de Atenção Básica (PNAB) do Sistema Único de Saúde (SUS) no Brasil estabelece as normas e os princípios para a organização da Atenção Básica, também conhecida como Atenção Primária à Saúde (APS). A Atenção Básica é a porta de entrada preferencial para o sistema de saúde e é a responsável pelo primeiro nível de cuidado, com foco na promoção da saúde, prevenção de doenças e no tratamento e acompanhamento de condições de saúde mais comuns. A Portaria GM/MS nº 2.436, de 21 de setembro de 2017, reformula a Política Nacional de Atenção Básica (PNAB) no âmbito do Sistema Único de Saúde (SUS), estabelecendo diretrizes para a organização da Atenção Básica no Brasil. São Princípios e Diretrizes do SUS e da RAS, a serem operacionalizados na Atenção Básica, respectivamente:',ops:['Equidade e Resolutividade.','Territorialização e Universalidade.','Participação da comunidade e Integralidade.','Regionalização e Universalidade.','Regionalização e Hierarquização.'],g:0,exp:'Gabarito: A.'},
        {n:34,q:'As arboviroses são doenças causadas por vírus transmitidos por artrópodes, como mosquitos. No Brasil, o SUS desempenha um papel fundamental no combate e controle dessas doenças, que incluem Dengue, Zika e Chikungunya. Diante disso, aponte qual das alternativas abaixo descreve corretamente uma das estratégias adotadas pelo SUS no enfrentamento das arboviroses.',ops:['O SUS incentiva o uso de repelentes como única forma de proteção contra as arboviroses em áreas de alta infestação de mosquitos.','A vacinação em massa contra a dengue é a principal medida preventiva adotada pelo SUS para combater as arboviroses no Brasil.','A vigilância epidemiológica e o controle vetorial são estratégias fundamentais do SUS para monitorar a transmissão de arboviroses e reduzir a proliferação do mosquito Aedes aegypti.','O tratamento de arboviroses pelo SUS é baseado exclusivamente no uso de antivirais para todas as doenças transmitidas pelo Aedes aegypti.','O SUS recomenda a aplicação de inseticidas em áreas urbanas apenas durante surtos de arboviroses, sem a necessidade de monitoramento de casos.'],g:2,exp:'Gabarito: C.'},
        {n:35,q:'O Sistema Único de Saúde (SUS) foi criado pela Constituição Federal de 1988 com o objetivo de garantir o acesso universal, integral e igualitário à saúde para todos os cidadãos brasileiros. Para tanto, o SUS baseia-se em três princípios fundamentais que orientam suas ações e políticas públicas: a universalidade, a integralidade e a equidade, e em princípios organizativos, que norteiam a organização e a oferta dos serviços de saúde, visando a atender as necessidades da população de forma justa e eficiente. Sendo assim, assinale a opção que contém um dos princípios organizativos do SUS.',ops:['Participação da comunidade.','Inclusão.','Legalidade.','Prestação de contas.','Integridade.'],g:0,exp:'Gabarito: A.'},
        {n:36,q:'[QUESTÃO ANULADA] O Processo Transexualizador no Sistema Único de Saúde (SUS) foi implementado com o objetivo de garantir o acesso integral à saúde da população transgênero, respeitando os princípios da universalidade e da equidade. Sobre esse processo, assinale a alternativa correta.',ops:['O Processo Transexualizador no SUS abrange apenas o acompanhamento psicológico e psiquiátrico para pessoas transgênero, excluindo cirurgias e tratamentos hormonais.','Apenas maiores de 21 anos têm direito de acessar o Processo Transexualizador no SUS para realizar intervenções cirúrgicas.','Para acessar o Processo Transexualizador no SUS, é obrigatório que a pessoa tenha diagnóstico de transtorno de identidade de gênero feito por no mínimo três profissionais de saúde.','O acompanhamento psicológico dentro do Processo Transexualizador no SUS não é opcional, sendo de no mínimo de 1 (um) ano no pré-operatório e por até 1 (um) ano no pós-operatório.','O Processo Transexualizador inclui tanto o acompanhamento ambulatorial quanto a realização de cirurgias de redesignação sexual, além de tratamentos hormonais, conforme as necessidades de cada paciente.'],g:0,exp:'QUESTÃO ANULADA pela banca.'},
        {n:37,q:'As Conferências e os Conselhos de Saúde são instâncias fundamentais para a participação social e o controle das políticas públicas de saúde no Brasil, atuando em consonância com os princípios do Sistema Único de Saúde (SUS). Essas instâncias permitem que uma representação da sociedade esteja presente nas discussões de saúde e na formulação de propostas que poderão apoiar a construção de planos municipais, estaduais e nacionais de saúde. Levando em consideração a legislação vigente, identifique o item correto.',ops:['A periodicidade da Conferência de Saúde é determinada pelo Conselho de Saúde, sem a necessidade de convocação pelo Poder Executivo.','Os Conselhos de Saúde são órgãos consultivos, tendo a função de fornecer orientações sobre as políticas de saúde.','A participação popular nas Conferências de Saúde é garantida pelos profissionais de saúde.','A representação dos usuários nos Conselhos de Saúde e Conferências deve ser paritária em relação ao conjunto dos demais segmentos.','A composição dos Conselhos de Saúde é formada exclusivamente por representantes do governo e dos gestores de saúde.'],g:3,exp:'Gabarito: D.'},
        {n:38,q:'A incorporação de insumos, medicamentos e tecnologias no Sistema Único de Saúde (SUS) segue critérios e procedimentos estabelecidos para garantir que novas intervenções sejam eficazes, seguras e atendam às necessidades da população. A Comissão Nacional de Incorporação de Tecnologias no SUS (CONITEC) é responsável por avaliar e recomendar a incorporação de novos insumos, medicamentos e tecnologias ao SUS. Sobre o processo de incorporação de insumos no SUS, identifique o item correto.',ops:['A incorporação de insumos no SUS é realizada pelo Ministério da Saúde, sem a participação de outros órgãos ou comissões.','A CONITEC disponibiliza suas recomendações em consulta pública para obter informações, opiniões e críticas da sociedade a respeito de determinado tema.','Todo medicamento registrado pela Agência Nacional de Vigilância Sanitária (ANVISA) é automaticamente incorporado ao SUS, sem necessidade de avaliação adicional.','A decisão de incorporação de insumos ao SUS prioriza sempre os mais baratos para a aquisição visando a aquisição eficiente para todo o território nacional.','Após a recomendação da CONITEC, o Ministério da Saúde tem prazo de até 30 dias para obrigatoriamente incorporar o insumo ao SUS.'],g:1,exp:'Gabarito: B.'},
        {n:39,q:'A Rede de Urgência e Emergência (RUE) do Sistema Único de Saúde (SUS) é uma estratégia de organização do atendimento para garantir o acesso rápido e eficaz a serviços de saúde em situações de urgência e emergência. A RUE visa integrar e articular os diferentes níveis de atenção à saúde (atenção primária, especializada e hospitalar) para oferecer um atendimento ágil, contínuo e resolutivo, desde o primeiro contato até a alta do paciente ou a sua estabilização. A Rede de Atenção às Urgências e Emergências (RUE) organiza e integra os serviços que prestam atendimento às situações de urgência e emergência no Brasil. Sobre a Rede de Urgência e Emergência no SUS, identifique o item correto.',ops:['A Rede de Urgência e Emergência é composta exclusivamente pelas Unidades de Pronto Atendimento (UPAs), Unidades Hospitalares, Força Nacional do SUS e Atenção Domiciliar.','As Unidades de Pronto Atendimento (UPAs) na Rede de Urgência e Emergência têm a função de prestar atendimento resolutivo e qualificado a pacientes com condições clínicas não graves.','A Rede de Urgência e Emergência está restrita à assistência imediata, sem integrar a continuidade do cuidado dos pacientes após o atendimento inicial.','A Rede de Urgência e Emergência, devido ao seu caráter imprevisível, não apresenta fluxos regulatórios definidos.','Para que a Rede oferte assistência qualificada aos usuários, é indispensável a implementação da qualificação profissional, da informação, do processo de acolhimento e da regulação de acesso a todos os componentes que a constitui.'],g:4,exp:'Gabarito: E.'},
        {n:40,q:'As Redes de Atenção à Saúde (RAS) são os trajetos percorridos para acesso aos diferentes pontos dos serviços de saúde. Esses trajetos existem com o objetivo de coordenar o cuidado e o acesso dos usuários nos diferentes serviços do Sistema Único de Saúde (SUS), ou seja, busca garantir que estes, ao apresentar determinada condição de saúde, estejam em um ponto de cuidado adequado à sua necessidade. Com isso em mente, aponte qual das alternativas abaixo descreve corretamente um princípio fundamental das RAS.',ops:['A descentralização da gestão da saúde é uma característica das RAS, mas as decisões de regulação de acesso devem ser exclusivamente da União.','A participação da comunidade na gestão das RAS é facultativa, sendo opcional para os gestores municipais envolverem os cidadãos na tomada de decisões.','As RAS devem atuar de forma integrada com a atenção primária à saúde como coordenadora do cuidado e porta de entrada principal para os usuários.','A atenção secundária e terciária na RAS substitui a atenção primária à saúde, que não possui um papel central na coordenação do cuidado.','O acesso aos serviços especializados das RAS deve ser restrito a hospitais localizados em capitais, priorizando os grandes centros urbanos.'],g:2,exp:'Gabarito: C.'},
        {n:41,q:'A Política Nacional de Saúde Integral da População Negra (PNSIPN) é um compromisso firmado pelo Ministério da Saúde no combate às desigualdades no Sistema Único de Saúde (SUS) e na promoção da saúde da população negra de forma integral, considerando que as iniquidades em saúde são resultadas de injustos processos socioeconômicos e culturais em destaque, o vigente racismo que corroboram com a morbimortalidade das populações negras brasileiras. Brasil. Ministério da Saúde. Secretaria de Gestão Estratégica e Participativa. Departamento de Apoio à Gestão Participativa e ao Controle Social. Política Nacional de Saúde Integral da População Negra: uma política para o SUS / Ministério da Saúde, Secretaria de Gestão Estratégica e Participativa, Departamento de Apoio à Gestão Participativa e ao Controle Social. 3. ed. Brasília: Editora do Ministério da Saúde, 2017. Nesse sentido, compõe como sendo um dos Objetivos Específicos desta Política a opção:',ops:['incluir as demandas específicas da população negra nos processos de regulação do sistema único de saúde.','realizar articulação intersetorial, incluindo parcerias com instituições governamentais e não governamentais, com vistas a contribuir no processo de implementação desta Política.','identificar, combater e prevenir situações de abuso, exploração e violência, incluindo assédio moral, no ambiente de trabalho.','definir e pactuar, junto aos governos estaduais, indicadores e metas para a promoção da equidade étnico-racial na saúde.','fortalecer a gestão participativa, com incentivo à participação popular e ao controle social.'],g:2,exp:'Gabarito: C.'},
        {n:42,q:'[QUESTÃO ANULADA] O Programa Nacional de Imunizações (PNI), coordenado pelo Ministério da Saúde do Brasil, é uma das iniciativas de saúde pública mais bem-sucedidas do país. Criado em 1973, o PNI tem como objetivo garantir o acesso universal e equitativo a vacinas, com o intuito de controlar, eliminar e erradicar doenças imunopreveníveis, protegendo a população de diversas enfermidades. A Lei nº 6.259, de 30 de Outubro de 1975, dispõe sobre a organização das ações de Vigilância Epidemiológica, sobre o Programa Nacional de Imunizações, estabelece normas relativas à notificação compulsória de doenças, e dá outras providências. Sobre a Notificação Compulsória de Doenças, podemos afirmar que',ops:['é dever de todo cidadão comunicar à autoridade sanitária local a ocorrência de fato, comprovado ou presumível, de caso de doença transmissível.','recebida a notificação, a autoridade sanitária decidirá se deve proceder à investigação epidemiológica pertinente dependendo do agravo.','a síndrome respiratória é um agravo de notificação compulsória incluído recentemente na Lista Nacional de Notificação Compulsória.','os casos de violência contra a mulher atendidos no sistema privado podem ou não ser notificados. Há obrigatoriedade de notificação no sistema os casos de violência contra a mulher atendidos no sistema público.','são de notificação compulsória imediata para a Secretaria Municipal de Saúde (SMS) acidentes por animal peçonhento, acidentes por animal potencialmente transmissor da raiva, Cólera e Febre amarela.'],g:0,exp:'QUESTÃO ANULADA pela banca.'},
        {n:43,q:'A humanização no SUS (Sistema Único de Saúde) é um princípio que visa garantir um atendimento mais acolhedor, respeitoso e centrado nas necessidades dos usuários e dos profissionais de saúde. Esse conceito foi formalizado principalmente com a Política Nacional de Humanização (PNH), lançada em 2003, e tem como objetivo transformar a cultura dos serviços de saúde, promovendo uma maior aproximação entre os profissionais, usuários e gestores, com foco na melhoria da qualidade dos atendimentos e das relações. A Política Nacional de Humanização (PNH) existe desde 2003 no Sistema Único de Saúde. As grandes discussões dessa importante política perpassam pela promoção da comunicação entre usuários, trabalhadores e gestores em direção às discussões para mudanças que proporcionem melhor forma de cuidar e novas formas de organizar o trabalho. A PNH trabalha com 3 macro-objetivos, sendo um deles:',ops:['Reduzir o processo de regionalização do SUS para que as microáreas ofertem tratamentos mais humanizados.','Divulgar a Política Nacional de Humanização e ampliar os processos de formação e produção de conhecimento em articulação com movimentos sociais e instituições.','Estruturar a parceria com serviços privados para a redução de filas em todo o país.','Fomentar os tratamentos de eficiência tecnológica para aumentar eficiência aos usuários do SUS.','Estimular a contratação de consultorias para produção de planos de humanização nos territórios para viabilizar o alcance total dos objetivos da PNH.'],g:1,exp:'Gabarito: B.'},
        {n:44,q:'A Política Nacional de Atenção à Saúde dos Povos Indígenas integra a Política Nacional de Saúde, compatibilizando as determinações das Leis Orgânicas da Saúde com as da Constituição Federal, que reconhecem aos povos indígenas suas especificidades étnicas e culturais e seus direitos territoriais. Brasil. Fundação Nacional de Saúde. Política Nacional de Atenção à Saúde dos Povos Indígenas. 2ª edição. Brasília: Ministério da Saúde. Fundação Nacional de Saúde, 2002. Para garantir o atendimento à saúde dos povos indígenas, foi criado o Subsistema de Atenção à Saúde Indígena (SasiSUS), de acordo com a Lei nº 9.836, de 23 de setembro de 1999. A Secretaria de Saúde Indígena (SESAI) é responsável por coordenar e executar a Política Nacional de Atenção à Saúde dos Povos Indígenas e todo o processo de gestão do Subsistema de Atenção à Saúde Indígena (SasiSUS) no Sistema Único de Saúde (SUS). Assinale a única opção em que a ação compete à Secretaria de Saúde Indígena.',ops:['Fomentar a implementação de políticas assistenciais para a população indígena no âmbito do Subsistema de Atenção à Saúde Indígena, em articulação com as demais Secretarias do Ministério.','Estabelecer o processo de gestão do Subsistema de Atenção à Saúde Indígena para a promoção, a proteção e a recuperação da saúde dos povos indígenas e a sua integração ao SUS.','Estabelecer diretrizes e promover o fortalecimento da gestão nos Distritos Sanitários Especiais Indígenas.','Acompanhar a execução financeira dos Distritos Sanitários Especiais Indígenas (DSEI).','Acompanhar e monitorar a execução das ações de atenção integral à Saúde Indígena e determinantes ambientais.'],g:2,exp:'Gabarito: C.'},
        {n:45,q:'No contexto do Sistema Único de Saúde (SUS), o Consórcio de Saúde é uma estratégia de cooperação intermunicipal em que dois ou mais municípios se unem para administrar, organizar e financiar ações e serviços de saúde de forma conjunta. O objetivo principal é otimizar os recursos financeiros, logísticos e humanos disponíveis, garantindo maior eficiência e qualidade nos atendimentos prestados à população. Essa colaboração é especialmente importante em regiões onde os municípios isoladamente não têm capacidade técnica ou financeira para oferecer certos tipos de serviços, como exames especializados, cirurgias ou atendimentos hospitalares de alta complexidade. Em relação aos consórcios municipais, assinale a alternativa correta.',ops:['A adesão dos municípios a um consórcio público é obrigatória e definida pelo governo federal, de acordo com a necessidade de cada região.','Para formar um consórcio, os municípios envolvidos devem renunciar à autonomia administrativa sobre os serviços que passarem a ser geridos em conjunto.','Os consórcios municipais são restritos a municípios pertencentes ao mesmo estado, não podendo incluir municípios de estados diferentes.','Os consórcios municipais podem ser formados apenas para a execução de serviços de saúde, como gestão hospitalar e de Unidades de Pronto Atendimento (UPAs).','Um dos principais objetivos dos consórcios municipais é a realização conjunta de compras públicas, visando reduzir custos e aumentar a eficiência na aquisição de bens e serviços.'],g:4,exp:'Gabarito: E.'},
        {n:46,q:'A violência contra a mulher é tema recorrente em jornais e noticiários do mundo. No Brasil, a Lei nº 14.847 de 25 de abril de 2024 alterou a Lei nº 8.080, de 19 de setembro de 1990 (Lei Orgânica da Saúde), para dispor sobre o atendimento de mulheres vítimas de violência em ambiente privativo e individualizado nos serviços de saúde prestados no âmbito do Sistema Único de Saúde. A grande alteração trouxe como cuidado para as mulheres em situação de violência:',ops:['As mulheres vítimas de qualquer tipo de violência têm o direito de serem acolhidas e atendidas nos serviços de saúde prestados na rede privada, em local e ambiente que garantam sua privacidade e restrição do acesso de terceiros não autorizados pela paciente, em especial o do agressor.','As mulheres vítimas de qualquer tipo de violência têm o direito de serem acolhidas e atendidas nos serviços de saúde prestados no âmbito do SUS, na rede própria ou conveniada, em local e ambiente que garantam sua privacidade e restrição do acesso de terceiros não autorizados pela paciente, em especial o do agressor.','As mulheres vítimas de qualquer tipo de violência têm o direito de serem acolhidas e atendidas nos serviços de saúde prestados no âmbito do SUS, após 30 dias do boletim de ocorrência, na rede própria ou conveniada, em local e ambiente que garantam sua privacidade e restrição do acesso de terceiros não autorizados pela paciente, em especial o do agressor.','As mulheres vítimas de qualquer tipo de violência têm o direito de serem acolhidas e atendidas nos serviços de saúde prestados no âmbito do SUS, mesmo sem privacidade tendo em vista a emergência, mas com restrição do acesso de terceiros não autorizados pela paciente, em especial o do agressor.','As mulheres vítimas de qualquer tipo de violência têm o direito de serem acolhidas e atendidas nos serviços de saúde prestados no âmbito do SUS, após instauração de inquérito policial, na rede própria ou conveniada, em local e ambiente que garantam sua privacidade com a presença de um agente militar e do agressor.'],g:1,exp:'Gabarito: B.'},
        {n:47,q:'A participação da comunidade no Sistema Único de Saúde está presente, como princípio organizativo na Constituição Federal de 1988. A partir dessa discussão, a Lei Federal nº 8.142 de 28 de dezembro de 1990 referendou a participação da comunidade na gestão do SUS, trazendo estruturas de participação, com vários segmentos sociais, permitindo a avaliação da situação de saúde e a proposição de diretrizes para a formulação de políticas de saúde, construção de estratégias e controle na execução da política de saúde. Sobre essa importante Lei que trata da participação da comunidade no SUS, podemos definir que as instâncias colegiadas são',ops:['os Conselhos de Saúde e as Conferências de Saúde nas três instâncias de gestão.','os Conselhos de Saúde e Conferências de Saúde na instância federal.','as Ouvidorias e Conferências de Saúde em todas as instâncias de gestão.','os Conselhos de Saúde, Ouvidorias e Conferências de Saúde em todas as instâncias de gestão.','os Conselhos de Saúde e Ouvidorias em todas as instâncias de gestão (municipal, estadual e federal).'],g:0,exp:'Gabarito: A.'},
        {n:48,q:'A Política Nacional de Atenção Integral à Saúde da Mulher (PNAISM) no Sistema Único de Saúde (SUS) visa garantir o acesso integral, humanizado e de qualidade aos serviços de saúde para todas as mulheres, em todas as fases de sua vida. Criada em 2004, a PNAISM tem como objetivo atender as necessidades de saúde das mulheres, considerando as diversidades sociais, culturais, étnicas e de orientação sexual. Considera-se um objetivo geral desta política no SUS:',ops:['Contribuir para o aumento da morbidade e redução da mortalidade feminina no Brasil, especialmente por causas evitáveis, em todos os ciclos de vida e nos diversos grupos populacionais, sem discriminação de qualquer espécie.','Ampliar até o limite constitucional e qualificar anualmente a atenção integral à saúde da mulher no Sistema Único de Saúde.','Estruturar as unidades de atendimento às vítimas de violência em todas as unidades da federação com recursos próprios e financiados pelo Ministério da Saúde.','Estruturar redes de atenção à saúde das mulheres em situação de vulnerabilidade social nos estados, união e municípios até o ano de 2024, compondo a rede mulheres no SUS − RMS.','Promover a melhoria das condições de vida e saúde das mulheres brasileiras, mediante a garantia de direitos legalmente constituídos e ampliação do acesso aos meios e serviços de promoção, prevenção, assistência e recuperação da saúde em todo território brasileiro.'],g:4,exp:'Gabarito: E.'},
        {n:49,q:'A criação do Sistema Único de Saúde (SUS) em 1988 representou um marco importante na história da saúde pública no Brasil, consolidando a universalidade do direito à saúde, garantindo na Constituição Federal que a saúde é um direito de todos e um dever do Estado. A construção do SUS passava por momentos históricos no Brasil que promoviam o debate sobre a saúde e a produção de propostas para o tema. Assim, aponte qual das alternativas abaixo descreve corretamente um evento histórico que contribuiu para a criação e organização do SUS.',ops:['O SUS foi criado pela reforma sanitária de 1974, que instituiu a universalidade da saúde e a descentralização dos serviços.','A 8ª Conferência Nacional de Saúde, realizada em 1986, foi um evento decisivo para a formulação das bases do SUS, propondo a saúde como um direito de todos e um dever do Estado.','O modelo de saúde pública adotado antes da criação do SUS já oferecia atendimento integral e gratuito a toda a população brasileira desde a década de 1940.','O SUS foi criado durante o regime militar, com o objetivo de centralizar o controle da saúde pública no governo federal e limitar a atuação de estados e municípios.','A criação do Instituto Nacional de Assistência Médica da Previdência Social (INAMPS) na década de 1960 foi o primeiro passo para universalizar o acesso à saúde no Brasil.'],g:1,exp:'Gabarito: B.'},
        {n:50,q:'O Decreto nº 7.508, de 28 de junho de 2011, regulamenta a Lei Orgânica da Saúde (Lei nº 8.080/1990), estabelecendo diretrizes importantes para a organização do Sistema Único de Saúde (SUS). O decreto define conceitos fundamentais, como a região de saúde, além de regulamentar a contratualização de serviços e o acesso universal e igualitário às ações e serviços de saúde, assegurando a integralidade do atendimento. Entre as comissões trazidas pelo decreto, podemos encontrar em seu bojo:',ops:['Comissão intergestores Nacional − CIN','Comissão Intergestores Tripartite − CIT','Comissão Intergestores Municipais − CIM','Comissão Intergestores da Saúde − CIS','Comissão Intergestores Estaduais − CIE ================================================================================ FIM DA PROVA – 50 QUESTÕES EXTRAÍDAS ================================================================================'],g:1,exp:'Gabarito: B.'}
      ]}
    ]

      {nome:'Língua Portuguesa',qs:[

        {n:6,q:'Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão.',ops:['Fazem dois anos que ingressei na guarda.','Houveram muitas ocorrências ontem.','Faz dois anos que ingressei na guarda.','Devem haver soluções para o problema.','Haviam vários candidatos na fila.'],g:2,exp:'"Fazer" indicando tempo decorrido e "haver" com sentido de existir são impessoais: ficam na 3ª pessoa do singular (Faz; Houve; Deve haver; Havia).'},

// ===================== GLOBAIS =====================
const STORAGE_KEY = 'aceRespostas';
let flashDados=[], flashDeck=[], flashIdx=0;
let quizPerguntas=[], quizIdx=0, quizCertas=0, quizErradas=0, respondeu=false;
let exAtual=null, exSecAtual=0, exQAtual=0, exRespostas={}, exStarted=false;
let _speechRate=1;

// ===================== INIT =====================
window.addEventListener('DOMContentLoaded',()=>{
  buildFlashDados();
  renderResumo();
  renderFlashFiltro();
  renderFlash();
  renderMapa();
  renderExamesList();
  mostrarRelatorio();
  const dark = localStorage.getItem('aceDark');
  if(dark==='1') document.body.setAttribute('data-dark','');
});

// ===================== RESUMO =====================
function renderResumo(){
  const el = document.getElementById('sec-resumo');
  el.innerHTML = disciplinas.map((d,i)=>`
    <div class="disc-bloco">
      <div class="disc-header" onclick="toggleDisc(${i},this)" style="background:${d.cor}">
        ${d.nome} <span class="arrow">▼</span>
      </div>
      <div class="disc-topicos" id="disc-${i}">
        ${d.topicos.map(t=>`
          <div class="topico-item">
            <div style="flex:1">
              <div class="topico-nome">${t.t}</div>
              <div class="topico-desc">${t.d}</div>
            </div>
            <span class="freq-badge freq-${t.freq}">${t.freq.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleDisc(i,hdr){
  const el = document.getElementById('disc-'+i);
  const open = el.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

// ===================== FLASHCARDS =====================
function buildFlashDados(){
  flashDados=[];
  disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      flashDados.push({disc:d.nome, termo:t.t, def:t.d, freq:t.freq});
    });
  });
  flashDeck=[...flashDados];
}

function renderFlashFiltro(){
  const sel = document.getElementById('flash-filtro');
  disciplinas.forEach(d=>{
    const op = document.createElement('option');
    op.value = d.nome;
    op.textContent = d.nome.replace(/^.{2}/,'');
    sel.appendChild(op);
  });
}

function filtrarFlash(){
  const v = document.getElementById('flash-filtro').value;
  flashDeck = v==='todos' ? [...flashDados] : flashDados.filter(f=>f.disc===v);
  flashIdx=0;
  renderFlash();
}

function shuffleFlash(){
  for(let i=flashDeck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];
  }
  flashIdx=0;
  document.getElementById('flash-inner').classList.remove('virado');
  renderFlash();
  toast('Embaralhado!');
}

function renderFlash(){
  if(!flashDeck.length) return;
  const c = flashDeck[flashIdx];
  document.getElementById('flash-termo').textContent = c.termo;
  document.getElementById('flash-def').textContent = c.def;
  document.getElementById('flash-prog').textContent = `${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-inner').classList.remove('virado');
}

function virarCard(){
  document.getElementById('flash-inner').classList.toggle('virado');
}

function navFlash(d){
  flashIdx = (flashIdx+d+flashDeck.length)%flashDeck.length;
  renderFlash();
}

function falarCard(){
  const virado = document.getElementById('flash-inner').classList.contains('virado');
  const txt = virado ? document.getElementById('flash-def').textContent : document.getElementById('flash-termo').textContent;
  falar(txt);
}

function falar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR'; u.rate=_speechRate;
  speechSynthesis.speak(u);
}

// ===================== MAPA =====================
function renderMapa(){
  const filtros = document.getElementById('mapa-filtros');
  const grid = document.getElementById('mapa-grid');
  const nomes = ['Todos',...disciplinas.map(d=>d.nome)];
  filtros.innerHTML = nomes.map((n,i)=>`<button class="${i===0?'ativo':''}" onclick="filtrarMapa(this,'${n}')">${n}</button>`).join('');
  _renderMapaGrid('Todos');
}

function filtrarMapa(btn,disc){
  document.querySelectorAll('.mapa-filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  _renderMapaGrid(disc);
}

function _renderMapaGrid(disc){
  const grid = document.getElementById('mapa-grid');
  let items=[];
  disciplinas.forEach(d=>{
    if(disc==='Todos'||d.nome===disc){
      d.topicos.forEach(t=>items.push({disc:d.nome,t}));
    }
  });
  grid.innerHTML = items.map(({disc,t})=>`
    <div class="mapa-card" onclick="toast('${t.t}')">
      <div class="mc-disc">${disc.replace(/^.{2}/,'')}</div>
      <div class="mc-nome">${t.t}</div>
      <span class="freq-badge freq-${t.freq} mc-freq">${t.freq.toUpperCase()}</span>
    </div>
  `).join('');
}

function iniciarQuiz(){
  const filtro = document.getElementById('quiz-filtro').value;
  let banco = filtro==='todos' ? [...questoes] : questoes.filter(q=>q.disc===filtro);
  for(let i=banco.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[banco[i],banco[j]]=[banco[j],banco[i]];}
  quizPerguntas = banco.slice(0,Math.min(10,banco.length));
  quizIdx=0; quizCertas=0; quizErradas=0; respondeu=false;
  document.getElementById('quiz-placar').classList.remove('show');
  document.getElementById('quiz-box').style.display='block';
  renderQuestao();
}

function renderQuestao(){
  if(quizIdx>=quizPerguntas.length){encerrarQuiz();return;}
  respondeu=false;
  const q = quizPerguntas[quizIdx];
  document.getElementById('q-disc').textContent = q.disc;
  const temaEl = document.getElementById('q-tema');
  temaEl.textContent = q.tema || '';
  temaEl.style.display = q.tema ? '' : 'none';
  document.getElementById('q-num').textContent = `${quizIdx+1}/${quizPerguntas.length}`;
  document.getElementById('q-pergunta').textContent = q.p;
  document.getElementById('q-exp').classList.remove('show');
  document.getElementById('btn-prox-q').style.display='none';
  const ops = document.getElementById('q-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="quiz-op" onclick="verificarResposta(${i})">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span> ${o}
    </button>
  `).join('');
  const vid = q.tema ? (videoMap[q.tema] || '') : '';
  const wrap = document.getElementById('q-video-wrap');
  if(vid){
    wrap.style.display = 'block';
    wrap.innerHTML = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${vid}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="border-radius:12px;display:block;margin-top:10px"></iframe>`;
  } else {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
  }
}

function verificarResposta(idx){
  if(respondeu) return;
  respondeu=true;
  const q = quizPerguntas[quizIdx];
  const btns = document.querySelectorAll('.quiz-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  if(idx===q.c) quizCertas++; else quizErradas++;
  salvarRespostaQuiz(idx===q.c);
  document.getElementById('q-exp').textContent = q.exp;
  document.getElementById('q-exp').classList.add('show');
  document.getElementById('btn-prox-q').style.display='inline-block';
}

function proximaQuestao(){
  quizIdx++;
  renderQuestao();
}

function encerrarQuiz(){
  document.getElementById('quiz-box').style.display='none';
  const placar = document.getElementById('quiz-placar');
  placar.classList.add('show');
  const total = quizCertas+quizErradas;
  document.getElementById('placar-num').textContent = `${quizCertas}/${total}`;
  const pct = total?Math.round(quizCertas/total*100):0;
  document.getElementById('placar-label').textContent = `${pct}% de aproveitamento – ${quizCertas} certa(s), ${quizErradas} errada(s)`;
}

function salvarRespostaQuiz(acertou){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.quizTotal = (dados.quizTotal||0)+1;
  dados.quizCertas = (dados.quizCertas||0)+(acertou?1:0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

// ===================== SIMULADOS =====================
function totalQuestoes(e){
  return e.secoes.reduce((t,s)=>t+s.qs.length,0);
}
function renderExamesList(){
  const el = document.getElementById('exames-lista');
  el.innerHTML = EXAMES_DATA.map(e=>`
    <div class="exame-card">
      <div class="exame-info">
        <h3>${e.titulo}</h3>
        <p>${e.banca} · ${e.ano} · ${e.cargo}</p>
        <span class="badge-qtd">${totalQuestoes(e)} questões</span>
      </div>
      <button class="btn-iniciar" onclick="iniciarExame('${e.id}')">▶ Iniciar</button>
    </div>
  `).join('');
}

function iniciarExame(id){
  exAtual = EXAMES_DATA.find(e=>e.id===id);
  exSecAtual=0; exQAtual=0; exRespostas={}; exStarted=true;
  document.getElementById('exames-lista').style.display='none';
  const ativo = document.getElementById('exame-ativo');
  ativo.classList.add('show');
  document.getElementById('ex-titulo').textContent = exAtual.titulo;
  document.getElementById('ex-info').textContent = `${exAtual.banca} · ${exAtual.ano}`;
  document.getElementById('ex-resultado').classList.remove('show');
  document.getElementById('ex-corpo').style.display='block';
  renderQuestaoExame();
}

function renderQuestaoExame(){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  document.getElementById('ex-sec-label').textContent = sec.nome;

  // pergunta
  const pergEl = document.getElementById('ex-pergunta');
  if(q.texto){
    pergEl.innerHTML = `<div class="texto-base-wrap" id="tbw-${q.n}"><button class="texto-base-toggle" onclick="document.getElementById('tbw-${q.n}').classList.toggle('open')">📄 Texto-base — clique para expandir</button><div class="texto-base-conteudo"></div></div><div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
    pergEl.querySelector('.texto-base-conteudo').textContent = q.texto;
  } else {
    pergEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
  }
  pergEl.querySelector('span').textContent = `Q${q.n}. ${q.q}`;
  pergEl.querySelector('.audio-btn').addEventListener('click', ()=>falar(`Q${q.n}. ${q.q}`));
  // tabela (se existir)
  const oldTab = pergEl.querySelector('.q-tabela-wrap');
  if(oldTab) oldTab.remove();
  if(q.tabela){
    const wrap = document.createElement('div');
    wrap.className = 'q-tabela-wrap';
    let html = '<table class="q-tabela"><thead><tr>';
    q.tabela.cab.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    q.tabela.lin.forEach(row => { html += '<tr>'; row.forEach(cell => html += `<td>${cell}</td>`); html += '</tr>'; });
    html += '</tbody></table>';
    wrap.innerHTML = html;
    pergEl.appendChild(wrap);
  }

  document.getElementById('ex-exp').classList.remove('show');
  document.getElementById('btn-ex-prox').style.display='none';

  // alternativas
  const ops = document.getElementById('ex-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="ex-op" data-idx="${i}">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span>
      <span style="flex:1"></span>
      <span class="audio-btn-op" data-audio="${i}" title="Ouvir alternativa">🔊</span>
    </button>
  `).join('');

  // preenche texto e listeners sem risco de escape
  ops.querySelectorAll('.ex-op').forEach((btn, i)=>{
    btn.querySelector('span:nth-child(2)').textContent = q.ops[i];
    btn.addEventListener('click', (e)=>{
      if(e.target.classList.contains('audio-btn-op')) return;
      responderExame(i);
    });
    btn.querySelector('.audio-btn-op').addEventListener('click', (e)=>{
      e.stopPropagation();
      falar(q.ops[i]);
    });
  });
}

function responderExame(idx){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  const key = `${exSecAtual}_${exQAtual}`;
  if(exRespostas[key]!==undefined) return;
  exRespostas[key]=idx;
  const btns = document.querySelectorAll('.ex-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.g) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  document.getElementById('ex-exp').textContent = q.exp;
  document.getElementById('ex-exp').classList.add('show');
  document.getElementById('btn-ex-prox').style.display='inline-block';
}

function avancarExame(){
  const sec = exAtual.secoes[exSecAtual];
  exQAtual++;
  if(exQAtual>=sec.qs.length){
    exSecAtual++;
    exQAtual=0;
    if(exSecAtual>=exAtual.secoes.length){finalizarExame();return;}
  }
  renderQuestaoExame();
}

function finalizarExame(){
  document.getElementById('ex-corpo').style.display='none';
  let total=0,certas=0;
  exAtual.secoes.forEach((s,si)=>{
    s.qs.forEach((q,qi)=>{
      total++;
      if(exRespostas[`${si}_${qi}`]===q.g) certas++;
    });
  });
  document.getElementById('ex-res-num').textContent = `${certas}/${total}`;
  const pct=Math.round(certas/total*100);
  document.getElementById('ex-res-label').textContent = `${pct}% de aproveitamento`;
  document.getElementById('ex-resultado').classList.add('show');
  salvarResultadoSimulado(certas,total);
}

function salvarResultadoSimulado(certas,total){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.simTotal = (dados.simTotal||0)+1;
  dados.simCertas = (dados.simCertas||0)+certas;
  dados.simQuestoes = (dados.simQuestoes||0)+total;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function voltarExames(){
  document.getElementById('exame-ativo').classList.remove('show');
  document.getElementById('exames-lista').style.display='grid';
  exAtual=null; exStarted=false;
}

// ===================== RELATÓRIO =====================
function mostrarRelatorio(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0, qC=dados.quizCertas||0;
  const sT=dados.simTotal||0, sC=dados.simCertas||0, sQ=dados.simQuestoes||0;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${qT}</div><div class="stat-label">Quiz respondidas</div></div>
    <div class="stat-card"><div class="stat-num">${qT?Math.round(qC/qT*100):0}%</div><div class="stat-label">Acerto no Quiz</div></div>
    <div class="stat-card"><div class="stat-num">${sT}</div><div class="stat-label">Simulados feitos</div></div>
    <div class="stat-card"><div class="stat-num">${sQ?Math.round(sC/sQ*100):0}%</div><div class="stat-label">Acerto Simulados</div></div>
  `;
}

function exportarTXT(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0,qC=dados.quizCertas||0;
  const sT=dados.simTotal||0,sC=dados.simCertas||0,sQ=dados.simQuestoes||0;
  const txt=`RELATÓRIO ACE – Agente de Combate às Endemias
Gerado em: ${new Date().toLocaleString('pt-BR')}

QUIZ
  Questões respondidas: ${qT}
  Acertos: ${qC} (${qT?Math.round(qC/qT*100):0}%)
  Erros: ${qT-qC}

SIMULADOS
  Simulados realizados: ${sT}
  Questões respondidas: ${sQ}
  Acertos: ${sC} (${sQ?Math.round(sC/sQ*100):0}%)

---
Bons estudos! 🌿
`;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='relatorio-ace.txt';
  a.click();
  toast('Exportado com sucesso!');
}

function limparDados(){
  if(!confirm('Limpar todo o histórico de respostas?')) return;
  localStorage.removeItem(STORAGE_KEY);
  mostrarRelatorio();
  toast('Dados apagados!');
}

// ===================== UTILS =====================
function mudarTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('sec-'+id).classList.add('ativa');
  if(id==='relatorio') mostrarRelatorio();
}

function setSpeed(v, btn){
  _speechRate = v;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function toggleDark(){
  const dark = document.body.hasAttribute('data-dark');
  dark ? document.body.removeAttribute('data-dark') : document.body.setAttribute('data-dark','');
  localStorage.setItem('aceDark', dark?'0':'1');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
