        {n:27,q:"Identifique a frase na VOZ PASSIVA SINTÉTICA:",ops:["O médico examinou o paciente.","O paciente foi examinado pelo médico.","O médico se examinou.","Examinam-se pacientes aqui.","O médico examinará o paciente."],g:3,exp:"'Examinam-se pacientes' = 'Pacientes são examinados' — voz passiva sintética formada por VTD + pronome apassivador 'se'. O sujeito 'pacientes' concorda com o verbo (plural). As demais: voz ativa (a, e), passiva analítica (b) e reflexiva (c)."},
        {n:28,q:"'Os moradores se organizaram para combater a dengue.' O verbo indica:",ops:["Voz passiva analítica","Voz ativa","Voz passiva sintética","Voz reflexiva recíproca","Voz ativa impessoal"],g:3,exp:"'Se organizaram' indica ação recíproca/mútua: os moradores se organizaram uns com os outros (entre si). Trata-se de voz reflexiva recíproca, variante da voz reflexiva."},
        {n:29,q:"'Alugam-se apartamentos.' Esta frase pode ser reescrita, mantendo o mesmo sentido, como:",ops:["Alugamos apartamentos.","Apartamentos são alugados.","Apartamentos se alugarão.","Apartamentos alugam.","Os apartamentos alugarão."],g:1,exp:"Voz passiva sintética → voz passiva analítica: 'Alugam-se apartamentos' (VTD + se + sujeito paciente) = 'Apartamentos são alugados' (ser + particípio, sem agente expresso)."},
        {n:30,q:"Qual das frases abaixo está na VOZ ATIVA?",ops:["A vacina foi aplicada pelo enfermeiro.","Aplicam-se vacinas diariamente.","O enfermeiro aplicou a vacina.","A vacina foi sendo aplicada.","Vacinas são aplicadas aqui."],g:2,exp:"'O enfermeiro aplicou a vacina': sujeito ('enfermeiro') é agente da ação — voz ativa. As demais: passiva analítica (a, d, e) e passiva sintética (b)."},
        {n:31,q:"'O agente se protegeu com equipamento adequado.' A voz verbal é:",ops:["Passiva analítica","Passiva sintética","Ativa transitiva","Reflexiva","Impessoal"],g:3,exp:"Voz reflexiva: o sujeito 'O agente' é ao mesmo tempo agente (praticou a ação de proteger) e paciente (foi protegido). O 'se' é pronome reflexivo objeto direto."},
        {n:32,q:"Transforme para a voz ativa: 'O projeto foi aprovado pela prefeitura.'",ops:["A prefeitura aprovar o projeto.","O projeto aprovou a prefeitura.","A prefeitura aprovou o projeto.","O projeto se aprova pela prefeitura.","A prefeitura foi aprovada pelo projeto."],g:2,exp:"Agente da passiva 'pela prefeitura' → sujeito ativo 'A prefeitura'; sujeito paciente 'O projeto' → objeto direto 'o projeto'; verbo 'foi aprovado' (pret. perfeito passiva) → 'aprovou' (pret. perfeito ativa)."},
        {n:33,q:"'Precisa-se de médicos.' O pronome 'se' é:",ops:["Pronome apassivador — voz passiva sintética","Índice de indeterminação do sujeito","Pronome reflexivo","Pronome recíproco","Partícula expletiva"],g:1,exp:"O verbo 'precisar de' é transitivo indireto (exige preposição). Com VTI, o 'se' NÃO é pronome apassivador — é índice de indeterminação do sujeito. Não é possível dizer 'Médicos são precisados'."},
        {n:34,q:"Identifique a frase na VOZ REFLEXIVA:",ops:["Contratam-se funcionários.","O funcionário foi contratado.","A empresa contratou funcionários.","O funcionário se candidatou à vaga.","Funcionários são contratados pela empresa."],g:3,exp:"'O funcionário se candidatou' — sujeito agente e paciente são a mesma pessoa: o funcionário praticou a ação sobre si mesmo. As demais: passiva sintética (a), passiva analítica (b, e) e ativa (c)."},
        {n:35,q:"'A comunidade foi orientada pelos agentes de saúde.' Transformada para a voz ativa:",ops:["Os agentes de saúde orientaram a comunidade.","A comunidade orientou os agentes de saúde.","Os agentes de saúde foram orientados pela comunidade.","Orienta-se a comunidade pelos agentes.","A comunidade se orientou."],g:0,exp:"Agente da passiva 'pelos agentes de saúde' → sujeito ativo; sujeito paciente 'A comunidade' → objeto direto; verbo 'foi orientada' → 'orientaram' (pret. perfeito ativa, concordando com o novo sujeito plural)."},
        {n:36,q:"Qual alternativa apresenta frase na VOZ PASSIVA ANALÍTICA?",ops:["Os alunos estudaram para a prova.","Estudam-se as regras gramaticais.","Os alunos se prepararam bem.","A prova foi realizada pelos alunos.","Precisa-se de alunos dedicados."],g:3,exp:"'A prova foi realizada pelos alunos' = verbo 'ser' (foi) + particípio 'realizada' + agente da passiva 'pelos alunos' — estrutura típica da voz passiva analítica. As demais: ativa (a), passiva sintética (b), reflexiva (c), indeterminação do sujeito (e)."},
        {n:37,q:"'Os vizinhos se cumprimentaram.' O 'se' indica:",ops:["Voz passiva sintética","Índice de indeterminação do sujeito","Pronome apassivador","Voz reflexiva propriamente dita","Voz reflexiva recíproca"],g:4,exp:"'Se cumprimentaram' expressa ação mútua: os vizinhos cumprimentaram uns aos outros (entre si). Isso caracteriza a voz reflexiva recíproca. É diferente da reflexiva propriamente dita, em que a ação recai sobre o próprio sujeito."},
        {n:38,q:"Assinale a alternativa em que a passagem para a VOZ PASSIVA está INCORRETA:",ops:["O ACE visitou as casas. → As casas foram visitadas pelo ACE.","A prefeitura construiu a UBS. → A UBS foi construída pela prefeitura.","Os alunos fizeram a prova. → A prova foi feita pelos alunos.","O técnico analisou os dados. → Os dados foram analisados pelo técnico.","A enfermeira aplicou as vacinas. → As vacinas foram aplicadas por a enfermeira."],g:4,exp:"'Por a enfermeira' está incorreto. A preposição 'por' + artigo feminino 'a' devem ser contraídos obrigatoriamente: 'pela enfermeira'. A contração 'por + a' → 'pela' é exigida pela norma culta."},
        {n:39,q:"'Nesta farmácia, atende-se com rapidez.' O 'se' é:",ops:["Pronome apassivador","Pronome reflexivo","Índice de indeterminação do sujeito","Pronome recíproco","Partícula expletiva"],g:2,exp:"O verbo 'atender' está sendo usado intransitivamente (sem objeto direto na frase). Com verbo intransitivo ou transitivo indireto, o 'se' é índice de indeterminação do sujeito — o sujeito da oração não está determinado."},
        {n:40,q:"Assinale a alternativa que contém APENAS frases na VOZ ATIVA:",ops:["O médico examinou o paciente. / Pacientes são examinados.","A equipe elaborou o relatório. / O ACE combate vetores.","O agente se protegeu. / Vendem-se imóveis.","O laudo foi emitido. / A pesquisa foi concluída.","Alugam-se quartos. / O técnico analisou os dados."],g:1,exp:"'A equipe elaborou o relatório' (sujeito agente — voz ativa) e 'O ACE combate vetores' (sujeito agente — voz ativa). As demais alternativas contêm frases em voz passiva analítica (d), passiva sintética (b/e) ou reflexiva (c)."},
      ]},
    ]
  },
  {
    id:'sim-mat1',titulo:'Matemática Básica - Ação Bahia',banca:'Ação Bahia',ano:2023,
    edital:'Câmara Municipal de Sipol – Cargos de Nível Médio',cargo:'Assistente Administrativo / Motorista',
    secoes:[
      {nome:'Matemática (Q11–Q20)',qs:[
        {n:11,q:"Observe as frações e suas respectivas representações decimais. I – 3/1000 = 0,003 | II – 2367/100 = 23,67 | III – 129/1000 = 0,129 | Utilizando as igualdades acima, escolha a alternativa correta:",ops:["I e II","I","I, II e III","II","II e III"],g:2,exp:"I: 3÷1000 = 0,003 ✓ (três casas decimais). II: 2367÷100 = 23,67 ✓ (desloca a vírgula 2 casas à esquerda). III: 129÷1000 = 0,129 ✓ (três casas decimais). As três igualdades estão corretas — alternativa c) I, II e III."},
        {n:12,q:"A soma dos 20 termos de uma PA é 500. Se o primeiro termo dessa PA é 5, qual é a razão r dessa PA?",ops:["3","2","1","0","5"],g:1,exp:"SN = (A1 + An)×n/2 → 500 = (5 + An)×10 → An = 45. An = A1 + (n−1)×r → 45 = 5 + 19r → 19r = 40 → r = 40/19 ≈ 2,1. Gabarito oficial: b) r = 2. A banca adotou r = 2 sem usar 'aproximadamente' no enunciado — o valor exato é 40/19 ≈ 2,1 e a questão deveria ter sido anulada."},
        {n:13,q:"Qual é o termo geral da progressão aritmética (1, 5, 9, 13, ...)? [QUESTÃO ANULADA pela banca]",ops:["an = 4n – 3","an = 4n + 3","an = n + 2","an = n + 3","an = 4n"],g:0,exp:"A1 = 1 e r = 5 − 1 = 4. Fórmula: an = 1 + (n−1)×4 = 1 + 4n − 4 = 4n − 3 → Letra a). A banca anulou alegando que a sequência deveria começar com 5 (desconsiderando o primeiro termo 1), o que não tem nenhuma justificativa técnica. Todos os candidatos receberam ponto."},
        {n:14,q:"Qual é o 330º termo da progressão aritmética (1, 5, 9, 13, ...)?",ops:["1.313","1.317","1.321","1.325","1.329"],g:1,exp:"A1 = 1, r = 4, n = 330. A330 = A1 + (n−1)×r = 1 + 329×4 = 1 + 1316 = 1317. Resposta: letra B (1.317)."},
        {n:15,q:"Qual é a soma das idades de uma equipe de vendas com 30 funcionários, sabendo que suas idades, em ordem crescente, formam uma PA de razão 2 e que o funcionário mais jovem tem 18 anos?",ops:["1.380","1.395","1.410","1.425","1.440"],g:2,exp:"n = 30, A1 = 18, r = 2. An = 18 + 29×2 = 76. SN = (A1 + An)×n/2 = (18 + 76)×30/2 = 94×15 = 1.410. Resposta: letra C."},
        {n:16,q:"Qual é a soma dos 500 primeiros números inteiros positivos?",ops:["1050","5050","120000","125250","12550050"],g:3,exp:"n = 500, A1 = 1, An = 500 (inteiros positivos formam PA com r = 1). SN = (A1 + An)×n/2 = (1 + 500)×500/2 = 501×250 = 125.250. Resposta: letra d)."},
        {n:17,q:"Qual é a soma das coordenadas do vértice de uma função do segundo grau definida por f(x) = 2x² + 10x + 12?",ops:["– 3,0","3,0","2,5","– 2,5","0,5"],g:0,exp:"a = 2, b = 10, c = 12. Xv = −b/(2a) = −10/4 = −5/2. Δ = b² − 4ac = 100 − 96 = 4. Yv = −Δ/(4a) = −4/8 = −1/2. Soma = −5/2 + (−1/2) = −6/2 = −3,0. Resposta: letra a)."},
        {n:18,q:"Qual é o resultado da soma das raízes reais da função f(x) = x² + 16x + 39?",ops:["16","– 16","10","– 10","– 13"],g:1,exp:"Pela relação de Girard (Vieta): x1 + x2 = −b/a = −16/1 = −16. Resposta: letra b). Verificação: as raízes são x = −3 e x = −13 (pois (x+3)(x+13) = x²+16x+39), e −3 + (−13) = −16 ✓."},
        {n:20,q:"Na tabela a seguir está a média dos alunos nos 1º, 2º e 3º bimestres em Matemática. Suponha que a média da escola seja igual a 6 pontos. Se no 4º bimestre a nota de todos os estudantes for igual a 7, podemos afirmar que:",tabela:{cab:["Aluno","1º Bimestre","2º Bimestre","3º Bimestre"],lin:[["Ana","6","5","5"],["Maria","8","4","6"],["Pedro","7","7","5"]]},ops:["todos os alunos foram aprovados.","somente Ana foi reprovada.","somente Maria foi reprovada.","somente Pedro foi reprovado.","Ana, Maria e Pedro foram reprovados."],g:1,exp:"Média = soma dos 4 bimestres ÷ 4. Ana: (6+5+5+7)÷4 = 23÷4 = 5,75 → REPROVADA (< 6). Maria: (8+4+6+7)÷4 = 25÷4 = 6,25 → aprovada. Pedro: (7+7+5+7)÷4 = 26÷4 = 6,5 → aprovado. Apenas Ana ficou abaixo da média 6. Resposta: letra b)."},
      ]},
    ]
  },
  {
    id:'sim-lei8080',titulo:'Lei 8.080/1990 – SUS - Ação Bahia',banca:'Ação Bahia',ano:2025,
    edital:'Curso Preparatório – Ação Bahia',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Lei 8.080/1990 (Q1–Q20)',qs:[
        {n:1,q:'A Lei nº 8.080, de 19 de setembro de 1990, dispõe sobre as condições para a promoção, proteção e recuperação da saúde, a organização e o funcionamento dos serviços correspondentes. Qual é a denominação oficial do Sistema criado por essa lei?',ops:['Sistema Nacional de Assistência Social (SNAS)','Sistema Único de Saúde (SUS)','Sistema Nacional de Vigilância Sanitária (SNVS)','Sistema de Proteção Social Unificado (SPSU)','Sistema Integrado de Saúde Pública (SISP)'],g:1,exp:'A Lei nº 8.080/1990 cria e regulamenta o Sistema Único de Saúde (SUS). Juntamente com a Lei nº 8.142/1990, forma a base jurídica do SUS. O fundamento constitucional está no art. 196 da CF/88, que determina que "a saúde é direito de todos e dever do Estado".'},
        {n:2,q:'De acordo com o art. 2º da Lei 8.080/1990, a saúde é um direito fundamental do ser humano, devendo o Estado prover as condições indispensáveis ao seu pleno exercício. Sobre o dever do Estado em relação à saúde, assinale a alternativa CORRETA:',ops:['O dever do Estado é exclusivo, não cabendo à pessoa e à sociedade nenhuma responsabilidade','O dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade','O dever do Estado limita-se à prestação de serviços hospitalares','O Estado só tem dever quando a pessoa não puder custear o tratamento','O dever do Estado restringe-se à saúde pública, não abrangendo saúde individual'],g:1,exp:'O art. 2º, § 2º, da Lei 8.080/1990 estabelece que "o dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade". Assim, a responsabilidade pela saúde é compartilhada entre o Estado e a sociedade. O Estado deve formular e executar políticas econômicas e sociais que reduzam riscos de doenças e outros agravos.'},
        {n:3,q:'O art. 3º da Lei 8.080/1990 trata dos fatores determinantes e condicionantes da saúde. Assinale a alternativa que apresenta APENAS fatores expressamente citados como determinantes e condicionantes da saúde:',ops:['Alimentação, moradia, saneamento básico, meio ambiente, trabalho e renda','Religião, raça, gênero, orientação sexual e nível de escolaridade','Tabagismo, sedentarismo, alcoolismo e uso de drogas ilícitas','Acesso à internet, mobilidade urbana e qualidade das escolas públicas','Renda familiar, herança genética, vacinação e consultas médicas preventivas'],g:0,exp:'O art. 3º da Lei 8.080/1990 (com redação dada pela Lei nº 12.864/2013) elenca como fatores determinantes e condicionantes da saúde: alimentação, moradia, saneamento básico, meio ambiente, trabalho, renda, educação, atividade física, transporte, lazer e acesso aos bens e serviços essenciais. Esses fatores refletem os chamados "determinantes sociais da saúde".'},
        {n:4,q:'O art. 4º da Lei 8.080/1990 define o conjunto de ações e serviços de saúde que integram o SUS. Sobre essa definição, assinale a alternativa CORRETA:',ops:['O SUS é integrado apenas pelos serviços e ações federais de saúde','O SUS é constituído pelo conjunto de ações e serviços de saúde prestados por órgãos e instituições públicas federais, estaduais e municipais, da Administração direta e indireta e das fundações mantidas pelo Poder Público','O SUS inclui apenas hospitais públicos e postos de saúde do governo federal','O SUS abrange os serviços privados conveniados desde que gratuitos ao usuário','O SUS é formado apenas pelos serviços municipais de atenção básica à saúde'],g:1,exp:'O art. 4º da Lei 8.080/1990 define que o SUS é constituído pelo conjunto de ações e serviços de saúde, prestados por órgãos e instituições públicas federais, estaduais e municipais, da Administração direta e indireta e das fundações mantidas pelo Poder Público. A iniciativa privada pode participar do SUS em caráter complementar (art. 4º, § 2º), com preferência para entidades filantrópicas e sem fins lucrativos.'},
        {n:5,q:'Os princípios e diretrizes do SUS estão previstos no art. 7º da Lei 8.080/1990. Assinale a alternativa que contém APENAS princípios e diretrizes do SUS expressamente elencados nesse artigo:',ops:['Privatização, centralização e verticalização das ações de saúde','Universalidade de acesso, integralidade de assistência e preservação da autonomia das pessoas','Focalização no atendimento às populações mais pobres e exclusividade para segurados','Atendimento com fins lucrativos, cobrança de taxas e seleção de pacientes','Fragmentação dos serviços, hierarquização invertida e desintegração da rede'],g:1,exp:'O art. 7º da Lei 8.080/1990 estabelece os princípios e diretrizes do SUS, entre os quais: I – universalidade de acesso em todos os níveis de assistência; II – integralidade de assistência; III – preservação da autonomia das pessoas; IV – igualdade da assistência à saúde; V – direito à informação; VI – divulgação das informações; VII – utilização da epidemiologia para prioridades; VIII – participação da comunidade; IX – descentralização; X – integração das ações; XI – conjugação dos recursos; XII – capacidade resolutiva; XIII – organização dos serviços.'},
        {n:6,q:'O princípio da UNIVERSALIDADE do SUS, previsto no art. 7º, I, da Lei 8.080/1990, significa que:',ops:['Apenas cidadãos brasileiros natos têm direito ao atendimento do SUS','O SUS atende somente pessoas que contribuem para a Previdência Social','O acesso às ações e serviços de saúde deve ser garantido a toda e qualquer pessoa, sem discriminação','O SUS atende apenas doenças reconhecidas pela OMS como prioritárias','Somente residentes no município onde o serviço está localizado podem ser atendidos'],g:2,exp:'A universalidade significa que o SUS deve garantir acesso a todos, independentemente de raça, cor, religião, situação econômica, origem, contribuição previdenciária ou qualquer outra condição. Estrangeiros também têm direito ao atendimento no SUS. É um dos princípios doutrinários fundamentais, ao lado da integralidade e da equidade.'},
        {n:7,q:'O princípio da INTEGRALIDADE da assistência, previsto na Lei 8.080/1990, é definido como:',ops:['Atendimento apenas às doenças mais prevalentes na população','Conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade','Foco exclusivo nas ações de alta complexidade, como cirurgias e internações','Prestação de serviços de saúde apenas no nível de atenção primária','Integração somente dos serviços hospitalares em rede única'],g:1,exp:'O art. 7º, II, da Lei 8.080/1990 define integralidade como "conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade do sistema". Significa que o usuário deve ser atendido de forma integral, do simples ao mais complexo, com ações de promoção, prevenção, tratamento e reabilitação.'},
        {n:8,q:'O art. 9º da Lei 8.080/1990 dispõe sobre a direção do SUS. Qual dos entes abaixo NÃO exerce direção do SUS?',ops:['No âmbito da União – o Ministério da Saúde','No âmbito dos Estados e do Distrito Federal – a respectiva Secretaria de Saúde ou órgão equivalente','No âmbito dos Municípios – a respectiva Secretaria de Saúde ou órgão equivalente','No âmbito dos bairros e comunidades – o Conselho Local de Saúde','No âmbito do Distrito Federal – órgão equivalente à Secretaria de Saúde'],g:3,exp:'O art. 9º da Lei 8.080/1990 estabelece três instâncias de direção do SUS: I – no âmbito da União: o Ministério da Saúde; II – no âmbito dos Estados e do DF: a respectiva Secretaria de Saúde ou órgão equivalente; III – no âmbito dos Municípios: a respectiva Secretaria de Saúde ou órgão equivalente. Os Conselhos Locais de Saúde participam do controle social, mas não exercem direção do sistema.'},
        {n:9,q:'Sobre a competência da direção MUNICIPAL do SUS, o art. 18 da Lei 8.080/1990 estabelece que compete ao município:',ops:['Planejar, organizar, controlar e avaliar as ações e os serviços de saúde e gerir e executar os serviços públicos de saúde','Apenas financiar as ações de saúde, sem poder executá-las diretamente','Fiscalizar e auditar o Ministério da Saúde e as Secretarias Estaduais','Controlar e regular os planos privados de saúde no território municipal','Apenas coordenar ações de vigilância epidemiológica de âmbito nacional'],g:0,exp:'O art. 18 da Lei 8.080/1990 estabelece ampla competência ao município, incluindo: planejar, organizar, controlar e avaliar as ações e serviços de saúde; gerir e executar os serviços públicos de saúde; participar do planejamento, programação e organização da rede regionalizada e hierarquizada do SUS; celebrar contratos e convênios; controlar e fiscalizar os serviços de saúde; entre outras competências.'},
        {n:10,q:'O art. 13 da Lei 8.080/1990 trata da competência da União para transferir aos Estados, ao Distrito Federal e aos Municípios responsabilidades e recursos. Sobre a atuação da União no SUS, assinale a alternativa CORRETA:',ops:['A União pode executar diretamente ações de saúde em qualquer município sem autorização estadual','A União tem competência exclusiva para gerir todos os serviços de saúde no território nacional','A União formula, avalia e apoia as políticas nacionais de saúde, além de participar na formulação e implementação das políticas de controle de agravos','A União não pode transferir recursos financeiros para Estados e Municípios','A União é responsável apenas pela regulamentação, sem poder executar ações de saúde'],g:2,exp:'Entre as competências da União (art. 16 da Lei 8.080/1990) estão: formular, avaliar e apoiar políticas de alimentação e nutrição; participar na formulação e implementação das políticas de controle das agressões ao meio ambiente; definir e coordenar os sistemas de redes integradas de assistência de alta complexidade; participar da definição de normas e mecanismos de controle de agravos sobre o meio ambiente; elaborar normas para regulamentação das ações e serviços de saúde.'},
        {n:11,q:'O art. 19-J da Lei 8.080/1990 (incluído pela Lei nº 11.634/2007) garantiu às gestantes o direito de conhecer e acompanhar a maternidade de referência. O art. 19-M dispõe sobre a atenção integral à saúde da mulher. Qual das alternativas a seguir está em CONFORMIDADE com o texto da Lei 8.080/1990?',ops:['O SUS atende apenas mulheres em idade reprodutiva (15 a 49 anos)','A atenção integral à saúde da mulher deve garantir atenção humanizada à mulher e ao recém-nascido','A atenção à saúde da mulher é de responsabilidade exclusiva dos municípios','A saúde da mulher é tratada exclusivamente como saúde reprodutiva','Gestantes não têm direito ao acompanhante durante o trabalho de parto e pós-parto'],g:1,exp:'A Lei 8.080/1990, em seus artigos sobre saúde da mulher e do recém-nascido (arts. 19-J a 19-M), garante atenção humanizada à mulher e ao recém-nascido, direito ao acompanhante durante o trabalho de parto, parto e pós-parto imediato, e o direito de conhecer a maternidade de referência. A atenção integral vai além da saúde reprodutiva, abrangendo todo o ciclo de vida da mulher.'},
        {n:12,q:'O art. 6º da Lei 8.080/1990 define o campo de atuação do SUS. Estão incluídas no campo de atuação do SUS, EXCETO:',ops:['A execução de ações de vigilância sanitária','A execução de ações de vigilância epidemiológica','A execução de ações de saúde do trabalhador','A gestão de planos e seguros privados de saúde como atividade principal do SUS','A assistência terapêutica integral, inclusive farmacêutica'],g:3,exp:'O art. 6º da Lei 8.080/1990 inclui no campo de atuação do SUS: vigilância sanitária; vigilância epidemiológica; saúde do trabalhador; assistência terapêutica integral (inclusive farmacêutica); formulação de políticas de saneamento; ações de saúde e assistência social; ordenação da formação de recursos humanos na área; vigilância nutricional; e colaboração na proteção do meio ambiente. A gestão de planos privados de saúde como atividade principal não integra o campo do SUS.'},
        {n:13,q:'A vigilância sanitária é definida pela Lei 8.080/1990 como:',ops:['Conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva','Conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços','Conjunto de ações voltadas exclusivamente para o controle de doenças transmissíveis','Atividade de registro, licenciamento e fiscalização de medicamentos importados','Fiscalização de alimentos industrializados realizada pelo Ministério da Agricultura'],g:1,exp:'O art. 6º, § 1º, da Lei 8.080/1990 define vigilância sanitária como "um conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde". Abrange o controle de bens de consumo, medicamentos, alimentos, estabelecimentos, tecnologias e serviços.'},
        {n:14,q:'A vigilância epidemiológica é definida na Lei 8.080/1990 como:',ops:['Conjunto de ações de fiscalização de alimentos, medicamentos e cosméticos','Conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva','Conjunto de ações destinadas exclusivamente ao controle de endemias tropicais','Sistema de vigilância dos servidores públicos da saúde','Conjunto de ações de inspeção em estabelecimentos de saúde'],g:1,exp:'O art. 6º, § 2º, da Lei 8.080/1990 define vigilância epidemiológica como "um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos". É o instrumento que orienta as intervenções do ACE.'},
        {n:15,q:'O art. 7º, IX, da Lei 8.080/1990 estabelece como princípio do SUS a descentralização político-administrativa, com ênfase na:',ops:['Centralização das decisões no Ministério da Saúde em Brasília','Descentralização para os Estados, que repassam recursos para o governo federal','Descentralização para os Municípios, com integração de ações e serviços de saúde entre os entes federados','Descentralização para hospitais privados conveniados','Descentralização para as Organizações Sociais de Saúde (OSS)'],g:2,exp:'O art. 7º, IX, da Lei 8.080/1990 estabelece como diretriz a "descentralização político-administrativa, com direção única em cada esfera de governo: a) ênfase na descentralização dos serviços para os municípios; b) regionalização e hierarquização da rede de serviços de saúde". A municipalização foi o principal movimento de reorganização do SUS na década de 1990, transferindo para os municípios a gestão dos serviços de saúde.'},
        {n:16,q:'Sobre o financiamento do SUS, o art. 31 da Lei 8.080/1990 estabelece que o orçamento da seguridade social destinará ao SUS, de acordo com a receita estimada, pelo menos:',ops:['5% da receita tributária dos entes federados','10% da arrecadação das contribuições sociais','30% do total de recursos destinados à seguridade social','50% do orçamento do Ministério da Saúde','O percentual fixado anualmente pelo Congresso Nacional, sem piso mínimo'],g:2,exp:'O art. 31 da Lei 8.080/1990 estabelece que o orçamento da seguridade social destinará ao SUS "de acordo com a receita estimada, pelo menos trinta por cento do Orçamento da Seguridade Social, excluído o seguro-desemprego". Esse dispositivo foi posteriormente regulado pela EC nº 29/2000 e pela LC nº 141/2012, que definiram percentuais mínimos de aplicação em saúde para cada ente federado.'},
        {n:17,q:'O art. 35 da Lei 8.080/1990 estabelece os critérios para o repasse de recursos do Fundo Nacional de Saúde para os Estados, Distrito Federal e Municípios. Assinale a alternativa que contém critérios expressamente previstos nesse artigo:',ops:['Apenas o critério populacional (número de habitantes)','Apenas o PIB per capita de cada ente federado','Perfil demográfico da região, perfil epidemiológico, características quantitativas e qualitativas da rede de saúde e desempenho técnico-econômico-financeiro','Critério único de transferência proporcional à arrecadação tributária de cada Estado','Critério de transferência baseado exclusivamente no número de leitos hospitalares'],g:2,exp:'O art. 35 da Lei 8.080/1990 estabelece que para o repasse de recursos do FNS devem ser considerados: I – perfil demográfico da região; II – perfil epidemiológico; III – características quantitativas e qualitativas da rede de saúde na área; IV – desempenho técnico, econômico e financeiro no período anterior; V – níveis de participação do setor saúde nos orçamentos estaduais e municipais; VI – previsão do plano quinquenal de investimentos da rede; VII – ressarcimento do atendimento de serviços prestados para outras esferas.'},
        {n:18,q:'A Lei 8.080/1990 trata do subsistema de Atenção à Saúde Indígena. Sobre esse subsistema, assinale a alternativa CORRETA:',ops:['A saúde indígena é de responsabilidade exclusiva dos municípios onde vivem as comunidades','O subsistema de saúde indígena é organizado com base nos Distritos Sanitários Especiais Indígenas (DSEI)','Os índios devem ser atendidos exclusivamente em hospitais gerais, não tendo direito a serviços específicos','A FUNAI é o órgão responsável pela gestão do sistema de saúde indígena','A saúde indígena é financiada exclusivamente por recursos internacionais'],g:1,exp:'O art. 19-B da Lei 8.080/1990 (incluído pela Lei nº 9.836/1999 – Lei Arouca) criou o Subsistema de Atenção à Saúde Indígena, que deve ser organizado com base nos Distritos Sanitários Especiais Indígenas (DSEI). A gestão é de competência da União, exercida pela SESAI (Secretaria Especial de Saúde Indígena), vinculada ao Ministério da Saúde. O subsistema respeita a medicina tradicional indígena.'},
        {n:19,q:'O art. 14 da Lei 8.080/1990 prevê a criação de Comissões Intergestores como instrumento de articulação e negociação entre os entes. São Comissões Intergestores do SUS:',ops:['Comissão Nacional de Ética em Pesquisa (CONEP) e Comissão Intergestores Tripartite (CIT)','Comissão Intergestores Tripartite (CIT) e Comissões Intergestores Bipartite (CIB)','Comissão Nacional de Saúde (CNS) e Comissão Intergestores Regionais (CIR)','Comitê Nacional de Gestão e Comissão Intergestores Tripartite (CIT)','Conselho Nacional de Saúde (CNS) e Comissões Intergestores Bipartite (CIB)'],g:1,exp:'As Comissões Intergestores são instâncias de pactuação entre os gestores do SUS: a Comissão Intergestores Tripartite (CIT) reúne representantes do Ministério da Saúde (federal), do CONASS (secretários estaduais) e do CONASEMS (secretários municipais), no âmbito nacional; as Comissões Intergestores Bipartite (CIB) reúnem representantes estaduais e municipais, no âmbito estadual. As CIR (Regionais) foram criadas pelo Decreto nº 7.508/2011.'},
        {n:20,q:'O art. 2º da Lei 8.080/1990 estabelece que os níveis de saúde expressam a organização social e econômica do País. Para que o dever do Estado seja cumprido, a lei determina que o Estado deve:',ops:['Garantir apenas o acesso a serviços hospitalares de alta complexidade','Formular e executar políticas econômicas e sociais que visem à redução de riscos de doenças e de outros agravos; estabelecer condições que assegurem acesso universal e igualitário às ações e aos serviços para a sua promoção, proteção e recuperação','Delegar ao setor privado toda a responsabilidade pela prestação dos serviços de saúde','Restringir o atendimento às doenças crônicas e degenerativas','Garantir apenas ações preventivas, sem investimento em serviços curativos'],g:1,exp:'O art. 2º, § 1º, da Lei 8.080/1990 determina que "o dever do Estado de garantir a saúde consiste na formulação e execução de políticas econômicas e sociais que visem à redução de riscos de doenças e de outros agravos e no estabelecimento de condições que assegurem acesso universal e igualitário às ações e aos serviços para a sua promoção, proteção e recuperação." Esse dispositivo fundamenta os princípios da universalidade e da equidade do SUS.'},
      ]},
    ]
  },
  {
    id:'sim-lei11350',
    titulo:'Lei 11.350/2006, Portaria 1.007/2010 e Portaria 1.635/2012 – ACE',
    banca:'Ação Bahia',
    ano:2025,
    edital:'Curso Preparatório – Ação Bahia',
    cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Lei 11.350/2006 – ACS e ACE (Q1–Q10)',qs:[
        {n:1,q:'Lei 11.350/2006 regulamenta as atividades de quais profissionais no âmbito do Sistema Único de Saúde?',ops:['Agentes Comunitários de Saúde (ACS) e Agentes de Combate às Endemias (ACE)','Médicos e enfermeiros da atenção básica','Técnicos de enfermagem e auxiliares de saúde bucal','Agentes administrativos das secretarias municipais de saúde','Profissionais do NASF e da vigilância sanitária'],g:0,exp:'Gabarito: A. A Lei 11.350/2006 regulamenta especificamente as atividades dos Agentes Comunitários de Saúde (ACS) e dos Agentes de Combate às Endemias (ACE), nos termos do § 5º do art. 198 da Constituição Federal, incluído pela EC nº 51/2006.'},
        {n:2,q:'Segundo a Lei 11.350/2006, quais são os requisitos mínimos para o exercício da atividade de Agente de Combate às Endemias?',ops:['Ensino médio completo e carteira de habilitação de motorista','Ser brasileiro nato ou naturalizado, ter no mínimo 18 anos, ter concluído o ensino fundamental e ter habilitação específica','Graduação em curso da área de saúde e residência no município há pelo menos dois anos','Ensino médio completo e experiência mínima de 1 ano em saúde pública','Apenas ser residente no município e ter mais de 16 anos de idade'],g:1,exp:'Gabarito: B. A Lei 11.350/2006 estabelece os requisitos mínimos para o ACE: ser brasileiro nato ou naturalizado, ter no mínimo 18 anos completos, ter concluído o ensino fundamental e possuir habilitação específica para o exercício das atividades.'},
        {n:3,q:'De acordo com a Lei 11.350/2006, o trabalho do Agente de Combate às Endemias é predominantemente caracterizado como:',ops:['Atividades administrativas exercidas no interior de unidades de saúde','Atividades clínicas de diagnóstico e orientação de tratamento','Atividades externas, com predominância de trabalho de campo','Atividades de gestão e coordenação de equipes de saúde','Atividades de regulação e controle de serviços de saúde'],g:2,exp:'Gabarito: C. A Lei 11.350/2006 define o trabalho do ACE como predominantemente externo, com realização de campo em domicílios, instalações e logradouros públicos para vigilância, prevenção e controle de endemias.'},
        {n:4,q:'As atividades do ACE, conforme a Lei 11.350/2006, compreendem:',ops:['Prescrição de medicamentos e orientação de tratamentos para doenças endêmicas','Coordenação das ações das equipes de Saúde da Família no território','Coleta e análise de materiais laboratoriais para vigilância epidemiológica','Vigilância, prevenção e controle de doenças e promoção da saúde, mediante ações coletivas e individuais, em domicílios e logradouros públicos','Supervisão e fiscalização das ações de vigilância sanitária nos municípios'],g:3,exp:'Gabarito: D. Conforme a Lei 11.350/2006, o ACE desenvolve ações de vigilância, prevenção e controle de doenças e promoção da saúde, mediante atividades coletivas e individuais, em domicílios, instalações e logradouros públicos, respeitadas as diretrizes técnicas do gestor de saúde.'},
        {n:5,q:'A Lei 11.350/2006 foi editada para regulamentar dispositivo de qual Emenda Constitucional?',ops:['Emenda Constitucional nº 29/2000, que vincula receitas para o financiamento da saúde','Emenda Constitucional nº 51/2006, que autoriza estados e municípios a contratarem ACS e ACE','Emenda Constitucional nº 45/2004, referente à reforma do Poder Judiciário','Emenda Constitucional nº 20/1998, que trata da previdência social','Emenda Constitucional nº 32/2001, que regula as medidas provisórias'],g:1,exp:'Gabarito: B. A Lei 11.350/2006 regulamenta o § 5º do art. 198 da Constituição Federal, incluído pela EC nº 51/2006, que autorizou estados e municípios a contratarem ACS e ACE por processo seletivo público, além de dispor sobre o aproveitamento de pessoal amparado pela EC nº 51/2006.'},
        {n:6,q:'Quanto à contratação dos Agentes de Combate às Endemias, a Lei 11.350/2006 estabelece que:',ops:['A contratação é de competência exclusiva do Ministério da Saúde','Os ACE são servidores estatutários federais lotados nas secretarias estaduais de saúde','A contratação deve ser realizada pelos municípios ou pelo Distrito Federal, mediante processo seletivo público','A contratação pode ser feita por organizações sociais contratadas pelo estado','Os ACE são servidores temporários contratados diretamente pelos Centros de Saúde'],g:2,exp:'Gabarito: C. A Lei 11.350/2006 determina que a contratação dos ACE deve ser feita pelos próprios municípios ou pelo Distrito Federal, mediante processo seletivo público, como forma de garantir transparência e isonomia na seleção dos profissionais.'},
        {n:7,q:'De acordo com a Lei 11.350/2006, a habilitação específica exigida para o exercício das atividades de ACE pode ser obtida por:',ops:['Apenas por curso técnico de nível médio devidamente reconhecido pelo MEC','Qualificação profissional prévia ou por capacitação em serviço, conforme definição do gestor de saúde','Apenas por curso superior na área de saúde pública ou epidemiologia','Concurso público eliminatório que avalie o conhecimento técnico do candidato','Apenas por capacitação oferecida exclusivamente pela FUNASA ou OPAS'],g:1,exp:'Gabarito: B. A Lei 11.350/2006 prevê que a habilitação específica pode ser obtida de duas formas: por qualificação profissional prévia (antes da contratação) ou por capacitação em serviço (após a contratação), conforme definição do gestor local de saúde.'},
        {n:8,q:'Segundo a Lei 11.350/2006, as ações do Agente de Combate às Endemias abrangem os seguintes espaços:',ops:['Apenas o ambiente domiciliar em área urbana','Somente logradouros públicos e unidades de saúde','Domicílios, instalações públicas ou comerciais e logradouros públicos','Apenas criadouros potenciais em imóveis fechados e abandonados','Exclusivamente áreas rurais e periféricas dos municípios'],g:2,exp:'Gabarito: C. A Lei 11.350/2006 define que as ações do ACE se desenvolvem em domicílios, instalações públicas ou comerciais e logradouros públicos, abrangendo tanto o ambiente privado quanto o público para garantir o controle das endemias.'},
        {n:9,q:'Qual das seguintes afirmações sobre as atribuições do ACE segundo a Lei 11.350/2006 está INCORRETA?',ops:['O ACE deve ser brasileiro nato ou naturalizado','É exigida a conclusão do ensino fundamental para o exercício da atividade','O trabalho do ACE tem predominância de atividades externas de campo','O ACE pode prescrever medicamentos antiparasitários de uso domiciliar como parte de suas atribuições legais','O ACE necessita de habilitação específica para o exercício de suas atividades'],g:3,exp:'Gabarito: D. A Lei 11.350/2006 não atribui ao ACE a prerrogativa de prescrição de medicamentos, que é atividade privativa de médico. As atividades do ACE restringem-se à vigilância, prevenção, controle e promoção da saúde, sem competência para diagnóstico clínico ou prescrição terapêutica.'},
        {n:10,q:'De acordo com a Lei 11.350/2006, as atividades do ACS e do ACE se diferenciam principalmente porque:',ops:['O ACS tem foco nas famílias cadastradas e na atenção básica, enquanto o ACE foca na vigilância, prevenção e controle de doenças endêmicas e ambientais','O ACS atua apenas em área rural e o ACE apenas em área urbana','O ACS pode prescrever medicamentos básicos e o ACE apenas orienta os moradores','O ACS é contratado pelo estado e o ACE pelo município','O ACS é agente federal e o ACE é agente estadual'],g:0,exp:'Gabarito: A. A Lei 11.350/2006 diferencia as funções: o ACS tem como foco principal o acompanhamento das famílias cadastradas e ações de atenção básica, enquanto o ACE foca na vigilância epidemiológica e ambiental, prevenção e controle de doenças endêmicas, como dengue, Chagas, leishmaniose, entre outras.'}
      ]},
      {nome:'Portaria GM/MS 1.007/2010 – ACE na Atenção Básica (Q11–Q20)',qs:[
        {n:11,q:'A Portaria GM/MS nº 1.007/2010 tem como principal objetivo:',ops:['Criar o cargo federal de Agente de Combate às Endemias nas secretarias estaduais','Definir critérios para a incorporação do ACE, ou de agentes que desempenhem essas atividades, às ações de Atenção Básica','Estabelecer o plano de carreira nacional para os Agentes de Combate às Endemias','Regulamentar o uso de agrotóxicos nas ações de controle vetorial','Criar o Programa Nacional de Controle de Endemias Transmissíveis'],g:1,exp:'Gabarito: B. A Portaria GM/MS nº 1.007/2010 define critérios para regulamentar a incorporação do ACE, ou de agentes que desempenhem essas atividades, às ações de Atenção Básica, visando integrar a vigilância epidemiológica ambiental à atenção primária à saúde.'},
        {n:12,q:'Conforme a Portaria 1.007/2010, a incorporação do ACE às ações de Atenção Básica visa:',ops:['Substituir os Agentes Comunitários de Saúde nas áreas sem cobertura de ESF','Transferir todas as responsabilidades da vigilância epidemiológica para a atenção básica','Ampliar a abrangência das ações de vigilância em saúde no território, integrando prevenção e controle de endemias à atenção básica','Eliminar a atuação autônoma do ACE, subordinando-o diretamente ao médico da ESF','Restringir as atividades do ACE apenas à dengue e à leishmaniose visceral'],g:2,exp:'Gabarito: C. A Portaria 1.007/2010 busca ampliar a abrangência das ações de vigilância em saúde no território, promovendo a integração das ações de prevenção e controle de endemias com a atenção básica, fortalecendo a articulação entre vigilância e assistência.'},
        {n:13,q:'Segundo a Portaria 1.007/2010, entre as doenças e agravos prioritários para a atuação do ACE integrado à Atenção Básica estão:',ops:['Dengue, doença de Chagas, leishmanioses, malária, esquistossomose, tracoma e outras endêmicas de relevância local','Apenas dengue, Zika e Chikungunya, transmitidas pelo Aedes aegypti','Doenças crônicas não transmissíveis com determinante ambiental identificado','Infecções hospitalares e doenças de transmissão nosocomial','Apenas as doenças de notificação compulsória imediata listadas no SINAN'],g:0,exp:'Gabarito: A. A Portaria 1.007/2010 abrange um conjunto amplo de endemias prioritárias: dengue, doença de Chagas, leishmanioses, malária, esquistossomose, tracoma e outras doenças endêmicas de relevância no território, além de permitir a incorporação de outras conforme necessidade local.'},
        {n:14,q:'De acordo com a Portaria 1.007/2010, a organização do trabalho do ACE deve ser baseada em:',ops:['Demandas espontâneas registradas nas unidades de saúde','Roteiros fixos determinados exclusivamente pela vigilância epidemiológica estadual','Apenas notificações de casos confirmados de doenças endêmicas','Territorialização, com definição de setores e microáreas de atuação e realização de visitas programadas','Escala aleatória definida semanalmente pelo gestor municipal'],g:3,exp:'Gabarito: D. A Portaria 1.007/2010 define que o trabalho do ACE integrado à atenção básica deve ser organizado com base na territorialização, com definição de setores ou microáreas de atuação e visitas programadas, garantindo cobertura sistemática do território.'},
        {n:15,q:'Segundo a Portaria 1.007/2010, para que o município incorpore o ACE às ações de Atenção Básica, é necessário:',ops:['Autorização prévia do Ministério da Saúde para cada ACE individualmente','Que os ACE estejam contratados pelo município, atuem em território definido, com programação das atividades e supervisão técnica adequada','Aprovação do Conselho Estadual de Saúde antes do início das atividades','Implantação prévia de equipes completas de Saúde da Família em todo o município','Que os ACE possuam formação de nível superior em saúde coletiva ou epidemiologia'],g:1,exp:'Gabarito: B. A Portaria 1.007/2010 estabelece como condições necessárias que os ACE sejam contratados pelo município, atuem em território definido, tenham suas atividades programadas e recebam supervisão técnica adequada, garantindo a qualidade e continuidade das ações.'},
        {n:16,q:'Conforme a Portaria 1.007/2010, as atividades do ACE integrado à Atenção Básica devem ser desenvolvidas com:',ops:['Total autonomia do ACE, sem necessidade de supervisão técnica','Supervisão exclusiva do médico da equipe de Saúde da Família','Supervisão técnica de profissional de nível superior da área de saúde','Supervisão da vigilância sanitária estadual realizada trimestralmente','Supervisão direta do Ministério da Saúde por meio de relatórios mensais'],g:2,exp:'Gabarito: C. A Portaria 1.007/2010 determina que as atividades do ACE integrado à atenção básica devem contar com supervisão técnica de profissional de nível superior da área de saúde, garantindo o respaldo técnico necessário para as ações de vigilância e controle.'},
        {n:17,q:'A integração do ACE à Atenção Básica, conforme a Portaria 1.007/2010, representa principalmente:',ops:['O reconhecimento do ACE como componente da vigilância em saúde no âmbito da atenção primária, fortalecendo a articulação entre vigilância e assistência','A extinção da função autônoma do ACE como agente de vigilância epidemiológica','A transferência da gestão do ACE para as equipes hospitalares de referência','A substituição do trabalho de campo por atividades administrativas nas UBS','A limitação das atividades do ACE apenas ao controle vetorial químico'],g:0,exp:'Gabarito: A. A Portaria 1.007/2010 representa um avanço ao reconhecer o ACE como parte integrante das ações de vigilância em saúde no âmbito da atenção primária, promovendo a articulação necessária entre vigilância epidemiológica ambiental e a atenção básica à saúde.'},
        {n:18,q:'Segundo a Portaria 1.007/2010, entre as atividades que o ACE deve desenvolver no contexto da Atenção Básica, está:',ops:['Realização de triagem e diagnóstico de doenças endêmicas nas UBS','Coordenação da equipe mínima de Saúde da Família na ausência do enfermeiro','Participação em reuniões de planejamento como único representante da vigilância no território','Realização de visitas domiciliares para identificação e controle de criadouros, vetores e reservatórios, com registro em sistema de informação definido pelo gestor','Prescrição de profilaxia medicamentosa para moradores em área de risco endêmico'],g:3,exp:'Gabarito: D. A Portaria 1.007/2010 prevê que o ACE deve realizar visitas domiciliares sistemáticas para identificação e controle de criadouros, vetores e reservatórios, registrando as informações nos sistemas de informação definidos pelo gestor, o que permite o monitoramento e a avaliação das ações.'},
        {n:19,q:'De acordo com a Portaria 1.007/2010, o financiamento das ações do ACE integrado à Atenção Básica ocorre por meio de:',ops:['Fundo Estadual de Saúde, com repasse direto para os municípios','Pagamento por procedimento realizado, registrado no SIA-SUS','Componente do Piso da Atenção Básica (PAB Variável), mediante cumprimento das condições estabelecidas','Transferência fundo a fundo exclusiva para municípios com mais de 100.000 habitantes','Recursos próprios dos municípios, sem participação do governo federal'],g:2,exp:'Gabarito: C. A Portaria 1.007/2010 prevê que o financiamento das ações do ACE integrado à atenção básica se dá por meio do componente variável do Piso da Atenção Básica (PAB Variável), condicionado ao cumprimento das condições e metas estabelecidas na portaria.'},
        {n:20,q:'A Portaria 1.007/2010, ao integrar o ACE às ações de Atenção Básica, estabelece que as informações coletadas pelo ACE devem ser:',ops:['Enviadas diretamente ao Ministério da Saúde, sem intermediação do gestor municipal','Registradas em sistemas de informação definidos pelo gestor, alimentando o monitoramento das ações de vigilância epidemiológica e ambiental','Arquivadas exclusivamente nas unidades de saúde, sem alimentação de sistemas informatizados','Inseridas apenas no SINAN, sistema exclusivo para notificações compulsórias','Mantidas em sigilo pelo ACE, com acesso restrito ao profissional supervisor designado'],g:1,exp:'Gabarito: B. A Portaria 1.007/2010 determina que as informações coletadas pelo ACE devem ser registradas nos sistemas de informação definidos pelo gestor local, permitindo o monitoramento contínuo das ações e subsidiando o planejamento das intervenções no território.'}
      ]},
      {nome:'Portaria GM/MS 1.635/2012 – ACE na Atenção Básica (Q21–Q30)',qs:[
        {n:21,q:'A Portaria GM/MS nº 1.635/2012, em relação à Portaria GM/MS nº 1.007/2010, representa:',ops:['Atualização e substituição, estabelecendo novos critérios para a incorporação do ACE às ações de Atenção Básica','Complementação parcial, coexistindo com a portaria anterior para diferentes regiões do país','Extinção das regras de incorporação do ACE à atenção básica vigentes desde 2010','Transferência da competência normativa para os estados regulamentarem o ACE em seu território','Apenas uma mudança no valor do incentivo financeiro, sem alterações substantivas nas regras'],g:0,exp:'Gabarito: A. A Portaria GM/MS nº 1.635/2012 revoga a Portaria 1.007/2010 e estabelece novos critérios atualizados para a incorporação do ACE às ações de Atenção Básica, substituindo as disposições anteriores e aprimorando o modelo de integração.'},
        {n:22,q:'Segundo a Portaria 1.635/2012, para que o município receba o incentivo financeiro federal relativo ao ACE na Atenção Básica, é necessário, entre outros requisitos:',ops:['Ter mais de 50.000 habitantes e sede de regional de saúde no município','Ter equipe completa de Saúde da Família implantada em 100% do território municipal','Ter os ACE contratados, com território definido, atividades programadas e supervisão técnica de profissional de nível superior','Ter aprovação prévia do Conselho Estadual de Saúde para cada ACE a ser incorporado','Ter celebrado convênio individual com o Ministério da Saúde para cada agente'],g:2,exp:'Gabarito: C. A Portaria 1.635/2012 estabelece como condições para o repasse do incentivo financeiro que os ACE estejam devidamente contratados pelo município, com território definido, atividades programadas e supervisão técnica de profissional de nível superior da área de saúde.'},
        {n:23,q:'De acordo com a Portaria 1.635/2012, as ações do ACE devem ser registradas:',ops:['Apenas em caderneta física de campo, sem necessidade de sistema informatizado','No sistema de informação da atenção básica definido pelo gestor, para fins de monitoramento e financiamento','No prontuário eletrônico do paciente, integrado ao sistema hospitalar regional','Em boletim semanal enviado diretamente ao Ministério da Saúde','Apenas quando houver caso confirmado de doença endêmica no setor'],g:1,exp:'Gabarito: B. A Portaria 1.635/2012 determina que as ações do ACE devem ser registradas nos sistemas de informação da atenção básica definidos pelo gestor, o que é condição para o monitoramento das atividades e para o repasse do incentivo financeiro federal.'},
        {n:24,q:'Conforme a Portaria 1.635/2012, como deve ser organizado o trabalho do ACE integrado à Atenção Básica?',ops:['Por demanda espontânea da população, sem programação prévia de visitas','Por roteiro definido exclusivamente pela vigilância epidemiológica estadual, sem participação do gestor municipal','Aleatoriamente, conforme orientação diária do supervisor técnico','Apenas em resposta a epidemias formalmente declaradas pelas autoridades sanitárias','Com território definido, setorização em microáreas e programação sistemática de visitas domiciliares'],g:4,exp:'Gabarito: E. A Portaria 1.635/2012 define que o trabalho do ACE deve ser organizado com base em território definido, com setorização em microáreas e programação sistemática de visitas domiciliares, garantindo cobertura regular e planejada do território.'},
        {n:25,q:'De acordo com a Portaria 1.635/2012, qual das seguintes afirmações sobre a supervisão do ACE está CORRETA?',ops:['O ACE é autossuficiente e não necessita de supervisão técnica formal','A supervisão é de responsabilidade exclusiva do médico da UBS de referência do setor','As atividades do ACE devem ser supervisionadas por profissional de nível superior da área de saúde, designado pelo gestor municipal','A supervisão é realizada semestralmente pela equipe estadual de vigilância epidemiológica','O ACE supervisiona a si mesmo por meio de relatórios de autoavaliação enviados ao Ministério'],g:2,exp:'Gabarito: C. A Portaria 1.635/2012 mantém a exigência de supervisão técnica das atividades do ACE por profissional de nível superior da área de saúde, designado pelo gestor municipal, assegurando o respaldo técnico e a qualidade das ações desenvolvidas.'},
        {n:26,q:'Segundo a Portaria 1.635/2012, estão entre as endemias e agravos prioritários para a atuação do ACE:',ops:['Apenas doenças transmitidas por vetor com surto ativo no município','Dengue, doença de Chagas, leishmanioses, malária, esquistossomose, tracoma e outras endêmicas de relevância no território','Apenas dengue e Zika, por serem as de maior impacto epidemiológico nos últimos anos','Doenças crônicas não transmissíveis associadas a condições ambientais adversas','Apenas as doenças de notificação compulsória imediata classificadas como emergência em saúde pública'],g:1,exp:'Gabarito: B. A Portaria 1.635/2012 abrange um conjunto amplo de endemias, incluindo dengue, doença de Chagas, leishmanioses, malária, esquistossomose, tracoma e outras doenças endêmicas de relevância local, mantendo a abrangência já prevista na Portaria 1.007/2010.'},
        {n:27,q:'A Portaria 1.635/2012 enfatiza a integração do ACE com:',ops:['As equipes de Atenção Básica do território, fortalecendo a articulação entre vigilância epidemiológica e atenção primária à saúde','As equipes de regulação e controle dos planos de saúde privados','As secretarias estaduais de meio ambiente para ações de saneamento','As equipes hospitalares de referência para endemias de alta complexidade','Os laboratórios centrais estaduais para coleta e análise de amostras entomológicas'],g:0,exp:'Gabarito: A. A Portaria 1.635/2012 reforça a integração do ACE com as equipes de Atenção Básica do território, fortalecendo a articulação necessária entre a vigilância epidemiológica ambiental e a atenção primária à saúde para uma resposta mais efetiva no controle das endemias.'},
        {n:28,q:'De acordo com a Portaria 1.635/2012, a base da organização territorial do trabalho do ACE é:',ops:['Divisão do município por bairros administrativos definidos pela prefeitura','Divisão por zonas de risco epidemiológico definidas anualmente pelo estado','Setorização em microáreas com responsabilidade territorial definida e visitas domiciliares programadas','Distribuição por tipo de doença, com um ACE responsável por cada endemia em todo o município','Organização por demanda, sem território fixo, conforme necessidade epidemiológica emergencial'],g:2,exp:'Gabarito: C. A Portaria 1.635/2012 define que a organização do trabalho do ACE deve se basear na setorização em microáreas com responsabilidade territorial claramente definida e realização de visitas domiciliares programadas, garantindo cobertura sistemática e planejada do território.'},
        {n:29,q:'Segundo a Portaria 1.635/2012, as ações do ACE integrado à Atenção Básica incluem:',ops:['Apenas ações de controle vetorial químico (fumacê, larvicida e adulticida)','Apenas visitas domiciliares para distribuição de materiais educativos sobre endemias','Diagnóstico laboratorial de doenças endêmicas e emissão de laudos técnicos epidemiológicos','Vigilância entomológica, controle de criadouros, educação em saúde, coleta de dados epidemiológicos e articulação com as equipes de saúde do território','Apenas ações de bloqueio em resposta a casos notificados, sem atividades programadas regulares'],g:3,exp:'Gabarito: D. A Portaria 1.635/2012 prevê que as ações do ACE incluem vigilância entomológica, controle de criadouros, vetores e reservatórios, educação em saúde, coleta de dados epidemiológicos e articulação com as equipes de saúde do território, configurando uma atuação integrada e abrangente.'},
        {n:30,q:'A Portaria 1.635/2012 representa, no contexto da regulamentação do ACE, um avanço em relação à Portaria 1.007/2010 porque:',ops:['Elimina a necessidade de qualificação específica para o ACE, simplificando a contratação municipal','Retira o ACE do âmbito da saúde pública e o transfere para o âmbito da gestão ambiental','Extingue o cargo de ACE e o substitui pelo Agente de Saúde Ambiental com formação de nível médio','Consolida e aprimora o modelo de integração do ACE à Atenção Básica, estabelecendo critérios mais claros para financiamento, organização do trabalho e registro das ações','Transfere integralmente a gestão dos ACE para o governo federal, retirando a autonomia municipal'],g:3,exp:'Gabarito: D. A Portaria 1.635/2012 consolida e aprimora o modelo de integração do ACE à Atenção Básica ao estabelecer critérios mais claros para o financiamento federal, a organização territorial do trabalho, o registro das ações e a supervisão, representando um avanço na regulamentação do ACE no âmbito da atenção primária.'}
      ]}
    ]
  },

  {
    id:'sim-dengue1',titulo:'Dengue e Mosquito Aedes aegypti - Ação Bahia',banca:'Ação Bahia',ano:2025,
    edital:'Curso Preparatório – Ação Bahia',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Dengue (Q1–Q10)',qs:[
        {n:1,q:'A dengue é uma arbovirose causada por vírus da família Flaviviridae. Quantos sorotipos do vírus da dengue são atualmente reconhecidos?',ops:['2 sorotipos (DENV-1 e DENV-2)','3 sorotipos (DENV-1, DENV-2 e DENV-3)','4 sorotipos (DENV-1, DENV-2, DENV-3 e DENV-4)','5 sorotipos (DENV-1 a DENV-5)','6 sorotipos (DENV-1 a DENV-6)'],g:2,exp:'São reconhecidos 4 sorotipos do vírus da dengue: DENV-1, DENV-2, DENV-3 e DENV-4. A imunidade adquirida após a infecção por um sorotipo é permanente apenas para aquele sorotipo, sendo temporária e parcial para os demais, o que permite reinfecções.'},
        {n:2,q:'O período de incubação da dengue no ser humano, ou seja, o tempo entre a picada do mosquito infectado e o aparecimento dos primeiros sintomas, é de:',ops:['1 a 2 dias','3 a 15 dias','16 a 30 dias','31 a 45 dias','Mais de 60 dias'],g:1,exp:'O período de incubação intrínseco da dengue no ser humano é de 3 a 15 dias, geralmente de 4 a 7 dias. Já o período de incubação extrínseco no mosquito (tempo para o vírus se tornar infectante no vetor) é de 8 a 12 dias.'},
        {n:3,q:'A dengue apresenta três fases clínicas em ordem cronológica. Assinale a alternativa que apresenta a sequência CORRETA:',ops:['Crítica, febril e de recuperação','Febril, crítica e de recuperação','Inicial, intermediária e final','Aguda, subaguda e crônica','Prodromal, sintomática e convalescente'],g:1,exp:'As três fases clínicas da dengue, em ordem cronológica, são: (1) Fase Febril – início abrupto com febre alta (39°C–40°C), cefaleia, mialgia e artralgia; (2) Fase Crítica – ocorre com a queda da febre (défervescence), podendo haver sinais de alarme e extravasamento plasmático; (3) Fase de Recuperação – reabsorção dos fluidos e melhora clínica.'},
        {n:4,q:'São sinais de alarme da dengue, que indicam possível evolução para dengue grave, EXCETO:',ops:['Dor abdominal intensa e contínua ou à palpação','Vômitos persistentes','Acúmulo de líquidos (ascite, derrame pleural, derrame pericárdico)','Febre alta acima de 39°C no início da doença','Sangramento de mucosas'],g:3,exp:'Febre alta no início da doença é uma característica da fase febril da dengue, não um sinal de alarme. Os sinais de alarme surgem geralmente com a queda da febre (fase crítica) e incluem: dor abdominal intensa, vômitos persistentes, acúmulo de líquidos, sangramento de mucosas, letargia/irritabilidade, hepatomegalia (>2 cm) e aumento progressivo do hematócrito.'},
        {n:5,q:'A transmissão da dengue para o ser humano ocorre por meio de:',ops:['Contato direto com o doente através de aperto de mão','Gotículas respiratórias expelidas ao tossir ou espirrar','Picada da fêmea do mosquito Aedes aegypti infectada com o vírus','Ingestão de água ou alimentos contaminados','Transfusão sanguínea e transplante de órgãos'],g:2,exp:'A dengue é transmitida exclusivamente pela picada da fêmea do mosquito Aedes aegypti infectada. A fêmea adquire o vírus ao se alimentar do sangue de uma pessoa doente em período virêmico. Não há transmissão por contato interpessoal, via oral ou aérea. A transmissão vertical (mãe-filho) é rara, mas possível.'},
        {n:6,q:'Em relação ao tratamento da dengue, é CORRETO afirmar:',ops:['O ácido acetilsalicílico (AAS/aspirina) é recomendado para aliviar a febre','O ibuprofeno deve ser usado em todos os casos para controle da dor','Não existe tratamento antiviral específico; o tratamento é sintomático e de suporte, com hidratação','Antibióticos devem ser prescritos para prevenir infecções secundárias','A internação hospitalar é obrigatória em todos os casos confirmados'],g:2,exp:'Não existe tratamento antiviral específico para a dengue. O tratamento é sintomático e de suporte, sendo a hidratação oral ou venosa fundamental. AAS e anti-inflamatórios não esteroides (como ibuprofeno) são CONTRAINDICADOS pelo risco de hemorragia e síndrome de Reye. Para febre, usa-se paracetamol ou dipirona. A internação é indicada apenas em casos classificados como grupos C e D.'},
        {n:7,q:'A dengue grave (dengue hemorrágica grave) pode evoluir para choque, sendo caracterizada principalmente por:',ops:['Hipertensão arterial acentuada, bradicardia e sudorese fria','Hipotensão arterial ou pressão diferencial ≤ 20 mmHg, taquicardia e pele fria e úmida','Febre muito alta, convulsões tônico-clônicas e coma profundo','Icterícia, hepatomegalia dolorosa e insuficiência hepática fulminante','Hematúria macroscópica, oligúria e insuficiência renal aguda'],g:1,exp:'O choque na dengue grave é causado pelo extravasamento plasmático intenso. Os sinais clínicos incluem: hipotensão arterial (pressão sistólica < 90 mmHg) ou pressão diferencial ≤ 20 mmHg, taquicardia, pulso rápido e fraco, pele fria, pálida e úmida, agitação ou letargia. É uma emergência médica que exige reposição volêmica imediata.'},
        {n:8,q:'A trombocitopenia (redução das plaquetas) é um achado laboratorial importante na dengue. Assinale a alternativa que indica o valor de plaquetas que configura alerta para dengue grave:',ops:['Plaquetas abaixo de 500.000/mm³','Plaquetas abaixo de 400.000/mm³','Plaquetas abaixo de 200.000/mm³','Plaquetas abaixo de 100.000/mm³','Plaquetas abaixo de 50.000/mm³'],g:3,exp:'A queda de plaquetas abaixo de 100.000/mm³ é considerada um sinal de alarme que indica risco de evolução para dengue grave. A plaquetopenia na dengue é causada pela destruição de plaquetas mediada por anticorpos e pela supressão da medula óssea pelo vírus. Valores abaixo de 20.000/mm³ indicam risco alto de hemorragia espontânea.'},
        {n:9,q:'O Agente de Combate às Endemias (ACE), ao realizar visita domiciliar, encontra um morador com febre há 3 dias, dor de cabeça intensa, dores no corpo e manchas vermelhas na pele. Qual deve ser a conduta prioritária do ACE?',ops:['Ministrar paracetamol ao morador e aguardar a melhora em casa','Orientar o morador a procurar imediatamente uma unidade de saúde para avaliação médica','Realizar o teste rápido de dengue e aguardar o resultado antes de tomar qualquer decisão','Pedir ao morador que descanse e tome bastante líquido, sem necessidade de médico','Notificar o caso à vigilância epidemiológica e encerrar a visita'],g:1,exp:'O ACE não tem atribuição de diagnosticar nem de tratar doenças. Diante de sintomas sugestivos de dengue, a conduta prioritária é orientar o morador a procurar imediatamente uma unidade de saúde para avaliação médica. O ACE também deve realizar a notificação e investigar possíveis focos do vetor no domicílio e peridomicílio.'},
        {n:10,q:'Em relação à vigilância epidemiológica da dengue, a notificação de casos suspeitos é:',ops:['Facultativa, cabendo ao médico decidir se notifica ou não','Obrigatória apenas para casos confirmados laboratorialmente','Obrigatória e imediata para casos suspeitos, independentemente de confirmação laboratorial','Obrigatória somente em períodos de epidemia declarada','Responsabilidade exclusiva dos laboratórios de análises clínicas'],g:2,exp:'A dengue é doença de notificação compulsória no Brasil (Portaria GM/MS nº 217/2023). A notificação deve ser imediata para casos suspeitos, sem aguardar confirmação laboratorial. O profissional de saúde que assistir o paciente, ou o responsável pelo estabelecimento de saúde, é obrigado a notificar o caso à autoridade de saúde pública. A subnotificação compromete o controle epidemiológico.'},
      ]},
      {nome:'Mosquito Aedes aegypti (Q11–Q20)',qs:[
        {n:11,q:'O Aedes aegypti possui características morfológicas que permitem sua identificação visual. Assinale a alternativa que descreve CORRETAMENTE a aparência do mosquito:',ops:['Corpo avermelhado com pernas lisas e sem marcas','Corpo cinza-acastanhado com listras amarelas nas asas','Corpo preto com manchas brancas (prateadas) no tórax e nas pernas, formando um desenho característico','Corpo transparente com manchas azuis no abdome','Corpo marrom-escuro sem manchas, de maior porte que outros mosquitos'],g:2,exp:'O Aedes aegypti é facilmente reconhecido por seu corpo preto com escamas brancas (prateadas), formando um desenho característico semelhante a uma lira no tórax (escudo torácico). As pernas também apresentam anéis brancos e pretos. É um mosquito de pequeno porte (4–7 mm), menor que os mosquitos comuns (Culex).'},
        {n:12,q:'O ciclo de vida do Aedes aegypti compreende quatro fases distintas, em ordem cronológica:',ops:['Ovo → ninfa → larva → adulto','Ovo → larva → pupa → adulto','Larva → ovo → pupa → adulto','Ovo → pupa → ninfa → adulto','Ovo → larva → ninfa → adulto'],g:1,exp:'O Aedes aegypti possui metamorfose completa (holometabolia) com quatro fases: (1) Ovo – depositado acima do nível da água; (2) Larva – aquática, passa por quatro instares; (3) Pupa – aquática, não se alimenta; (4) Adulto – terrestre/aéreo. As três primeiras fases ocorrem na água ou próximo a ela. A duração do ciclo completo varia de 7 a 10 dias em condições ideais (temperatura entre 25°C e 30°C).'},
        {n:13,q:'Em relação à origem geográfica do Aedes aegypti, é CORRETO afirmar que:',ops:['É originário da América do Sul, especialmente do Brasil','É originário da Ásia tropical e foi introduzido nas Américas no século XX','É originário da África e foi introduzido nas Américas pelos navios negreiros durante o período colonial','É originário da Europa e chegou ao Brasil com os colonizadores portugueses','É originário da América Central e se dispersou naturalmente para o restante do continente'],g:2,exp:'O Aedes aegypti é originário da África (região subsaariana), de onde foi inadvertidamente transportado para as Américas durante o tráfico negreiro nos séculos XVI a XIX, dentro de barris d\'água nos navios. No Brasil, foi erradicado pelo programa de Erradicação do Aedes aegypti (1947–1958), mas reinfestou o país a partir da década de 1970, tornando-se endêmico.'},
        {n:14,q:'Sobre os hábitos alimentares do Aedes aegypti, assinale a alternativa CORRETA:',ops:['Tanto machos quanto fêmeas se alimentam de sangue humano para sobreviver','Somente a fêmea pica humanos para se alimentar de sangue, necessário para a maturação dos ovos; o macho se alimenta de néctar','O macho pica humanos e a fêmea se alimenta apenas de sucos vegetais','A fêmea alimenta-se exclusivamente de animais domésticos (cães e gatos)','O mosquito adulto não se alimenta; apenas as larvas necessitam de nutrição'],g:1,exp:'Apenas a fêmea do Aedes aegypti é hematófaga (alimenta-se de sangue), pois necessita de proteínas do sangue para o desenvolvimento e maturação dos ovos. O macho se alimenta exclusivamente de néctar de flores e outros líquidos vegetais açucarados. A fêmea pode se alimentar de sangue de humanos e outros vertebrados. Uma única refeição sanguínea pode ser suficiente para postura de 100 a 200 ovos.'},
        {n:15,q:'Os criadouros preferenciais do Aedes aegypti são recipientes com água limpa e parada. Assinale a alternativa que contém APENAS exemplos de criadouros comuns do mosquito:',ops:['Rios, lagos naturais e riachos com água corrente','Pneus velhos, caixas d\'água, vasos de plantas com pratinhos e piscinas sem tratamento','Esgotos abertos, valas com água suja e fossas sépticas','Solos encharcados, manguezais e pântanos de água salobra','Árvores ocas, tocas de animais e frestas de rochas'],g:1,exp:'O Aedes aegypti é uma espécie sinantrópica, intimamente associada ao ambiente urbano e doméstico. Seus criadouros preferenciais são recipientes artificiais com água limpa e parada: pneus, caixas d\'água, caixas de descarga, vasos com pratinhos, garrafas, latas, brinquedos, calhas entupidas, lonas plásticas, entre outros. Não utiliza água corrente, suja (esgotos) ou salobra.'},
        {n:16,q:'O Aedes aegypti é um mosquito com hábitos predominantemente:',ops:['Noturnos, com maior atividade entre meia-noite e 4h da manhã','Crepusculares e diurnos, com picos de atividade nas primeiras horas da manhã e no final da tarde','Exclusivamente noturnos, atacando apenas após o pôr do sol','Aleatórios, sem padrão definido de horário de atividade','Vespertinos, com atividade concentrada apenas entre 14h e 18h'],g:1,exp:'Diferentemente do mosquito Culex (pernilongo comum), que é noturno, o Aedes aegypti tem hábitos diurnos e crepusculares. Seus picos de atividade são nas primeiras horas da manhã (1–2 horas após o amanhecer) e no final da tarde (algumas horas antes do anoitecer). Esse comportamento facilita o contato com humanos ativos, aumentando a eficiência de transmissão.'},
        {n:17,q:'O raio de voo habitual do Aedes aegypti, em condições normais, é de aproximadamente:',ops:['1 a 5 metros ao redor do local de nascimento','10 a 50 metros ao redor do criadouro','100 a 200 metros ao redor do criadouro','500 a 1.000 metros do local de oviposição','Mais de 5 quilômetros, sem limitação prática de distância'],g:2,exp:'O Aedes aegypti tem raio de voo relativamente curto, em torno de 100 a 200 metros ao longo de toda a vida, o que significa que, ao encontrar um caso de dengue em um domicílio, os focos do vetor estão quase sempre no próprio imóvel ou nos imóveis vizinhos. Essa característica é importante para direcionar as ações de bloqueio vetorial.'},
        {n:18,q:'Além da dengue, o mosquito Aedes aegypti é vetor de outras doenças. Assinale a alternativa que contém APENAS doenças transmitidas pelo Aedes aegypti:',ops:['Dengue, Zika vírus, Chikungunya e Febre Amarela urbana','Dengue, malária, leptospirose e febre tifoide','Dengue, Zika vírus, leishmaniose visceral e esquistossomose','Dengue, Chikungunya, doença de Chagas e toxoplasmose','Dengue, febre amarela silvestre, hantavirose e influenza'],g:0,exp:'O Aedes aegypti é vetor de quatro arboviroses de grande importância no Brasil: Dengue (DENV-1 a DENV-4), Zika vírus (ZIKV), Chikungunya (CHIKV) e Febre Amarela urbana (YFV). A malária é transmitida pelo Anopheles; a leishmaniose pelo flebotomíneo (Lutzomyia); a leptospirose pela bactéria Leptospira via urina de ratos; a doença de Chagas pelo barbeiro (Triatoma).'},
        {n:19,q:'Em relação aos ovos do Aedes aegypti, é CORRETO afirmar que:',ops:['Os ovos são depositados diretamente na água e morrem se ficarem secos por mais de 24 horas','Os ovos precisam de água salgada para eclodir e se desenvolver','Os ovos são depositados nas paredes dos recipientes, próximos à superfície da água, e podem resistir à dessecação por até 450 dias','Os ovos do Aedes aegypti são idênticos aos ovos de outros mosquitos, impossibilitando a identificação da espécie','Os ovos eclodem somente à noite, em resposta à ausência de luz'],g:2,exp:'Os ovos do Aedes aegypti são depositados individualmente nas paredes úmidas dos recipientes, logo acima da linha d\'água, e não diretamente na água. Uma característica fundamental é a resistência à dessecação: os ovos podem permanecer viáveis por até 450 dias em superfícies secas, eclodem quando a água entra em contato com eles novamente. Isso explica por que a simples limpeza sem escovação não elimina os ovos dos recipientes.'},
        {n:20,q:'O método de controle biológico do Aedes aegypti que utiliza a bactéria Bacillus thuringiensis israelensis (BTi) é aplicado com a finalidade de:',ops:['Repelir mosquitos adultos das residências por meio de fumigação','Eliminar larvas nos criadouros, atuando como larvicida biológico sem agredir o meio ambiente','Ser aplicado na pele humana como repelente natural e seguro','Tratar o sistema de esgoto para eliminar pupas e adultos emergentes','Ser utilizado como inseticida residual nas paredes dos domicílios'],g:1,exp:'O Bacillus thuringiensis israelensis (BTi) é uma bactéria esporulante que produz proteínas tóxicas especificamente para larvas de dípteros (como mosquitos). É aplicado nos criadouros como larvicida biológico, sendo eficaz, seletivo e ambientalmente seguro (não causa danos a vertebrados, plantas ou outros insetos não-alvo). É uma alternativa sustentável aos larvicidas químicos, como o temefós (Abate), que caiu em desuso por toxicidade e resistência.'},
      ]},
    ]
  },
  {
    id:'sim-santa-filomena',titulo:'Prova ACE Santa Filomena - Instituto Ação Bahia',banca:'Instituto Ação Bahia',ano:2023,
    edital:'Concurso Público nº 01/2023 – Prefeitura Municipal de Santa Filomena/PI',cargo:'Agente de Combate às Endemias',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q10)',qs:[
        {n:1,texto:'Leia o poema a seguir para responder às questões 01 a 08.\n\nQuem tem medo de dizer não?\n\nA gente vive aprendendo:\nA ser bonitinho, legal,\nA dizer sim pra tudo,\nA ser sempre cordial...\n\nAceitamos tudo nós,\nPois ninguém não escapou,\nDe tanto nos calar e ceder,\nTô sempre engolindo sapo.\n\nCom fígado e espinhaço,\nDe modo bem sabido,\nÀs vezes, do sim quero,\nVou ter que comer sabido.\n\nA gente promete tudo...\nCom vergonha de negar,\nMas já sabe que vai tirar,\nE as coisas vão piorar.\n\nA gente sempre demora\nA entender que, afinal,\nÀs vezes custa um bocado\nDizer simplesmente NÃO.\n\nRuth Rocha',q:'Com base no poema "Quem tem medo de dizer não?", pode-se afirmar que a gente:',ops:['É fácil dizer não na maioria das situações.','Aprende facilmente a negar quando necessário.','Quer dizer não a tudo que lhe é pedido.','Promete tudo com vergonha de negar.','Vive aprendendo a dizer não a tudo.'],g:3,exp:'No poema, a autora afirma: "A gente promete tudo... Com vergonha de negar" — isso reflete a dificuldade de dizer não e a tendência de fazer promessas por não conseguir negar. O poema retrata a dificuldade humana de recusar pedidos por educação excessiva. Gabarito: D.'},
        {n:2,q:'De acordo com o poema, a gente também:',ops:['Já comeu sabiá.','Vive dizendo não.','Comeu apenas espinhaço.','Não é boazinha.','Costuma dizer sim pra tudo.'],g:4,exp:'O poema afirma que "A gente vive aprendendo... A dizer sim pra tudo, A ser sempre cordial". A alternativa E reflete essa ideia de que a gente costuma dizer sim a tudo por educação e vergonha de negar. Gabarito: E.'},
        {n:3,q:'No fragmento do poema "Tô sempre engolindo sapo", a expressão em destaque é um exemplo de:',ops:['Personificação','Paradoxo','Polissíndeto','Ironia','Metáfora'],g:4,exp:'"Engolindo sapo" é uma metáfora: a expressão usa a imagem de engolir um sapo para representar a ideia de ter que aceitar algo desagradável em silêncio, sem poder reclamar. Figuras de linguagem que transferem sentido de forma implícita utilizando comparação subentendida são metáforas. Gabarito: E.'},
        {n:4,q:'Assinale a proposição que completa corretamente as lacunas abaixo:\n"Nunca naquele lugar morava uma velha ______ que ______ muito bem de todos e era considerada ______."',ops:['sabia, sábia; sabia','sábia, sabia; sábia','sabia, sabia; sábia','sábia, sábia; sábia','sabia, sábia; sabia'],g:1,exp:'As palavras são homófonas com significados distintos: "sábia" (adj. = dotada de sabedoria); "sabia" (verbo saber no pretérito imperfeito = tinha conhecimento); "sábia" (adj. = sábia novamente). No contexto: "uma velha sábia [adjetivo] que sabia [verbo] muito bem de todos e era considerada sábia [adjetivo]". Gabarito: B.'},
        {n:5,q:'As palavras que completam as lacunas da questão anterior pertencem, respectivamente, às seguintes classes gramaticais:',ops:['Adjetivo, verbo e adjetivo.','Verbo, adjetivo e verbo.','Substantivo, adjetivo e verbo.','Adjetivo, adjetivo e substantivo.','Verbo, verbo e adjetivo.'],g:0,exp:'"sábia" (1ª lacuna) = adjetivo (qualidade da pessoa: dotada de sabedoria); "sabia" (2ª lacuna) = verbo (pretérito imperfeito do indicativo de "saber"); "sábia" (3ª lacuna) = adjetivo novamente. Portanto: adjetivo, verbo e adjetivo. Gabarito: A.'},
        {n:6,q:'Assinale a alternativa que apresenta vocábulo que, de acordo com o Novo Acordo Ortográfico de 2009, passou a ser escrito SEM acento gráfico diferencial:',ops:['fôrma (recipiente de assar/molde)','pôde (pretérito perfeito de poder)','avó','lá (advérbio de lugar)','alguém'],g:0,exp:'Após o Acordo Ortográfico de 1990 (em vigor no Brasil desde 2009), o acento diferencial em "fôrma" (recipiente/molde) deixou de ser obrigatório na maioria dos usos, pois o contexto geralmente indica o sentido. "Pôde" mantém o acento diferencial; "avó", "lá" e "alguém" mantêm seus acentos normais. Gabarito: A.'},
        {n:7,q:'No título do poema "Quem tem medo de dizer não?", o termo sublinhado "não" exerce a função sintática de:',ops:['Sujeito simples','Adjunto adnominal','Adjunto adverbial','Predicativo do sujeito','Objeto direto'],g:1,exp:'No sintagma "medo de dizer não", o termo "não" funciona como objeto direto do verbo "dizer" (dizer o quê? = não). No contexto da estrutura nominal "medo de dizer não", o "não" exerce função de adjunto adnominal do substantivo "medo" ao integrar o complemento nominal. Gabarito: B (conforme gabarito oficial da banca).'},
        {n:8,q:'De acordo com a questão anterior, o termo "não" no título do poema pertence à seguinte classe gramatical:',ops:['Verbo','Adjetivo','Numeral','Pronome','Substantivo'],g:3,exp:'O termo "não", quando substantivado (como em "dizer não" ou "o não"), pertence à classe dos pronomes/advérbios, mas no uso do poema funciona como substantivo. No gabarito oficial da banca, a resposta é D = Pronome, pelo uso anafórico do termo no contexto do poema. Gabarito: D.'},
        {n:9,q:'Temos abaixo um exemplo de advérbio de INTENSIDADE em:',ops:['O homem falava rapidamente.','O homem falava muito.','O homem falava efetivamente.','O homem trabalhava duro.','O homem falava devagar.'],g:1,exp:'"Muito" é advérbio de intensidade (modifica o grau de um adjetivo, verbo ou outro advérbio, indicando a intensidade da ação). "Rapidamente" e "devagar" são advérbios de modo; "efetivamente" é advérbio de afirmação/modo; "duro" funciona como advérbio de modo. Gabarito: B.'},
        {n:10,q:'Observe a oração: "O homem domina a máquina." Assinale a alternativa que apresenta essa frase corretamente transformada para a voz PASSIVA ANALÍTICA:',ops:['A mulher domina a máquina.','O homem domina a máquina.','A máquina é dominada pelo homem.','A máquina domina os homens.','As máquinas são dominadas pelas mulheres.'],g:2,exp:'Na voz passiva analítica: o objeto direto vira sujeito paciente, o verbo assume a forma "ser + particípio" e o sujeito ativo vira agente da passiva introduzido por "pelo/pela". Assim: "O homem domina a máquina" → sujeito=homem, OD=máquina → "A máquina é dominada pelo homem." Gabarito: C.'},
      ]},
      {nome:'Matemática (Q11–Q20)',qs:[
        {n:11,q:'A soma de um número com o seu quadrado é igual a 56. Calcule esse número.',ops:['7','8','9','10','11'],g:0,exp:'x + x² = 56 → x² + x − 56 = 0. Usando Bhaskara: Δ = 1 + 4×56 = 225 → √225 = 15. x = (−1 + 15)/2 = 7 ou x = (−1 − 15)/2 = −8. Como buscamos número positivo: x = 7. Verificação: 7 + 49 = 56 ✓. Gabarito: A.'},
