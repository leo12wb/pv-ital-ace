        {n:5,texto:"Texto-base (Q1–Q7) — Artigo BBC: 'A inteligência artificial vai acabar com os testes em animais?' Pesquisadores buscam alternativas ao uso de animais. A IA usa resultados globais já existentes, evitando novos testes desnecessários. Joseph Manuppello (EUA): entusiasmado com ChatGPT para extrair e sintetizar dados. Thomas Hartung (Johns Hopkins): 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A IA proporciona 'enorme salto em frente tanto em potência quanto em precisão', criando oportunidades antes inexistentes. Problema: viés de dados — sistema treinado com dados de um grupo étnico pode ser inadequado para outros. Vioxx passou em testes animais mas causou risco cardíaco em humanos; aspirina teria falhado em animais (tóxica para embriões de ratos). Conclusão: em vários casos, a IA já se revelou mais precisa que os testes em animais.",q:"Analise as afirmativas: I. 'mas' pode ser substituído por 'contudo' sem alterar o sentido. II. 'pode' pode ser substituído por 'é' sem alterar o sentido. III. 'subitamente' é advérbio de modo. IV. 'existiam' pode ser substituído por 'haviam' sem alteração gramatical. V. 'artificial' e 'novos' são nomeados pelos substantivos 'Inteligência' e 'medicamentos'. Estão CORRETAS:",ops:["II, III e IV.","II, III e V.","I e III.","I, III e V.","I, III e IV."],g:2,exp:"I: Correta — 'mas' e 'contudo' são conjunções adversativas equivalentes. II: Falsa — 'pode' (possibilidade) ≠ 'é' (certeza). III: Correta — 'subitamente' indica o modo como algo ocorre. IV: Falsa — 'existiam' é intransitivo; 'haviam' exigiria objeto. V: Falsa — 'artificial' e 'novos' são adjetivos. Logo: I e III."},
        {n:6,texto:"Texto-base (Q1–Q7) — Artigo BBC: 'A inteligência artificial vai acabar com os testes em animais?' Pesquisadores buscam alternativas ao uso de animais. A IA usa resultados globais já existentes, evitando novos testes desnecessários. Joseph Manuppello (EUA): entusiasmado com ChatGPT para extrair e sintetizar dados. Thomas Hartung (Johns Hopkins): 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A IA proporciona 'enorme salto em frente tanto em potência quanto em precisão', criando oportunidades antes inexistentes. Problema: viés de dados — sistema treinado com dados de um grupo étnico pode ser inadequado para outros. Vioxx passou em testes animais mas causou risco cardíaco em humanos; aspirina teria falhado em animais (tóxica para embriões de ratos). Conclusão: em vários casos, a IA já se revelou mais precisa que os testes em animais.",q:"Qual reescrita de 'Isso porque a tecnologia utiliza todos os resultados globais de testes em animais existentes e disponíveis e evita a necessidade de novos testes desnecessários' mantém o mesmo sentido e coesão?",ops:["...existentes e disponíveis, mesmo porque evita a necessidade de novos testes desnecessários.","...existentes e disponíveis para que os testes desnecessários sejam necessários.","...de utilização de animais em testes de resultado global provoca a falta de necessidade de novos testes desnecessários.","...de animais existentes em testes disponíveis a fim de evitar novos testes desnecessários.","...existentes e disponíveis, evitando novos testes desnecessários."],g:4,exp:"A opção E substitui 'e evita' pela forma gerundiva 'evitando', mantendo a relação de consequência sem alterar o sentido. As demais introduzem contradições, deslocamentos ou sentidos diferentes do original."},
        {n:7,texto:"Texto-base (Q1–Q7) — Artigo BBC: 'A inteligência artificial vai acabar com os testes em animais?' Pesquisadores buscam alternativas ao uso de animais. A IA usa resultados globais já existentes, evitando novos testes desnecessários. Joseph Manuppello (EUA): entusiasmado com ChatGPT para extrair e sintetizar dados. Thomas Hartung (Johns Hopkins): 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A IA proporciona 'enorme salto em frente tanto em potência quanto em precisão', criando oportunidades antes inexistentes. Problema: viés de dados — sistema treinado com dados de um grupo étnico pode ser inadequado para outros. Vioxx passou em testes animais mas causou risco cardíaco em humanos; aspirina teria falhado em animais (tóxica para embriões de ratos). Conclusão: em vários casos, a IA já se revelou mais precisa que os testes em animais.",q:"Em: 'A IA é tão boa quanto um ser humano, ou melhor, na extração de informações de artigos científicos.' A expressão 'ou melhor' foi empregada para:",ops:["Confirmar o que foi dito anteriormente.","Mostrar uma hipótese sobre a afirmação posterior.","Opor uma ideia que foi dita anteriormente.","Retificar a afirmação anterior.","Indicar uma comparação entre a IA e o homem."],g:3,exp:"'Ou melhor' é expressão retificativa — o autor reformula e corrige o que foi dito antes, ampliando: não apenas tão boa quanto, mas potencialmente superior ao ser humano na extração de informações."},
        {n:8,q:"Locução adjetiva substituída pelo respectivo adjetivo, EXCETO:",ops:["Olhos de águia = olhos aquilinos.","Pão com manteiga = pão amanteigado.","Sonho de ouro = sonho áureo.","Prejuízo sem recuperação = prejuízo recuperável.","Raios de sol = raios solares."],g:3,exp:"'Recuperável' significa que pode ser recuperado — o oposto do sentido pretendido. O correto para 'sem recuperação' seria 'irrecuperável'. Todas as outras substituições estão corretas."},
        {n:9,q:"Na oração 'No local moravam seis almas', há uma figura de linguagem relacionada à mudança de significado por proximidade de ideias, denominada:",ops:["Braquilogia.","Metáfora.","Metonímia.","Catacrese.","Barbarismo."],g:2,exp:"'Almas' é usada no lugar de 'pessoas' — trata-se de metonímia, figura de linguagem que substitui um termo por outro que tem relação de contiguidade ou proximidade (parte pelo todo, causa pelo efeito, etc.)."},
        {n:10,q:"Complete o texto: 'Na manhã do dia 2 de agosto de 2022, policiais e fiscais guatemaltecos [...] ........ 19 pessoas em ...... operações surpresa. As buscas ...... uma área montanhosa. Entre os detidos, ...... quatro homens procurados pelos EUA, ...... de serem membros da organização e ...... pela morte de Marta Raymundo. Ela morreu em ...... sub-humanas.' Com concordância adequada:",ops:["Prenderam, diversas, inclui, haviam, acusado, responsável, condições.","Prenderão, diversa, inclue, havia, acusado, responsáveis, condição.","Prenderam, diversas, incluirão, haviam, acusado, responsável, condição.","Prenderam, diversas, incluíram, havia, acusados, responsáveis, condições.","Prenderão, diversa, incluem, havia, acusados, responsável, condição."],g:3,exp:"'Prenderam' (passado); 'diversas operações' (plural feminino); 'incluíram' (passado); 'havia' (singular); 'acusados' (plural — quatro homens); 'responsáveis' (plural); 'condições' (plural)."},
        {n:11,q:"Preencha as lacunas com vocábulos corretamente grafados: 'Além de uma ......: conheça as ...... e como observá-las. [...] de repente, recebeu um sinal que fez com que todas as suas dúvidas ......? [...] uma conversa que ...... a resposta que estávamos buscando ...... algum tempo [...] que ...... as nossas ......'",ops:["Coinsidência, sincronisidades, derepente, desaparecessem, através, traz, a, chaqualha, convicsões.","Coinsidência, sincronisidades, de repente, desaparecessem, através, tras, a, chacoalha, convicções.","Coincidência, sincronisidades, de repente, dezaparecessem, atravéz, traz, a, chaqualha, convicsões.","Coincidênsia, sincronisidades, derepente, desaparecesem, através, tras, a, chaqualha, convicções.","Coincidência, sincronicidades, de repente, desaparecessem, através, traz, há, chacoalha, convicções."],g:4,exp:"Grafia correta: 'coincidência' (não coinsidência); 'sincronicidades' (não sincronisidades); 'de repente' (separado); 'desaparecessem' (-essem); 'através'; 'traz' (verbo trazer); 'há' (indica tempo decorrido); 'chacoalha'; 'convicções'."},
        {n:12,q:"Regência verbal — a expressão destacada está INCORRETA em:",ops:["Ela se referiu à doença com um nome familiar: dengue.","A terapia psicodélica pode curar doenças mentais.","O vírus da dengue pertence a um grupo de vírus hemorrágicos.","A rainha da Espanha, María Luisa de Parma, contraiu à doença.","Foram relatados à OMS mais de 7,6 milhões de casos de dengue."],g:3,exp:"'Contrair' é verbo transitivo direto — não exige preposição. O correto é 'contraiu a doença' (sem crase). A crase em 'contraiu à doença' é incorreta pois não há fusão válida entre artigo e preposição nesse contexto."},
        {n:13,q:"'Texto curto com narrador que conta uma história em torno de um enredo; poucos personagens e locais; estrutura com apresentação, desenvolvimento, clímax e desfecho.' Que gênero textual é descrito?",ops:["Novela.","Romance.","Conto.","Crônica.","Poema."],g:2,exp:"O conto é gênero narrativo curto, com poucos personagens, enredo único e estrutura compacta (apresentação, desenvolvimento, clímax, desfecho). Difere do romance (longo, múltiplos enredos) e da novela (intermediário em extensão)."},
        {n:14,q:"Plural dos elementos compostos — uma forma está INCORRETA gramaticalmente (ordem gramatical do plural). Qual?",ops:["Decreto-leis.","Vice-reis.","Tique-taques.","Furta-cores.","Cabras-cegas."],g:0,exp:"'Decreto-leis' está incorreto. O plural correto é 'decretos-leis' — em compostos formados por dois substantivos, ambos vão para o plural. 'Vice-reis', 'tique-taques', 'furta-cores' e 'cabras-cegas' estão corretos."},
        {n:15,q:"Identifique a alternativa com vocábulo NÃO corretamente acentuado pelo novo acordo ortográfico:",ops:["'A linguagem escrita, histórica e culturalmente construída para se situar na relação entre os olhos e a mente de quem lê e de quem escreve.'","'Quando você aceita se relacionar com alguém, deve respeitá-la e amá-la do jeito que ela é.'","'Assinatura e rubrica precisam ser registradas em cartório?'","'Alcateia é leitura obrigatória para todas que estão determinadas a ensinar nossas crianças que não existem limites.'","'Eles lêem, mas não compreendem: onde está o equívoco?'"],g:4,exp:"'Lêem' está incorreto pelo novo acordo ortográfico (2009). O acento diferencial foi eliminado de verbos como 'leem', 'creem', 'veem', 'deem' (3ª pessoa plural). O correto é 'leem' (sem acento)."},
      ]},
      {nome:'Raciocínio Lógico-Matemático (Q16–Q20)',qs:[
        {n:16,q:"Juliana quer construir uma piscina retangular de 3m de largura por 5m de comprimento. O volume máximo é 22.500 litros. Qual a quantidade de cerâmica para revestir paredes e fundo?",ops:["Serão usados 23 m² de cerâmica.","Serão usados 17 m² de cerâmica.","Serão usados 39 m² de cerâmica.","Serão usados 45 m² de cerâmica.","Serão usados 28 m² de cerâmica."],g:2,exp:"Volume = 22.500 L = 22,5 m³. Profundidade = 22,5 ÷ (3×5) = 1,5 m. Fundo: 3×5 = 15 m². Paredes: 2×(3×1,5) + 2×(5×1,5) = 9 + 15 = 24 m². Total: 15 + 24 = 39 m²."},
        {n:17,q:"p: O cão é manso. q: O cão morde. Qual alternativa representa a disjunção (p v q)?",ops:["O cão é manso ou morde.","O cão é manso e morde.","O cão é manso, se e somente se morde.","Se o cão é manso e não morde.","Se o cão é manso, então morde."],g:0,exp:"Disjunção (p v q) é 'p OU q' — verdadeira quando pelo menos uma das proposições é verdadeira. 'O cão é manso ou morde' é a tradução correta da disjunção."},
        {n:18,q:"João: 10 mesas + 15 cadeiras em 5 dias, 4 funcionários, 9h/dia. Encomenda: 20 mesas + 30 cadeiras. Contratou mais 2 funcionários (total 6), passaram a trabalhar 10h/dia. Quantos dias para entregar?",ops:["De 7 dias.","De 21 dias.","De 15 dias.","De 12 dias.","De 4 dias."],g:3,exp:"Capacidade original: 4 func × 9h × 5 dias = 180 h·func para a encomenda original. Nova encomenda = 2× o trabalho original. Nova capacidade: 6 func × 10h = 60 h·func/dia. Pelo gabarito oficial: 12 dias (D)."},
        {n:19,q:"André fez 3 provas com pesos 2, 3 e 5 e tirou, respectivamente, 6, 7 e 5 pontos. Qual foi a média ponderada?",ops:["A média foi 6,2.","A média foi 7,1.","A média foi 4,9.","A média foi 5,8.","A média foi 9,4."],g:3,exp:"Média ponderada = (2×6 + 3×7 + 5×5) ÷ (2+3+5) = (12 + 21 + 25) ÷ 10 = 58 ÷ 10 = 5,8."},
        {n:20,q:"Bianca: pacote de 10 pratos acrílico = R$25,00; pacote de 50 copos = R$56,00. Comprou 18 pacotes no total e pagou R$543,00. Quantos pacotes de cada?",ops:["15 pacotes de pratos e 3 de copos.","16 pacotes de pratos e 2 de copos.","12 pacotes de pratos e 6 de copos.","8 pacotes de pratos e 10 de copos.","14 pacotes de pratos e 4 de copos."],g:0,exp:"Sistema: p + c = 18 e 25p + 56c = 543. Substituindo p = 18−c: 25(18−c) + 56c = 543 → 450 + 31c = 543 → c = 3; p = 15. Verificação: 25×15 + 56×3 = 375 + 168 = 543. ✓"},
      ]},
      {nome:'Informática (Q21–Q25)',qs:[
        {n:21,q:"É um conjunto de circuitos eletrônicos montados num tablete de silício (tecnologia VLSI), com dois chips: ponte norte e ponte sul. Marque a alternativa CORRETA que corresponde a esse recurso na Placa Mãe. [QUESTÃO ANULADA pela banca]",ops:["Chipset.","Memória RAM.","HD.","BIOS.","Processador."],g:0,exp:"QUESTÃO ANULADA pela banca IDCAP. A descrição corresponde ao Chipset (A) — conjunto de circuitos VLSI com arquitetura norte/south bridge. Todos os candidatos receberam ponto nesta questão."},
        {n:22,q:"No Excel, quando a largura da coluna é insuficiente para mostrar um número, quais caracteres são exibidos na célula?",ops:["%%%%.","####.","$$$$.","&&&&.","*****."],g:1,exp:"Quando a coluna é estreita demais para exibir um número, o Excel preenche a célula com sinais '####'. A solução é aumentar a largura da coluna ou diminuir o tamanho da fonte."},
        {n:23,q:"Política de segurança que define regras sobre cópias de segurança: tipo de mídia, período de retenção e frequência de execução:",ops:["Política da disponibilidade.","Política de privacidade.","Política de confidencialidade.","Política de backup.","Política de senhas."],g:3,exp:"A política de backup define as diretrizes para realização de cópias de segurança: tipo de mídia (fita, disco, nuvem), periodicidade (diário, semanal), período de retenção e procedimentos de recuperação."},
        {n:24,q:"São espaços alocados pela UCP geralmente nos discos rígidos, tratados como páginas de memória principal, porém bem mais lentos por dependerem de leitura e gravação em discos. Corresponde a:",ops:["Memória expandida.","Memória estendida.","Memória cache.","Memória primária.","Memória virtual."],g:4,exp:"A memória virtual usa espaço do disco rígido como extensão da RAM, sendo muito mais lenta. Permite executar programas maiores que a RAM disponível. Memória cache é a mais rápida; RAM é a memória primária."},
        {n:25,q:"Recurso do Excel que, ao digitar texto repetido em diferentes partes da planilha, mostra automaticamente o texto completo em destaque preto. Para aceitar: Enter ou Tab:",ops:["AutoSoma.","Formatação Condicional.","Ortografia e Gramática.","Suplementos.","AutoConclusão."],g:4,exp:"AutoConclusão (AutoComplete) no Excel sugere automaticamente o texto completo quando o início coincide com entradas anteriores da coluna. Para aceitar: Enter ou Tab. Para ignorar: continuar digitando."},
      ]},
      {nome:'Conhecimentos Específicos (Q41–Q60)',qs:[
        {n:41,q:"Sobre territorialização na saúde pública, marque V ou F: (1) A territorialização compreende a demarcação geográfica não dependendo da dinâmica social, cultural e econômica. (2) A caracterização do território engloba dados demográficos, relevo, rios, serviços de saúde, condições socioeconômicas, ambientais, sanitárias e culturais. (3) A área de atuação da UBS é formada por microáreas com no máximo 2.000 pessoas. Sequência correta:",ops:["F − V − F.","V − F − F.","F − V − V.","V − V − F.","F − F − V."],g:0,exp:"(1) F — a territorialização DEPENDE da dinâmica social, cultural e econômica. (2) V — caracterização multidimensional do território. (3) F — a microárea atende no máximo 750 pessoas (não 2.000). Sequência: F−V−F."},
        {n:42,q:"Sobre a esporotricose humana (micose causada por Sporothrix), marque a alternativa INCORRETA:",ops:["É transmitida unicamente pelo sangue contaminado.","Em casos graves (pulmões), podem surgir tosse, falta de ar, dor ao respirar e febre.","A esporotricose extracutânea ocorre quando a doença se espalha para outros locais como ossos e mucosas, sem comprometimento da pele.","A doença pode afetar tanto humanos quanto animais.","A esporotricose cutânea caracteriza-se por lesões localizadas principalmente nas mãos e braços."],g:0,exp:"A é INCORRETA: a esporotricose NÃO é transmitida pelo sangue. A transmissão ocorre por inoculação traumática (picadas de espinhos, arranhões de animais, especialmente gatos) ou inalação de conídios. Gatos domésticos são o principal reservatório."},
        {n:43,q:"Sobre a Leishmaniose (doença infecciosa, não contagiosa, evolução longa), marque a CORRETA:",ops:["A leishmaniose visceral caracteriza-se por feridas na pele nas partes descobertas do corpo.","É transmitida pela picada de fêmeas do carrapato estrela.","A leishmaniose tegumentar é sistêmica, acometendo fígado, baço e medula óssea.","A suscetibilidade de infecção por LT é universal; infecção e doença não conferem imunidade.","É causada por bactéria do gênero Leishmania."],g:3,exp:"D é a correta: suscetibilidade à LT é universal e infecção não confere imunidade permanente. A: incorreta (descreveu LT, não visceral). B: incorreta (vetor é o flebotomíneo). C: incorreta (descreveu a visceral). E: incorreta (protozoário, não bactéria)."},
        {n:44,q:"Acerca da Portaria 2.436/2017 (Política Nacional de Atenção Básica), marque a CORRETA:",ops:["A Atenção Básica será ofertada gratuitamente somente às pessoas maiores de 60 anos ou portadoras de necessidades especiais.","As UBS nunca devem ser consideradas espaços de educação, formação, pesquisa e inovação.","A territorialização e a resolutividade não são diretrizes do SUS e da RAS.","A PNAB exclui a Saúde da Família de suas estratégias para a Atenção Básica.","A Atenção Básica será a principal porta de entrada e centro de comunicação da RAS, coordenadora do cuidado."],g:4,exp:"E é a correta: a Portaria 2.436/2017 define a Atenção Básica como principal porta de entrada e centro de comunicação da RAS, coordenadora do cuidado. As demais contradizem os princípios da PNAB."},
        {n:45,q:"Sobre a Hantavirose (zoonose viral aguda e progressiva), marque a alternativa INCORRETA:",ops:["Os hantavírus possuem como reservatórios naturais alguns roedores silvestres.","A prevenção baseia-se em medidas que impeçam o contato do homem com roedores silvestres e suas excretas.","A infecção humana ocorre mais frequentemente pela inalação de aerossóis formados da urina, fezes e saliva de roedores infectados.","O período de incubação é de 24 horas.","A Hantavirose é causada por um vírus RNA."],g:3,exp:"D é INCORRETA: o período de incubação da Hantavirose é de 1 a 5 semanas (média 2 a 4 semanas), NÃO de 24 horas. As demais estão corretas: reservatórios são roedores silvestres, transmissão por aerossóis, e é causada por vírus RNA (Hantaviridae)."},
        {n:46,q:"Sobre a leptospirose (doença infecciosa febril aguda, letalidade de até 40% nos casos graves), marque a CORRETA:",ops:["É causada por um vírus.","O diagnóstico específico é feito exclusivamente por exame indireto (anticorpos).","A única forma de controle de roedores é pelo uso de raticidas, podendo ser feito por qualquer pessoa.","É transmitida pela exposição direta ou indireta à urina de animais, principalmente ratos.","O período de incubação é sempre de 3 dias."],g:3,exp:"D é a correta: leptospirose é transmitida pela exposição (direta ou indireta) à urina de animais infectados, especialmente ratos — principalmente em enchentes. É causada pela bactéria Leptospira (não vírus). Diagnóstico pode ser direto ou indireto."},

        {n:48,q:"Sobre a Lei Municipal nº 1.722/2010 (Conselho Municipal de Saúde de Vitória da Conquista), marque a CORRETA:",ops:["O Conselho reunir-se-á ordinariamente de 90 em 90 dias e extraordinariamente quando necessário.","As reuniões ocorrerão com quórum de metade mais três dos integrantes e paridade de 40% de usuários.","O Conselho não deve conter representantes da Secretaria Estadual de Saúde (DIRES).","O Conselho Municipal de Saúde tem autonomia administrativa, dotação orçamentária e espaço físico próprios.","Não compete ao Conselho atuar na formulação e controle da execução da política de saúde."],g:3,exp:"D é a correta: a Lei 1.722/2010 garante ao Conselho Municipal de Saúde autonomia administrativa, dotação orçamentária própria e espaço físico. Essa autonomia é essencial para o controle social do SUS."},
        {n:49,q:"Sobre a Chikungunya (arbovirose confirmada no Brasil em 2014 no Amapá e Bahia), é CORRETO afirmar que: [QUESTÃO ANULADA pela banca]",ops:["É causada por um parasita.","O diagnóstico tem componentes clínicos e laboratoriais e deve ser feito por um médico.","A CHIKV foi introduzida no continente americano em 2003 e ocasionou epidemia na América Central.","A doença é transmitida pela picada de fêmeas infectadas do gênero Aedes.","É uma doença que apresenta como único sintoma a febre alta."],g:3,exp:"QUESTÃO ANULADA pela banca IDCAP. As alternativas B e D estariam corretas, gerando ambiguidade. D: Chikungunya é transmitida por fêmeas do gênero Aedes (Ae. aegypti e Ae. albopictus). Todos os candidatos receberam ponto nesta questão."},
        {n:50,q:"Sobre a Zika Vírus (arbovirose causada pelo ZIKV), marque a CORRETA:",ops:["Existe vacina que protege contra o Zika Vírus no SUS.","É transmitida pelo contato direto com o doente contaminado.","Toda infecção pelo ZIKV é assintomática.","A gestante infectada, sintomática ou assintomática, pode transmitir o vírus ao feto durante todo o período gestacional.","O diagnóstico é exclusivamente clínico, feito por enfermeiro, sem exames laboratoriais."],g:3,exp:"D é a correta: a gestante infectada pelo ZIKV pode transmitir o vírus ao feto em qualquer fase da gestação, com maior risco de microcefalia no 1º trimestre. Não há vacina no SUS. Diagnóstico inclui sorologia e biologia molecular."},
        {n:51,q:"Sobre a febre maculosa (doença infecciosa febril aguda, gravidade variável com alta letalidade nas formas graves), marque a CORRETA:",ops:["É transmitida pela picada do mosquito palha.","Não existe tratamento para a doença.","É totalmente assintomática em todos os casos.","É causada por um vírus.","A prevenção é baseada no impedimento do contato com o vetor."],g:4,exp:"E é a correta: prevenção da febre maculosa baseia-se no impedimento do contato com o vetor (carrapato do gênero Amblyomma). A: incorreta (mosquito-palha é vetor de leishmaniose). D: incorreta (causada pela bactéria Rickettsia rickettsii). Tem tratamento (doxiciclina)."},
        {n:52,q:"Sobre a doença de Chagas (Tripanossomíase americana), marque a CORRETA:",ops:["O período de incubação é de exatamente dois dias.","A única forma de transmissão é a via oral.","Não existe tratamento nem cura para a doença.","É causada pelo vírus Trypanosoma cruzi.","Para confirmação laboratorial é necessária a realização de exame de sangue (parasitológico e/ou sorológico, a depender da fase da doença)."],g:4,exp:"E é a correta: diagnóstico laboratorial por exame parasitológico (fase aguda) e sorológico (fase crônica). É causada pelo protozoário (não vírus) Trypanosoma cruzi. Tem tratamento (benznidazol, nifurtimox). Transmissão pode ocorrer por múltiplas vias."},
        {n:53,q:"Sobre prevenção e primeiros socorros com animais peçonhentos: I. Envenenamento por escorpião trata-se com Soro Antiescorpiônico ou Antiaracnídico, em ambiente hospitalar. II. O Brasil não é produtor do Soro Antilonômico (SALon) para Lonomia. III. Picadas de abelha variam pela quantidade de veneno e susceptibilidade alérgica. É correto: [QUESTÃO ANULADA pela banca]",ops:["I e III apenas.","I apenas.","I e II apenas.","II apenas.","III apenas."],g:0,exp:"QUESTÃO ANULADA pela banca IDCAP. I e III estão corretas. I: correta — soros antiescorpiônico/antiaracnídico em ambiente hospitalar. II: incorreta — o Brasil produz o SALon pelo Instituto Butantan. III: correta — intoxicação varia pelo veneno e susceptibilidade. Todos os candidatos receberam ponto."},
        {n:54,q:"Todas as alternativas apresentam atividades típicas do ACE, EXCETO:",ops:["Mobilização da comunidade para medidas de manejo ambiental e controle de vetores.","Realização de visitas domiciliares regulares para acolhimento e acompanhamento da gestante no pré-natal, parto e puerpério.","Desenvolvimento de ações educativas relativas à prevenção e controle de doenças e agravos.","Cadastramento e atualização da base de imóveis para planejamento de estratégias de prevenção.","Realização de ações de campo para pesquisa entomológica, malacológica e coleta de reservatórios."],g:1,exp:"B NÃO é atribuição do ACE, mas do Agente Comunitário de Saúde (ACS). O ACE foca no controle de vetores, zoonoses e endemias. O ACS realiza o acompanhamento familiar incluindo pré-natal, parto e puerpério. A, C, D e E são atribuições específicas do ACE conforme a Lei 11.350/2006."},
        {n:55,q:"Sobre a malária (impaludismo, paludismo), marque a CORRETA:",ops:["Indivíduos com vários episódios de malária podem atingir imunidade parcial, com poucos ou nenhum sintoma ao contrair a doença.","É uma doença sem cura nem tratamento eficaz.","A doença é causada por uma bactéria do gênero Plasmodium.","No Brasil, todos os casos de malária acontecem na região amazônica.","É transmitida pelo contato direto com o doente."],g:0,exp:"A é a correta: em regiões endêmicas, indivíduos com repetidas infecções desenvolvem imunidade parcial (premunição), tornando a doença menos sintomática. B: tem tratamento. C: Plasmodium é protozoário. D: há casos fora da Amazônia. E: transmissão é por picada do Anopheles infectado."},
        {n:56,q:"Sobre a raiva (doença infecciosa aguda grave que acomete mamíferos, inclusive o homem), marque a CORRETA:",ops:["Apresenta letalidade abaixo de 5%.","No ciclo urbano é transmitida exclusivamente pelo cão.","É causada por uma bactéria.","Caracteriza-se como uma dermatite progressiva e aguda.","A raiva é transmitida ao homem pela saliva de animais infectados, principalmente por meio da mordedura."],g:4,exp:"E é a correta: raiva transmitida pela saliva de animais infectados, principalmente por mordedura. A: letalidade é praticamente 100% após início dos sintomas. B: no ciclo urbano, cão e gato são os principais (não únicos). C: causada pelo vírus Rhabdoviridae (Lyssavirus). D: não é dermatite."},
        {n:57,q:"Sobre a biologia do Aedes aegypti, marque a CORRETA:",ops:["A larva é composta de cefalotórax e abdômen.","A fase larvária é o período de alimentação e crescimento.","A pupa representa a fase reprodutora do inseto.","No momento da postura os ovos são pretos, mas rapidamente adquirem cor verde brilhante.","As larvas possuem cinco estágios evolutivos."],g:1,exp:"B é a correta: a fase larvária (L1 a L4) é o período de alimentação ativa e crescimento do mosquito. A: incorreta — a larva tem cabeça, tórax e abdômen distintos. C: incorreta — a pupa é fase de metamorfose (não reproduz). D: incorreta — ovos são brancos ao ser postos e escurecem para preto. E: incorreta — 4 estágios larvários."},
        {n:58,q:"Sobre a febre amarela (doença febril aguda com alta letalidade nas formas graves), marque a CORRETA:",ops:["No ciclo silvestre, a transmissão ocorre exclusivamente por mosquitos Aedes aegypti infectados.","A vacina contra febre amarela só deve ser aplicada em crianças com menos de cinco meses de idade.","A doença é causada por uma bactéria.","É uma doença de notificação compulsória imediata.","No Brasil o ciclo da doença é unicamente urbano, com transmissão por Haemagogus e Sabethes."],g:3,exp:"D é a correta: febre amarela é doença de notificação compulsória IMEDIATA (Portaria 204/2016). A: no ciclo silvestre, vetores são Haemagogus e Sabethes (não Aedes aegypti). B: vacina contraindicada para menores de 6 meses; recomendada a partir de 9 meses. C: causada por vírus RNA."},

// ===================== RESUMO =====================
function renderResumo(){
  const el = document.getElementById('sec-resumo');
  el.innerHTML = disciplinas.map((d,i)=>`
    <div class="disc-bloco">
      <div class="disc-header" onclick="toggleDisc(${i},this)" style="background:${d.cor}">
        ${d.nome} <span class="arrow">▼</span>
      </div>
      <div class="disc-topicos" id="disc-${i}">
        ${d.topicos.map(t=>`
          <div class="topico-item">
            <div style="flex:1">
              <div class="topico-nome">${t.t}</div>
              <div class="topico-desc">${t.d}</div>
            </div>
            <span class="freq-badge freq-${t.freq}">${t.freq.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleDisc(i,hdr){
  const el = document.getElementById('disc-'+i);
  const open = el.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

// ===================== FLASHCARDS =====================
function buildFlashDados(){
  flashDados=[];
  disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      flashDados.push({disc:d.nome, termo:t.t, def:t.d, freq:t.freq});
    });
  });
  flashDeck=[...flashDados];
}

function renderFlashFiltro(){
  const sel = document.getElementById('flash-filtro');
  disciplinas.forEach(d=>{
    const op = document.createElement('option');
    op.value = d.nome;
    op.textContent = d.nome.replace(/^.{2}/,'');
    sel.appendChild(op);
  });
}

function filtrarFlash(){
  const v = document.getElementById('flash-filtro').value;
  flashDeck = v==='todos' ? [...flashDados] : flashDados.filter(f=>f.disc===v);
  flashIdx=0;
  renderFlash();
}

function shuffleFlash(){
  for(let i=flashDeck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];
  }
  flashIdx=0;
  document.getElementById('flash-inner').classList.remove('virado');
  renderFlash();
  toast('Embaralhado!');
}

function renderFlash(){
  if(!flashDeck.length) return;
  const c = flashDeck[flashIdx];
  document.getElementById('flash-termo').textContent = c.termo;
  document.getElementById('flash-def').textContent = c.def;
  document.getElementById('flash-prog').textContent = `${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-inner').classList.remove('virado');
}

function virarCard(){
  document.getElementById('flash-inner').classList.toggle('virado');
}

function navFlash(d){
  flashIdx = (flashIdx+d+flashDeck.length)%flashDeck.length;
  renderFlash();
}

function falarCard(){
  const virado = document.getElementById('flash-inner').classList.contains('virado');
  const txt = virado ? document.getElementById('flash-def').textContent : document.getElementById('flash-termo').textContent;
  falar(txt);
}

function falar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR'; u.rate=_speechRate;
  speechSynthesis.speak(u);
}

// ===================== MAPA =====================
function renderMapa(){
  const filtros = document.getElementById('mapa-filtros');
  const grid = document.getElementById('mapa-grid');
  const nomes = ['Todos',...disciplinas.map(d=>d.nome)];
  filtros.innerHTML = nomes.map((n,i)=>`<button class="${i===0?'ativo':''}" onclick="filtrarMapa(this,'${n}')">${n}</button>`).join('');
  _renderMapaGrid('Todos');
}

function filtrarMapa(btn,disc){
  document.querySelectorAll('.mapa-filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  _renderMapaGrid(disc);
}

function _renderMapaGrid(disc){
  const grid = document.getElementById('mapa-grid');
  let items=[];
  disciplinas.forEach(d=>{
    if(disc==='Todos'||d.nome===disc){
      d.topicos.forEach(t=>items.push({disc:d.nome,t}));
    }
  });
  grid.innerHTML = items.map(({disc,t})=>`
    <div class="mapa-card" onclick="toast('${t.t}')">
      <div class="mc-disc">${disc.replace(/^.{2}/,'')}</div>
      <div class="mc-nome">${t.t}</div>
      <span class="freq-badge freq-${t.freq} mc-freq">${t.freq.toUpperCase()}</span>
    </div>
  `).join('');
}

function iniciarQuiz(){
  const filtro = document.getElementById('quiz-filtro').value;
  let banco = filtro==='todos' ? [...questoes] : questoes.filter(q=>q.disc===filtro);
  for(let i=banco.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[banco[i],banco[j]]=[banco[j],banco[i]];}
  quizPerguntas = banco.slice(0,Math.min(10,banco.length));
  quizIdx=0; quizCertas=0; quizErradas=0; respondeu=false;
  document.getElementById('quiz-placar').classList.remove('show');
  document.getElementById('quiz-box').style.display='block';
  renderQuestao();
}

function renderQuestao(){
  if(quizIdx>=quizPerguntas.length){encerrarQuiz();return;}
  respondeu=false;
  const q = quizPerguntas[quizIdx];
  document.getElementById('q-disc').textContent = q.disc;
  const temaEl = document.getElementById('q-tema');
  temaEl.textContent = q.tema || '';
  temaEl.style.display = q.tema ? '' : 'none';
  document.getElementById('q-num').textContent = `${quizIdx+1}/${quizPerguntas.length}`;
  document.getElementById('q-pergunta').textContent = q.p;
  document.getElementById('q-exp').classList.remove('show');
  document.getElementById('btn-prox-q').style.display='none';
  const ops = document.getElementById('q-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="quiz-op" onclick="verificarResposta(${i})">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span> ${o}
    </button>
  `).join('');
  const vid = q.tema ? (videoMap[q.tema] || '') : '';
  const wrap = document.getElementById('q-video-wrap');
  if(vid){
    wrap.style.display = 'block';
    wrap.innerHTML = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${vid}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="border-radius:12px;display:block;margin-top:10px"></iframe>`;
  } else {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
  }
}

function verificarResposta(idx){
  if(respondeu) return;
  respondeu=true;
  const q = quizPerguntas[quizIdx];
  const btns = document.querySelectorAll('.quiz-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  if(idx===q.c) quizCertas++; else quizErradas++;
  salvarRespostaQuiz(idx===q.c);
  document.getElementById('q-exp').textContent = q.exp;
  document.getElementById('q-exp').classList.add('show');
  document.getElementById('btn-prox-q').style.display='inline-block';
}

function proximaQuestao(){
  quizIdx++;
  renderQuestao();
}

function encerrarQuiz(){
  document.getElementById('quiz-box').style.display='none';
  const placar = document.getElementById('quiz-placar');
  placar.classList.add('show');
  const total = quizCertas+quizErradas;
  document.getElementById('placar-num').textContent = `${quizCertas}/${total}`;
  const pct = total?Math.round(quizCertas/total*100):0;
  document.getElementById('placar-label').textContent = `${pct}% de aproveitamento – ${quizCertas} certa(s), ${quizErradas} errada(s)`;
}

function salvarRespostaQuiz(acertou){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.quizTotal = (dados.quizTotal||0)+1;
  dados.quizCertas = (dados.quizCertas||0)+(acertou?1:0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

// ===================== SIMULADOS =====================
function renderExamesList(){
  const el = document.getElementById('exames-lista');
  el.innerHTML = EXAMES_DATA.map(e=>`
    <div class="exame-card">
      <div class="exame-info">
        <h3>${e.titulo}</h3>
        <p>${e.banca} · ${e.ano} · ${e.cargo}</p>
      </div>
      <button class="btn-iniciar" onclick="iniciarExame('${e.id}')">▶ Iniciar</button>
    </div>
  `).join('');
}

function iniciarExame(id){
  exAtual = EXAMES_DATA.find(e=>e.id===id);
  exSecAtual=0; exQAtual=0; exRespostas={}; exStarted=true;
  document.getElementById('exames-lista').style.display='none';
  const ativo = document.getElementById('exame-ativo');
  ativo.classList.add('show');
  document.getElementById('ex-titulo').textContent = exAtual.titulo;
  document.getElementById('ex-info').textContent = `${exAtual.banca} · ${exAtual.ano}`;
  document.getElementById('ex-resultado').classList.remove('show');
  document.getElementById('ex-corpo').style.display='block';
  renderQuestaoExame();
}

function renderQuestaoExame(){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  document.getElementById('ex-sec-label').textContent = sec.nome;

  // pergunta
  const pergEl = document.getElementById('ex-pergunta');
  if(q.texto){
    pergEl.innerHTML = `<div class="texto-base-wrap" id="tbw-${q.n}"><button class="texto-base-toggle" onclick="document.getElementById('tbw-${q.n}').classList.toggle('open')">📄 Texto-base — clique para expandir</button><div class="texto-base-conteudo"></div></div><div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
    pergEl.querySelector('.texto-base-conteudo').textContent = q.texto;
  } else {
    pergEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
  }
  pergEl.querySelector('span').textContent = `Q${q.n}. ${q.q}`;
  pergEl.querySelector('.audio-btn').addEventListener('click', ()=>falar(`Q${q.n}. ${q.q}`));

  document.getElementById('ex-exp').classList.remove('show');
  document.getElementById('btn-ex-prox').style.display='none';

  // alternativas
  const ops = document.getElementById('ex-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="ex-op" data-idx="${i}">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span>
      <span style="flex:1"></span>
      <span class="audio-btn-op" data-audio="${i}" title="Ouvir alternativa">🔊</span>
    </button>
  `).join('');

  // preenche texto e listeners sem risco de escape
  ops.querySelectorAll('.ex-op').forEach((btn, i)=>{
    btn.querySelector('span:nth-child(2)').textContent = q.ops[i];
    btn.addEventListener('click', (e)=>{
      if(e.target.classList.contains('audio-btn-op')) return;
      responderExame(i);
    });
    btn.querySelector('.audio-btn-op').addEventListener('click', (e)=>{
      e.stopPropagation();
      falar(q.ops[i]);
    });
  });
}

function responderExame(idx){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  const key = `${exSecAtual}_${exQAtual}`;
  if(exRespostas[key]!==undefined) return;
  exRespostas[key]=idx;
  const btns = document.querySelectorAll('.ex-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.g) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  document.getElementById('ex-exp').textContent = q.exp;
  document.getElementById('ex-exp').classList.add('show');
  document.getElementById('btn-ex-prox').style.display='inline-block';
}

function avancarExame(){
  const sec = exAtual.secoes[exSecAtual];
  exQAtual++;
  if(exQAtual>=sec.qs.length){
    exSecAtual++;
    exQAtual=0;
    if(exSecAtual>=exAtual.secoes.length){finalizarExame();return;}
  }
  renderQuestaoExame();
}

function finalizarExame(){
  document.getElementById('ex-corpo').style.display='none';
  let total=0,certas=0;
  exAtual.secoes.forEach((s,si)=>{
    s.qs.forEach((q,qi)=>{
      total++;
      if(exRespostas[`${si}_${qi}`]===q.g) certas++;
    });
  });
  document.getElementById('ex-res-num').textContent = `${certas}/${total}`;
  const pct=Math.round(certas/total*100);
  document.getElementById('ex-res-label').textContent = `${pct}% de aproveitamento`;
  document.getElementById('ex-resultado').classList.add('show');
  salvarResultadoSimulado(certas,total);
}

function salvarResultadoSimulado(certas,total){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.simTotal = (dados.simTotal||0)+1;
  dados.simCertas = (dados.simCertas||0)+certas;
  dados.simQuestoes = (dados.simQuestoes||0)+total;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function voltarExames(){
  document.getElementById('exame-ativo').classList.remove('show');
  document.getElementById('exames-lista').style.display='grid';
  exAtual=null; exStarted=false;
}

// ===================== RELATÓRIO =====================
function mostrarRelatorio(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0, qC=dados.quizCertas||0;
  const sT=dados.simTotal||0, sC=dados.simCertas||0, sQ=dados.simQuestoes||0;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${qT}</div><div class="stat-label">Quiz respondidas</div></div>
    <div class="stat-card"><div class="stat-num">${qT?Math.round(qC/qT*100):0}%</div><div class="stat-label">Acerto no Quiz</div></div>
    <div class="stat-card"><div class="stat-num">${sT}</div><div class="stat-label">Simulados feitos</div></div>
    <div class="stat-card"><div class="stat-num">${sQ?Math.round(sC/sQ*100):0}%</div><div class="stat-label">Acerto Simulados</div></div>
  `;
}

function exportarTXT(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0,qC=dados.quizCertas||0;
  const sT=dados.simTotal||0,sC=dados.simCertas||0,sQ=dados.simQuestoes||0;
  const txt=`RELATÓRIO ACE – Agente de Combate às Endemias
Gerado em: ${new Date().toLocaleString('pt-BR')}

QUIZ
  Questões respondidas: ${qT}
  Acertos: ${qC} (${qT?Math.round(qC/qT*100):0}%)
  Erros: ${qT-qC}

SIMULADOS
  Simulados realizados: ${sT}
  Questões respondidas: ${sQ}
  Acertos: ${sC} (${sQ?Math.round(sC/sQ*100):0}%)

---
Bons estudos! 🌿
`;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='relatorio-ace.txt';
  a.click();
  toast('Exportado com sucesso!');
}

function limparDados(){
  if(!confirm('Limpar todo o histórico de respostas?')) return;
  localStorage.removeItem(STORAGE_KEY);
  mostrarRelatorio();
  toast('Dados apagados!');
}

// ===================== UTILS =====================
function mudarTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('sec-'+id).classList.add('ativa');
  if(id==='relatorio') mostrarRelatorio();
}

function setSpeed(v, btn){
  _speechRate = v;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function toggleDark(){
  const dark = document.body.hasAttribute('data-dark');
  dark ? document.body.removeAttribute('data-dark') : document.body.setAttribute('data-dark','');
  localStorage.setItem('aceDark', dark?'0':'1');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
