        {n:27,q:"Identifique a frase na VOZ PASSIVA SINTÉTICA:",ops:["O médico examinou o paciente.","O paciente foi examinado pelo médico.","O médico se examinou.","Examinam-se pacientes aqui.","O médico examinará o paciente."],g:3,exp:"'Examinam-se pacientes' = 'Pacientes são examinados' — voz passiva sintética formada por VTD + pronome apassivador 'se'. O sujeito 'pacientes' concorda com o verbo (plural). As demais: voz ativa (a, e), passiva analítica (b) e reflexiva (c)."},
        {n:28,q:"'Os moradores se organizaram para combater a dengue.' O verbo indica:",ops:["Voz passiva analítica","Voz ativa","Voz passiva sintética","Voz reflexiva recíproca","Voz ativa impessoal"],g:3,exp:"'Se organizaram' indica ação recíproca/mútua: os moradores se organizaram uns com os outros (entre si). Trata-se de voz reflexiva recíproca, variante da voz reflexiva."},
        {n:29,q:"'Alugam-se apartamentos.' Esta frase pode ser reescrita, mantendo o mesmo sentido, como:",ops:["Alugamos apartamentos.","Apartamentos são alugados.","Apartamentos se alugarão.","Apartamentos alugam.","Os apartamentos alugarão."],g:1,exp:"Voz passiva sintética → voz passiva analítica: 'Alugam-se apartamentos' (VTD + se + sujeito paciente) = 'Apartamentos são alugados' (ser + particípio, sem agente expresso)."},
        {n:30,q:"Qual das frases abaixo está na VOZ ATIVA?",ops:["A vacina foi aplicada pelo enfermeiro.","Aplicam-se vacinas diariamente.","O enfermeiro aplicou a vacina.","A vacina foi sendo aplicada.","Vacinas são aplicadas aqui."],g:2,exp:"'O enfermeiro aplicou a vacina': sujeito ('enfermeiro') é agente da ação — voz ativa. As demais: passiva analítica (a, d, e) e passiva sintética (b)."},
        {n:31,q:"'O agente se protegeu com equipamento adequado.' A voz verbal é:",ops:["Passiva analítica","Passiva sintética","Ativa transitiva","Reflexiva","Impessoal"],g:3,exp:"Voz reflexiva: o sujeito 'O agente' é ao mesmo tempo agente (praticou a ação de proteger) e paciente (foi protegido). O 'se' é pronome reflexivo objeto direto."},
        {n:32,q:"Transforme para a voz ativa: 'O projeto foi aprovado pela prefeitura.'",ops:["A prefeitura aprovar o projeto.","O projeto aprovou a prefeitura.","A prefeitura aprovou o projeto.","O projeto se aprova pela prefeitura.","A prefeitura foi aprovada pelo projeto."],g:2,exp:"Agente da passiva 'pela prefeitura' → sujeito ativo 'A prefeitura'; sujeito paciente 'O projeto' → objeto direto 'o projeto'; verbo 'foi aprovado' (pret. perfeito passiva) → 'aprovou' (pret. perfeito ativa)."},
        {n:33,q:"'Precisa-se de médicos.' O pronome 'se' é:",ops:["Pronome apassivador — voz passiva sintética","Índice de indeterminação do sujeito","Pronome reflexivo","Pronome recíproco","Partícula expletiva"],g:1,exp:"O verbo 'precisar de' é transitivo indireto (exige preposição). Com VTI, o 'se' NÃO é pronome apassivador — é índice de indeterminação do sujeito. Não é possível dizer 'Médicos são precisados'."},
        {n:34,q:"Identifique a frase na VOZ REFLEXIVA:",ops:["Contratam-se funcionários.","O funcionário foi contratado.","A empresa contratou funcionários.","O funcionário se candidatou à vaga.","Funcionários são contratados pela empresa."],g:3,exp:"'O funcionário se candidatou' — sujeito agente e paciente são a mesma pessoa: o funcionário praticou a ação sobre si mesmo. As demais: passiva sintética (a), passiva analítica (b, e) e ativa (c)."},
        {n:35,q:"'A comunidade foi orientada pelos agentes de saúde.' Transformada para a voz ativa:",ops:["Os agentes de saúde orientaram a comunidade.","A comunidade orientou os agentes de saúde.","Os agentes de saúde foram orientados pela comunidade.","Orienta-se a comunidade pelos agentes.","A comunidade se orientou."],g:0,exp:"Agente da passiva 'pelos agentes de saúde' → sujeito ativo; sujeito paciente 'A comunidade' → objeto direto; verbo 'foi orientada' → 'orientaram' (pret. perfeito ativa, concordando com o novo sujeito plural)."},
        {n:36,q:"Qual alternativa apresenta frase na VOZ PASSIVA ANALÍTICA?",ops:["Os alunos estudaram para a prova.","Estudam-se as regras gramaticais.","Os alunos se prepararam bem.","A prova foi realizada pelos alunos.","Precisa-se de alunos dedicados."],g:3,exp:"'A prova foi realizada pelos alunos' = verbo 'ser' (foi) + particípio 'realizada' + agente da passiva 'pelos alunos' — estrutura típica da voz passiva analítica. As demais: ativa (a), passiva sintética (b), reflexiva (c), indeterminação do sujeito (e)."},
        {n:37,q:"'Os vizinhos se cumprimentaram.' O 'se' indica:",ops:["Voz passiva sintética","Índice de indeterminação do sujeito","Pronome apassivador","Voz reflexiva propriamente dita","Voz reflexiva recíproca"],g:4,exp:"'Se cumprimentaram' expressa ação mútua: os vizinhos cumprimentaram uns aos outros (entre si). Isso caracteriza a voz reflexiva recíproca. É diferente da reflexiva propriamente dita, em que a ação recai sobre o próprio sujeito."},
        {n:38,q:"Assinale a alternativa em que a passagem para a VOZ PASSIVA está INCORRETA:",ops:["O ACE visitou as casas. → As casas foram visitadas pelo ACE.","A prefeitura construiu a UBS. → A UBS foi construída pela prefeitura.","Os alunos fizeram a prova. → A prova foi feita pelos alunos.","O técnico analisou os dados. → Os dados foram analisados pelo técnico.","A enfermeira aplicou as vacinas. → As vacinas foram aplicadas por a enfermeira."],g:4,exp:"'Por a enfermeira' está incorreto. A preposição 'por' + artigo feminino 'a' devem ser contraídos obrigatoriamente: 'pela enfermeira'. A contração 'por + a' → 'pela' é exigida pela norma culta."},
        {n:39,q:"'Nesta farmácia, atende-se com rapidez.' O 'se' é:",ops:["Pronome apassivador","Pronome reflexivo","Índice de indeterminação do sujeito","Pronome recíproco","Partícula expletiva"],g:2,exp:"O verbo 'atender' está sendo usado intransitivamente (sem objeto direto na frase). Com verbo intransitivo ou transitivo indireto, o 'se' é índice de indeterminação do sujeito — o sujeito da oração não está determinado."},
        {n:40,q:"Assinale a alternativa que contém APENAS frases na VOZ ATIVA:",ops:["O médico examinou o paciente. / Pacientes são examinados.","A equipe elaborou o relatório. / O ACE combate vetores.","O agente se protegeu. / Vendem-se imóveis.","O laudo foi emitido. / A pesquisa foi concluída.","Alugam-se quartos. / O técnico analisou os dados."],g:1,exp:"'A equipe elaborou o relatório' (sujeito agente — voz ativa) e 'O ACE combate vetores' (sujeito agente — voz ativa). As demais alternativas contêm frases em voz passiva analítica (d), passiva sintética (b/e) ou reflexiva (c)."},
      ]},
    ]
  },

        {n:11,q:"Observe as frações e suas respectivas representações decimais. I – 3/1000 = 0,003 | II – 2367/100 = 23,67 | III – 129/1000 = 0,129 | Utilizando as igualdades acima, escolha a alternativa correta:",ops:["I e II","I","I, II e III","II","II e III"],g:2,exp:"I: 3÷1000 = 0,003 ✓ (três casas decimais). II: 2367÷100 = 23,67 ✓ (desloca a vírgula 2 casas à esquerda). III: 129÷1000 = 0,129 ✓ (três casas decimais). As três igualdades estão corretas — alternativa c) I, II e III."},
        {n:12,q:"A soma dos 20 termos de uma PA é 500. Se o primeiro termo dessa PA é 5, qual é a razão r dessa PA?",ops:["3","2","1","0","5"],g:1,exp:"SN = (A1 + An)×n/2 → 500 = (5 + An)×10 → An = 45. An = A1 + (n−1)×r → 45 = 5 + 19r → 19r = 40 → r = 40/19 ≈ 2,1. Gabarito oficial: b) r = 2. A banca adotou r = 2 sem usar 'aproximadamente' no enunciado — o valor exato é 40/19 ≈ 2,1 e a questão deveria ter sido anulada."},
        {n:13,q:"Qual é o termo geral da progressão aritmética (1, 5, 9, 13, ...)? [QUESTÃO ANULADA pela banca]",ops:["an = 4n – 3","an = 4n + 3","an = n + 2","an = n + 3","an = 4n"],g:0,exp:"A1 = 1 e r = 5 − 1 = 4. Fórmula: an = 1 + (n−1)×4 = 1 + 4n − 4 = 4n − 3 → Letra a). A banca anulou alegando que a sequência deveria começar com 5 (desconsiderando o primeiro termo 1), o que não tem nenhuma justificativa técnica. Todos os candidatos receberam ponto."},
        {n:14,q:"Qual é o 330º termo da progressão aritmética (1, 5, 9, 13, ...)?",ops:["1.313","1.317","1.321","1.325","1.329"],g:1,exp:"A1 = 1, r = 4, n = 330. A330 = A1 + (n−1)×r = 1 + 329×4 = 1 + 1316 = 1317. Resposta: letra B (1.317)."},
        {n:15,q:"Qual é a soma das idades de uma equipe de vendas com 30 funcionários, sabendo que suas idades, em ordem crescente, formam uma PA de razão 2 e que o funcionário mais jovem tem 18 anos?",ops:["1.380","1.395","1.410","1.425","1.440"],g:2,exp:"n = 30, A1 = 18, r = 2. An = 18 + 29×2 = 76. SN = (A1 + An)×n/2 = (18 + 76)×30/2 = 94×15 = 1.410. Resposta: letra C."},
        {n:16,q:"Qual é a soma dos 500 primeiros números inteiros positivos?",ops:["1050","5050","120000","125250","12550050"],g:3,exp:"n = 500, A1 = 1, An = 500 (inteiros positivos formam PA com r = 1). SN = (A1 + An)×n/2 = (1 + 500)×500/2 = 501×250 = 125.250. Resposta: letra d)."},
        {n:17,q:"Qual é a soma das coordenadas do vértice de uma função do segundo grau definida por f(x) = 2x² + 10x + 12?",ops:["– 3,0","3,0","2,5","– 2,5","0,5"],g:0,exp:"a = 2, b = 10, c = 12. Xv = −b/(2a) = −10/4 = −5/2. Δ = b² − 4ac = 100 − 96 = 4. Yv = −Δ/(4a) = −4/8 = −1/2. Soma = −5/2 + (−1/2) = −6/2 = −3,0. Resposta: letra a)."},
        {n:18,q:"Qual é o resultado da soma das raízes reais da função f(x) = x² + 16x + 39?",ops:["16","– 16","10","– 10","– 13"],g:1,exp:"Pela relação de Girard (Vieta): x1 + x2 = −b/a = −16/1 = −16. Resposta: letra b). Verificação: as raízes são x = −3 e x = −13 (pois (x+3)(x+13) = x²+16x+39), e −3 + (−13) = −16 ✓."},
        {n:20,q:"Na tabela a seguir está a média dos alunos nos 1º, 2º e 3º bimestres em Matemática. Suponha que a média da escola seja igual a 6 pontos. Se no 4º bimestre a nota de todos os estudantes for igual a 7, podemos afirmar que:",tabela:{cab:["Aluno","1º Bimestre","2º Bimestre","3º Bimestre"],lin:[["Ana","6","5","5"],["Maria","8","4","6"],["Pedro","7","7","5"]]},ops:["todos os alunos foram aprovados.","somente Ana foi reprovada.","somente Maria foi reprovada.","somente Pedro foi reprovado.","Ana, Maria e Pedro foram reprovados."],g:1,exp:"Média = soma dos 4 bimestres ÷ 4. Ana: (6+5+5+7)÷4 = 23÷4 = 5,75 → REPROVADA (< 6). Maria: (8+4+6+7)÷4 = 25÷4 = 6,25 → aprovada. Pedro: (7+7+5+7)÷4 = 26÷4 = 6,5 → aprovado. Apenas Ana ficou abaixo da média 6. Resposta: letra b)."},
      ]},

      {nome:'Língua Portuguesa',qs:[
        {n:1,texto:'Em muitas cidades brasileiras, a guarda municipal deixou de ser vista apenas como uma força de vigilância e passou a atuar também na prevenção. Rondas escolares, palestras sobre cidadania e o acompanhamento de eventos públicos aproximam os agentes da população. Essa aproximação, porém, depende de um cuidado: o respeito aos direitos de cada cidadão. Sem confiança mútua, nenhuma estratégia de segurança se sustenta por muito tempo.',q:'Segundo o texto, a atuação das guardas municipais em muitas cidades brasileiras:',ops:['limita-se à vigilância patrimonial.','passou a incluir ações de prevenção, além da vigilância.','substituiu totalmente as demais forças de segurança.','dispensa a confiança da população.','restringe-se ao acompanhamento de eventos públicos.'],g:1,exp:'O 1º período diz que a guarda deixou de ser vista apenas como vigilância e passou a atuar também na prevenção.'},
        {n:2,texto:'Em muitas cidades brasileiras, a guarda municipal deixou de ser vista apenas como uma força de vigilância e passou a atuar também na prevenção. Rondas escolares, palestras sobre cidadania e o acompanhamento de eventos públicos aproximam os agentes da população. Essa aproximação, porém, depende de um cuidado: o respeito aos direitos de cada cidadão. Sem confiança mútua, nenhuma estratégia de segurança se sustenta por muito tempo.',q:'No trecho "Essa aproximação, porém, depende de um cuidado", a palavra destacada estabelece, entre as ideias, relação de:',ops:['causa.','adição.','conclusão.','oposição (ressalva).','finalidade.'],g:3,exp:'"Porém" é conjunção coordenativa adversativa: introduz ressalva à ideia anterior (a aproximação é positiva, mas condicionada).'},
        {n:3,q:'Assinale a alternativa em que todas as palavras estão corretamente grafadas e acentuadas, de acordo com o Novo Acordo Ortográfico.',ops:['ideia, herói, feiura','enjoô, jiboia, plateia','voo, heróico, assembleia','paranóia, europeia, Coreia','lingüiça, tranqüilo, pinguim'],g:0,exp:'Após o Acordo, não há acento em ditongos abertos ei/oi de paroxítonas (ideia, plateia, assembleia, paranoia, heroico), nem em oo (voo, enjoo); herói (oxítona) mantém o acento; feiura não é acentuada; o trema foi abolido.'},

function renderResumo(){

  el.innerHTML = disciplinas.map((d,i)=>`
    <div class="disc-bloco">
      <div class="disc-header" onclick="toggleDisc(${i},this)" style="background:${d.cor}">
        ${d.nome} <span class="arrow">▼</span>
      </div>
      <div class="disc-topicos" id="disc-${i}">
        ${d.topicos.map(t=>`
          <div class="topico-item">
            <div style="flex:1">
              <div class="topico-nome">${t.t}</div>
              <div class="topico-desc">${t.d}</div>
            </div>
            <span class="freq-badge freq-${t.freq}">${t.freq.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleDisc(i,hdr){
  const el = document.getElementById('disc-'+i);
  const open = el.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

// ===================== FLASHCARDS =====================
function buildFlashDados(){
  flashDados=[];
  disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      flashDados.push({disc:d.nome, termo:t.t, def:t.d, freq:t.freq});
    });
  });
  flashDeck=[...flashDados];
}

function renderFlashFiltro(){
  const sel = document.getElementById('flash-filtro');
  disciplinas.forEach(d=>{
    const op = document.createElement('option');
    op.value = d.nome;
    op.textContent = d.nome.replace(/^.{2}/,'');
    sel.appendChild(op);
  });
}

function filtrarFlash(){
  const v = document.getElementById('flash-filtro').value;
  flashDeck = v==='todos' ? [...flashDados] : flashDados.filter(f=>f.disc===v);
  flashIdx=0;
  renderFlash();
}

function shuffleFlash(){
  for(let i=flashDeck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];
  }
  flashIdx=0;
  document.getElementById('flash-inner').classList.remove('virado');
  renderFlash();
  toast('Embaralhado!');
}

function renderFlash(){
  if(!flashDeck.length) return;
  const c = flashDeck[flashIdx];
  document.getElementById('flash-termo').textContent = c.termo;
  document.getElementById('flash-def').textContent = c.def;
  document.getElementById('flash-prog').textContent = `${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-inner').classList.remove('virado');
}

function virarCard(){
  document.getElementById('flash-inner').classList.toggle('virado');
}

function navFlash(d){
  flashIdx = (flashIdx+d+flashDeck.length)%flashDeck.length;
  renderFlash();
}

function falarCard(){
  const virado = document.getElementById('flash-inner').classList.contains('virado');
  const txt = virado ? document.getElementById('flash-def').textContent : document.getElementById('flash-termo').textContent;
  falar(txt);
}

function falar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR'; u.rate=_speechRate;
  speechSynthesis.speak(u);
}

// ===================== MAPA =====================
function renderMapa(){
  const filtros = document.getElementById('mapa-filtros');
  const grid = document.getElementById('mapa-grid');
  const nomes = ['Todos',...disciplinas.map(d=>d.nome)];
  filtros.innerHTML = nomes.map((n,i)=>`<button class="${i===0?'ativo':''}" onclick="filtrarMapa(this,'${n}')">${n}</button>`).join('');
  _renderMapaGrid('Todos');
}

function filtrarMapa(btn,disc){
  document.querySelectorAll('.mapa-filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  _renderMapaGrid(disc);
}

function _renderMapaGrid(disc){
  const grid = document.getElementById('mapa-grid');
  let items=[];
  disciplinas.forEach(d=>{
    if(disc==='Todos'||d.nome===disc){
      d.topicos.forEach(t=>items.push({disc:d.nome,t}));
    }
  });
  grid.innerHTML = items.map(({disc,t})=>`
    <div class="mapa-card" onclick="toast('${t.t}')">
      <div class="mc-disc">${disc.replace(/^.{2}/,'')}</div>
      <div class="mc-nome">${t.t}</div>
      <span class="freq-badge freq-${t.freq} mc-freq">${t.freq.toUpperCase()}</span>
    </div>
  `).join('');
}

function iniciarQuiz(){
  const filtro = document.getElementById('quiz-filtro').value;
  let banco = filtro==='todos' ? [...questoes] : questoes.filter(q=>q.disc===filtro);
  for(let i=banco.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[banco[i],banco[j]]=[banco[j],banco[i]];}
  quizPerguntas = banco.slice(0,Math.min(10,banco.length));
  quizIdx=0; quizCertas=0; quizErradas=0; respondeu=false;
  document.getElementById('quiz-placar').classList.remove('show');
  document.getElementById('quiz-box').style.display='block';
  renderQuestao();
}

function renderQuestao(){
  if(quizIdx>=quizPerguntas.length){encerrarQuiz();return;}
  respondeu=false;
  const q = quizPerguntas[quizIdx];
  document.getElementById('q-disc').textContent = q.disc;
  const temaEl = document.getElementById('q-tema');
  temaEl.textContent = q.tema || '';
  temaEl.style.display = q.tema ? '' : 'none';
  document.getElementById('q-num').textContent = `${quizIdx+1}/${quizPerguntas.length}`;
  document.getElementById('q-pergunta').textContent = q.p;
  document.getElementById('q-exp').classList.remove('show');
  document.getElementById('btn-prox-q').style.display='none';
  const ops = document.getElementById('q-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="quiz-op" onclick="verificarResposta(${i})">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span> ${o}
    </button>
  `).join('');
  const vid = q.tema ? (videoMap[q.tema] || '') : '';
  const wrap = document.getElementById('q-video-wrap');
  if(vid){
    wrap.style.display = 'block';
    wrap.innerHTML = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${vid}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="border-radius:12px;display:block;margin-top:10px"></iframe>`;
  } else {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
  }
}

function verificarResposta(idx){
  if(respondeu) return;
  respondeu=true;
  const q = quizPerguntas[quizIdx];
  const btns = document.querySelectorAll('.quiz-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  if(idx===q.c) quizCertas++; else quizErradas++;
  salvarRespostaQuiz(idx===q.c);
  document.getElementById('q-exp').textContent = q.exp;
  document.getElementById('q-exp').classList.add('show');
  document.getElementById('btn-prox-q').style.display='inline-block';
}

function proximaQuestao(){
  quizIdx++;
  renderQuestao();
}

function encerrarQuiz(){
  document.getElementById('quiz-box').style.display='none';
  const placar = document.getElementById('quiz-placar');
  placar.classList.add('show');
  const total = quizCertas+quizErradas;
  document.getElementById('placar-num').textContent = `${quizCertas}/${total}`;
  const pct = total?Math.round(quizCertas/total*100):0;
  document.getElementById('placar-label').textContent = `${pct}% de aproveitamento – ${quizCertas} certa(s), ${quizErradas} errada(s)`;
}

function salvarRespostaQuiz(acertou){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.quizTotal = (dados.quizTotal||0)+1;
  dados.quizCertas = (dados.quizCertas||0)+(acertou?1:0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

// ===================== SIMULADOS =====================
function totalQuestoes(e){
  return e.secoes.reduce((t,s)=>t+s.qs.length,0);
}
function renderExamesList(){
  const el = document.getElementById('exames-lista');
  el.innerHTML = EXAMES_DATA.map(e=>`
    <div class="exame-card">
      <div class="exame-info">
        <h3>${e.titulo}</h3>
        <p>${e.banca} · ${e.ano} · ${e.cargo}</p>
        <span class="badge-qtd">${totalQuestoes(e)} questões</span>
      </div>
      <button class="btn-iniciar" onclick="iniciarExame('${e.id}')">▶ Iniciar</button>
    </div>
  `).join('');
}

function iniciarExame(id){
  exAtual = EXAMES_DATA.find(e=>e.id===id);
  exSecAtual=0; exQAtual=0; exRespostas={}; exStarted=true;
  document.getElementById('exames-lista').style.display='none';
  const ativo = document.getElementById('exame-ativo');
  ativo.classList.add('show');
  document.getElementById('ex-titulo').textContent = exAtual.titulo;
  document.getElementById('ex-info').textContent = `${exAtual.banca} · ${exAtual.ano}`;
  document.getElementById('ex-resultado').classList.remove('show');
  document.getElementById('ex-corpo').style.display='block';
  renderQuestaoExame();
}

function renderQuestaoExame(){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  document.getElementById('ex-sec-label').textContent = sec.nome;

  // pergunta
  const pergEl = document.getElementById('ex-pergunta');
  if(q.texto){
    pergEl.innerHTML = `<div class="texto-base-wrap" id="tbw-${q.n}"><button class="texto-base-toggle" onclick="document.getElementById('tbw-${q.n}').classList.toggle('open')">📄 Texto-base — clique para expandir</button><div class="texto-base-conteudo"></div></div><div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
    pergEl.querySelector('.texto-base-conteudo').textContent = q.texto;
  } else {
    pergEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
  }
  pergEl.querySelector('span').textContent = `Q${q.n}. ${q.q}`;
  pergEl.querySelector('.audio-btn').addEventListener('click', ()=>falar(`Q${q.n}. ${q.q}`));
  // tabela (se existir)
  const oldTab = pergEl.querySelector('.q-tabela-wrap');
  if(oldTab) oldTab.remove();
  if(q.tabela){
    const wrap = document.createElement('div');
    wrap.className = 'q-tabela-wrap';
    let html = '<table class="q-tabela"><thead><tr>';
    q.tabela.cab.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    q.tabela.lin.forEach(row => { html += '<tr>'; row.forEach(cell => html += `<td>${cell}</td>`); html += '</tr>'; });
    html += '</tbody></table>';
    wrap.innerHTML = html;
    pergEl.appendChild(wrap);
  }

  document.getElementById('ex-exp').classList.remove('show');
  document.getElementById('btn-ex-prox').style.display='none';

  // alternativas
  const ops = document.getElementById('ex-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="ex-op" data-idx="${i}">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span>
      <span style="flex:1"></span>
      <span class="audio-btn-op" data-audio="${i}" title="Ouvir alternativa">🔊</span>
    </button>
  `).join('');

  // preenche texto e listeners sem risco de escape
  ops.querySelectorAll('.ex-op').forEach((btn, i)=>{
    btn.querySelector('span:nth-child(2)').textContent = q.ops[i];
    btn.addEventListener('click', (e)=>{
      if(e.target.classList.contains('audio-btn-op')) return;
      responderExame(i);
    });
    btn.querySelector('.audio-btn-op').addEventListener('click', (e)=>{
      e.stopPropagation();
      falar(q.ops[i]);
    });
  });
}

function responderExame(idx){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  const key = `${exSecAtual}_${exQAtual}`;
  if(exRespostas[key]!==undefined) return;
  exRespostas[key]=idx;
  const btns = document.querySelectorAll('.ex-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.g) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  document.getElementById('ex-exp').textContent = q.exp;
  document.getElementById('ex-exp').classList.add('show');
  document.getElementById('btn-ex-prox').style.display='inline-block';
}

function avancarExame(){
  const sec = exAtual.secoes[exSecAtual];
  exQAtual++;
  if(exQAtual>=sec.qs.length){
    exSecAtual++;
    exQAtual=0;
    if(exSecAtual>=exAtual.secoes.length){finalizarExame();return;}
  }
  renderQuestaoExame();
}

function finalizarExame(){
  document.getElementById('ex-corpo').style.display='none';
  let total=0,certas=0;
  exAtual.secoes.forEach((s,si)=>{
    s.qs.forEach((q,qi)=>{
      total++;
      if(exRespostas[`${si}_${qi}`]===q.g) certas++;
    });
  });
  document.getElementById('ex-res-num').textContent = `${certas}/${total}`;
  const pct=Math.round(certas/total*100);
  document.getElementById('ex-res-label').textContent = `${pct}% de aproveitamento`;
  document.getElementById('ex-resultado').classList.add('show');
  salvarResultadoSimulado(certas,total);
}

function salvarResultadoSimulado(certas,total){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.simTotal = (dados.simTotal||0)+1;
  dados.simCertas = (dados.simCertas||0)+certas;
  dados.simQuestoes = (dados.simQuestoes||0)+total;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function voltarExames(){
  document.getElementById('exame-ativo').classList.remove('show');
  document.getElementById('exames-lista').style.display='grid';
  exAtual=null; exStarted=false;
}

// ===================== RELATÓRIO =====================
function mostrarRelatorio(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0, qC=dados.quizCertas||0;
  const sT=dados.simTotal||0, sC=dados.simCertas||0, sQ=dados.simQuestoes||0;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${qT}</div><div class="stat-label">Quiz respondidas</div></div>
    <div class="stat-card"><div class="stat-num">${qT?Math.round(qC/qT*100):0}%</div><div class="stat-label">Acerto no Quiz</div></div>
    <div class="stat-card"><div class="stat-num">${sT}</div><div class="stat-label">Simulados feitos</div></div>
    <div class="stat-card"><div class="stat-num">${sQ?Math.round(sC/sQ*100):0}%</div><div class="stat-label">Acerto Simulados</div></div>
  `;
}

function exportarTXT(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0,qC=dados.quizCertas||0;
  const sT=dados.simTotal||0,sC=dados.simCertas||0,sQ=dados.simQuestoes||0;
  const txt=`RELATÓRIO ACE – Agente de Combate às Endemias
Gerado em: ${new Date().toLocaleString('pt-BR')}

QUIZ
  Questões respondidas: ${qT}
  Acertos: ${qC} (${qT?Math.round(qC/qT*100):0}%)
  Erros: ${qT-qC}

SIMULADOS
  Simulados realizados: ${sT}
  Questões respondidas: ${sQ}
  Acertos: ${sC} (${sQ?Math.round(sC/sQ*100):0}%)

---
Bons estudos! 🌿
`;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='relatorio-ace.txt';
  a.click();
  toast('Exportado com sucesso!');
}

function limparDados(){
  if(!confirm('Limpar todo o histórico de respostas?')) return;
  localStorage.removeItem(STORAGE_KEY);
  mostrarRelatorio();
  toast('Dados apagados!');
}

// ===================== UTILS =====================
function mudarTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('sec-'+id).classList.add('ativa');
  if(id==='relatorio') mostrarRelatorio();
}

function setSpeed(v, btn){
  _speechRate = v;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function toggleDark(){
  const dark = document.body.hasAttribute('data-dark');
  dark ? document.body.removeAttribute('data-dark') : document.body.setAttribute('data-dark','');
  localStorage.setItem('aceDark', dark?'0':'1');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
